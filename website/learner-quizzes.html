<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Practice | Practice Online</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --nav:#1b1648;
  --bg:#f6f7fb;
  --border:#e6e6e6;
  --text:#0f172a;
  --muted:#475569;
  --easy:#22c55e;
  --moderate:#3b82f6;
  --hard:#ef4444;
}

body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:var(--bg);
}

/* HEADER */
header{background:var(--nav);color:#fff}
.topbar-inner{
  max-width:1100px;margin:auto;padding:14px;
  display:flex;justify-content:space-between;
}
nav a{color:#fff;margin-left:10px;text-decoration:none}

/* PAGE */
.wrap{max-width:1100px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px}

.cardHead{padding:14px;border-bottom:1px solid var(--border)}

h1{font-size:20px;margin:0}
.muted{font-size:14px;color:var(--muted)}

/* CONTROLS */
.controls{
  padding:14px;
  display:grid;
  grid-template-columns:1fr 160px 140px 150px;
  gap:10px;
}

input,select{
  font-family:Arial;
  font-size:14px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

/* FILTERS */
.filters{
  padding:0 14px;
  display:flex;
  gap:22px;
  border-bottom:1px solid #eee;
}

.fbtn{
  background:none;
  border:none;
  font-family:Arial;
  font-size:13px;
  cursor:pointer;
  position:relative;
  padding:10px 0;
  color:#64748b;
}

/* underline base */
.fbtn::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-2px;
  height:3px;
  transform:scaleX(0);
  transition:0.2s;
}

/* underline colors */
.fbtn[data-diff="easy"]::after{background:var(--easy)}
.fbtn[data-diff="moderate"]::after{background:var(--moderate)}
.fbtn[data-diff="hard"]::after{background:var(--hard)}
.fbtn[data-diff="all"]::after{background:#94a3b8}

/* active */
.fbtn.active::after{
  transform:scaleX(1);
}

/* TOPICS */
.topic-wrap{padding:14px}

.topic-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

/* 🔥 topic font FIX */
.topic-title{
  font-family:Arial;
  font-size:14px;
  font-weight:400;
}

/* QUIZ */
.quiz-squares{display:flex;gap:16px;margin-top:10px}

.quiz-icon-wrap{
  position:relative;
  width:64px;
  height:70px;
}

/* color perfectly inside */
.quiz-fill{
  position:absolute;
  left:10px;
  top:10px;
  width:44px;
  height:50px;
  border-radius:6px;
}

.quiz-square.pass .quiz-fill{background:#dcfce7}
.quiz-square.fail .quiz-fill{background:#fee2e2}

/* square */
.quiz-square-base{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

/* score */
.quiz-mark{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-family:Arial;
  font-weight:700;
  font-size:14px;
}

/* question */
.quiz-q{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:18px;
  font-weight:700;
}

.quiz-number{
  font-family:Arial;
  font-size:12px;
  text-align:center;
  margin-top:2px;
}
</style>
</head>

<body>

<header>
  <div class="topbar-inner">
    <strong>Practice Online</strong>
    <nav>
      <a>Practice</a>
      <a href="results.html">Results</a>
    </nav>
  </div>
</header>

<div class="wrap">
<div class="card">

<div class="cardHead">
  <h1>Practice</h1>
  <div class="muted" id="gradeText">Loading...</div>
</div>

<div class="controls">
  <input id="search" placeholder="Search topic or assessment">
  <select id="topicFilter"></select>

  <select id="paperFilter">
    <option value="all">All Papers</option>
    <option value="paper1">Paper 1</option>
    <option value="paper2">Paper 2</option>
  </select>

  <select id="periodFilter">
    <option value="all">All Time</option>
    <option value="today">Today</option>
    <option value="week">This Week</option>
    <option value="month">This Month</option>
  </select>
</div>

<div class="filters">
  <button class="fbtn active" data-diff="all">All</button>
  <button class="fbtn" data-diff="easy">Easy</button>
  <button class="fbtn" data-diff="moderate">Moderate</button>
  <button class="fbtn" data-diff="hard">Hard</button>
</div>

<div id="quizList" class="topic-wrap"></div>

</div>
</div>

<script>
const API="https://practice-backend-msgn.onrender.com";
const token=localStorage.getItem("token");

const ICON="https://res.cloudinary.com/dopoxadlr/image/upload/v1773875474/square_ho8otg.svg";

const searchEl=document.getElementById("search");
const topicFilter=document.getElementById("topicFilter");
const paperFilter=document.getElementById("paperFilter");

let quizzes=[];
let resultsMap={};
let diff="all";

/* STATE */
function getState(id){
  const r=resultsMap[id];
  if(!r) return {type:"new"};

  const percent=Math.round((r.score/r.total)*100);
  return {
    type:"done",
    score:percent+"%",
    state:percent>=50?"pass":"fail"
  };
}

/* FILTER */
function apply(){
  const q=searchEl.value.toLowerCase();

  const filtered=quizzes.filter(x=>{
    return (
      (!q || x.title.toLowerCase().includes(q) || x.topic.toLowerCase().includes(q)) &&
      (topicFilter.value==="all" || x.topic===topicFilter.value) &&
      (paperFilter.value==="all" || x.paper===paperFilter.value) &&
      (diff==="all" || x.difficulty===diff)
    );
  });

  render(filtered);
}

/* RENDER */
function render(list){
  const groups={};
  list.forEach(q=>{
    if(!groups[q.topic]) groups[q.topic]=[];
    groups[q.topic].push(q);
  });

  const html=Object.keys(groups).map(t=>`
    <div class="topic-card">
      <div class="topic-title">${t}</div>

      <div class="quiz-squares">
        ${groups[t].map((q,i)=>{
          const s=getState(q._id);
          return `
          <div class="quiz-square ${s.state}" onclick="location='attempt.html?quizId=${q._id}'">
            <div class="quiz-icon-wrap">
              <div class="quiz-fill"></div>
              <img src="${ICON}" class="quiz-square-base">
              ${
                s.type==="new"
                ? `<div class="quiz-q">?</div>`
                : `<div class="quiz-mark">${s.score}</div>`
              }
            </div>
            <div class="quiz-number">${i+1}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `).join("");

  document.getElementById("quizList").innerHTML=html;
}

/* EVENTS */
document.querySelectorAll(".fbtn").forEach(b=>{
  b.onclick=()=>{
    diff=b.dataset.diff;
    document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    apply();
  }
});

searchEl.oninput=apply;
topicFilter.onchange=apply;
paperFilter.onchange=apply;

/* LOAD */
(async()=>{
  const me=await fetch(`${API}/api/auth/me`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
  document.getElementById("gradeText").textContent="Grade: "+me.grade;

  quizzes=await fetch(`${API}/api/quizzes`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());

  const results=await fetch(`${API}/api/results/my`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());

  results.forEach(r=>{
    const id=r.quizId?._id||r.quizId;
    resultsMap[id]=r;
  });

  const topics=[...new Set(quizzes.map(q=>q.topic))];
  topicFilter.innerHTML=`<option value="all">All Topics</option>`+
    topics.map(t=>`<option value="${t}">${t}</option>`).join("");

  apply();
})();
</script>

</body>
</html>
