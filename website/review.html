<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Review Attempt | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);

      --green:#16a34a;
      --greenBg:#dcfce7;
      --red:#dc2626;
      --redBg:#fee2e2;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--text);}
    .wrap{max-width:1000px; margin:0 auto; padding:24px;}
    .muted{color:var(--muted);}
    .hidden{display:none;}
    .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}

    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:12px; flex-wrap:wrap;}
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{width:38px; height:38px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800;}
    .nav{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .nav a,.nav button{
      text-decoration:none; font-size:14px;
      padding:8px 12px; border-radius:10px;
      border:none; cursor:pointer;
      background:#fff; color:var(--text); border:1px solid #ddd;
      font-weight:700;
    }
    .nav .primary{background:var(--accent); color:#fff; border:none;}

    h1{margin:0 0 4px 0; font-size:22px;}
    .pillRow{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; align-items:center;}
    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #cfe9ff;
      background:#eef7ff;
      color:#0b3c5d;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .markspill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #e6e6e6;
      background:#f8fafc;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }

    .qBox{margin-top:14px; padding-top:14px; border-top:1px solid #eee;}
    .qTitle{font-weight:800; margin:0 0 10px 0; font-size:16px; line-height:1.35;}
    .hint{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background:var(--accent-soft);
      border:1px solid #cfe9ff;
      color:#0b3c5d;
      font-size:13px;
      font-weight:600;
    }

    /* MCQ options */
    .opt{
      display:block;
      padding:10px;
      border:1px solid #ddd;
      border-radius:10px;
      margin-bottom:8px;
      background:#fff;
      line-height:1.35;
      word-break:break-word;
    }
    .opt.correct{ border-color:var(--green); background:var(--greenBg); }
    .opt.wrong{ border-color:var(--red); background:var(--redBg); }
    .opt input{margin-right:10px;}

    /* Typed answer cards */
    .answerGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    .answerCard{
      border:1px solid #e6e6e6;
      border-radius:12px;
      padding:12px;
      background:#fff;
      min-width:0;
    }
    .answerCard .label{
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.04em;
      margin-bottom:6px;
    }
    .answerCard .value{
      font-weight:800;
      word-break:break-word;
    }
    .answerCard.good{border-color:var(--green); background:var(--greenBg);}
    .answerCard.bad{border-color:var(--red); background:var(--redBg);}

    .controlsRow{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:12px;
      flex-wrap:wrap;
      margin-top:12px;
      margin-bottom:10px;
    }
    .jumpGroup{display:flex; flex-direction:column; gap:6px;}
    select{
      padding:10px;
      border-radius:10px;
      border:1px solid #ddd;
      background:#fff;
      min-width:220px;
      font-size:14px;
      outline:none;
    }

    .footerRow{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .btn2{
      background:#fff;
      border:1px solid #ddd;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
    }
    .btn2:disabled{opacity:.6; cursor:not-allowed;}

    .onlyCorrect{
      margin-top:14px;
      padding-top:14px;
      border-top:1px solid #eee;
      font-weight:900;
      line-height:1.35;
      word-break:break-word;
    }

    .errorBox{
      margin-top:12px;
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
    }

    @media (max-width:700px){
      .wrap{padding:16px;}
      select{min-width:100%;}
      .answerGrid{grid-template-columns:1fr;}
      .footerRow{justify-content:flex-start;}
    }
  </style>

  <script>
    const t = localStorage.getItem("token");
    if (!t) window.location.href = "login.html";
  </script>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <div class="muted" id="welcomeSub">Review Attempt</div>
      </div>
    </div>

    <div class="nav">
      <a href="results.html">Back to Results</a>
      <button class="primary" id="logoutBtn" type="button">Logout</button>
    </div>
  </div>

  <div class="card">
    <h1 id="title">Loading…</h1>
    <div class="muted" id="subtitle"></div>

    <div class="pillRow">
      <span class="pill" id="gradePill">Grade -</span>
      <span class="pill" id="topicPill">Topic -</span>
      <span class="markspill" id="marksPill">Marks: -</span>
    </div>

    <div class="qBox">
      <div class="controlsRow">
        <div class="muted" id="qCounter"></div>

        <div class="jumpGroup">
          <label class="muted" style="font-size:12px;">Jump to question</label>
          <select id="jumpSelect"></select>
        </div>
      </div>

      <p class="qTitle" id="qText"></p>

      <div id="hintBox" class="hint hidden"></div>

      <div id="body"></div>

      <div class="onlyCorrect" id="onlyCorrect"></div>

      <div class="footerRow">
        <button class="btn2" id="prevBtn" type="button">Previous</button>
        <button class="btn2" id="nextBtn" type="button">Next</button>
      </div>
    </div>

    <div id="err" class="errorBox" style="display:none;"></div>
  </div>
</div>

<script>
  const API = window.API || "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");
  const resultId = new URLSearchParams(window.location.search).get("resultId");

  const titleEl = document.getElementById("title");
  const subtitleEl = document.getElementById("subtitle");
  const gradePill = document.getElementById("gradePill");
  const topicPill = document.getElementById("topicPill");
  const marksPill = document.getElementById("marksPill");

  const qCounter = document.getElementById("qCounter");
  const qText = document.getElementById("qText");
  const body = document.getElementById("body");
  const onlyCorrect = document.getElementById("onlyCorrect");
  const hintBox = document.getElementById("hintBox");

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const err = document.getElementById("err");
  const jumpSelect = document.getElementById("jumpSelect");

  let answers = [];
  let idx = 0;

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    window.location.href = "login.html";
  };

  if (!resultId) {
    showErr("Missing resultId in the URL.");
  } else {
    loadResult();
  }

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  function showErr(message){
    err.style.display = "block";
    err.textContent = message;
  }

  async function loadResult(){
    try{
      const res = await fetch(`${API}/api/results/${encodeURIComponent(resultId)}`, {
        headers: { Authorization: "Bearer " + token }
      });

      if (res.status === 401) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
        return;
      }

      if (!res.ok) {
        const txt = await res.text().catch(()=> "");
        throw new Error(txt || `Request failed (HTTP ${res.status})`);
      }

      const r = await res.json();

      titleEl.textContent = cleanSpaces(r.title || "Assessment Review");
      subtitleEl.textContent = "Review your attempt question by question.";
      gradePill.textContent = `Grade ${r.grade ?? "-"}`;
      topicPill.textContent = `Topic: ${cleanSpaces(r.topic || "General")}`;

      const pct = Number(r.percent);
      const safePct = Number.isFinite(pct) ? pct : 0;
      marksPill.textContent = `Marks: ${safePct}%`;

      answers = Array.isArray(r.answers) ? r.answers : [];
      if (answers.length === 0) {
        showErr("No saved answers found for this attempt.");
        return;
      }

      jumpSelect.innerHTML = answers.map((a, i) => {
        const type = String(a.type || "mcq").toLowerCase();
        const tag = type === "text" ? "" : "";
        return `<option value="${i}">Question ${i + 1}${tag}</option>`;
      }).join("");

      jumpSelect.addEventListener("change", () => {
        const v = Number(jumpSelect.value);
        if (Number.isFinite(v) && v >= 0 && v < answers.length) {
          idx = v;
          renderQuestion();
        }
      });

      idx = 0;
      renderQuestion();
    } catch(e){
      showErr("Could not load review: " + (e.message || ""));
    }
  }

  function letter(i){ return ["A","B","C","D","E","F"][i] || String(i+1); }

  function renderQuestion(){
    const a = answers[idx];
    const type = String(a.type || "mcq").toLowerCase();

    qCounter.textContent = `Question ${idx + 1} of ${answers.length}`;
    jumpSelect.value = String(idx);
    qText.textContent = cleanSpaces(a.questionText || "");

    // Hint
    const hint = cleanSpaces(a.hint || "");
    if (hint) {
      hintBox.classList.remove("hidden");
      hintBox.textContent = "Hint: " + hint;
    } else {
      hintBox.classList.add("hidden");
      hintBox.textContent = "";
    }

    body.innerHTML = "";
    onlyCorrect.textContent = "";

    if (type === "text") {
      // ✅ support both possible field names
      const userAns = cleanSpaces(a.textAnswer || a.chosenText || "");
      const correctAns = cleanSpaces(a.correctText || "");
      const isCorrect = !!a.isCorrect;

      body.innerHTML = `
        <div class="answerGrid">
          <div class="answerCard ${isCorrect ? "good" : "bad"}">
            <div class="label">Your Answer</div>
            <div class="value">${escapeHtml(userAns || "No answer")}</div>
          </div>

          <div class="answerCard good">
            <div class="label">Correct Answer</div>
            <div class="value">${escapeHtml(correctAns || "Not saved")}</div>
          </div>
        </div>
      `;

      onlyCorrect.textContent = `Result: ${isCorrect ? "Correct" : "Incorrect"}`;

    } else {
      // MCQ
      const options = Array.isArray(a.options) ? a.options : [];
      const chosen = Number(a.chosenIndex);
      const correct = Number(a.correctIndex);

      body.innerHTML = options.map((opt, i) => {
        const isCorrect = i === correct;
        const isChosen = i === chosen;

        let cls = "";
        if (isCorrect) cls = "correct";
        if (isChosen && !isCorrect) cls = "wrong";

        return `
          <label class="opt ${cls}">
            <input type="radio" disabled ${isChosen ? "checked" : ""}>
            ${letter(i)}. ${escapeHtml(cleanSpaces(opt))}
          </label>
        `;
      }).join("");

      const correctText = options[correct] ?? "";
      onlyCorrect.textContent = `Correct answer: ${letter(correct)}. ${cleanSpaces(correctText)}`;
    }

    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === answers.length - 1;
  }

  prevBtn.addEventListener("click", () => {
    if (idx > 0) { idx--; renderQuestion(); }
  });

  nextBtn.addEventListener("click", () => {
    if (idx < answers.length - 1) { idx++; renderQuestion(); }
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") prevBtn.click();
    if (e.key === "ArrowRight") nextBtn.click();
  });

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>
</body>
</html>
