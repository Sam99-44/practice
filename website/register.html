<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account | Practice Online</title>

  <meta name="robots" content="noindex, nofollow" />

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#d9dee7;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --nav:#1b1648;
      --red:#e11d2e;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    button,input,select,option{
      font-family:Arial, Helvetica, sans-serif;
    }

    .topbar{
      background:var(--nav);
      color:#fff;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .topbar-inner{
      max-width:1150px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .accountLeft{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      user-select:none;
    }

    .accountIconWrap{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .accountIcon{
      width:40px;
      height:40px;
      display:block;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .accountMeta{
      min-width:0;
      line-height:1.1;
    }

    .accountName{
      font-size:14px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .accountType{
      font-size:13px;
      color:#e0e7ff;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
      font-weight:400;
    }

    .topbarRight{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .topLink{
      color:#e7e9ff;
      font-size:13px;
      font-weight:700;
      padding:8px 0;
      border-bottom:3px solid transparent;
    }

    .topLink:hover{
      color:#fff;
    }

    .topLink.active{
      color:#fff;
      border-bottom:3px solid var(--red);
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:24px;
      min-height:calc(100vh - 72px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width:560px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:var(--shadow);
    }

    h2{
      margin:0 0 6px;
      font-size:22px;
      font-weight:700;
    }

    p{
      margin:6px 0 14px;
      color:var(--muted);
      font-size:14px;
      font-weight:400;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:700;
      font-size:14px;
    }

    .normalFields label{
      font-weight:400;
    }

    input,select{
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:12px;
      border:1px solid #ddd;
      background:#fff;
      font-size:14px;
      outline:none;
      font-weight:400;
    }

    input:focus,select:focus{
      border-color:#cbd5e1;
      box-shadow:0 0 0 4px rgba(226,232,240,.7);
    }

    .radioRow{
      display:flex;
      gap:16px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .radioRow label{
      font-weight:700;
      margin-top:0;
      display:flex;
      align-items:center;
      gap:8px;
      color:#334155;
    }

    .radioRow input{
      width:auto;
      margin:0;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    .btn{
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:12px;
      padding:12px;
      font-weight:700;
      cursor:pointer;
      width:100%;
      transition:transform .08s ease, box-shadow .2s ease;
      font-size:14px;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 24px rgba(11,60,93,.18);
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .ghost{
      background:#fff;
      border:1px solid #ddd;
      border-radius:12px;
      padding:12px;
      font-weight:700;
      cursor:pointer;
      width:100%;
      font-size:14px;
    }

    .ghost:hover{
      background:var(--accent-soft);
    }

    .msg{
      margin-top:10px;
      font-size:14px;
      font-weight:400;
      line-height:1.5;
    }

    .error{color:var(--error)}
    .ok{color:var(--ok)}

    .links{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:12px;
      font-size:14px;
      flex-wrap:wrap;
    }

    .links a{
      color:var(--accent);
      text-decoration:none;
      font-weight:700;
    }

    .links a:hover{
      text-decoration:underline;
    }

    .hide{display:none !important;}

    .noteBox{
      background:var(--accent-soft);
      border:1px solid #d8e6f3;
      border-radius:12px;
      padding:12px;
      margin:10px 0 12px;
      color:#0f172a;
      font-size:14px;
      line-height:1.5;
    }

    .noteBox b{
      display:block;
      margin-bottom:4px;
      font-size:14px;
    }

    .autoPassInfo{
      margin-top:14px;
      padding:12px;
      border-radius:12px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      color:#334155;
      font-size:13px;
      line-height:1.5;
    }

    @media(max-width:640px){
      .topbar-inner{
        padding:12px 14px;
      }

      .accountName,
      .accountType{
        max-width:120px;
      }

      .wrap{
        padding:16px;
      }

      .row{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="accountLeft">
      <div class="accountIconWrap">
        <img
          class="accountIcon"
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
          alt="Practice Online"
        >
      </div>

      <div class="accountMeta">
        <div class="accountName">Practice Online</div>
        <div class="accountType">Create account</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="login.html" class="topLink">Login</a>
      <a href="register.html" class="topLink active">Register</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h2>Register Account</h2>
    <p>Create your Practice Online account</p>

    <div class="noteBox" id="acctNote">
      <b id="acctNoteTitle">Student Account</b>
      <span id="acctNoteText">Practice the Quizzes + Online Tutorials.</span>
    </div>

    <label>Account Type</label>
    <div class="radioRow">
      <label><input type="radio" name="accountType" value="student" checked> Student</label>
      <label><input type="radio" name="accountType" value="materials"> Practice Account</label>
    </div>

    <div class="normalFields">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" />

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" />

      <div class="row">
        <div>
          <label for="firstName">Name</label>
          <input id="firstName" autocomplete="given-name" />
        </div>
        <div>
          <label for="surname">Surname</label>
          <input id="surname" autocomplete="family-name" />
        </div>
      </div>

      <label for="schoolName">School Name</label>
      <input id="schoolName" autocomplete="organization" />

      <label for="currentMarkRange">Current Mark</label>
      <select id="currentMarkRange">
        <option value="">Select Current Mark</option>
        <option value="0-29">0-29</option>
        <option value="30-39">30-39</option>
        <option value="40-49">40-49</option>
        <option value="50-59">50-59</option>
        <option value="60-69">60-69</option>
        <option value="70-79">70-79</option>
        <option value="80-100">80-100</option>
      </select>

      <label>Are you in South Africa?</label>
      <div class="radioRow">
        <label><input type="radio" name="isSA" value="yes" checked> Yes</label>
        <label><input type="radio" name="isSA" value="no"> No</label>
      </div>

      <div id="saWrap">
        <label for="province">Province</label>
        <select id="province">
          <option value="">Select Province</option>
          <option value="Eastern Cape">Eastern Cape</option>
          <option value="Free State">Free State</option>
          <option value="Gauteng">Gauteng</option>
          <option value="KwaZulu-Natal">KwaZulu-Natal</option>
          <option value="Limpopo">Limpopo</option>
          <option value="Mpumalanga">Mpumalanga</option>
          <option value="Northern Cape">Northern Cape</option>
          <option value="North West">North West</option>
          <option value="Western Cape">Western Cape</option>
        </select>

        <label for="district">District</label>
        <select id="district" disabled>
          <option value="">Select District</option>
        </select>
      </div>

      <label for="gender">Gender</label>
      <select id="gender">
        <option value="">Prefer not to say</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
      </select>

      <div class="row">
        <div>
          <label for="cellphone">Your Cellphone</label>
          <input id="cellphone" inputmode="tel" placeholder="+27" />
        </div>
        <div>
          <label for="guardianCellphone">Guardian Cellphone</label>
          <input id="guardianCellphone" inputmode="tel" placeholder="+27" />
        </div>
      </div>

      <div id="gradeWrap">
        <label for="grade">Grade</label>
        <select id="grade">
          <option value="">Select Grade</option>
          <option value="8">Grade 8</option>
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
        </select>
      </div>

      <div class="autoPassInfo">
        Your password will be generated automatically and sent to your email after registration.
      </div>
    </div>

    <div class="row">
      <button id="registerBtn" class="btn" type="button">Register</button>
      <button id="resetBtn" class="ghost" type="button">Reset</button>
    </div>

    <p id="msg" class="msg"></p>

    <div class="links">
      <a href="login.html">Login</a>
      <a href="reset-otp.html">Forgot password?</a>
    </div>
  </div>
</main>

<script>
  const API = "https://practice-backend-msgn.onrender.com";

  const msg = document.getElementById("msg");
  const btn = document.getElementById("registerBtn");
  const resetBtn = document.getElementById("resetBtn");

  const acctNoteTitle = document.getElementById("acctNoteTitle");
  const acctNoteText  = document.getElementById("acctNoteText");

  const usernameEl = document.getElementById("username");
  const emailEl = document.getElementById("email");
  const firstNameEl = document.getElementById("firstName");
  const surnameEl = document.getElementById("surname");
  const schoolNameEl = document.getElementById("schoolName");
  const currentMarkRangeEl = document.getElementById("currentMarkRange");
  const gradeEl = document.getElementById("grade");
  const gradeWrap = document.getElementById("gradeWrap");

  const saWrap = document.getElementById("saWrap");
  const provinceEl = document.getElementById("province");
  const districtEl = document.getElementById("district");

  const genderEl = document.getElementById("gender");
  const cellphoneEl = document.getElementById("cellphone");
  const guardianCellEl = document.getElementById("guardianCellphone");

  function setMsg(text,type=""){
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g," ");
  }

  function isValidEmail(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim().toLowerCase());
  }

  function isValidSAPhone(phone){
    return /^\+27\d{9}$/.test(String(phone || "").trim());
  }

  function accountType(){
    return document.querySelector('input[name="accountType"]:checked').value;
  }

  function isSA(){
    return document.querySelector('input[name="isSA"]:checked')?.value === "yes";
  }

  function updateAccountNote(){
    const t = accountType();
    if (t === "student") {
      acctNoteTitle.textContent = "Student Account";
      acctNoteText.textContent  = "Practice the Quizzes + Online Tutorials.";
    } else {
      acctNoteTitle.textContent = "Practice Account";
      acctNoteText.textContent  = "Practice the Quizzes.";
    }
  }

  function toggleGrade(){
    const isStudent = accountType() === "student";
    gradeWrap.style.display = isStudent ? "block" : "none";
    if(!isStudent) gradeEl.value = "";
  }

  document.querySelectorAll('input[name="accountType"]').forEach(r=>{
    r.addEventListener("change", () => {
      toggleGrade();
      updateAccountNote();
    });
  });

  function ensurePlus27(el){
    el.addEventListener("focus", () => {
      if(!el.value.trim()) el.value = "+27";
    });
    el.addEventListener("blur", () => {
      if(el.value.trim() === "+27") el.value = "";
    });
  }

  ensurePlus27(cellphoneEl);
  ensurePlus27(guardianCellEl);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.tagName !== "SELECT") btn.click();
  });

  const DISTRICTS_BY_PROVINCE = {
    "Eastern Cape": [
      "Buffalo City (Metro)",
      "Nelson Mandela Bay (Metro)",
      "Amathole",
      "Chris Hani",
      "Joe Gqabi",
      "OR Tambo",
      "Sarah Baartman"
    ],
    "Free State": [
      "Mangaung (Metro)",
      "Fezile Dabi",
      "Lejweleputswa",
      "Thabo Mofutsanyana",
      "Xhariep"
    ],
    "Gauteng": [
      "City of Johannesburg (Metro)",
      "City of Tshwane (Metro)",
      "Ekurhuleni (Metro)",
      "Sedibeng",
      "West Rand"
    ],
    "KwaZulu-Natal": [
      "eThekwini (Metro)",
      "Amajuba",
      "Harry Gwala",
      "iLembe",
      "King Cetshwayo",
      "Ugu",
      "uMgungundlovu",
      "uMkhanyakude",
      "uMzinyathi",
      "uThukela",
      "Zululand"
    ],
    "Limpopo": [
      "Capricorn",
      "Mopani",
      "Sekhukhune",
      "Vhembe",
      "Waterberg"
    ],
    "Mpumalanga": [
      "Ehlanzeni",
      "Gert Sibande",
      "Nkangala"
    ],
    "Northern Cape": [
      "Frances Baard",
      "John Taolo Gaetsewe",
      "Namakwa",
      "Pixley ka Seme",
      "ZF Mgcawu"
    ],
    "North West": [
      "Bojanala Platinum",
      "Dr Kenneth Kaunda",
      "Dr Ruth Segomotsi Mompati",
      "Ngaka Modiri Molema"
    ],
    "Western Cape": [
      "City of Cape Town (Metro)",
      "Cape Winelands",
      "Central Karoo",
      "Garden Route",
      "Overberg",
      "West Coast"
    ]
  };

  function resetDistrict(){
    districtEl.innerHTML = `<option value="">Select District</option>`;
    districtEl.disabled = true;
  }

  function populateDistricts(){
    const prov = provinceEl.value;
    const list = DISTRICTS_BY_PROVINCE[prov] || [];
    resetDistrict();
    if(!prov || list.length === 0) return;

    const frag = document.createDocumentFragment();
    list.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      frag.appendChild(opt);
    });
    districtEl.appendChild(frag);
    districtEl.disabled = false;
  }

  provinceEl.addEventListener("change", populateDistricts);

  function toggleSAFields(){
    const yes = isSA();
    saWrap.classList.toggle("hide", !yes);

    if(!yes){
      provinceEl.value = "";
      resetDistrict();
    } else {
      populateDistricts();
    }
  }

  document.querySelectorAll('input[name="isSA"]').forEach(r=>{
    r.addEventListener("change", toggleSAFields);
  });

  function resetForm(){
    usernameEl.value = "";
    emailEl.value = "";
    firstNameEl.value = "";
    surnameEl.value = "";
    schoolNameEl.value = "";
    currentMarkRangeEl.value = "";
    genderEl.value = "";
    cellphoneEl.value = "";
    guardianCellEl.value = "";
    gradeEl.value = "";
    provinceEl.value = "";
    resetDistrict();
    document.querySelector('input[name="accountType"][value="student"]').checked = true;
    document.querySelector('input[name="isSA"][value="yes"]').checked = true;
    toggleGrade();
    updateAccountNote();
    toggleSAFields();
    setMsg("");
  }

  resetBtn.addEventListener("click", resetForm);

  btn.onclick = async () => {
    const type = accountType();

    const username = cleanSpaces(usernameEl.value);
    const email = emailEl.value.trim().toLowerCase();
    const firstName = cleanSpaces(firstNameEl.value);
    const surname = cleanSpaces(surnameEl.value);
    const schoolName = cleanSpaces(schoolNameEl.value);
    const currentMarkRange = currentMarkRangeEl.value.trim();

    const gender = genderEl.value.trim();
    const cellphone = cellphoneEl.value.trim();
    const guardianCellphone = guardianCellEl.value.trim();

    const province = isSA() ? provinceEl.value.trim() : "";
    const district = isSA() ? districtEl.value.trim() : "";

    if(!username) return setMsg("Username is required.","error");
    if(!email) return setMsg("Email is required.","error");
    if(!isValidEmail(email)) return setMsg("Please enter a valid email address.","error");
    if(!firstName) return setMsg("Name is required.","error");
    if(!surname) return setMsg("Surname is required.","error");
    if(!schoolName) return setMsg("School name is required.","error");
    if(!currentMarkRange) return setMsg("Please select your current mark.","error");
    if(!cellphone) return setMsg("Your cellphone number is required.","error");
    if(!guardianCellphone) return setMsg("Guardian cellphone is required.","error");
    if(!isValidSAPhone(cellphone)) return setMsg("Your cellphone must use format +27XXXXXXXXX","error");
    if(!isValidSAPhone(guardianCellphone)) return setMsg("Guardian cellphone must use format +27XXXXXXXXX","error");
    if(isSA() && !province) return setMsg("Please select your province.","error");
    if(isSA() && province && !district) return setMsg("Please select your district.","error");

    const payload = {
      username,
      email,
      accountType: type,
      ...(type === "student" ? { grade: Number(gradeEl.value) } : {}),
      ...(firstName ? { firstName } : {}),
      ...(surname ? { surname } : {}),
      ...(schoolName ? { schoolName } : {}),
      ...(currentMarkRange ? { currentMarkRange } : {}),
      ...(gender ? { gender } : {}),
      ...(province ? { province } : {}),
      ...(district ? { district } : {}),
      ...(cellphone ? { cellphone } : {}),
      ...(guardianCellphone ? { guardianCellphone } : {})
    };

    if(type === "student" && !Number.isFinite(payload.grade)){
      return setMsg("Please select a grade.","error");
    }

    btn.disabled = true;
    btn.textContent = "Creating account...";
    setMsg("Creating account...");

    try{
      const res = await fetch(API + "/api/register", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(()=>({}));

      if(!res.ok){
        btn.disabled = false;
        btn.textContent = "Register";
        return setMsg(data.message || "Registration failed.","error");
      }

      const extra =
        type === "student" && data.studentNumber
          ? ` Your student number is ${data.studentNumber}.`
          : "";

      setMsg(
        (data.message || "Account created successfully.") +
        extra +
        " Your password will be sent to your email.",
        "ok"
      );

      setTimeout(() => location.href = "login.html", 1600);

    }catch{
      btn.disabled = false;
      btn.textContent = "Register";
      setMsg("Network error. Please try again.","error");
    }
  };

  toggleGrade();
  updateAccountNote();
  toggleSAFields();
</script>

</body>
</html>
