<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Practice | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .wrap{max-width:1000px;margin:0 auto;padding:24px;}

    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:12px;}
    .brand{display:flex;align-items:center;gap:10px;}
    .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;}
    .brand span{font-size:13px;color:var(--muted);}

    .nav{display:flex;gap:14px;align-items:center;}
    .nav a{text-decoration:none;color:var(--text);padding:6px 8px;border-radius:8px;}
    .nav a.active{font-weight:600;color:var(--accent);}
    .nav .logout{background:var(--accent);color:white;border:none;padding:8px 12px;border-radius:10px;cursor:pointer;}

    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
    h1{margin:0;font-size:20px;}
    .muted{color:var(--muted);}
    .error{color:var(--error);}

    select,input{padding:10px;border-radius:10px;border:1px solid #ddd;}
    .controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
    .btn2{background:#fff;border:1px solid #ddd;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;}

    .topic-wrap{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
    .topic-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff;}
    .topic-head{display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .topic-title{font-size:16px;font-weight:800;color:var(--accent);}
    .toggle{border:1px solid #ddd;background:#fff;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:700;}

    .quiz-squares{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
    .quiz-square{width:64px;height:64px;border-radius:14px;border:1px solid var(--border);background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:800;}
    .quiz-square:hover{background:#eef7ff;}
    .hidden{display:none!important;}
  </style>

  <script>
    /* ✅ TOKEN DECLARED ONCE */
    const authToken = localStorage.getItem("token");
    if (!authToken) window.location.href = "login.html";
  </script>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <span id="welcomeSub"></span>
      </div>
    </div>

    <nav class="nav">
      <a class="active">Practice</a>
      <a href="about.html">About</a>
      <a href="admin-quiz.html" data-admin>Admin</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </nav>
  </div>

  <div class="card">
    <h1>Select Grade</h1>
    <p class="muted">Choose your grade to view quizzes.</p>

    <div class="controls">
      <select id="gradeSelect">
        <option value="">Choose grade</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select>

      <input id="topicSearch" placeholder="Search topic…" disabled />

      <button class="btn2" id="expandAllBtn" disabled>Expand all</button>
      <button class="btn2" id="collapseAllBtn" disabled>Collapse all</button>
    </div>

    <p id="status" class="muted"></p>
    <div id="quizList"></div>
  </div>

</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";

  document.getElementById("welcomeSub").textContent =
    "Welcome, " + (localStorage.getItem("username") || "Learner");

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.clear();
    window.location.href = "login.html";
  };

  const gradeSelect = document.getElementById("gradeSelect");
  const quizList = document.getElementById("quizList");
  const status = document.getElementById("status");
  const topicSearch = document.getElementById("topicSearch");
  const expandAllBtn = document.getElementById("expandAllBtn");
  const collapseAllBtn = document.getElementById("collapseAllBtn");

  let topicOpen = {};

  gradeSelect.onchange = loadQuizzes;
  topicSearch.oninput = () => filterTopics(topicSearch.value);
  expandAllBtn.onclick = () => toggleAll(true);
  collapseAllBtn.onclick = () => toggleAll(false);

  async function loadQuizzes(){
    const grade = gradeSelect.value;
    if (!grade) return;

    status.textContent = "Loading quizzes...";
    quizList.innerHTML = "";

    const res = await fetch(`${API}/api/quizzes?grade=${grade}`, {
      headers:{ Authorization:`Bearer ${authToken}` }
    });

    const quizzes = await res.json();

    if (!quizzes.length){
      status.textContent = "No quizzes found.";
      return;
    }

    const byTopic = {};
    quizzes.forEach(q=>{
      const t = q.topic || "General";
      (byTopic[t] ||= []).push(q);
      topicOpen[t] = true;
    });

    render(byTopic);
    topicSearch.disabled = expandAllBtn.disabled = collapseAllBtn.disabled = false;
    status.textContent = "";
  }

  function render(byTopic){
    quizList.innerHTML = `
      <div class="topic-wrap">
        ${Object.keys(byTopic).map(t=>`
          <div class="topic-card" data-topic="${t}">
            <div class="topic-head">
              <div class="topic-title">${t}</div>
              <button class="toggle" onclick="toggleTopic('${t}')">
                ${topicOpen[t] ? "Collapse" : "Expand"}
              </button>
            </div>
            <div class="quiz-squares ${topicOpen[t] ? "" : "hidden"}">
              ${byTopic[t].map((q,i)=>`
                <div class="quiz-square"
                  onclick="location.href='attempt.html?quizId=${q._id}'">
                  ${i+1}
                </div>`).join("")}
            </div>
          </div>`).join("")}
      </div>`;
  }

  function toggleTopic(t){
    topicOpen[t] = !topicOpen[t];
    loadQuizzes();
  }

  function toggleAll(open){
    Object.keys(topicOpen).forEach(t=>topicOpen[t]=open);
    loadQuizzes();
  }

  function filterTopics(q){
    q = q.toLowerCase();
    document.querySelectorAll("[data-topic]").forEach(card=>{
      card.classList.toggle("hidden", !card.dataset.topic.toLowerCase().includes(q));
    });
  }
</script>
</body>
</html>
