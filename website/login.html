<!doctype html>
<html>
<head>
<title>Login</title>
<style>
body{font-family:Arial;background:#f6f7fb}
.card{max-width:420px;margin:60px auto;background:#fff;padding:20px;border-radius:12px}
input,button{width:100%;padding:10px;margin-top:8px}
button{background:#0b3c5d;color:#fff;border:none;border-radius:8px;font-weight:bold}
.msg{margin-top:10px}
.error{color:red}
.ok{color:green}
</style>
</head>
<body>

<div class="card">
<h2>Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<p class="msg" id="msg"></p>
<a href="forgot-password.html">Forgot password?</a>
</div>

<script>
const API="https://practice-backend-msgn.onrender.com";

async function login(){
  const r=await fetch(API+"/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:email.value,password:password.value})
  });

  const d=await r.json();
  msg.className="msg "+(r.ok?"ok":"error");
  msg.textContent=d.message;

  if(r.ok){
    localStorage.setItem("token",d.token);
    alert("Student Number: "+(d.user.studentNumber||"N/A"));
  }
}
</script>

</body>
</html>
