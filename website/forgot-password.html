<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password</title>
</head>
<body style="font-family:Arial; max-width:520px; margin:40px auto;">
  <h2>Forgot Password</h2>
  <p>Enter your email. If it exists, we will send a reset link.</p>

  <input id="email" placeholder="you@example.com" style="width:100%; padding:10px;" />
  <button id="btn" style="margin-top:10px; padding:10px 14px;">Send reset link</button>

  <p id="msg" style="margin-top:10px;"></p>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    btn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim().toLowerCase();
      if (!email) { msg.textContent = "Enter your email."; return; }

      btn.disabled = true;
      msg.textContent = "Sending...";

      try {
        const res = await fetch(`${API}/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json().catch(()=>({}));

        // Always show the generic message (security)
        msg.textContent = data.message || "If that email exists, a reset link was sent.";
      } catch (e) {
        msg.textContent = "Network error. Please try again.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
