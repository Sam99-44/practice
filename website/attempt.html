<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Attempt Assessment | Practice Online</title>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    :root{
      --nav:#1b1648;
      --red:#e11d2e;

      --bg:#ffffff;
      --card:#ffffff;
      --border:#d9dee7;
      --text:#0f172a;
      --muted:#475569;

      --radius:14px;
      --shadow:none;

      --ok:#065f46;
      --error:#b91c1c;

      --soft:#f8fafc;
      --focus:0 0 0 4px rgba(226,232,240,.7);

      --noteBg:#f8fafc;
      --noteBd:#e5e7eb;
      --noteText:#0f172a;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Times New Roman", Times, serif;
      background:var(--bg);
      color:var(--text);
      font-weight:400;
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1150px;margin:0 auto;padding:18px}
    .muted{color:var(--muted)}
    .error{color:var(--error)}
    .ok{color:var(--ok)}
    .hidden{display:none!important}

    /* Make MathJax blend with normal text */
    mjx-container[jax="SVG"]{
      font-size:1em !important;
    }

    .qText mjx-container,
    .optText mjx-container,
    .hintText mjx-container,
    .noteBox mjx-container{
      font-size:1em !important;
    }

    /* ===== CONSISTENT HEADER ===== */
    .topbar{
      background:var(--nav);
      color:#fff;
      position:sticky;
      top:0;
      z-index:1000;
      font-family:Arial, Helvetica, sans-serif;
    }

    .topbar-inner{
      max-width:1150px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .accountLeft{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      cursor:default;
      user-select:none;
    }

    .accountIconWrap{
      width:auto;
      height:auto;
      background:transparent;
      border:none;
      box-shadow:none;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .accountIcon{
      width:40px;
      height:40px;
      display:block;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .accountMeta{
      min-width:0;
      line-height:1.1;
    }

    .accountName{
      font-size:16px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .accountType{
      font-size:13px;
      color:#e0e7ff;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
      text-transform:capitalize;
    }

    .topbarRight{
      display:flex;
      align-items:center;
      gap:14px;
      position:relative;
    }

    .iconBtn{
      min-width:50px;
      height:50px;
      border:none;
      background:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      padding:0 4px;
    }

    .iconBtn img{
      width:30px;
      height:30px;
      display:block;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .bellBtn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
    }

    .bellBtn:hover{
      opacity:.92;
    }

    .navBadge{
      min-width:auto;
      height:auto;
      padding:0;
      margin-left:2px;
      border-radius:0;
      background:transparent;
      color:#ffd6db;
      font-size:13px;
      font-weight:700;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      font-family:Arial, Helvetica, sans-serif;
    }

    .menuBtn{
      min-width:auto;
      height:50px;
      padding:0;
      gap:8px;
      border:none;
      background:transparent;
      border-radius:0;
      box-shadow:none;
      font-family:Arial, Helvetica, sans-serif;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .menuBtn:hover{
      background:transparent;
      opacity:1;
    }

    .menuBtnText{
      font-size:14px;
      font-weight:700;
      color:#fff;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      position:relative;
      top:-1px;
    }

    .menuBtn img{
      width:28px;
      height:28px;
      filter:brightness(0) invert(1) contrast(180%);
      display:block;
    }

    .menuDropdown{
      position:absolute;
      top:48px;
      right:0;
      width:210px;
      background:#f7f7f8;
      color:#111827;
      border:1px solid #d9dee7;
      border-radius:16px;
      box-shadow:0 14px 30px rgba(15,23,42,.14);
      padding:10px 0;
      display:none;
      font-family:Arial, Helvetica, sans-serif;
    }

    .menuDropdown.open{
      display:block;
    }

    .menuItem{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 18px;
      color:#111827;
      font-size:14px;
      font-weight:700;
      background:transparent;
      border:none;
      text-align:left;
      cursor:pointer;
    }

    .menuItem:hover{
      background:#eef2f7;
    }

    .menuItem img{
      width:18px;
      height:18px;
      display:block;
      flex-shrink:0;
    }

    .menuItem.profileTextOnly{
      padding-left:38px;
    }

    .menuDivider{
      height:1px;
      background:#dde4ec;
      margin:8px 0 6px;
    }

    .logoutMenuBtn{
      width:100%;
      border:none;
      background:transparent;
      cursor:pointer;
      text-align:left;
    }

    .section{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:18px;
      box-shadow:none;
      overflow:hidden;
      margin-top:14px;
    }

    .sectionHead{
      background:#fff;
      border-bottom:1px solid #ececec;
      padding:18px 22px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .sectionHead h1{
      margin:0;
      font-size:18px;
      letter-spacing:-0.01em;
      font-family:Arial, Helvetica, sans-serif;
      font-weight:700;
    }
    .sectionHead p{
      margin:6px 0 0 0;
      font-family:Arial, Helvetica, sans-serif;
      font-weight:400;
    }
    .sectionBody{
      padding:22px;
      background:#ffffff;
    }

    .examPaper{
      background:#ffffff;
      border:none;
      border-radius:0;
      padding:12px 6px 20px;
      box-shadow:none;
      max-width:860px;
      margin:0 auto;
    }

    .paperMeta{
      margin:0 0 26px 0;
      font-family:"Times New Roman", Times, serif;
      color:#111827;
      font-size:14px;
      line-height:1.5;
    }

    .paperTitle{
      font-size:14px;
      font-weight:400;
      margin:0 0 2px 0;
      text-transform:none;
      letter-spacing:0;
      line-height:1.5;
    }

    .paperMetaRow{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:16px;
      align-items:start;
      font-size:14px;
      line-height:1.5;
      margin-bottom:0;
    }

    .paperMetaLeft{
      min-width:0;
    }

    .paperMetaRight{
      white-space:nowrap;
      text-align:right;
      justify-self:end;
    }

    .metaRight{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:4px;
      min-width:220px;
    }
    .statusText{
      font-weight:800;
      font-size:12px;
      letter-spacing:.02em;
      text-transform:uppercase;
      font-family:Arial, Helvetica, sans-serif;
    }
    .statusText.available{color:#065f46}
    .statusText.unavailable{color:#b91c1c}
    .timeText{
      font-weight:400;
      font-size:12px;
      color:#0f172a;
      font-family:Arial, Helvetica, sans-serif;
    }
    .timeText.warn{color:#b45309}

    .q{
      padding:18px 0;
      border-top:none;
    }
    .q:first-child{padding-top:0}

    .qMainHeading{
      font-family:"Times New Roman", Times, serif;
      font-size:14px;
      font-weight:700;
      letter-spacing:0;
      text-transform:uppercase;
      color:#111827;
      margin:26px 0 18px;
      line-height:1.5;
    }

    .qSectionStem{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:18px;
      align-items:start;
      margin:18px 0 10px;
      font-family:"Times New Roman", Times, serif;
      color:#111827;
      line-height:1.5;
      font-size:14px;
    }

    .qSectionLeft{
      display:grid;
      grid-template-columns:56px minmax(0,1fr);
      gap:12px;
      align-items:start;
      min-width:0;
    }

    .qSectionNo{
      min-width:56px;
      font-weight:700;
    }

    .qSectionText{
      min-width:0;
      font-weight:400;
    }

    .qHead{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:18px;
      align-items:start;
      margin-bottom:6px;
    }

    .qTitle{
      font-weight:400;
      line-height:1.5;
      margin:0;
      min-width:0;
      word-break:break-word;
      font-size:14px;
      display:grid;
      grid-template-columns:56px minmax(0,1fr);
      gap:12px;
      align-items:start;
      font-family:"Times New Roman", Times, serif;
      color:#111827;
    }
    .qNo{
      font-weight:700;
      color:#111827;
      min-width:56px;
    }
    .qText{
      flex:1 1 auto;
      min-width:0;
      font-weight:400;
    }

    .marksBox{
      margin:0;
      padding:0;
      border:none;
      background:transparent;
      display:block;
      font-weight:400;
      color:#111827;
      line-height:1.2;
      font-family:"Times New Roman", Times, serif;
      font-size:14px;
      min-width:0;
    }
    .marksMeta{
      display:flex;
      align-items:flex-start;
      gap:0;
      flex:0 0 auto;
      font-family:"Times New Roman", Times, serif;
      color:#111827;
      padding-top:0;
      font-size:14px;
      line-height:1.3;
      white-space:nowrap;
      justify-self:end;
      margin:0;
      text-align:right;
      min-width:32px;
    }
    .marksMeta::before{content:"(";}
    .marksMeta::after{content:")";}
    .marksLbl{display:none;}.qimg{
      display:block;
      width:100%;
      max-width:560px;
      height:auto;
      border-radius:0;
      border:1px solid #d9dee7;
      margin:0 0 14px 68px;
    }

    .noteBox{
      border:none;
      background:#fff;
      border-radius:0;
      padding:4px 0 8px;
      color:#111827;
      font-weight:400;
      line-height:1.45;
      word-break:break-word;
      font-family:"Times New Roman", Times, serif;
      font-size:14px;
    }

    .opt{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding:5px 0 5px 68px;
      border:none;
      border-radius:0;
      margin-bottom:0;
      cursor:pointer;
      background:transparent;
      transition:.12s;
      font-family:"Times New Roman", Times, serif;
      font-weight:400;
      font-size:14px;
      line-height:1.45;
    }
    .opt:hover{background:transparent}
    .opt input{margin-top:2px}
    .opt.disabled{opacity:.7;cursor:not-allowed}
    .opt.disabled:hover{background:transparent}
    .optText{
      font-weight:400;
      line-height:1.55;
      display:block;
    }

    .textAnswer{
      width:100%;
      padding:8px 10px;
      border-radius:0;
      border:1px solid #d6d3d1;
      outline:none;
      font-size:14px;
      background:#fff;
      font-weight:400;
      font-family:"Times New Roman", Times, serif;
      color:var(--text);
      margin-left:68px;
      width:calc(100% - 68px);
    }
    .textAnswer:focus{border-color:#cbd5e1;box-shadow:var(--focus);}
    .textAnswer:disabled{opacity:.7;background:#f8fafc}

    .hint{
      margin-top:8px;
      margin-left:68px;
      padding:6px 8px;
      border-radius:0;
      background:#fff;
      border:1px solid #e5e7eb;
      color:#334155;
      font-size:12px;
      font-weight:400;
      font-family:"Times New Roman", Times, serif;
      line-height:1.4;
    }
    .hintText{
      font-weight:400;
    }

    .solutionBox{
      margin:12px 0 0 68px;
      padding:12px 14px;
      border:1px solid #e5e7eb;
      background:#fff;
      border-radius:0;
      font-family:"Times New Roman", Times, serif;
      color:#111827;
    }

    .solutionTitle{
      font-weight:700;
      font-size:13px;
      margin-bottom:10px;
    }

    .solutionStep{
      display:grid;
      grid-template-columns:92px 1fr;
      gap:10px;
      align-items:start;
      margin:10px 0 4px 0;
      font-size:14px;
      line-height:1.7;
    }

    .solutionStepNo{
      font-weight:700;
      white-space:nowrap;
    }

    .solutionStepBody{
      font-weight:400;
      min-width:0;
      word-break:break-word;
    }

    .solutionLine{
      margin:2px 0;
    }

    .solutionContinuation{
      margin:2px 0 10px 102px;
      font-size:14px;
      line-height:1.7;
    }

    .finalAnswerRow{
      margin-top:14px;
      padding-top:8px;
      border-top:1px solid #e5e7eb;
    }

    .finalAnswerText{
      font-weight:700;
      background:#f8fafc;
      border:1px solid #e5e7eb;
      padding:6px 8px;
      word-break:break-word;
    }

    @media(max-width:640px){
      .solutionBox{
        margin-left:56px;
      }

      .solutionStep{
        grid-template-columns:78px 1fr;
        gap:8px;
      }

      .solutionContinuation{
        margin-left:86px;
      }
    }

    .btnRow{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;}
    .btn{
      background:var(--red);
      color:#fff;
      padding:10px 14px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      font-family:Arial, Helvetica, sans-serif;
    }
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .btn2{
      background:#fff;
      border:1px solid #ddd;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      font-family:Arial, Helvetica, sans-serif;
    }
    .btn2:disabled{opacity:.6;cursor:not-allowed}

    .notice{
      border:1px solid #e5e7eb;
      background:#f8fafc;
      color:#334155;
      padding:12px;
      border-radius:12px;
      margin-top:12px;
      font-family:Arial, Helvetica, sans-serif;
      font-weight:400;
      line-height:1.45;
    }
    .notice.red{
      border-color:#fecaca;
      background:#fff1f2;
      color:#991b1b;
    }
    .notice.red b{
      font-weight:700;
    }

    .lockBox{
      border:1px dashed #ddd;
      background:#fafafa;
      padding:14px;
      border-radius:12px;
      margin-top:12px;
      font-family:Arial, Helvetica, sans-serif;
      font-weight:400;
      line-height:1.45;
    }

    #quizInfo b{
      font-weight:700;
    }

    #msg{
      font-weight:400;
      line-height:1.45;
    }

    @media(max-width:640px){
      .wrap{padding:14px}
      .sectionBody{padding:14px}
      .sectionHead{padding:12px 14px}
      .metaRight{align-items:flex-start;min-width:0}
      .examPaper{padding:16px 14px}
      .qMainHeading{font-size:14px;margin:22px 0 14px}
      .qSectionStem{
        font-size:14px;
        grid-template-columns:minmax(0,1fr) auto;
        gap:12px;
        margin:16px 0 10px;
      }
      .qSectionLeft{
        grid-template-columns:46px minmax(0,1fr);
        gap:10px;
      }
      .qSectionNo{min-width:46px}
      .qTitle{
        font-size:14px;
        grid-template-columns:46px minmax(0,1fr);
        gap:10px;
      }
      .qNo{min-width:46px}
      .marksBox{font-size:14px}
      .marksMeta,.qSectionMarks{font-size:14px;min-width:26px}
      .qimg{
        max-width:100%;
        margin-left:56px;
      }
      .opt{padding-left:56px;font-size:14px}
      .textAnswer{margin-left:56px;width:calc(100% - 56px)}
      .hint{margin-left:56px}

      .topbar-inner{
        padding:12px 14px;
      }

      .accountName,
      .accountType{
        max-width:120px;
      }

      .menuDropdown{
        width:200px;
      }

      .menuBtnText{
        display:none;
      }
    }
  </style>
</head>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="accountLeft">
      <div class="accountIconWrap">
        <img
          class="accountIcon"
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
          alt="Account"
        >
      </div>

      <div class="accountMeta">
        <div class="accountName" id="topAccountName">Loading...</div>
        <div class="accountType" id="topAccountType">Account</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="announcements.html" class="iconBtn bellBtn" title="Announcements" aria-label="Announcements">
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="Announcements">
        <span class="navBadge" id="navAnnouncementBadge">0</span>
      </a>

      <button class="menuBtn" id="menuToggleBtn" title="Menu" aria-label="Menu" type="button">
        <span class="menuBtnText">Menu</span>
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773952155/menu_q2xag6.svg" alt="Menu">
      </button>

      <div class="menuDropdown" id="menuDropdown">
        <a class="menuItem profileTextOnly" href="profile.html">
          <span>Profile</span>
        </a>

        <a class="menuItem" href="learner-quizzes.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777660/practice_ubgfso.svg" alt="">
          <span>Practice</span>
        </a>

        <a class="menuItem" href="results.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/results_qgdct1.svg" alt="Results">
          <span>Results</span>
        </a>

        <a class="menuItem" href="progress-dashboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="">
          <span>Dashboard</span>
        </a>

        <a class="menuItem" href="leaderboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777661/leaderboard_yfjgjf.svg" alt="">
          <span>Leaderboard</span>
        </a>

        <a class="menuItem" href="support.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/support_bs175s.svg" alt="">
          <span>Support</span>
        </a>

        <a class="menuItem" href="announcements.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="">
          <span>Announcements</span>
        </a>

        <div class="menuDivider"></div>

        <button class="menuItem logoutMenuBtn" id="logoutBtn" type="button">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773768418/logout_uay6y8.svg" alt="">
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="section">
    <div class="sectionHead">
      <div>
        <h1 id="quizTitle">Loading…</h1>
        <p class="muted" id="quizInfo"></p>
      </div>

      <div class="metaRight">
        <div class="statusText" id="statusText" style="display:none;">—</div>
        <div class="timeText" id="timeText" style="display:none;">Time: 00:00</div>
      </div>
    </div>

    <div class="sectionBody">
      <div id="lockNotice" class="lockBox hidden">
        <b class="error">Attempt already submitted.</b>
        <div class="muted" style="margin-top:4px;">
          You can retry in <b>Practice Mode</b>. Practice results are not saved.
        </div>
      </div>

      <div id="unavailableNotice" class="notice red hidden">
        <b>This assessment is not available right now.</b>
        <div class="muted" style="margin-top:4px;">Please try again later.</div>
      </div>

      <div id="questions" class="examPaper"></div>

      <div class="btnRow">
        <button class="btn" id="submitBtn" type="button">Submit</button>
        <button class="btn2" id="retryBtn" type="button" disabled>Retry</button>
        <button class="btn2" id="viewResultsBtn" type="button" disabled>View Results</button>
      </div>

      <p id="msg" class="muted" style="margin:12px 0 0;"></p>
    </div>
  </div>
</div>

<script>
  const API = "https://api.practiceonline.co.za";

  const qs = new URLSearchParams(window.location.search);
  const quizId = qs.get("quizId");

  async function loadTopbarProfile(){
    try{
      const res = await fetch(`${API}/api/profile/me`, {
        headers:{Authorization:`Bearer ${token}`}

      if(res.status === 401){
        localStorage.removeItem("token");

        location.href = "login.html";

      }

      const data = await res.json().catch(()=>null);

  async function loadTopbarAnnouncementCount(){
    try{
      const res = await fetch(`${API}/api/announcements/profile-summary`, {
        headers:{Authorization:`Bearer ${token}`}
      });

      const data = await res.json().catch(() => ({}));
      document.getElementById("navAnnouncementBadge").textContent = Number(data.count || 0);

      document.getElementById("navAnnouncementBadge").textContent = "0";

  }

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  function normalizeIndexArray(v){
    if (!Array.isArray(v)) return [];
    const out = [];
    for (const x of v){
      const n = Number(x);
      if (Number.isInteger(n) && n >= 0) out.push(n);
    }
    return [...new Set(out)].sort((a,b)=>a-b);
  }

  function isMultiQuestion(q){
    const idxs = normalizeIndexArray(q?.correctIndexes || []);
    return Boolean(q?.isMultiSelect) || idxs.length > 1;
  }

  function setAvailability(isAvailable){
    statusText.style.display = "block";
    if (isAvailable){
      statusText.textContent = "AVAILABLE";
      statusText.className = "statusText available";
    } else {
      statusText.textContent = "UNAVAILABLE";
      statusText.className = "statusText unavailable";
    }
  }

  function disableAllInputs(){
    document.querySelectorAll("input[type=radio], input[type=checkbox], input[type=text], input[type=number], textarea").forEach(el => el.disabled = true);
    document.querySelectorAll(".opt").forEach(el => el.classList.add("disabled"));
  }

  function enableAllInputs(){
    document.querySelectorAll("input[type=radio], input[type=checkbox], input[type=text], input[type=number], textarea").forEach(el => el.disabled = false);
    document.querySelectorAll(".opt").forEach(el => el.classList.remove("disabled"));
  }

  function resetTimerFresh(){
    localStorage.removeItem(END_KEY);
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    quizEndAtMs = null;
    if (quizData) startTimerWithQuiz(quizData);
  }

  function clearAllAnswers(){
    document.querySelectorAll(".mcqInput").forEach(inp => { inp.checked = false; });
    document.querySelectorAll(".textAnswer").forEach(inp => { inp.value = ""; });
  }
  function hideAllSolutions(){
    document.querySelectorAll(".solutionHolder").forEach(el => {
      el.classList.add("hidden");
    });
  }

  function showAllSolutions(){
    document.querySelectorAll(".solutionHolder").forEach(el => {
      if (el.innerHTML.trim()) {
        el.classList.remove("hidden");
        typesetMath(el);
      }
    });
    typesetMath(questionsDiv);
  }


  function isUnavailableBySchedule(quiz){
    const now = new Date();
    if (quiz?.isFrozen) return true;

    if (quiz?.availableFrom){
      const from = new Date(quiz.availableFrom);
      if (!isNaN(from.getTime()) && now < from) return true;
    }
    if (quiz?.availableUntil){
      const until = new Date(quiz.availableUntil);
      if (!isNaN(until.getTime()) && now > until) return true;
    }
    return false;
  }

  function countScorableQuestions(){
    return (quizData?.questions || []).filter(q => String(q.type || "mcq").toLowerCase() !== "note").length;
  }

  async function checkAlreadyAttempted(){
    try{
      const r = await fetch(`${API}/api/results/my`,{
        headers:{ Authorization:"Bearer " + token }
      });
      if (r.status === 401) return false;
      const rows = await r.json().catch(()=>[]);
      const list = Array.isArray(rows) ? rows : [];
      return list.some(x => String(x.quizId) === String(quizId));
    }catch{
      return false;
    }
  }

  function parseNumberOrFraction(input) {
    const s = String(input || "").trim().replace(/,/g, ".").replace(/−/g, "-");
    if (!s) return null;

    const m = s.match(/^([+-]?\d+(?:\.\d+)?)\s*\/\s*([+-]?\d+(?:\.\d+)?)$/);
    if (m) {
      const a = Number(m[1]);
      const b = Number(m[2]);
      if (!Number.isFinite(a) || !Number.isFinite(b) || b === 0) return null;
      return a / b;
    }
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  function normalizeTextAnswer(s) {
    return String(s || "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, "")
      .replace(/−/g, "-");
  }

  function compareTextAnswer(userAns, correctAns, mode, tolerance) {
    const uaRaw = String(userAns || "");
    const caRaw = String(correctAns || "");
    if (!caRaw.trim()) return false;

    const uNum = parseNumberOrFraction(uaRaw);
    const cNum = parseNumberOrFraction(caRaw);

    if (mode === "number_tolerance") {
      const tol = Number(tolerance);
      if (uNum === null || cNum === null || !Number.isFinite(tol) || tol < 0) return false;
      return Math.abs(uNum - cNum) <= tol;
    }

    if (uNum !== null && cNum !== null) return Math.abs(uNum - cNum) <= 1e-12;

    const ua = normalizeTextAnswer(uaRaw);
    const ca = normalizeTextAnswer(caRaw);

    if (mode === "contains") return ua.includes(ca);
    return ua === ca;
  }

  function isMultiMcqCorrect(chosenIdxs, correctIdxs){
    const a = normalizeIndexArray(chosenIdxs);
    const b = normalizeIndexArray(correctIdxs);
    if (!b.length) return false;
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function computePracticeResult(){
    const qs = Array.isArray(quizData?.questions) ? quizData.questions : [];
    let totalPoints = 0;
    let scorePoints = 0;

    qs.forEach((q, i) => {
      const type = String(q.type || "mcq").toLowerCase();
      if (type === "note") return;

      const pts = Math.max(1, Math.round(Number(q.points || 1)));
      totalPoints += pts;

      if (type === "text") {
        const inp = document.getElementById(`txt${i}`);
        const userText = inp ? cleanSpaces(inp.value) : "";
        const correctText = cleanSpaces(q.correctText || "");
        const mode = q.textAnswerMode || "exact";
        const tol = q.numberTolerance ?? 0;
        if (compareTextAnswer(userText, correctText, mode, tol)) scorePoints += pts;
        return;
      }

      const multi = isMultiQuestion(q);
      if (multi){
        const checked = [...document.querySelectorAll(`.mcqInput[data-qindex="${i}"]:checked`)];
        const chosenIndexes = checked.map(el => Number(el.value)).filter(n => Number.isInteger(n) && n >= 0);
        const correctIndexes = normalizeIndexArray(q.correctIndexes || []);
        if (isMultiMcqCorrect(chosenIndexes, correctIndexes)) scorePoints += pts;
      } else {
        const chosen = document.querySelector(`.mcqInput[data-qindex="${i}"]:checked`);
        const chosenIndex = chosen ? Number(chosen.value) : -1;
        const correctIndex = Number.isFinite(Number(q.correctIndex)) ? Number(q.correctIndex) : -1;
        if (chosenIndex === correctIndex && correctIndex >= 0) scorePoints += pts;
      }
    });

    const percent = totalPoints > 0 ? Math.round((scorePoints / totalPoints) * 100) : 0;
    return { scorePoints, totalPoints, percent };
  }

  function calcFallbackSeconds(totalQuestions){
    const raw = totalQuestions * 60;
    return Math.max(5 * 60, Math.min(raw, 30 * 60));
  }

  function startTimerWithQuiz(quiz){
    const now = Date.now();
    const savedEnd = Number(localStorage.getItem(END_KEY));

    if (savedEnd && Number.isFinite(savedEnd)) {
      quizEndAtMs = savedEnd;
    } else {
      const mins = Number(quiz.timeLimitMinutes || 0);
      const totalQuestions = (quiz.questions || []).filter(q => String(q.type || "mcq").toLowerCase() !== "note").length;

      let secs;
      if (Number.isFinite(mins) && mins > 0) secs = mins * 60;
      else secs = calcFallbackSeconds(totalQuestions);

      quizEndAtMs = now + (secs * 1000);
      localStorage.setItem(END_KEY, String(quizEndAtMs));
    }

    timeText.style.display = "block";
    timeText.classList.remove("warn");

    if (quizEndAtMs <= now) {
      timeText.textContent = "Time: 00:00";
      timeText.classList.add("warn");
      msgEl.className = "error";
      msgEl.textContent = "Time is up. Submitting…";
      submitQuiz("auto");
      return;
    }

    tickTimer();
    clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 1000);
  }

  function tickTimer(){
    if (!quizEndAtMs || submitted || blocked) return;

    const remainingMs = quizEndAtMs - Date.now();

    if (remainingMs <= 0) {
      timeText.textContent = "Time: 00:00";
      timeText.classList.add("warn");

      clearInterval(timerInterval);
      timerInterval = null;

      msgEl.className = "error";
      msgEl.textContent = "Time is up. Submitting…";

      submitQuiz("auto");
      return;
    }

    const remainingSec = Math.ceil(remainingMs / 1000);
    const mm = String(Math.floor(remainingSec / 60)).padStart(2, "0");
    const ss = String(remainingSec % 60).padStart(2, "0");

    timeText.textContent = `Time: ${mm}:${ss}`;

    if (remainingSec <= 60) timeText.classList.add("warn");
    else timeText.classList.remove("warn");
  }

  function getTimeTakenSeconds(){
    const mins = Number(quizData?.timeLimitMinutes || 0);
    const totalQuestions = (quizData?.questions || []).filter(q => String(q.type || "mcq").toLowerCase() !== "note").length;
    const totalSec = (Number.isFinite(mins) && mins > 0) ? mins * 60 : calcFallbackSeconds(totalQuestions);
    const remainingSec = quizEndAtMs ? Math.max(0, Math.ceil((quizEndAtMs - Date.now()) / 1000)) : 0;
    return Math.max(0, totalSec - remainingSec);
  }

  function buildAnswersPayload(){
    const answers = [];
    (quizData.questions || []).forEach((q, i) => {
      const type = String(q.type || "mcq").toLowerCase();
      if (type === "note") return;

      if (type === "text") {
        const inp = document.getElementById(`txt${i}`);
        answers.push({ questionIndex: i, textAnswer: inp ? cleanSpaces(inp.value) : "" });
        return;
      }

      const multi = isMultiQuestion(q);
      if (multi){
        const checked = [...document.querySelectorAll(`.mcqInput[data-qindex="${i}"]:checked`)];
        const chosenIndexes = checked.map(el => Number(el.value)).filter(n => Number.isInteger(n) && n >= 0);
        answers.push({ questionIndex: i, chosenIndexes });
      } else {
        const chosen = document.querySelector(`.mcqInput[data-qindex="${i}"]:checked`);
        answers.push({ questionIndex: i, chosenIndex: chosen ? Number(chosen.value) : -1 });
      }
    });
    return answers;
  }

  function countAnswered(){
    let answered = 0;
    (quizData.questions || []).forEach((q, i) => {
      const type = String(q.type || "mcq").toLowerCase();
      if (type === "note") return;

      if (type === "text") {
        const inp = document.getElementById(`txt${i}`);
        if (inp && cleanSpaces(inp.value)) answered++;
        return;
      }

      const multi = isMultiQuestion(q);
      if (multi){
        if (document.querySelectorAll(`.mcqInput[data-qindex="${i}"]:checked`).length > 0) answered++;
      } else {
        if (document.querySelector(`.mcqInput[data-qindex="${i}"]:checked`)) answered++;
      }
    });
    return answered;
  }

  function applyPracticeUI(){
    viewResultsBtn.classList.add("hidden");
  }

  function applyNormalUI(){
    viewResultsBtn.classList.remove("hidden");
  }

  function startPracticeMode(){
    if (!quizData) return;

    practiceMode = true;
    blocked = false;
    submitted = false;

    applyPracticeUI();

    msgEl.className = "muted";
    msgEl.textContent = "Practice Mode: Submit to see your percentage. This attempt will NOT be saved.";

    clearAllAnswers();
    enableAllInputs();
    hideAllSolutions();
    resetTimerFresh();

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
    submitBtn.onclick = () => submitQuiz("manual");

    retryBtn.disabled = false;

    lockNotice.classList.add("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  retryBtn.onclick = startPracticeMode;

  async function submitQuiz(mode){
    if (!quizData || submitted || blocked) return;

    const total = countScorableQuestions();
    const answered = countAnswered();

    if (mode === "manual" && answered < total) {
      msgEl.className = "error";
      msgEl.textContent = `Please answer all questions before submitting.`;
      return;
    }

    submitted = true;
    submitBtn.disabled = true;

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    localStorage.removeItem(END_KEY);

    if (practiceMode) {
      const r = computePracticeResult();

      if (r.percent === 100) {
        msgEl.className = "ok";
        msgEl.textContent = `Outcome: ${r.percent}%. Well done! Move to the next assessment.`;
      } else {
        msgEl.className = "error";
        msgEl.textContent = `Outcome: ${r.percent}%. You are getting there, please retry again until you get to 100%.`;
      }

      retryBtn.disabled = false;
      disableAllInputs();
      showAllSolutions();
      return;
    }

    if (alreadyAttempted) {
      msgEl.className = "error";
      msgEl.textContent = "You already submitted this assessment. Use Retry (Practice Mode).";
      blocked = true;
      disableAllInputs();
      showAllSolutions();
      return;
    }

    const payload = {
      quizId,
      answers: buildAnswersPayload(),
      timeTakenSeconds: getTimeTakenSeconds()
    };

    let res;
    try{
      res = await fetch(`${API}/api/results`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify(payload)
      });
    }catch{
      msgEl.className = "error";
      msgEl.textContent = "Network error. Please try again.";
      submitted = false;
      submitBtn.disabled = false;
      return;
    }

    if (res.status === 409) {
      alreadyAttempted = true;
      lockNotice.classList.remove("hidden");
      msgEl.className = "error";
      msgEl.textContent = "First attempt already saved. You can retry in Practice Mode.";
      disableAllInputs();

      retryBtn.disabled = false;
      submitBtn.disabled = true;

      applyNormalUI();
      viewResultsBtn.disabled = false;
      viewResultsBtn.onclick = () => window.location.href = "results.html";
      showAllSolutions();
      return;
    }

    if (!res.ok) {
      const data = await res.json().catch(()=>({}));
      msgEl.className = "error";
      msgEl.textContent = data.message || "Could not save attempt. Please try again.";
      submitted = false;
      submitBtn.disabled = false;
      return;
    }

    alreadyAttempted = true;
    msgEl.className = "ok";
    msgEl.textContent = "First attempt submitted and saved. You can now retry (Practice Mode).";

    retryBtn.disabled = false;

    applyNormalUI();
    viewResultsBtn.disabled = false;
    viewResultsBtn.onclick = () => window.location.href = "results.html";

    disableAllInputs();
    showAllSolutions();
  }

  async function loadQuiz() {
    msgEl.className = "muted";
    msgEl.textContent = "";
    lockNotice.classList.add("hidden");
    unavailableNotice.classList.add("hidden");
    blocked = false;
    submitted = false;
    practiceMode = false;

    alreadyAttempted = await checkAlreadyAttempted();

    let res;
    try{
      res = await fetch(`${API}/api/quizzes/${encodeURIComponent(quizId)}`, {
        headers: { Authorization: "Bearer " + token }
      });
    }catch{
      quizTitle.textContent = "Network error";
      msgEl.className = "error";
      msgEl.textContent = "Please refresh and try again.";
      submitBtn.disabled = true;
      return;
    }

    if (res.status === 401) {
      localStorage.removeItem("token");
      const next = encodeURIComponent(window.location.href);
      window.location.href = `login.html?next=${next}`;
      return;
    }

    if (!res.ok) {
      quizTitle.textContent = "Assessment not found";
      submitBtn.disabled = true;
      return;
    }

    quizData = await res.json().catch(()=>null);
    if (!quizData){
      quizTitle.textContent = "Could not load assessment";
      submitBtn.disabled = true;
      return;
    }

    quizTitle.textContent = cleanSpaces(quizData.title || "Assessment");
    quizInfo.innerHTML = cleanSpaces(quizData.topic || "") ? `<b>Topic:</b> ${escapeHtml(cleanSpaces(quizData.topic))}` : "";

    const unavailable = isUnavailableBySchedule(quizData);
    setAvailability(!unavailable);

    let displayNo = 0;
    const totals = computeQuestionAndSectionTotals(quizData.questions || []);
    const paperMetaHtml = buildPaperMeta(quizData);
    const allQuestions = quizData.questions || [];
    const hasMainHeading = allQuestions.some(q => {
      const type = String(q?.type || "mcq").toLowerCase();
      if (type !== "note") return false;
      return parseExamTextParts(cleanSpaces(q?.text || "")).kind === "main";
    });
    const autoMainHeadingHtml = hasMainHeading ? "" : `<div class="q"><div class="qMainHeading">QUESTION 1</div></div>`;

    questionsDiv.innerHTML = paperMetaHtml + autoMainHeadingHtml + allQuestions.map((q, i) => {
      const type = String(q.type || "mcq").toLowerCase();
      const hint = cleanSpaces(q.hint || "");
      const img = cleanSpaces(q.imageUrl || "");
      const solution = String(q.solution || "").trim();
      const points = getQuestionPoints(q);
      const rawText = cleanSpaces(q.text || "");
      const mainNo = getMainQuestionNumber(rawText, 1);
      const sectionKey = getSectionKey(rawText, mainNo);
      const questionTotal = totals.mainTotals.get(mainNo) || points;
      const sectionTotal = totals.sectionTotals.get(sectionKey) || points;

      const imageHtml = img ? `<img class="qimg" src="${escapeAttr(img)}" alt="Question image">` : "";

      if (type === "note") {
        return renderNoteLike(rawText, imageHtml, sectionTotal);
      }

      displayNo += 1;
      const headHtml = renderQuestionHead(rawText, points, displayNo, questionTotal);

      if (type === "text") {
        return `
          <div class="q" data-scorable="1">
            ${imageHtml}
            ${headHtml}
            <input class="textAnswer" id="txt${i}" placeholder="Type your answer" autocomplete="off" />
            ${hint ? `<div class="hint">Hint: <span class="hintText">${escapeHtml(hint)}</span></div>` : ``}
            <div class="solutionHolder hidden">${formatSolutionHtml(solution)}</div>
          </div>
        `;
      }

      const opts = Array.isArray(q.options) ? q.options : [];
      const multi = isMultiQuestion(q);
      const inputType = multi ? "checkbox" : "radio";

      return `
        <div class="q" data-scorable="1" data-qindex="${i}">
          ${imageHtml}
          ${headHtml}
          ${opts.map((o, j) => `
            <label class="opt">
              <input class="mcqInput" data-qindex="${i}" type="${inputType}" name="q${i}" value="${j}">
              <span class="optText">${renderMixedMath(cleanSpaces(o))}</span>
            </label>
          `).join("")}
          ${hint ? `<div class="hint">Hint: <span class="hintText">${escapeHtml(hint)}</span></div>` : ``}
          <div class="solutionHolder hidden">${formatSolutionHtml(solution)}</div>
        </div>
      `;
    }).join("");

    hideAllSolutions();
    typesetMath(questionsDiv);

    if (unavailable){
      unavailableNotice.classList.remove("hidden");
      blocked = true;
      submitBtn.disabled = true;
      retryBtn.disabled = true;
      viewResultsBtn.disabled = true;
      disableAllInputs();
      return;
    }

    if (alreadyAttempted){
      lockNotice.classList.remove("hidden");
      msgEl.className = "muted";
      msgEl.textContent = "Your first attempt is already saved. You can retry (Practice Mode).";

      submitBtn.disabled = true;
      submitBtn.textContent = "Submit (Locked - Already Saved)";

      retryBtn.disabled = false;

      applyNormalUI();
      viewResultsBtn.disabled = false;
      viewResultsBtn.onclick = () => window.location.href = "results.html";

      disableAllInputs();
      showAllSolutions();
      resetTimerFresh();

      if (wantsPracticeFromLink) startPracticeMode();
      return;
    }

    practiceMode = false;
    applyNormalUI();

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit";
    retryBtn.disabled = true;

    viewResultsBtn.disabled = true;

    startTimerWithQuiz(quizData);
    submitBtn.onclick = () => submitQuiz("manual");

    if (wantsPracticeFromLink) {
      msgEl.className = "error";
      msgEl.textContent = "Practice Mode is available after you submit your first attempt.";
    }
  }

  function toLatex(text){
    let t = String(text || "").trim();
    if (!t) return "";

    if (/\\\(|\\\[|\\frac|\\sqrt|\$/.test(t)) return t;

    t = t
      .replace(/<=/g, "\\leq ")
      .replace(/>=/g, "\\geq ")
      .replace(/!=/g, "\\neq ")
      .replace(/≤/g, "\\leq ")
      .replace(/≥/g, "\\geq ");

    t = t.replace(/sqrt\(([^()]+)\)/gi, "\\sqrt{$1}");
    t = t.replace(/([A-Za-z0-9)\]])\s*\^\s*\(([^()]+)\)/g, "$1^{$2}");
    t = t.replace(/([A-Za-z0-9)\]])\s*\^\s*([+-]?\d+)/g, "$1^{$2}");
    t = t.replace(/(\d+)\s*\/\s*(\d+)/g, "\\frac{$1}{$2}");

    return `$${t}$`;
  }

  function renderMixedMath(text){
    const raw = String(text || "").trim();
    if (!raw) return "";

    if (/\\\(|\\\[|\\frac|\\sqrt|\$/.test(raw)) {
      return raw.includes("$") ? raw : `$${raw}$`;
    }

    const protectedParts = [];
    let temp = raw.replace(/(Final Answer:|Step\s*\d+:)/gi, (m) => `@@LBL${protectedParts.push(m)-1}@@`);

    temp = temp.replace(
      /(sqrt\([^()]+\)|[A-Za-z0-9)\]]\s*\^\s*(?:\([^()]+\)|[+-]?\d+)|\d+\s*\/\s*\d+|[A-Za-z0-9()\s+\-*/]+(?:<=|>=|<|>|=)[A-Za-z0-9()\s+\-*/]+)/g,
      (m) => `@@M${protectedParts.push(m)-1}@@`
    );

    temp = escapeHtml(temp);

    temp = temp.replace(/@@LBL(\d+)@@/g, (_, i) => `<span>${escapeHtml(protectedParts[Number(i)])}</span>`);
    temp = temp.replace(/@@M(\d+)@@/g, (_, i) => toLatex(protectedParts[Number(i)]));

    return temp;
  }

  function formatSolutionHtml(solutionText){
    const raw = String(solutionText || "").trim();
    if (!raw) return "";

    function normalizeSolutionText(input){
      let s = String(input || "").replace(/\r/g, "\n");

      s = s.replace(/\$/g, "");

      s = s
        .replace(/\\leq/g, "≤")
        .replace(/\\geq/g, "≥")
        .replace(/\\neq/g, "≠")
        .replace(/\\sqrt/g, "sqrt");

      s = s
        .replace(/\s*Final\s*Answer\s*:/gi, "\n\nFinal Answer: ")
        .replace(/\s*Step\s*(\d+)\s*:/gi, "\n\nStep $1: ");

      s = s
        .replace(/([a-zA-Z])\(/g, "$1 (")
        .replace(/\)([a-zA-Z])/g, ") $1");

      s = s
        .replace(/<=/g, "≤")
        .replace(/>=/g, "≥")
        .replace(/([<>]=?|=)([^\s])/g, "$1 $2")
        .replace(/([^\s])([<>]=?|=)/g, "$1 $2");

      s = s
        .replace(/([a-z0-9])or([a-z0-9])/gi, "$1 or $2")
        .replace(/([a-z0-9])and([a-z0-9])/gi, "$1 and $2");

      s = s.replace(/:\s*/g, ": ");

      s = s
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n");

      return s.trim();
    }

    const cleanedText = normalizeSolutionText(raw);
    const rawLines = cleanedText.split("\n");
    const blocks = [];
    let current = null;

    for (const rawLine of rawLines) {
      const line = rawLine.trim();
      if (!line) continue;

      const stepMatch = line.match(/^(Step\s*\d+\s*:)(.*)$/i);
      const finalMatch = line.match(/^(Final Answer\s*:|Answer\s*:)(.*)$/i);

      if (stepMatch) {
        if (current) blocks.push(current);
        current = {
          type: "step",
          label: stepMatch[1].trim(),
          lines: stepMatch[2].trim() ? [stepMatch[2].trim()] : []
        };
        continue;
      }

      if (finalMatch) {
        if (current) blocks.push(current);
        current = {
          type: "final",
          label: finalMatch[1].trim(),
          lines: finalMatch[2].trim() ? [finalMatch[2].trim()] : []
        };
        continue;
      }

      if (!current) current = { type: "plain", label: "", lines: [line] };
      else current.lines.push(line);
    }

    if (current) blocks.push(current);

    const html = blocks.map(block => {
      if (block.type === "final") {
        return `
          <div class="solutionStep finalAnswerRow">
            <div class="solutionStepNo">${escapeHtml(block.label)}</div>
            <div class="solutionStepBody finalAnswerText">
              ${block.lines.map(line => `<div class="solutionLine">${renderMixedMath(line)}</div>`).join("")}
            </div>
          </div>
        `;
      }

      if (block.type === "step") {
        return `
          <div class="solutionStep">
            <div class="solutionStepNo">${escapeHtml(block.label)}</div>
            <div class="solutionStepBody">
              ${block.lines.map(line => `<div class="solutionLine">${renderMixedMath(line)}</div>`).join("")}
            </div>
          </div>
        `;
      }

      return `
        <div class="solutionContinuation">
          ${block.lines.map(line => `<div class="solutionLine">${renderMixedMath(line)}</div>`).join("")}
        </div>
      `;
    }).join("");

    return `
      <div class="solutionBox">
        <div class="solutionTitle">Solution / Workings</div>
        ${html}
      </div>
    `;
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(str){
    return String(str || "").replaceAll('"',"&quot;");
  }

  function parseExamTextParts(rawText){
    const text = cleanSpaces(rawText || "");
    if (!text) return { kind:"plain", label:"", body:"" };

    const qMain = text.match(/^QUESTION\s+(\d+)\s*[:.-]?\s*(.*)$/i);
    if (qMain) {
      return { kind:"main", label:`QUESTION ${qMain[1]}`, body:cleanSpaces(qMain[2] || "") };
    }

    const triple = text.match(/^(\d+\.\d+\.\d+)\s+(.*)$/);
    if (triple) {
      return { kind:"sub", label:triple[1], body:cleanSpaces(triple[2] || "") };
    }

    const double = text.match(/^(\d+\.\d+)\s+(.*)$/);
    if (double) {
      return { kind:"section", label:double[1], body:cleanSpaces(double[2] || "") };
    }

    const single = text.match(/^(\d+)\.\s+(.*)$/);
    if (single) {
      return { kind:"single", label:`${single[1]}.`, body:cleanSpaces(single[2] || "") };
    }

    return { kind:"plain", label:"", body:text };
  }

  function getQuestionPoints(q){
    return Math.max(1, Math.round(Number(q?.points || 1)));
  }

  function getMainQuestionNumber(rawText, fallbackNo){
    const parsed = parseExamTextParts(rawText);
    if (parsed.kind === "main") {
      const m = String(parsed.label || "").match(/^QUESTION\s+(\d+)$/i);
      return m ? Number(m[1]) : fallbackNo;
    }
    const label = String(parsed.label || "");
    const m = label.match(/^(\d+)/);
    return m ? Number(m[1]) : fallbackNo;
  }

  function getSectionKey(rawText, fallbackNo){
    const parsed = parseExamTextParts(rawText);
    if (parsed.kind === "section") return parsed.label;
    if (parsed.kind === "sub") {
      const m = String(parsed.label || "").match(/^(\d+\.\d+)\./);
      if (m) return m[1];
    }
    return `${fallbackNo}.1`;
  }

  function computeQuestionAndSectionTotals(questions){
    const mainTotals = new Map();
    const sectionTotals = new Map();
    let currentMain = 1;

    (questions || []).forEach((q) => {
      const type = String(q?.type || "mcq").toLowerCase();
      const rawText = cleanSpaces(q?.text || "");

      if (type === "note") {
        const parsed = parseExamTextParts(rawText);
        if (parsed.kind === "main") {
          const m = String(parsed.label || "").match(/^QUESTION\s+(\d+)$/i);
          if (m) currentMain = Number(m[1]);
        }
        return;
      }

      const pts = getQuestionPoints(q);
      const mainNo = getMainQuestionNumber(rawText, currentMain || 1);
      currentMain = mainNo;
      const sectionKey = getSectionKey(rawText, currentMain);

      mainTotals.set(mainNo, (mainTotals.get(mainNo) || 0) + pts);
      sectionTotals.set(sectionKey, (sectionTotals.get(sectionKey) || 0) + pts);
    });

    return { mainTotals, sectionTotals };
  }

  function computeOverallTotalMarks(questions){
    return (questions || []).reduce((sum, q) => {
      const type = String(q?.type || "mcq").toLowerCase();
      if (type === "note") return sum;
      return sum + getQuestionPoints(q);
    }, 0);
  }

  function buildPaperMeta(quiz){
    const title = cleanSpaces(quiz?.title || "Assessment");
    const totalMarks = computeOverallTotalMarks(quiz?.questions || []);
    const mins = Number(quiz?.timeLimitMinutes || 0);
    const timeLabel = Number.isFinite(mins) && mins > 0 ? `${mins} minutes` : "Not set";

    return `
      <div class="paperMeta">
        <div class="paperTitle"><b>Title :</b> ${escapeHtml(title)}</div>
        <div class="paperMetaRow">
          <div class="paperMetaLeft"><b>Total Marks:</b> ${totalMarks}</div>
          <div class="paperMetaRight"><b>Time Limit:</b> ${escapeHtml(timeLabel)}</div>
        </div>
      </div>
    `;
  }

  function renderQuestionHead(rawText, points, fallbackNo, questionTotal){
    const parsed = parseExamTextParts(rawText);
    const label = parsed.label || `${fallbackNo}.`;
    const body = parsed.body || (parsed.kind === "plain" ? cleanSpaces(rawText || "") : "");

    return `
      <div class="qHead">
        <div class="qTitle">
          <span class="qNo">${escapeHtml(label)}</span>
          <span class="qText">${renderMixedMath(body || cleanSpaces(rawText || ""))}</span>
        </div>
        <div class="marksMeta" title="Question marks">
          <div class="marksLbl">Marks</div>
          <div class="marksBox">${String(points).trim()}</div>
        </div>
      </div>
    `;
  }

  function renderNoteLike(rawText, imageHtml, sectionTotal){
    const parsed = parseExamTextParts(rawText);

    if (parsed.kind === "main") {
      const bodyHtml = parsed.body ? `<div class="noteBox" style="margin-top:8px;">${renderMixedMath(parsed.body)}</div>` : "";
      return `
        <div class="q">
          <div class="qMainHeading">${escapeHtml(parsed.label)}</div>
          ${bodyHtml}
          ${imageHtml}
        </div>
      `;
    }

    if (parsed.kind === "section") {
      return `
        <div class="q">
          <div class="qSectionStem">
            <div class="qSectionLeft">
              <div class="qSectionNo">${escapeHtml(parsed.label)}</div>
              <div class="qSectionText">${renderMixedMath(parsed.body)}</div>
            </div>
            
          </div>
          ${imageHtml}
        </div>
      `;
    }

    return `
      <div class="q">
        <div class="noteBox">${renderMixedMath(cleanSpaces(rawText || ""))}</div>
        ${imageHtml}
      </div>
    `;
  }

  window.addEventListener("beforeunload", function(){
    if (quizEndAtMs && !submitted && !blocked) {
      localStorage.setItem(END_KEY, String(quizEndAtMs));
    }
  });

  loadTopbarProfile();
  loadTopbarAnnouncementCount();

  if (!quizId) {
    quizTitle.textContent = "Assessment not found";
    submitBtn.disabled = true;
  } else {
    loadQuiz();
  }
</script>
