<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Practice | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{max-width:1100px; margin:0 auto; padding:24px;}

    /* Topbar */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
      flex-wrap:wrap;
      gap:12px;
    }
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{
      width:38px; height:38px; border-radius:10px;
      background:var(--accent); color:white;
      display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:16px;
      flex:0 0 auto;
    }
    .brand span{display:block; font-size:13px; color:var(--muted);}

    /* Desktop nav */
    .nav{display:flex; align-items:center; gap:14px;}
    .nav a{
      text-decoration:none;
      font-size:14px;
      color:var(--text);
      padding:6px 8px;
      border-radius:8px;
      transition:background 0.2s;
    }
    .nav a:hover{ background:var(--accent-soft); }
    .nav a.active{ font-weight:600; color:var(--accent); }
    .nav .logout{
      background:var(--accent);
      color:white;
      border:none;
      padding:8px 12px;
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
    }

    /* Mobile */
    .menu-btn{
      display:none;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
    }
    .mobile-menu{
      display:none;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:10px;
      margin-bottom:16px;
    }
    .mobile-menu a,
    .mobile-menu button{
      width:100%;
      display:block;
      text-align:left;
      padding:10px 12px;
      border-radius:10px;
      border:none;
      background:transparent;
      color:var(--text);
      text-decoration:none;
      cursor:pointer;
      font-size:14px;
    }
    .mobile-menu a:hover,
    .mobile-menu button:hover{ background:var(--accent-soft); }
    .mobile-menu a.active{ font-weight:600; color:var(--accent); }
    .mobile-menu .logout{
      background:var(--accent);
      color:white;
    }
    @media (max-width: 720px){
      .nav{ display:none; }
      .menu-btn{ display:inline-flex; }
      .mobile-menu.open{ display:block; }
    }

    /* Page card */
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }

    h1{margin:0; font-size:20px;}
    .muted{color:var(--muted); line-height:1.6;}
    .error{color:var(--error);}
    .ok{color:var(--ok);}

    select{
      padding:10px;
      border-radius:10px;
      border:1px solid #ddd;
      width:260px;
      max-width:100%;
      font-size:14px;
      outline:none;
      margin-top:8px;
    }

    /* TOPICS LAYOUT */
    .topics-wrap{
      margin-top:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .topic-block{
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:#fff;
      padding:14px;
    }

    .topic-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .topic-title{
      margin:0;
      font-size:16px;
      font-weight:700;
    }

    .topic-badge{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #cfe9ff;
      background:#eef7ff;
      color:#0b3c5d;
      white-space:nowrap;
    }

    .quiz-squares{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(64px, 1fr));
      gap:10px;
      max-width:100%;
    }

    .quiz-square{
      position:relative;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      height:64px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:transform .08s, background .2s, border-color .2s;
      user-select:none;
    }
    .quiz-square:hover{
      transform:translateY(-1px);
      background:var(--accent-soft);
      border-color:#cfe9ff;
    }
    .quiz-square .num{
      font-weight:800;
      font-size:16px;
      line-height:1;
    }
    .quiz-square .qcount{
      font-size:11px;
      color:var(--muted);
      margin-top:4px;
    }

    /* Attempted styling */
    .quiz-square.attempted{
      background:#ecfdf5;
      border-color:#86efac;
    }
    .quiz-square.attempted:hover{
      background:#dcfce7;
      border-color:#4ade80;
    }
    .tick{
      position:absolute;
      top:6px;
      right:6px;
      width:18px;
      height:18px;
      border-radius:999px;
      background:#16a34a;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:900;
    }

    footer{
      margin-top:24px;
      text-align:center;
      font-size:13px;
      color:#64748b;
    }
  </style>

  <script>
    // Protect this page (must be logged in)
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "login.html";
  </script>
</head>

<body>
  <div class="wrap">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="brand">
        <div class="logo">PO</div>
        <div>
          <strong>Practice Online</strong>
          <span id="welcomeSub">Grades 8–12 Mathematics</span>
        </div>
      </div>

      <!-- Desktop Nav -->
      <nav class="nav">
        <a href="learner-quizzes.html" class="active" data-auth>Practice</a>
        <a href="about.html">About</a>
        <a href="admin-quiz.html" data-admin>Admin</a>
        <button class="logout" type="button" id="logoutBtn" data-auth>Logout</button>
      </nav>

      <!-- Mobile Menu Button -->
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">Menu</button>
    </div>

    <!-- Mobile Menu Panel -->
    <div class="mobile-menu" id="mobileMenu">
      <a href="learner-quizzes.html" class="active" data-auth>Practice</a>
      <a href="about.html">About</a>
      <a href="admin-quiz.html" data-admin>Admin</a>
      <button class="logout" type="button" id="logoutBtnMobile" data-auth>Logout</button>
    </div>

    <!-- CONTENT -->
    <div class="card">
      <h1>Select Grade</h1>
      <p class="muted" style="margin:6px 0 0 0;">Pick your grade. Quizzes are grouped by <b>Topic</b> with numbered boxes.</p>

      <select id="gradeSelect">
        <option value="">Choose grade</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select>

      <p id="status" class="muted" style="margin-top:12px;"></p>
      <div id="topics"></div>
    </div>

    <footer>
      © <span id="year"></span> Practice Online. All rights reserved.
    </footer>

  </div>

  <!-- nav.js first -->
  <script src="nav.js"></script>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // ✅ Render backend
    const API = window.API || "https://practice-backend-msgn.onrender.com";
    const token = localStorage.getItem("token");

    // Welcome text
    const username = localStorage.getItem("username") || "Learner";
    document.getElementById("welcomeSub").textContent = `Welcome, ${username}`;

    // UI refs
    const gradeSelect = document.getElementById("gradeSelect");
    const status = document.getElementById("status");
    const topicsRoot = document.getElementById("topics");

    // Attempted map (quizId -> result)
    let attemptedByQuizId = {}; // { quizId: {score,total,percent,createdAt,...} }

    gradeSelect.addEventListener("change", loadQuizzes);

    async function loadMyResultsMap(){
      attemptedByQuizId = {};
      try{
        const res = await fetch(`${API}/api/results/mine`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) return;

        const results = await res.json().catch(()=>[]);
        (results || []).forEach(r => {
          if (r && r.quizId) attemptedByQuizId[String(r.quizId)] = r;
        });
      }catch(e){
        // if it fails, we simply won't show attempted ticks
      }
    }

    async function loadQuizzes() {
      const grade = gradeSelect.value;

      topicsRoot.innerHTML = "";
      status.textContent = "";

      if (!grade) return;

      status.textContent = "Loading quizzes...";

      try {
        const res = await fetch(`${API}/api/quizzes?grade=${encodeURIComponent(grade)}`);
        if (!res.ok) throw new Error("Failed to load quizzes");

        const quizzes = await res.json();

        // ✅ load my results so we can show ✓ attempted
        await loadMyResultsMap();

        if (!Array.isArray(quizzes) || quizzes.length === 0) {
          status.textContent = "";
          topicsRoot.innerHTML = `<p class="muted">No quizzes yet for Grade ${escapeHtml(grade)}.</p>`;
          return;
        }

        // Group by topic
        const byTopic = {};
        quizzes.forEach(q => {
          const topic = (q.topic || "General").trim() || "General";
          if (!byTopic[topic]) byTopic[topic] = [];
          byTopic[topic].push(q);
        });

        // Sort topics and quizzes
        const topicNames = Object.keys(byTopic).sort((a,b)=>a.localeCompare(b));
        topicNames.forEach(t => {
          byTopic[t].sort((a,b)=>String(a.title||"").localeCompare(String(b.title||"")));
        });

        status.textContent = "";
        topicsRoot.innerHTML = `
          <div class="topics-wrap">
            ${topicNames.map(topicName => {
              const list = byTopic[topicName];
              return `
                <div class="topic-block">
                  <div class="topic-head">
                    <h2 class="topic-title">${escapeHtml(topicName)}</h2>
                    <span class="topic-badge">${list.length} quiz${list.length === 1 ? "" : "zes"}</span>
                  </div>

                  <div class="quiz-squares">
                    ${list.map((q, i) => {
                      const qCount = (q.questions && q.questions.length) ? q.questions.length : 0;

                      const r = attemptedByQuizId[String(q._id)];
                      const attempted = Boolean(r);

                      const tip = attempted
                        ? `Attempted • ${r.score}/${r.total} (${r.percent}%)`
                        : (q.title || "Quiz");

                      return `
                        <div
                          class="quiz-square ${attempted ? "attempted" : ""}"
                          title="${escapeAttr(tip)}"
                          onclick="window.location.href='attempt.html?quizId=${encodeURIComponent(q._id)}'">
                          ${attempted ? `<div class="tick">✓</div>` : ""}
                          <div class="num">${i + 1}</div>
                          <div class="qcount">${qCount}Q</div>
                        </div>
                      `;
                    }).join("")}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      } catch (err) {
        status.textContent = "";
        topicsRoot.innerHTML = `<p class="error">Could not load quizzes. Please try again.</p>`;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function escapeAttr(str) {
      return String(str).replaceAll('"', "&quot;");
    }
  </script>
</body>
</html>
