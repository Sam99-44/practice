<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Progress Dashboard | Practice Online</title>

  <style>
    :root{
      --nav:#1b1648;
      --accent:#0b3c5d;
      --red:#e11d2e;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#d9dee7;
      --text:#0f172a;
      --muted:#475569;
      --radius:18px;
      --shadow:none;
      --focus:0 0 0 4px rgba(207,233,255,.65);
      --soft:#f8fafc;
      --soft2:#f1f5f9;
      --green:#065f46;
      --orange:#9a3412;
      --blue:#0b3c5d;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{text-decoration:none;color:inherit}
    button,input,select{font:inherit}

    .topbar{
      background:var(--nav);
      color:#fff;
      position:sticky;
      top:0;
      z-index:1000;
      font-family:Arial, Helvetica, sans-serif;
    }

    .topbar-inner{
      max-width:1150px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .accountLeft{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      cursor:default;
      user-select:none;
    }

    .accountIconWrap{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .accountIcon{
      width:40px;
      height:40px;
      display:block;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .accountMeta{min-width:0;line-height:1.1}

    .accountName{
      font-size:16px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .accountType{
      font-size:13px;
      color:#e0e7ff;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
      text-transform:capitalize;
    }

    .topbarRight{
      display:flex;
      align-items:center;
      gap:14px;
      position:relative;
    }

    .iconBtn{
      min-width:50px;
      height:50px;
      border:none;
      background:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      padding:0 4px;
    }

    .iconBtn img{
      width:28px;
      height:28px;
      display:block;
      flex-shrink:0;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .bellBtn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-width:auto;
      height:50px;
      padding:0;
    }

    .navBadge{
      min-width:auto;
      height:auto;
      padding:0;
      margin-left:2px;
      background:transparent;
      color:#ffd6db;
      font-size:13px;
      font-weight:700;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
    }

    .menuBtn{
      min-width:auto;
      height:50px;
      padding:0;
      gap:8px;
      border:none;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .menuBtnText{
      font-size:10px;
      font-weight:700;
      color:#fff;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      position:relative;
      top:-1px;
    }

    .menuBtn img{
      width:28px;
      height:28px;
      filter:brightness(0) invert(1) contrast(180%);
      display:block;
    }

    .menuDropdown{
      position:absolute;
      top:48px;
      right:0;
      width:210px;
      background:#f7f7f8;
      color:#111827;
      border:1px solid #d9dee7;
      border-radius:16px;
      box-shadow:0 14px 30px rgba(15,23,42,.14);
      padding:10px 0;
      display:none;
      font-family:Arial, Helvetica, sans-serif;
    }

    .menuDropdown.open{display:block}

    .menuItem{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 18px;
      color:#111827;
      font-size:10px;
      font-weight:700;
      background:transparent;
      border:none;
      text-align:left;
      cursor:pointer;
    }

    .menuItem:hover{background:#eef2f7}

    .menuItem img{
      width:18px;
      height:18px;
      display:block;
      flex-shrink:0;
    }

    .menuItem.profileTextOnly{padding-left:38px}

    .menuDivider{
      height:1px;
      background:#dde4ec;
      margin:8px 0 6px;
    }

    .logoutMenuBtn{
      width:100%;
      border:none;
      background:transparent;
      cursor:pointer;
      text-align:left;
    }

    .wrap{
      max-width:1150px;
      margin:0 auto;
      padding:18px;
    }

    .section{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:none;
      margin-top:14px;
      overflow:hidden;
    }

    .sectionHead{
      padding:18px;
      border-bottom:1px solid var(--border);
      background:#fff;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .sectionHead h1{
      margin:0;
      font-size:22px;
      color:var(--nav);
      font-weight:700;
      letter-spacing:0;
    }

    .muted{
      color:var(--muted);
      font-size:10px;
      margin-top:5px;
      min-height:18px;
      line-height:1.45;
      font-weight:400;
    }

    .filters{
      padding:14px 18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      background:#fff;
      border-bottom:1px solid #eee;
    }

    select{
      font-size:10px;
      padding:10px;
      border-radius:10px;
      border:1px solid #ddd;
      background:#fff;
      outline:none;
      min-width:170px;
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      font-weight:400;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      padding:16px;
    }

    .summaryCard{
      border:1px solid var(--border);
      border-radius:16px;
      background:#fff;
      overflow:hidden;
    }

    .summaryTitle{
      margin:0;
      padding:13px 14px;
      font-size:13px;
      font-weight:800;
      color:#0f172a;
      border-bottom:1px solid var(--border);
      background:var(--soft);
      letter-spacing:.01em;
    }

    .miniTableWrap,
    .tableWrapInner{
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }

    th, td{
      padding:11px 12px;
      border-bottom:1px solid #eee;
      text-align:left;
      vertical-align:top;
    }

    th{
      background:#f8fafc;
      font-size:11px;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:400;
      letter-spacing:.04em;
      white-space:nowrap;
    }

    .miniTable{
      min-width:100%;
      width:100%;
    }

    .miniTable th,
    .miniTable td{
      padding:11px 12px;
    }

    .rankCell{
      font-weight:800;
      color:var(--muted);
      width:50px;
    }

    .scoreCell{
      font-weight:400;
    }

    .topicLink{
      color:#0f172a;
      font-weight:400;
    }

    .topicLink:hover{
      text-decoration:none;
    }

    .rec{
      font-weight:400;
      color:#0f172a;
    }

    .rec.low{color:var(--orange);}
    .rec.mid{color:var(--blue);}
    .rec.high{color:var(--green);}

    .smallBtn{
      min-width:82px;
      padding:6px 10px;
      border:1px solid #e5e7eb;
      border-radius:6px;
      background:#f8fafc;
      cursor:pointer;
      font-weight:400;
      font-size:12px;
      white-space:nowrap;
      color:#0f172a;
      line-height:1;
      font-family:Arial, Helvetica, sans-serif;
    }

    .smallBtn:hover{
      background:#f8fafc;
    }

    .empty{
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
      color:var(--muted);
      font-weight:700;
      margin:14px;
      line-height:1.5;
    }

    .desktopTable{
      display:block;
    }

    .mobileCards{
      display:none;
      padding:14px;
      gap:12px;
    }

    .topicCard{
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
      padding:14px;
      box-shadow:0 4px 12px rgba(15,23,42,.04);
    }

    .topicCardHead{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:10px;
    }

    .topicCardTitle{
      font-size:15px;
      font-weight:800;
      color:var(--accent);
      line-height:1.4;
    }

    .topicCardGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px 12px;
      margin-top:10px;
      margin-bottom:12px;
    }

    .metric{
      background:#f8fafc;
      border:1px solid #eef2f7;
      border-radius:12px;
      padding:10px 11px;
    }

    .metricLabel{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:var(--muted);
      font-weight:800;
      margin-bottom:5px;
    }

    .metricValue{
      font-size:14px;
      font-weight:800;
      color:var(--text);
    }

    .cardActions{
      display:flex;
      justify-content:flex-end;
    }

    @media(max-width:900px){
      .grid2{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:760px){
      .wrap{
        padding:12px;
      }

      .sectionHead{
        padding:14px 12px 12px;
      }

      .sectionHead h1{
        font-size:18px;
      }

      .filters{
        padding:12px;
        gap:8px;
      }

      select{
        width:100%;
        min-width:0;
      }

      .desktopTable{
        display:none;
      }

      .mobileCards{
        display:grid;
      }

      .topbar-inner{
        padding:10px 12px;
        gap:8px;
      }

      .accountIcon{
        width:34px;
        height:34px;
      }

      .accountName{
        max-width:92px;
        font-size:13px;
      }

      .accountType{
        max-width:92px;
        font-size:11px;
      }

      .topbarRight{
        gap:8px;
      }

      .iconBtn,
      .menuBtn,
      .bellBtn{
        height:42px;
        min-width:auto;
      }

      .iconBtn img{
        width:24px;
        height:24px;
      }

      .navBadge{
        font-size:11px;
        margin-left:1px;
      }

      .menuDropdown{
        width:190px;
        right:0;
      }

      .menuBtnText{
        display:none;
      }

      .smallBtn{
        min-width:72px;
        font-size:11px;
        padding:6px 8px;
      }
    }

    @media(max-width:520px){
      .topicCardGrid{
        grid-template-columns:1fr;
      }

      .summaryTitle{
        font-size:12px;
      }

      .brand{
        font-size:15px;
      }

      .brand small{
        font-size:12px;
      }
    }
  </style>

  <script>
    if(!localStorage.getItem("token")) location.href="login.html";
  </script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="accountLeft">
      <div class="accountIconWrap">
        <img
          class="accountIcon"
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
          alt="Account"
          loading="eager"
          decoding="async"
        >
      </div>

      <div class="accountMeta">
        <div class="accountName" id="topAccountName">Loading...</div>
        <div class="accountType" id="topAccountType">Dashboard</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="announcements.html" class="iconBtn bellBtn" title="Announcements" aria-label="Announcements">
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="Announcements" loading="eager" decoding="async">
        <span class="navBadge" id="navAnnouncementBadge">0</span>
      </a>

      <button class="menuBtn" id="menuToggleBtn" title="Menu" aria-label="Menu" type="button">
        <span class="menuBtnText">Menu</span>
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773952155/menu_q2xag6.svg" alt="Menu" loading="eager" decoding="async">
      </button>

      <div class="menuDropdown" id="menuDropdown">
        <a class="menuItem profileTextOnly" href="profile.html">
          <span>Profile</span>
        </a>

        <a class="menuItem" href="learner-quizzes.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777660/practice_ubgfso.svg" alt="">
          <span>Practice</span>
        </a>

        <a class="menuItem" href="results.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/results_qgdct1.svg" alt="Results">
          <span>Results</span>
        </a>

        <a class="menuItem" href="progress-dashboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="">
          <span>Dashboard</span>
        </a>

        <a class="menuItem" href="leaderboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777661/leaderboard_yfjgjf.svg" alt="">
          <span>Leaderboard</span>
        </a>

        <a class="menuItem" href="support.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/support_bs175s.svg" alt="">
          <span>Support</span>
        </a>

        <a class="menuItem" href="announcements.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="">
          <span>Announcements</span>
        </a>

        <div class="menuDivider"></div>

        <button class="menuItem logoutMenuBtn" id="logoutBtn" type="button">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773768418/logout_uay6y8.svg" alt="">
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="section">
    <div class="sectionHead">
      <div>
        <h1>Topic Progress</h1>
        <div class="muted" id="subTxt"></div>
      </div>
    </div>

    <div class="filters">
      <select id="yearSelect">
        <option value="">All Years</option>
      </select>
      <select id="monthSelect">
        <option value="">All Months</option>
      </select>
    </div>

  </section>

  <section class="section" id="tableWrap">
    <div class="empty">Loading dashboard…</div>
  </section>

</main>


<script>
  const API = window.API || "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");

  const topAccountName = document.getElementById("topAccountName");
  const topAccountType = document.getElementById("topAccountType");
  const menuToggleBtn = document.getElementById("menuToggleBtn");
  const menuDropdown = document.getElementById("menuDropdown");

  const subTxt = document.getElementById("subTxt");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  const tableWrap = document.getElementById("tableWrap");

  document.getElementById("logoutBtn").onclick = ()=> {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("me_cache");
    localStorage.removeItem("user");
    localStorage.removeItem("role");
    location.href="login.html";
  };

  if(menuToggleBtn && menuDropdown){
    menuToggleBtn.addEventListener("click", function(e){
      e.stopPropagation();
      menuDropdown.classList.toggle("open");
    });

    document.addEventListener("click", function(e){
      if(!menuDropdown.contains(e.target) && !menuToggleBtn.contains(e.target)){
        menuDropdown.classList.remove("open");
      }
    });
  }

  async function loadTopbarProfile(){
    try{
      const res = await fetch(`${API}/api/profile/me`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      if(res.status === 401){
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        localStorage.removeItem("me_cache");
        location.href = "login.html";
        return;
      }

      const data = await res.json().catch(()=>null);
      if(!data) return;

      topAccountName.textContent = data.fullName || data.username || "User";
      topAccountType.textContent = data.accountType || data.role || "Dashboard";
    }catch{
      topAccountName.textContent = "User";
      topAccountType.textContent = "Dashboard";
    }
  }

  async function loadTopbarAnnouncementCount(){
    try{
      const res = await fetch(`${API}/api/announcements/profile-summary`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const data = await res.json().catch(() => ({}));
      document.getElementById("navAnnouncementBadge").textContent = Number(data.count || 0);
    }catch{
      document.getElementById("navAnnouncementBadge").textContent = "0";
    }
  }

  let allResults = [];
  let allQuizzes = [];

  let topicTotals = new Map();
  let quizTopicById = new Map();
  let attemptedQuizIdsByTopic = new Map();

  yearSelect.addEventListener("change", renderAll);
  monthSelect.addEventListener("change", renderAll);

  loadTopbarProfile();
  loadTopbarAnnouncementCount();
  load();

  async function load(){
    try{
      subTxt.textContent = "";

      const meRes = await fetch(`${API}/api/auth/me`,{
        headers:{Authorization:`Bearer ${token}`}
      });

      if(meRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const me = await meRes.json().catch(()=>null);
      if(!meRes.ok || !me){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      try{
        const isAdmin = me.role === "admin";
        document.querySelectorAll("[data-admin]").forEach(a => a.style.display = isAdmin ? "" : "none");
      }catch{}

      const quizzesUrl = (me.role === "admin") ? `${API}/api/quizzes?all=1` : `${API}/api/quizzes`;
      const qRes = await fetch(quizzesUrl,{ headers:{Authorization:`Bearer ${token}`} });

      if(qRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const qData = await qRes.json().catch(()=>[]);
      allQuizzes = Array.isArray(qData) ? qData : [];

      topicTotals = new Map();
      quizTopicById = new Map();

      for(const q of allQuizzes){
        const id = String(q._id || "");
        const t = cleanSpaces(q.topic || "General");
        if (id) quizTopicById.set(id, t);
        topicTotals.set(t, (topicTotals.get(t) || 0) + 1);
      }

      const rRes = await fetch(`${API}/api/results/my`, {
        headers:{Authorization:`Bearer ${token}`}
      });

      if(rRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const rData = await rRes.json().catch(()=>[]);
      allResults = Array.isArray(rData) ? rData : [];

      buildDateFilters(allResults);
      renderAll();

    }catch(e){
      subTxt.textContent = "Network error. Please refresh.";
      tableWrap.innerHTML = `<div class="empty">Could not load dashboard.</div>`;    }
  }

  function buildDateFilters(data){
    const years = [...new Set((data||[]).map(r=>{
      const d=new Date(r.createdAt);
      return isNaN(d)?null:d.getFullYear();
    }).filter(Boolean))].sort((a,b)=>b-a);

    yearSelect.innerHTML = `<option value="">All Years</option>` +
      years.map(y=>`<option value="${y}">${y}</option>`).join("");

    const months = [...new Set((data||[]).map(r=>{
      const d=new Date(r.createdAt);
      return isNaN(d)?null:(d.getMonth()+1);
    }).filter(Boolean))].sort((a,b)=>a-b);

    monthSelect.innerHTML = `<option value="">All Months</option>` +
      months.map(m=>{
        const name = new Date(2000, m-1, 1).toLocaleString(undefined,{month:"long"});
        return `<option value="${m}">${name}</option>`;
      }).join("");
  }

  function applyDateFilters(data){
    const y = yearSelect.value;
    const m = monthSelect.value;

    return (data || []).filter(r=>{
      const d=new Date(r.createdAt);
      if(y && (isNaN(d) || String(d.getFullYear()) !== String(y))) return false;
      if(m && (isNaN(d) || String(d.getMonth()+1) !== String(m))) return false;
      return true;
    });
  }

  function buildAttemptedQuizSets(results){
    attemptedQuizIdsByTopic = new Map();

    for(const r of (results || [])){
      const quizId = String(r.quizId || "");
      if(!quizId) continue;

      const topic = cleanSpaces(quizTopicById.get(quizId) || r.topic || "General");

      if(!attemptedQuizIdsByTopic.has(topic)) attemptedQuizIdsByTopic.set(topic, new Set());
      attemptedQuizIdsByTopic.get(topic).add(quizId);
    }
  }

  function summarizeByTopic(filteredResults){
    const map = new Map();
    for (const [topic, total] of topicTotals.entries()){
      map.set(topic, {
        topic,
        totalQuizzes: total,
        quizzesAttempted: 0,
        attempts: 0,
        sum: 0,
        best: 0,
        passCount: 0
      });
    }

    for(const r of (filteredResults || [])){
      const quizId = String(r.quizId || "");
      const topic = cleanSpaces(quizTopicById.get(quizId) || r.topic || "General");
      if(!map.has(topic)) continue;

      const percent = Number(r.percent) || 0;
      const pass = percent >= 50;

      const o = map.get(topic);
      o.attempts += 1;
      o.sum += percent;
      o.best = Math.max(o.best, percent);
      if(pass) o.passCount += 1;
    }

    for (const [topic, o] of map.entries()){
      const set = attemptedQuizIdsByTopic.get(topic);
      o.quizzesAttempted = set ? set.size : 0;
    }

    const list = [...map.values()].map(o=>{
      const avg = o.attempts ? Math.round(o.sum / o.attempts) : 0;
      const passRate = o.attempts ? Math.round((o.passCount / o.attempts) * 100) : 0;
      return { ...o, avg, passRate };
    });

    list.sort((a,b)=>a.topic.localeCompare(b.topic));
    return list;
  }

  function recommendation(passRate){
    const p = Number(passRate)||0;
    if(p < 50) return { text:"Practice more", cls:"low" };
    if(p < 75) return { text:"Good progress", cls:"mid" };
    return { text:"Excellent", cls:"high" };
  }

  function renderAll(){
    const filtered = applyDateFilters(allResults);
    buildAttemptedQuizSets(filtered);

    const rows = summarizeByTopic(filtered);

    if (!allQuizzes.length){
      subTxt.textContent = "No assessments found yet.";
    } else if (!allResults.length){
      subTxt.textContent = "No results yet. Attempt some quizzes to see your progress.";
    } else {
      subTxt.textContent = "";
    }

    const attemptedTopics = rows.filter(r => r.attempts > 0);
    const sorted = [...attemptedTopics].sort((a,b)=>b.passRate - a.passRate);

    renderTable(rows);
  }

  function renderTable(rows){
    if(!rows.length){
      tableWrap.innerHTML = `<div class="empty">No topic progress yet.</div>`;
      return;
    }

    tableWrap.innerHTML = `
      <div class="desktopTable">
        <div class="tableWrapInner">
          <table>
            <thead>
              <tr>
                <th>Topic</th>
                <th>Total Quizzes</th>
                <th>Quizzes Attempted</th>
                <th>Average</th>
                <th>Best</th>
                <th>Recommendation</th>
                <th>Open</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r=>{
                const rec = recommendation(r.passRate);
                const topicUrl = `learner-quizzes.html?search=${encodeURIComponent(r.topic)}`;
                return `
                  <tr>
                    <td><a class="topicLink" href="${topicUrl}">${escapeHtml(r.topic)}</a></td>
                    <td>${Number(r.totalQuizzes||0)}</td>
                    <td>${Number(r.quizzesAttempted||0)}</td>
                    <td>${r.avg}%</td>
                    <td>${Math.round(r.best)}%</td>
                    <td class="rec ${rec.cls}">${escapeHtml(rec.text)}</td>
                    <td><button class="smallBtn" type="button" onclick="location.href='${topicUrl}'">Open quiz</button></td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>

      <div class="mobileCards">
        ${rows.map(r=>{
          const rec = recommendation(r.passRate);
          const topicUrl = `learner-quizzes.html?search=${encodeURIComponent(r.topic)}`;
          return `
            <div class="topicCard">
              <div class="topicCardHead">
                <a class="topicCardTitle" href="${topicUrl}">${escapeHtml(r.topic)}</a>
              </div>

              <div class="topicCardGrid">
                <div class="metric">
                  <div class="metricLabel">Total Quizzes</div>
                  <div class="metricValue">${Number(r.totalQuizzes||0)}</div>
                </div>
                <div class="metric">
                  <div class="metricLabel">Quizzes Attempted</div>
                  <div class="metricValue">${Number(r.quizzesAttempted||0)}</div>
                </div>
                <div class="metric">
                  <div class="metricLabel">Average</div>
                  <div class="metricValue">${r.avg}%</div>
                </div>
                <div class="metric">
                  <div class="metricLabel">Best</div>
                  <div class="metricValue">${Math.round(r.best)}%</div>
                </div>
                <div class="metric" style="grid-column:1/-1;">
                  <div class="metricLabel">Recommendation</div>
                  <div class="metricValue rec ${rec.cls}">${escapeHtml(rec.text)}</div>
                </div>
              </div>

              <div class="cardActions">
                <button class="smallBtn" type="button" onclick="location.href='${topicUrl}'">Open quiz</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function cleanSpaces(s){
    return String(s||"").trim().replace(/\s+/g," ");
  }

  function escapeHtml(str){
    return String(str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>

</body>
</html>
