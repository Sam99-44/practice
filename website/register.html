<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account</title>
<style>
body{font-family:Arial;background:#f6f7fb}
.card{max-width:520px;margin:40px auto;background:#fff;padding:20px;border-radius:12px}
input,select,button{width:100%;padding:10px;margin-top:8px}
button{background:#0b3c5d;color:#fff;border:none;border-radius:8px;font-weight:bold}
.msg{margin-top:10px}
.error{color:red}
.ok{color:green}
</style>
</head>
<body>

<div class="card">
<h2>Create Account</h2>

<label>Username</label>
<input id="username">

<label>Email</label>
<input id="email" type="email">

<label>Account Type</label>
<select id="accountType">
  <option value="">Select</option>
  <option value="student">Student</option>
  <option value="materials">Access Materials Only</option>
</select>

<div id="gradeWrap" style="display:none">
  <label>Grade</label>
  <select id="grade">
    <option value="">Select Grade</option>
    <option value="8">Grade 8</option>
    <option value="9">Grade 9</option>
    <option value="10">Grade 10</option>
    <option value="11">Grade 11</option>
    <option value="12">Grade 12</option>
  </select>
</div>

<label>Password</label>
<input id="password" type="password">

<button onclick="register()">Register</button>
<p id="msg" class="msg"></p>
</div>

<script>
const API="https://practice-backend-msgn.onrender.com";

document.getElementById("accountType").addEventListener("change",e=>{
  document.getElementById("gradeWrap").style.display =
    e.target.value==="student" ? "block":"none";
});

async function register(){
  const body={
    username:username.value.trim(),
    email:email.value.trim(),
    password:password.value,
    accountType:accountType.value,
    grade:grade?.value || null
  };

  const r=await fetch(API+"/api/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });

  const d=await r.json();
  msg.className="msg "+(r.ok?"ok":"error");
  msg.textContent=d.message||"Error";

  if(r.ok) setTimeout(()=>location.href="login.html",1500);
}
</script>

</body>
</html>
