<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Attempt Assessment | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
      --warn:#b45309;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--text);}
    .wrap{max-width:1000px; margin:0 auto; padding:24px;}
    .error{color:var(--error);}
    .ok{color:var(--ok);}
    .muted{color:var(--muted);}
    .hidden{display:none;}

    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:12px;}
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{width:38px; height:38px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700;}

    .nav{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
    .nav a,.nav button{
      text-decoration:none;
      font-size:14px;
      padding:8px 12px;
      border-radius:10px;
      border:none;
      cursor:pointer;
    }
    .nav a{color:var(--text);}
    .nav .nav-btn{background:var(--accent); color:#fff;}
    .nav .logout{background:var(--accent); color:#fff;}

    .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
    h1{margin:0 0 6px 0;}

    .metaRow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
    .timerBox{
      border:1px solid #dbeafe;
      background:#eff6ff;
      color:#1e3a8a;
      padding:8px 12px;
      border-radius:999px;
      font-weight:800;
      font-size:14px;
      white-space:nowrap;
    }
    .timerBox.warn{
      border-color:#fed7aa;
      background:#fff7ed;
      color:var(--warn);
    }

    .q{margin-top:16px; padding-top:16px; border-top:1px solid #eee;}
    .q b{display:block; margin-bottom:10px;}
    .qimg{
      display:block;
      max-width:100%;
      height:auto;
      border-radius:12px;
      border:1px solid #eee;
      margin:10px 0 12px 0;
    }

    .opt{
      display:block;
      padding:10px;
      border:1px solid #ddd;
      border-radius:10px;
      margin-bottom:8px;
      cursor:pointer;
      background:#fff;
    }
    .opt.disabled{opacity:.7; cursor:not-allowed;}
    .opt input{margin-right:8px;}

    .textAnswer{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid #ddd;
      outline:none;
      font-size:14px;
      background:#fff;
    }
    .textAnswer:disabled{opacity:.7; background:#f8fafc;}

    .hint{
      margin-top:8px;
      padding:10px 12px;
      border-radius:12px;
      background:var(--accent-soft);
      border:1px solid #cfe9ff;
      color:#0b3c5d;
      font-size:13px;
      font-weight:600;
    }

    .btn{background:var(--accent); color:#fff; padding:10px 14px; border:none; border-radius:10px; cursor:pointer;}
    .btn:disabled{opacity:.6; cursor:not-allowed;}
    .btn2{background:#fff; border:1px solid #ddd; padding:10px 14px; border-radius:10px; cursor:pointer;}

    .lockBox{border:1px dashed #ddd; background:#fafafa; padding:14px; border-radius:12px; margin-top:10px;}

    .pill{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
      border:1px solid #e5e7eb;
      background:#f8fafc;
      color:#334155;
      white-space:nowrap;
    }
    .pill.red{border-color:#fecaca; background:#fff1f2; color:#b91c1c;}
    .pill.green{border-color:#bbf7d0; background:#f0fdf4; color:#065f46;}

    .notice{
      border:1px solid #e5e7eb;
      background:#f8fafc;
      color:#334155;
      padding:12px;
      border-radius:12px;
      margin-top:12px;
    }
    .notice.red{
      border-color:#fecaca;
      background:#fff1f2;
      color:#991b1b;
    }
  </style>

  <script>
    if (!localStorage.getItem("token")) {
      window.location.href = "login.html";
    }
  </script>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <span class="muted" id="welcomeSub">Attempt Assessment</span>
      </div>
    </div>

    <nav class="nav">
      <a href="learner-quizzes.html" class="nav-btn">Back</a>
      <a href="results.html">Results</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </nav>
  </div>

  <div class="card">
    <div class="metaRow">
      <div>
        <h1 id="quizTitle">Loading…</h1>
        <p class="muted" id="quizInfo" style="margin:6px 0 0 0;"></p>
        <div id="statusPill" class="pill hidden" style="margin-top:8px;">—</div>
      </div>

      <div id="timerBox" class="timerBox hidden">Time: 00:00</div>
    </div>

    <!-- already attempted -->
    <div id="lockNotice" class="lockBox hidden">
      <b class="error">This assessment is not available.</b>
      <div class="muted">You already attempted this assessment.</div>
    </div>

    <!-- unavailable (frozen/scheduled/server-blocked) -->
    <div id="unavailableNotice" class="notice red hidden">
      <b>This assessment is currently unavailable.</b>
      <div class="muted" style="margin-top:4px;">Please check back later.</div>
    </div>

    <div id="questions"></div>

    <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="submitBtn">Submit</button>
      <button class="btn2" id="viewResultsBtn" disabled>View Results</button>
    </div>

    <p id="msg"></p>
  </div>
</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");
  const quizId = new URLSearchParams(window.location.search).get("quizId");

  const quizTitle = document.getElementById("quizTitle");
  const quizInfo = document.getElementById("quizInfo");
  const questionsDiv = document.getElementById("questions");
  const submitBtn = document.getElementById("submitBtn");
  const viewResultsBtn = document.getElementById("viewResultsBtn");
  const msgEl = document.getElementById("msg");
  const lockNotice = document.getElementById("lockNotice");
  const unavailableNotice = document.getElementById("unavailableNotice");
  const statusPill = document.getElementById("statusPill");

  // Timer
  const timerBox = document.getElementById("timerBox");
  let timerInterval = null;
  let quizEndAtMs = null;
  let quizData = null;
  let submitted = false;
  let blocked = false; // unavailable or locked

  const END_KEY = `quiz_end_${quizId}`;

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    window.location.href = "login.html";
  };

  if (!quizId) {
    quizTitle.textContent = "Assessment not found";
    submitBtn.disabled = true;
  } else {
    loadQuiz();
  }

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  function setPillAvailable(isAvailable){
    statusPill.classList.remove("hidden");
    if (isAvailable){
      statusPill.textContent = "AVAILABLE";
      statusPill.className = "pill green";
    } else {
      statusPill.textContent = "UNAVAILABLE";
      statusPill.className = "pill red";
    }
  }

  function disableAllInputs(){
    document.querySelectorAll("input[type=radio], input[type=text], input[type=number], textarea").forEach(el => el.disabled = true);
    document.querySelectorAll(".opt").forEach(el => el.classList.add("disabled"));
  }

  function stopTimerAndClearKey(){
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    timerBox.classList.add("hidden");
    localStorage.removeItem(END_KEY);
  }

  function isUnavailableBySchedule(quiz){
    const now = new Date();

    if (quiz?.isFrozen) return true;

    if (quiz?.availableFrom){
      const from = new Date(quiz.availableFrom);
      if (!isNaN(from.getTime()) && now < from) return true;
    }
    if (quiz?.availableUntil){
      const until = new Date(quiz.availableUntil);
      if (!isNaN(until.getTime()) && now > until) return true;
    }

    return false;
  }

  async function loadQuiz() {
    msgEl.className = "muted";
    msgEl.textContent = "";
    lockNotice.classList.add("hidden");
    unavailableNotice.classList.add("hidden");
    blocked = false;
    submitted = false;

    const res = await fetch(`${API}/api/quizzes/${encodeURIComponent(quizId)}`, {
      headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) {
      quizTitle.textContent = "Assessment not found";
      submitBtn.disabled = true;
      return;
    }

    quizData = await res.json();

    quizTitle.textContent = cleanSpaces(quizData.title || "Assessment");

    const mins = Number(quizData.timeLimitMinutes || 0);
    const timeStr = mins > 0 ? ` • Time ${mins} min` : "";
    quizInfo.textContent = `Grade ${quizData.grade ?? "-"} • ${cleanSpaces(quizData.topic || "General")}${timeStr}`;

    // Availability (professional)
    const unavailable = isUnavailableBySchedule(quizData);
    setPillAvailable(!unavailable);

    // Render questions (MCQ + TEXT)
    questionsDiv.innerHTML = (quizData.questions || []).map((q, i) => {
      const type = String(q.type || "mcq").toLowerCase();
      const hint = cleanSpaces(q.hint || "");
      const img = cleanSpaces(q.imageUrl || "");

      const imageHtml = img ? `<img class="qimg" src="${escapeAttr(img)}" alt="Question image">` : "";

      if (type === "text") {
        return `
          <div class="q">
            <b>${i + 1}. ${escapeHtml(cleanSpaces(q.text))}</b>
            ${imageHtml}
            <input class="textAnswer" id="txt${i}" placeholder="Type your answer here" autocomplete="off" />
            ${hint ? `<div class="hint">Hint: ${escapeHtml(hint)}</div>` : ``}
          </div>
        `;
      }

      // default: mcq
      const opts = Array.isArray(q.options) ? q.options : [];
      return `
        <div class="q">
          <b>${i + 1}. ${escapeHtml(cleanSpaces(q.text))}</b>
          ${imageHtml}
          ${opts.map((o, j) => `
            <label class="opt">
              <input type="radio" name="q${i}" value="${j}"> ${escapeHtml(cleanSpaces(o))}
            </label>
          `).join("")}
          ${hint ? `<div class="hint">Hint: ${escapeHtml(hint)}</div>` : ``}
        </div>
      `;
    }).join("");

    // If unavailable: block UI
    if (unavailable){
      unavailableNotice.classList.remove("hidden");
      blocked = true;
      submitBtn.disabled = true;
      viewResultsBtn.disabled = true;
      disableAllInputs();
      stopTimerAndClearKey();
      return;
    }

    submitBtn.disabled = false;
    startTimerWithQuiz(quizData);
    submitBtn.onclick = () => submitQuiz("manual");
  }

  // fallback: 1 min per question (min 5, max 30)
  function calcFallbackSeconds(totalQuestions){
    const raw = totalQuestions * 60;
    return Math.max(5 * 60, Math.min(raw, 30 * 60));
  }

  function startTimerWithQuiz(quiz){
    const now = Date.now();
    const savedEnd = Number(localStorage.getItem(END_KEY));

    if (savedEnd && savedEnd > now) {
      quizEndAtMs = savedEnd;
    } else {
      const mins = Number(quiz.timeLimitMinutes || 0);
      const totalQuestions = (quiz.questions || []).length;

      let secs;
      if (Number.isFinite(mins) && mins > 0) secs = mins * 60;
      else secs = calcFallbackSeconds(totalQuestions);

      quizEndAtMs = now + secs * 1000;
      localStorage.setItem(END_KEY, String(quizEndAtMs));
    }

    timerBox.classList.remove("hidden");
    timerBox.classList.remove("warn");
    tickTimer();
    clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 1000);
  }

  function tickTimer(){
    if (!quizEndAtMs || submitted || blocked) return;

    const remainingMs = quizEndAtMs - Date.now();

    if (remainingMs <= 0) {
      timerBox.textContent = "Time: 00:00";
      timerBox.classList.add("warn");
      clearInterval(timerInterval);
      timerInterval = null;

      msgEl.className = "error";
      msgEl.textContent = "Time is up. Submitting your answers…";
      submitQuiz("auto");
      return;
    }

    const remainingSec = Math.ceil(remainingMs / 1000);
    const mm = String(Math.floor(remainingSec / 60)).padStart(2, "0");
    const ss = String(remainingSec % 60).padStart(2, "0");
    timerBox.textContent = `Time: ${mm}:${ss}`;

    if (remainingSec <= 60) timerBox.classList.add("warn");
  }

  function getTimeTakenSeconds(){
    const mins = Number(quizData?.timeLimitMinutes || 0);
    const totalQuestions = (quizData?.questions || []).length;
    const totalSec = (Number.isFinite(mins) && mins > 0)
      ? mins * 60
      : calcFallbackSeconds(totalQuestions);

    const now = Date.now();
    const remainingSec = quizEndAtMs ? Math.max(0, Math.ceil((quizEndAtMs - now) / 1000)) : 0;
    const taken = totalSec - remainingSec;
    return Math.max(0, taken);
  }

  function buildAnswersPayload(){
    const answers = [];
    (quizData.questions || []).forEach((q, i) => {
      const type = String(q.type || "mcq").toLowerCase();

      if (type === "text") {
        const inp = document.getElementById(`txt${i}`);
        const val = inp ? cleanSpaces(inp.value) : "";
        answers.push({ questionIndex: i, textAnswer: val });
        return;
      }

      const chosen = document.querySelector(`input[name="q${i}"]:checked`);
      answers.push({
        questionIndex: i,
        chosenIndex: chosen ? Number(chosen.value) : -1
      });
    });
    return answers;
  }

  function countAnswered(){
    let answered = 0;
    (quizData.questions || []).forEach((q, i) => {
      const type = String(q.type || "mcq").toLowerCase();

      if (type === "text") {
        const inp = document.getElementById(`txt${i}`);
        if (inp && cleanSpaces(inp.value)) answered++;
        return;
      }

      const chosen = document.querySelector(`input[name="q${i}"]:checked`);
      if (chosen) answered++;
    });
    return answered;
  }

  async function submitQuiz(mode){
    if (!quizData || submitted || blocked) return;

    const total = (quizData.questions || []).length;
    const answered = countAnswered();

    if (mode === "manual" && answered < total) {
      msgEl.className = "error";
      msgEl.textContent = `Please answer all questions (${answered}/${total}) before submitting.`;
      return;
    }

    submitted = true;
    submitBtn.disabled = true;

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;

    const timeTakenSeconds = getTimeTakenSeconds();
    localStorage.removeItem(END_KEY);

    // Server calculates score/percent now
    const payload = {
      quizId,
      answers: buildAnswersPayload(),
      timeTakenSeconds
    };

    const res = await fetch(`${API}/api/results`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify(payload)
    });

    // Already attempted
    if (res.status === 409) {
      lockNotice.classList.remove("hidden");
      msgEl.className = "error";
      msgEl.textContent = "You already attempted this assessment.";
      blocked = true;
      disableAllInputs();
      return;
    }

    // Unavailable (server-side)
    if (res.status === 403) {
      unavailableNotice.classList.remove("hidden");
      const data = await res.json().catch(()=>({}));
      msgEl.className = "error";
      msgEl.textContent = data.message || "This assessment is currently unavailable. Please check back later.";
      blocked = true;
      disableAllInputs();
      return;
    }

    if (!res.ok) {
      const data = await res.json().catch(()=>({}));
      msgEl.className = "error";
      msgEl.textContent = data.message || "Could not save attempt. Please try again.";
      submitted = false;
      submitBtn.disabled = false;
      return;
    }

    const data = await res.json().catch(()=>({}));
    const percent = Number.isFinite(Number(data.percent)) ? Number(data.percent) : null;

    msgEl.className = "ok";
    msgEl.textContent = percent !== null
      ? `Submitted successfully. Marks: ${percent}%. Time taken: ${timeTakenSeconds}s`
      : `Submitted successfully. Time taken: ${timeTakenSeconds}s`;

    viewResultsBtn.disabled = false;
    viewResultsBtn.onclick = () => window.location.href = "results.html";

    disableAllInputs();
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(str){
    return String(str || "").replaceAll('"',"&quot;");
  }
</script>
</body>
</html>
