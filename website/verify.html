<!doctype html>
<html>
<body style="font-family:Arial;padding:20px">
  <h2 id="msg">Verifying...</h2>

  <script>
    const API = "https://practice-backend-msgn.onrender.com";
    const qs = new URLSearchParams(location.search);
    const token = qs.get("token");
    const email = qs.get("email");
    const msg = document.getElementById("msg");

    async function run(){
      if (!token || !email){
        msg.textContent = "Missing token or email.";
        return;
      }

      const res = await fetch(`${API}/api/auth/verify?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`);
      const data = await res.json().catch(()=>({}));

      msg.textContent = data.message || (res.ok ? "Verified!" : "Could not verify.");

      if (res.ok) setTimeout(()=> location.href = "login.html", 2000);
    }

    run();
  </script>
</body>
</html>
