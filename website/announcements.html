<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Announcements | Practice Online</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --nav:#1b1648;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#64748b;
  --red:#e11d2e;
  --success:#15803d;
  --danger:#b91c1c;
  --info:#1d4ed8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.topbar{
  background:linear-gradient(135deg,var(--nav),#2b2370);
  color:#fff;
}
.topbar-inner{
  max-width:1100px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.hero{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}
.hero h2{margin:0 0 8px}
.hero p{margin:0;color:var(--muted);line-height:1.7;font-size:14px}
.section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:20px;
  overflow:hidden;
}
.sectionHead{
  padding:18px;
  border-bottom:1px solid var(--border);
  background:#f8fafc;
}
.sectionBody{
  padding:18px;
}
.grid{
  display:grid;
  gap:16px;
}
.card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  background:#fff;
}
.title{
  font-weight:800;
  font-size:16px;
  margin:8px 0;
}
.badge{
  font-size:11px;
  padding:5px 9px;
  border-radius:999px;
  font-weight:800;
}
.badge-class{background:#eef2ff;color:#4338ca}
.badge-quiz{background:#ecfeff;color:#0e7490}
.badge-general{background:#f1f5f9;color:#334155}
.badge-all{background:#fff7ed;color:#b45309}
.badge-accept{background:#ecfdf5;color:#15803d}
.badge-reject{background:#fef2f2;color:#b91c1c}
.badge-pending{background:#eff6ff;color:#1d4ed8}
.badge-grade{background:#eef4ff;color:#1d4ed8}
.meta{
  font-size:13px;
  color:var(--muted);
  margin-top:8px;
  line-height:1.7;
}
.btn{
  padding:9px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}
.btn-accept{background:var(--success);color:#fff}
.btn-reject{background:var(--danger);color:#fff}
.btn-copy{background:#f1f5f9}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}
input,select{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
}
.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap;
}
.status{
  display:none;
  padding:13px 14px;
  border-radius:12px;
  margin-bottom:14px;
  font-size:14px;
}
.status.show{display:block}
.status.info{background:#eef4ff;border:1px solid #c7d7fe;color:var(--info)}
.status.error{background:#fef2f2;border:1px solid #fecaca;color:var(--danger)}
.status.success{background:#ecfdf5;border:1px solid #bbf7d0;color:var(--success)}
.empty{
  color:var(--muted);
  font-size:14px;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <strong>Practice Online</strong>
    <span>Announcements</span>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h2>Announcements</h2>
    <p>View general updates, class announcements, and quiz notices for your grade.</p>
  </div>

  <div id="statusBox" class="status info"></div>

  <div class="toolbar">
    <input id="search" placeholder="Search announcements...">
    <select id="gradeFilter">
      <option value="all">My Grade / Allowed</option>
      <option value="grade8">Grade 8</option>
      <option value="grade9">Grade 9</option>
      <option value="grade10">Grade 10</option>
      <option value="grade11">Grade 11</option>
      <option value="grade12">Grade 12</option>
      <option value="allGrades">All Grades</option>
    </select>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>General Announcements</strong></div>
    <div class="sectionBody">
      <div id="generalGrid" class="grid"></div>
    </div>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>Class Announcements</strong></div>
    <div class="sectionBody">
      <div id="classGrid" class="grid"></div>
    </div>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>Quiz Announcements</strong></div>
    <div class="sectionBody">
      <div id="quizGrid" class="grid"></div>
    </div>
  </div>
</div>

<script>
const API = window.API || "https://practice-backend-msgn.onrender.com";
let dataStore = null;

const statusBox = document.getElementById("statusBox");

function showStatus(message, type = "info") {
  statusBox.className = `status show ${type}`;
  statusBox.textContent = message;
}

function hideStatus() {
  statusBox.className = "status info";
  statusBox.textContent = "";
}

function escapeHtml(text){
  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if (Number.isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString("en-ZA",{year:"numeric",month:"short",day:"numeric"});
}

function tokenHeaders() {
  const token = localStorage.getItem("token");
  return {
    "Content-Type":"application/json",
    ...(token ? { Authorization:`Bearer ${token}` } : {})
  };
}

function responseBadge(value = "pending") {
  const v = String(value || "pending").toLowerCase();
  if (v === "accepted") return `<span class="badge badge-accept">Accepted</span>`;
  if (v === "rejected") return `<span class="badge badge-reject">Rejected</span>`;
  return `<span class="badge badge-pending">Pending</span>`;
}

function matchFilter(item){
  const q = document.getElementById("search").value.toLowerCase();
  const grade = document.getElementById("gradeFilter").value;

  const text = `${item.title || ""} ${item.message || ""} ${item.meetingDate || ""} ${item.meetingTime || ""} ${item.dueDate || ""}`.toLowerCase();
  const searchOk = !q || text.includes(q);
  const gradeOk = grade === "all" || item.grade === grade;

  return searchOk && gradeOk;
}

function renderGeneral(list){
  const el = document.getElementById("generalGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>`
    <div class="card">
      <div class="row">
        <span class="badge badge-general">General</span>
        <span class="badge badge-grade">${escapeHtml(i.grade || "allGrades")}</span>
      </div>
      <div class="title">${escapeHtml(i.title)}</div>
      <div class="meta">${escapeHtml(i.message)}</div>
      <div class="meta">Posted: ${escapeHtml(formatDate(i.createdAt))}</div>
    </div>
  `).join("") : `<div class="empty">No general announcements.</div>`;
}

function renderClass(list){
  const el = document.getElementById("classGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>`
    <div class="card">
      <div class="row">
        <span class="badge badge-class">Class</span>
        <span class="badge badge-grade">${escapeHtml(i.grade || "allGrades")}</span>
        ${responseBadge(i.learnerResponse)}
      </div>

      <div class="title">${escapeHtml(i.title)}</div>
      <div class="meta">${escapeHtml(i.message)}</div>
      <div class="meta">Date: ${escapeHtml(formatDate(i.meetingDate))}</div>
      <div class="meta">Time: ${escapeHtml(i.meetingTime || "—")}</div>

      <div class="row">
        ${i.meetingLink ? `<a href="${escapeHtml(i.meetingLink)}" target="_blank" rel="noopener noreferrer">Join Meeting</a>` : `<span class="meta">No meeting link</span>`}
        ${i.meetingLink ? `<button class="btn btn-copy" onclick="copyLink('${escapeHtml(i.meetingLink)}')">Copy</button>` : ``}
      </div>

      <div class="row">
        <button class="btn btn-accept" onclick="respond('${i._id}','accepted')">Accept</button>
        <button class="btn btn-reject" onclick="respond('${i._id}','rejected')">Reject</button>
      </div>
    </div>
  `).join("") : `<div class="empty">No class announcements.</div>`;
}

function renderQuiz(list){
  const el = document.getElementById("quizGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>`
    <div class="card">
      <div class="row">
        <span class="badge badge-quiz">Quiz</span>
        <span class="badge badge-grade">${escapeHtml(i.grade || "allGrades")}</span>
      </div>

      <div class="title">${escapeHtml(i.title)}</div>
      <div class="meta">${escapeHtml(i.message)}</div>
      <div class="meta">Due: ${escapeHtml(formatDate(i.dueDate))}</div>
      <div class="meta">Status: ${escapeHtml(i.quizStatus || "Open")}</div>
    </div>
  `).join("") : `<div class="empty">No quiz announcements.</div>`;
}

function renderAll(){
  if(!dataStore) return;
  renderGeneral(dataStore.generalAnnouncements || []);
  renderClass(dataStore.classAnnouncements || []);
  renderQuiz(dataStore.quizAnnouncements || []);
}

async function load(){
  try {
    showStatus("Loading announcements...", "info");

    const res = await fetch(`${API}/api/announcements`, {
      headers: tokenHeaders()
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.message || "Failed to load announcements.");
    }

    dataStore = data;
    renderAll();
    hideStatus();
  } catch (err) {
    console.error(err);
    showStatus(err.message || "Could not load announcements.", "error");
  }
}

async function respond(id,response){
  try {
    showStatus("Saving response...", "info");

    const res = await fetch(`${API}/api/announcements/${id}/respond`,{
      method:"POST",
      headers: tokenHeaders(),
      body:JSON.stringify({response})
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.message || "Failed to save response.");
    }

    showStatus(`Response saved as ${response}.`, "success");
    await load();
  } catch (err) {
    console.error(err);
    showStatus(err.message || "Could not save response.", "error");
  }
}

function copyLink(link){
  navigator.clipboard.writeText(link)
    .then(() => showStatus("Meeting link copied.", "success"))
    .catch(() => showStatus("Could not copy the link.", "error"));
}

document.getElementById("search").addEventListener("input",renderAll);
document.getElementById("gradeFilter").addEventListener("change",renderAll);

load();
</script>

</body>
</html>
