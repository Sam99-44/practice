<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Maths Support | Practice Online</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#e6e6e6;
  --text:#0f172a;
  --muted:#475569;
  --radius:14px;
  --shadow:0 8px 22px rgba(0,0,0,.06);
  --ok:#065f46;
  --error:#b91c1c;
  --soft:#f8fafc;
}

*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}

header.topbar{background:var(--nav);color:#fff;}
.topbar-inner{
  max-width:1100px;margin:0 auto;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;}
.brandBadge{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  font-weight:900;
}
nav.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
nav.nav a{
  padding:8px 10px;border-radius:10px;
  color:#e7e9ff;font-weight:800;font-size:13px;
  text-decoration:none;
}
nav.nav a.active{color:#fff;border-bottom:3px solid var(--red);}
nav.nav a:hover{background:rgba(255,255,255,.10)}
.btnTop{
  background:rgba(255,255,255,.12);
  color:#fff;border:1px solid rgba(255,255,255,.18);
  padding:8px 12px;border-radius:12px;font-weight:900;cursor:pointer;
}
.btnTop:hover{background:rgba(255,255,255,.18)}

.wrap{max-width:1100px;margin:0 auto;padding:18px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.cardHead{
  padding:14px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#f4f7ff,#eef4ff);
}
.body{padding:14px}

label{
  display:block;
  font-size:12px;
  font-weight:900;
  margin-top:14px;
  margin-bottom:6px;
  color:#334155;
}

input,textarea,select{
  width:100%;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:14px;
  font-weight:600;
  background:#fff;
  outline:none;
}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{
  border-color:#cfe9ff;
  box-shadow:0 0 0 4px rgba(207,233,255,.65);
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:760px){.grid{grid-template-columns:1fr}}

.btnRow{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.btn{
  background:var(--red);
  color:#fff;
  padding:10px 14px;
  border:none;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn2{
  background:#fff;
  border:1px solid #ddd;
  padding:10px 14px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
}
.btn2:hover{background:var(--soft)}

.msg{margin-top:14px;font-weight:800;font-size:13px;color:var(--muted)}
.msg.ok{color:var(--ok)}
.msg.error{color:var(--error)}

/* ✅ Multi-select dropdown */
.multiSelect{position:relative}
.multiSelectBtn{
  width:100%;
  text-align:left;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #ddd;
  background:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.multiSelectBtn:focus{
  outline:none;
  border-color:#cfe9ff;
  box-shadow:0 0 0 4px rgba(207,233,255,.65);
}
.multiSelectBtn .hint{
  color:var(--muted);
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}

.multiPanel{
  position:absolute;
  left:0; right:0;
  margin-top:8px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  box-shadow:0 14px 30px rgba(0,0,0,.08);
  z-index:50;
  display:none;
  overflow:hidden;
}
.multiPanel.open{display:block;}

.multiTop{
  padding:10px;
  border-bottom:1px solid #eee;
  background:#fafafa;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}
.multiTop .left{flex:1;min-width:200px;}
.multiTop input{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-weight:600;
}

.multiTop .actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

/* ✅ nicer font for Select all / Clear / Done / Reset */
.uiBtn{
  border:1px solid #ddd;
  background:#fff;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-family:Inter,Arial,sans-serif;
  font-weight:800;
  font-size:13px;
  letter-spacing:-0.01em;
  color:#0f172a;
  white-space:nowrap;
}
.uiBtn:hover{background:#f8fafc}

.multiList{
  max-height:260px;
  overflow:auto;
  padding:10px;
}
.multiItem{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 8px;
  border-radius:10px;
  user-select:none;
}
.multiItem:hover{background:#f8fafc}
.multiItem input{width:auto}

.multiFooter{
  padding:10px;
  border-top:1px solid #eee;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.selectedWrap{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.selChip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid #e5e7eb;
  background:#f8fafc;
  color:#334155;
  padding:6px 10px;
  border-radius:999px;
  font-weight:900;
  font-size:12px;
}
.selChip button{
  border:none;
  background:transparent;
  cursor:pointer;
  font-weight:900;
  color:#64748b;
}
.selChip button:hover{color:#0f172a}
.smallCount{
  font-size:12px;
  font-weight:800;
  color:var(--muted);
}
</style>

<script>
if(!localStorage.getItem("token")) location.href="login.html";
</script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brandBadge">PO</div>
      <div>Practice Online</div>
    </div>
    <nav class="nav">
      <a href="learner-quizzes.html">Practice</a>
      <a href="results.html">Results</a>
      <a href="support.html" class="active">Support</a>
      <button class="btnTop" id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="cardHead">
      <h1 style="margin:0;font-size:18px;">Maths Support Request</h1>
      <div style="margin-top:6px;color:var(--muted);font-weight:700;font-size:13px;">
        Please select your request type and provide the necessary information.
      </div>
    </div>

    <div class="body">

      <label>Request Type</label>
      <select id="requestType">
        <option value="">Select</option>
        <option value="Math help">Math help</option>
        <option value="Change of account">Change of account</option>
        <option value="Other">Other</option>
      </select>

      <div id="otherRequestWrap" style="display:none;">
        <label>Please specify your request</label>
        <input id="otherRequest" placeholder="Type your request type..." />
      </div>

      <div id="topicsBlock">
        <label>Topic / Section</label>

        <div class="multiSelect" id="topicMulti">
          <button type="button" class="multiSelectBtn" id="topicBtn" aria-haspopup="listbox" aria-expanded="false">
            <span id="topicBtnText">Select topics…</span>
            <span class="hint">▼</span>
          </button>

          <div class="multiPanel" id="topicPanel">
            <div class="multiTop">
              <div class="left">
                <input id="topicSearch" placeholder="Search topics…" />
              </div>
              <div class="actions">
                <button type="button" class="uiBtn" id="selectAllBtn">Select all</button>
                <button type="button" class="uiBtn" id="clearTopicsBtn">Clear</button>
              </div>
            </div>

            <div class="multiList" id="topicsContainer">Loading topics…</div>

            <div class="multiFooter">
              <div class="smallCount" id="selectedCount">0 selected</div>
              <button type="button" class="uiBtn" id="doneTopicsBtn">Done</button>
            </div>
          </div>
        </div>

        <div class="selectedWrap" id="selectedChips"></div>
      </div>

      <label id="messageLabel">Message</label>
      <textarea id="message" placeholder="Please explain your request clearly..."></textarea>

      <div class="grid" id="extraBlock">
        <div>
          <label>Do you want Extra Classes?</label>
          <select id="wantExtra">
            <option value="no">No</option>
            <option value="yes">Yes</option>
          </select>
        </div>

        <div>
          <label>Preferred Contact (WhatsApp / Phone) (only if Yes)</label>
          <input id="contact" placeholder="e.g. 0712345678">
        </div>
      </div>

      <div id="changeAccountBlock" class="grid" style="display:none;">
        <div>
          <label>Current account type</label>
          <select id="currentAccountType">
            <option value="">Select</option>
            <option value="student">Student</option>
            <option value="materials">Materials</option>
          </select>
        </div>
        <div>
          <label>Change to</label>
          <select id="newAccountType">
            <option value="">Select</option>
            <option value="student">Student</option>
            <option value="materials">Materials</option>
          </select>
        </div>
        <div>
          <label>Grade (only if changing to Student)</label>
          <select id="newGrade">
            <option value="">Select</option>
            <option value="8">Grade 8</option>
            <option value="9">Grade 9</option>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>
        <div>
          <label>Contact number (required)</label>
          <input id="changeContact" placeholder="WhatsApp / Phone number" />
        </div>
      </div>

      <div class="btnRow">
        <button class="btn" id="submitBtn" type="button">Submit Support Request</button>
        <button class="btn2 uiBtn" id="resetBtn" type="button">Reset Form</button>
      </div>

      <div class="msg" id="msg"></div>

    </div>
  </div>
</div>

<script>
const API = window.API || "https://api.practiceonline.co.za";
const token = localStorage.getItem("token");

const requestTypeEl = document.getElementById("requestType");
const otherRequestWrap = document.getElementById("otherRequestWrap");
const otherRequestEl = document.getElementById("otherRequest");

const topicsBlock = document.getElementById("topicsBlock");
const topicsContainer = document.getElementById("topicsContainer");

const topicBtn = document.getElementById("topicBtn");
const topicBtnText = document.getElementById("topicBtnText");
const topicPanel = document.getElementById("topicPanel");
const topicSearch = document.getElementById("topicSearch");
const selectAllBtn = document.getElementById("selectAllBtn");
const clearTopicsBtn = document.getElementById("clearTopicsBtn");
const doneTopicsBtn = document.getElementById("doneTopicsBtn");

const selectedCount = document.getElementById("selectedCount");
const selectedChips = document.getElementById("selectedChips");

const messageLabel = document.getElementById("messageLabel");
const messageEl = document.getElementById("message");

const extraBlock = document.getElementById("extraBlock");
const wantExtraEl = document.getElementById("wantExtra");
const contactEl = document.getElementById("contact");

const changeAccountBlock = document.getElementById("changeAccountBlock");
const currentAccountTypeEl = document.getElementById("currentAccountType");
const newAccountTypeEl = document.getElementById("newAccountType");
const newGradeEl = document.getElementById("newGrade");
const changeContactEl = document.getElementById("changeContact");

const submitBtn = document.getElementById("submitBtn");
const resetBtn = document.getElementById("resetBtn");
const msgEl = document.getElementById("msg");

document.getElementById("logoutBtn").onclick = ()=>{
  localStorage.clear();
  location.href="login.html";
};

function clean(s){return String(s||"").trim().replace(/\s+/g," ");}

function setMsg(t,type){
  msgEl.className = "msg" + (type ? (" " + type) : "");
  msgEl.textContent = t || "";
}

function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(str){
  return String(str ?? "").replaceAll('"',"&quot;");
}

/* Multi-select open/close */
function openTopicPanel(){
  topicPanel.classList.add("open");
  topicBtn.setAttribute("aria-expanded","true");
  setTimeout(()=>topicSearch.focus(), 30);
}
function closeTopicPanel(){
  topicPanel.classList.remove("open");
  topicBtn.setAttribute("aria-expanded","false");
}
topicBtn.addEventListener("click", ()=>{
  topicPanel.classList.contains("open") ? closeTopicPanel() : openTopicPanel();
});
doneTopicsBtn.addEventListener("click", closeTopicPanel);

document.addEventListener("click", (e)=>{
  const box = document.getElementById("topicMulti");
  if(!box.contains(e.target)) closeTopicPanel();
});

function getAllCheckboxes(){
  return [...document.querySelectorAll("#topicsContainer input[type=checkbox]")];
}
function selectedTopics(){
  return getAllCheckboxes().filter(cb=>cb.checked).map(cb=>cb.value);
}

function applyTopicSearchFilter(){
  const q = topicSearch.value.trim().toLowerCase();
  document.querySelectorAll("#topicsContainer .multiItem").forEach(row=>{
    const t = (row.getAttribute("data-topic") || "").toLowerCase();
    row.style.display = (!q || t.includes(q)) ? "" : "none";
  });
}

function updateSelectedUI(){
  const sel = selectedTopics();
  selectedCount.textContent = `${sel.length} selected`;

  if(!sel.length) topicBtnText.textContent = "Select topics…";
  else if(sel.length <= 2) topicBtnText.textContent = sel.join(", ");
  else topicBtnText.textContent = `${sel.length} topics selected`;

  selectedChips.innerHTML = sel.map(t=>`
    <span class="selChip">
      ${escapeHtml(t)}
      <button type="button" data-remove="${escapeAttr(t)}" aria-label="Remove">×</button>
    </span>
  `).join("");

  applyTopicSearchFilter();
}

selectedChips.addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-remove]");
  if(!btn) return;
  const val = btn.getAttribute("data-remove") || "";
  const cb = document.querySelector(`#topicsContainer input[type=checkbox][value="${CSS.escape(val)}"]`);
  if(cb) cb.checked = false;
  updateSelectedUI();
});

clearTopicsBtn.addEventListener("click", ()=>{
  getAllCheckboxes().forEach(cb=>cb.checked=false);
  updateSelectedUI();
});

selectAllBtn.addEventListener("click", ()=>{
  document.querySelectorAll("#topicsContainer .multiItem").forEach(row=>{
    if(row.style.display === "none") return;
    const cb = row.querySelector("input[type=checkbox]");
    if(cb) cb.checked = true;
  });
  updateSelectedUI();
});

topicSearch.addEventListener("input", applyTopicSearchFilter);

/* Request type UI */
function setUIForRequestType(){
  const val = requestTypeEl.value;

  otherRequestWrap.style.display = "none";
  changeAccountBlock.style.display = "none";
  topicsBlock.style.display = "block";
  extraBlock.style.display = "grid";
  messageLabel.textContent = "Message";

  if (val === "Other") {
    otherRequestWrap.style.display = "block";
  }

  if (val === "Change of account") {
    topicsBlock.style.display = "none";
    extraBlock.style.display = "none";
    changeAccountBlock.style.display = "grid";
    messageLabel.textContent = "Message (optional)";
  }
}
requestTypeEl.addEventListener("change", setUIForRequestType);

/* Load topics */
async function loadTopics(){
  topicsContainer.innerHTML = "<div class='smallCount'>Loading topics…</div>";

  const res = await fetch(`${API}/api/quizzes`,{
    headers:{Authorization:`Bearer ${token}`}
  });

  const data = await res.json().catch(()=>[]);
  const topics = [...new Set((Array.isArray(data)?data:[])
    .map(q=>clean(q.topic))
    .filter(Boolean)
  )].sort((a,b)=>a.localeCompare(b));

  if(!topics.length){
    topicsContainer.innerHTML = "<div class='smallCount'>No topics found.</div>";
    updateSelectedUI();
    return;
  }

  topicsContainer.innerHTML = topics.map(t=>`
    <label class="multiItem" data-topic="${escapeAttr(t)}">
      <input type="checkbox" value="${escapeAttr(t)}" />
      <span>${escapeHtml(t)}</span>
    </label>
  `).join("");

  topicsContainer.addEventListener("change", (e)=>{
    if(e.target && e.target.type === "checkbox"){
      updateSelectedUI();
    }
  });

  updateSelectedUI();
}

/* Reset */
function resetForm(){
  requestTypeEl.value = "";
  otherRequestEl.value = "";
  otherRequestWrap.style.display = "none";

  messageEl.value = "";
  wantExtraEl.value = "no";
  contactEl.value = "";

  currentAccountTypeEl.value = "";
  newAccountTypeEl.value = "";
  newGradeEl.value = "";
  changeContactEl.value = "";

  topicSearch.value = "";
  getAllCheckboxes().forEach(cb=>cb.checked=false);
  updateSelectedUI();

  setMsg("");
  setUIForRequestType();
}
resetBtn.addEventListener("click", resetForm);

/* Submit */
submitBtn.onclick = async ()=>{
  setMsg("");

  const reqType = clean(requestTypeEl.value);
  const reqOther = clean(otherRequestEl.value);

  if (!reqType) return setMsg("Please select a request type.", "error");
  if (reqType === "Other" && !reqOther) return setMsg("Please specify your request type (Other).", "error");

  const message = clean(messageEl.value);

  if (reqType === "Change of account") {
    const currentType = clean(currentAccountTypeEl.value);
    const newType = clean(newAccountTypeEl.value);
    const grade = clean(newGradeEl.value);
    const phone = clean(changeContactEl.value);

    if (!currentType) return setMsg("Please select your current account type.", "error");
    if (!newType) return setMsg("Please select the account type you want.", "error");
    if (currentType === newType) return setMsg("Current and new account type cannot be the same.", "error");
    if (!phone) return setMsg("A contact number is required for account changes.", "error");
    if (newType === "student" && !grade) return setMsg("Please select a grade for the Student account.", "error");

    submitBtn.disabled = true;
    setMsg("Submitting…");

    const payload = {
      subject: "Maths",
      requestType: "Change of account",
      message: message || "",
      changeAccount: {
        currentAccountType: currentType,
        newAccountType: newType,
        newGrade: newType === "student" ? Number(grade) : null,
        contact: phone
      }
    };

    try{
      const r = await fetch(`${API}/api/support`,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          Authorization:`Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if(!r.ok){
        submitBtn.disabled = false;
        return setMsg("We could not submit your request. Please try again.", "error");
      }

      submitBtn.disabled = false;
      setMsg("✅ Your request has been submitted successfully. We will contact you shortly.", "ok");
      resetForm();
      return;

    }catch{
      submitBtn.disabled = false;
      return setMsg("Network error. Please try again.", "error");
    }
  }

  const topics = selectedTopics();

  if (reqType === "Math help" && topics.length === 0) {
    return setMsg("Please select at least one topic/section.", "error");
  }

  if (!message) return setMsg("Please enter a clear message.", "error");

  const wantsExtra = wantExtraEl.value === "yes";
  const phone = clean(contactEl.value);
  if (wantsExtra && !phone) return setMsg("Please provide a contact number for Extra Classes.", "error");

  submitBtn.disabled = true;
  setMsg("Submitting…");

  const payload = {
    subject: "Maths",
    requestType: (reqType === "Other") ? reqOther : reqType,
    topics: topics,
    message,
    wantExtraClasses: wantsExtra,
    preferredService: wantsExtra ? "extra_classes" : "",
    contact: wantsExtra ? phone : ""
  };

  try{
    const r = await fetch(`${API}/api/support`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:`Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    if(!r.ok){
      submitBtn.disabled = false;
      return setMsg("We could not submit your request. Please try again.", "error");
    }

    submitBtn.disabled = false;
    setMsg("Your support request has been submitted successfully. We will contact you soon.", "ok");
    resetForm();

  }catch{
    submitBtn.disabled = false;
    setMsg("Network error. Please try again.", "error");
  }
};

loadTopics();
setUIForRequestType();
</script>

</body>
</html>
