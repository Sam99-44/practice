<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Practice | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .wrap{max-width:1000px;margin:0 auto;padding:24px;}

    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:12px;}
    .brand{display:flex;align-items:center;gap:10px;}
    .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;}
    .brand span{font-size:13px;color:var(--muted);}

    .nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
    .nav a{text-decoration:none;color:var(--text);padding:6px 8px;border-radius:8px;}
    .nav a.active{font-weight:600;color:var(--accent);}
    .nav a:hover{background:var(--accent-soft);}
    .nav .logout{background:var(--accent);color:white;border:none;padding:8px 12px;border-radius:10px;cursor:pointer;}

    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
    h1{margin:0;font-size:20px;}
    .muted{color:var(--muted);}
    .error{color:var(--error);}

    input{padding:10px;border-radius:10px;border:1px solid #ddd;min-width:220px;}
    .controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center;}
    .btn2{background:#fff;border:1px solid #ddd;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;}
    .btn2:disabled{opacity:.6;cursor:not-allowed;}

    .topic-wrap{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
    .topic-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff;}
    .topic-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
    .topic-title{font-size:16px;font-weight:800;color:var(--accent);}
    .toggle{border:1px solid #ddd;background:#fff;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:700;}
    .toggle:hover{background:var(--accent-soft);}

    .quiz-squares{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
    .quiz-square{
      width:64px;height:64px;border-radius:14px;border:1px solid var(--border);
      background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;font-weight:800;position:relative;
      transition:transform .08s, background .2s, border-color .2s;
      user-select:none;
    }
    .quiz-square:hover{background:#eef7ff;transform:translateY(-1px);border-color:#cfe9ff;}

    /* Completed */
    .quiz-square.done{
      border-color:#86efac;
      background:#f0fdf4;
    }
    .quiz-square.done::after{
      content:"✓";
      position:absolute;
      top:6px;
      right:10px;
      font-size:14px;
      font-weight:900;
      color:#166534;
    }

    /* Unavailable */
    .quiz-square.unavailable{
      cursor:not-allowed;
      opacity:.75;
      background:#f8fafc;
      border-color:#e5e7eb;
    }
    .quiz-square.unavailable:hover{
      background:#f8fafc;
      border-color:#e5e7eb;
    }

    .quiz-square .status{
      font-size:10px;
      font-weight:800;
      margin-top:4px;
      color:#64748b;
    }
    .quiz-square.unavailable .status{
      color:#b45309;
    }

    .hidden{display:none!important;}

    @media (max-width:700px){
      .wrap{padding:16px;}
      input{min-width:100%;}
    }
  </style>

  <script>
    const authToken = localStorage.getItem("token");
    if (!authToken) window.location.href = "login.html";
  </script>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <span id="welcomeSub"></span>
      </div>
    </div>

    <nav class="nav">
      <a class="active" href="learner-quizzes.html">Practice</a>
      <a href="results.html">Results</a>
      <a href="about.html">About</a>
      <a href="admin-quiz.html" data-admin>Admin</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </nav>
  </div>

  <div class="card">
    <h1 id="pageTitle">Practice</h1>
    <p class="muted" id="pageSub">Loading your grade…</p>

    <div class="controls">
      <input id="topicSearch" placeholder="Search topic…" disabled />
      <button class="btn2" id="expandAllBtn" disabled type="button">Expand all</button>
      <button class="btn2" id="collapseAllBtn" disabled type="button">Collapse all</button>
    </div>

    <p id="status" class="muted"></p>
    <div id="quizList"></div>
  </div>

</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");

  document.getElementById("welcomeSub").textContent =
    "Welcome, " + (localStorage.getItem("username") || "Learner");

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.clear();
    window.location.href = "login.html";
  };

  const quizList = document.getElementById("quizList");
  const status = document.getElementById("status");
  const topicSearch = document.getElementById("topicSearch");
  const expandAllBtn = document.getElementById("expandAllBtn");
  const collapseAllBtn = document.getElementById("collapseAllBtn");
  const pageTitle = document.getElementById("pageTitle");
  const pageSub = document.getElementById("pageSub");

  let topicOpen = {};
  let cachedByTopic = null;
  let cachedTopics = [];
  let completedSet = new Set();
  let myGrade = null;

  topicSearch.addEventListener("input", () => filterTopics(topicSearch.value));
  expandAllBtn.addEventListener("click", () => toggleAll(true));
  collapseAllBtn.addEventListener("click", () => toggleAll(false));

  init();

  async function init(){
    if (!token) return window.location.href = "login.html";

    // Get learner grade from /me
    const meRes = await fetch(`${API}/api/auth/me`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if (meRes.status === 401) {
      localStorage.clear();
      return window.location.href = "login.html";
    }

    const me = await meRes.json().catch(()=>null);
    if (!meRes.ok || !me) {
      pageSub.className = "error";
      pageSub.textContent = "Could not load your profile. Please login again.";
      return;
    }

    myGrade = me.grade;

    // Update heading
    pageTitle.textContent = `Grade ${myGrade} Practice`;
    pageSub.textContent = "Good luck with your Assessments.";

    // Load quizzes
    await loadQuizzes();
  }

  async function loadCompletedResults(){
    try{
      const res = await fetch(`${API}/api/results/my`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) return;

      const results = await res.json();
      completedSet = new Set(results.map(r => r.quizId).filter(Boolean));
    } catch {}
  }

  async function loadQuizzes(){
    status.textContent = "Loading assessments...";
    quizList.innerHTML = "";

    await loadCompletedResults();

    // ✅ No grade selector anymore.
    // ✅ Backend should return only the learner grade quizzes.
    const res = await fetch(`${API}/api/quizzes`, {
      headers:{ Authorization:`Bearer ${token}` }
    });

    const quizzes = await res.json().catch(()=>[]);
    if (!Array.isArray(quizzes) || quizzes.length === 0){
      status.textContent = "No assessments found for your grade.";
      topicSearch.disabled = true;
      expandAllBtn.disabled = true;
      collapseAllBtn.disabled = true;
      return;
    }

    const byTopic = {};
    quizzes.forEach(q=>{
      const t = q.topic || "General";
      (byTopic[t] ||= []).push(q);
      if (topicOpen[t] === undefined) topicOpen[t] = false;
    });

    cachedTopics = Object.keys(byTopic).sort();
    cachedByTopic = byTopic;

    render();
    topicSearch.disabled = false;
    expandAllBtn.disabled = false;
    collapseAllBtn.disabled = false;
    status.textContent = "";
  }

  function render(){
    quizList.innerHTML = `
      <div class="topic-wrap">
        ${cachedTopics.map(t=>{
          const list = cachedByTopic[t];
          const open = topicOpen[t];

          return `
            <div class="topic-card" data-topic="${escapeAttr(t)}">
              <div class="topic-head">
                <div class="topic-title">${escapeHtml(t)}</div>
                <button class="toggle" data-toggle="${escapeAttr(t)}">
                  ${open ? "Collapse" : "Expand"}
                </button>
              </div>

              <div class="quiz-squares ${open ? "" : "hidden"}">
                ${list.map((q,i)=>{
                  const unavailable = !!q.isFrozen;
                  const done = completedSet.has(q._id);
                  return `
                    <div class="quiz-square ${done ? "done" : ""} ${unavailable ? "unavailable" : ""}"
                      data-id="${q._id}" data-unavailable="${unavailable}">
                      ${i+1}
                      <div class="status">${unavailable ? "Unavailable" : "Available"}</div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;

    document.querySelectorAll(".quiz-square").forEach(sq=>{
      sq.onclick = () => {
        if (sq.dataset.unavailable === "true") return;
        window.location.href = `attempt.html?quizId=${sq.dataset.id}`;
      };
    });

    document.querySelectorAll("[data-toggle]").forEach(btn=>{
      btn.onclick = ()=>{
        const t = btn.dataset.toggle;
        topicOpen[t] = !topicOpen[t];
        render();
      };
    });
  }

  function toggleAll(open){
    cachedTopics.forEach(t => topicOpen[t] = open);
    render();
  }

  function filterTopics(q){
    q = String(q || "").toLowerCase();
    document.querySelectorAll(".topic-card").forEach(card=>{
      card.classList.toggle("hidden", !card.dataset.topic.toLowerCase().includes(q));
    });
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(str){
    return String(str).replaceAll('"',"&quot;");
  }
</script>

</body>
</html>
