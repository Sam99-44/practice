<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Opportunities | Practice Online Academy</title>

<style>
:root{
  --nav:#1b1648;
  --nav-dark:#141038;
  --gold:#f4c400;
  --bg:#f6f7fb;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#64748b;
  --danger:#b91c1c;
  --success:#065f46;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

.topbar{
  background:var(--nav);
  color:#fff;
  padding:20px 28px;
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:700;
}

.top-links a{
  color:var(--gold);
  font-weight:700;
  font-size:15px;
  border-bottom:3px solid var(--gold);
  padding-bottom:6px;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:24px 18px 42px;
}

/* ================= CATEGORY ================= */

.categoryBox{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:24px;
  box-shadow:0 2px 8px rgba(15,23,42,0.04);
}

.loadingBox{
  padding:24px;
  color:var(--muted);
  font-weight:700;
}

.categoryItem{
  border-bottom:1px solid #e8edf5;
}

.categoryBtn{
  width:100%;
  border:none;
  background:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 24px;
  cursor:pointer;
  font-size:16px;
  font-weight:700;
  color:var(--nav);
}

.jobsWrap{
  display:block;
  padding:0 20px 20px;
  background:#fafcff;
}

.categoryItem:not(.active) .jobsWrap{
  display:none;
}

.categoryItem.active .arrow{
  transform:rotate(90deg);
}

.arrow{
  transition:.15s;
}

/* ================= JOB CARD ================= */

.jobCard{
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:16px;
  padding:26px;
  margin-top:18px;
  box-shadow:0 2px 8px rgba(15,23,42,0.04);
}

.jobCard h3{
  margin:0;
  color:var(--nav);
  font-size:21px;
}

.jobMeta{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.jobDesc{
  margin-top:14px;
  line-height:1.7;
  color:#334155;
}

/* ================= BUTTONS ================= */

.applyBtn{
  margin-top:18px;
  background:var(--nav);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:16px 28px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:170px;
  transition:.2s ease;
}

.applyBtn:hover{
  background:var(--nav-dark);
}

.submitBtn{
  width:100%;
  background:var(--nav);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:15px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.submitBtn:hover{
  background:var(--nav-dark);
}

/* ================= APPLICATION ================= */

.applicationSection{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:30px;
  margin-top:28px;
  display:none;
}

.applicationSection.show{
  display:block;
}

.applicationSection h2{
  margin:0 0 6px;
  color:var(--nav);
  font-size:28px;
}

.applicationSection p{
  color:var(--muted);
  line-height:1.6;
}

/* ================= FORM ================= */

.formGroup{
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
  background:#fff;
  box-shadow:0 2px 8px rgba(15,23,42,0.03);
}

.formGroup h3{
  margin:0 0 16px;
  color:var(--nav);
  font-size:20px;
}

.formGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.formGrid.three{
  grid-template-columns:.55fr 1.2fr 1.2fr;
}

.formGrid.personalTop{
  grid-template-columns:.55fr 1.45fr;
}

.formGrid.full{
  grid-template-columns:1fr;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  padding:14px 16px;
  border:1px solid #d7dde7;
  border-radius:12px;
  background:#fff;
  font-size:14px;
  font-family:Arial, Helvetica, sans-serif;
  color:#0f172a;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#cbd5e1;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input[readonly]{
  background:#f8fafc;
  color:#475569;
}

.fieldError{
  margin-top:6px;
  color:var(--danger);
  font-size:12px;
  font-weight:700;
  display:none;
}

.msg{
  margin-top:14px;
  font-weight:700;
  color:var(--success);
}

.req{
  color:#dc2626;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .topbar{
    padding:18px;
  }

  .topbar-inner{
    flex-direction:column;
    gap:14px;
    text-align:center;
  }

  .logo{
    font-size:22px;
  }

  .formGrid,
  .formGrid.three,
  .formGrid.personalTop{
    grid-template-columns:1fr;
  }

  .applicationSection{
    padding:22px;
  }

  .jobCard{
    padding:20px;
  }

  .jobCard h3{
    font-size:19px;
  }

  .applyBtn{
    width:100%;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="logo">
      Practice Online Academy
    </div>

    <div class="top-links">
      <a href="index.html">Home</a>
    </div>

  </div>

</header>

<main class="wrap">

  <section class="categoryBox" id="categoryBox">

    <div class="loadingBox">
      Loading opportunities...
    </div>

  </section>

  <section class="applicationSection" id="applicationSection">

    <h2>Apply for an Opportunity</h2>

    <p>
      Complete the application form below. Please make sure your details are correct before submitting.
    </p>

    <form id="applicationForm">

      <div class="formGroup">

        <h3>Opportunity Information</h3>

        <div class="formGrid">

          <div>
            <label>
              Opportunity Applied For <span class="req">*</span>
            </label>

            <input
              type="text"
              id="role"
              name="opportunityTitle"
              readonly
              required
            >
          </div>

          <div>
            <label>
              Availability <span class="req">*</span>
            </label>

            <select name="availability" required>
              <option value="">Select availability</option>
              <option>Immediately Available</option>
              <option>Part-Time</option>
              <option>Weekends Only</option>
              <option>Evenings Only</option>
              <option>One Month Notice</option>
            </select>
          </div>

        </div>

      </div>

      <button class="submitBtn" type="submit">
        Submit Professional Application
      </button>

      <div id="msg" class="msg"></div>

    </form>

  </section>

</main>

<script>

const API = "https://practice-backend-msgn.onrender.com";

const categoryBox = document.getElementById("categoryBox");

const CACHE_KEY = "po_open_opportunities_cache_v1";

/* ================= ESCAPE HTML ================= */

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ================= RENDER ================= */

function renderOpportunities(jobs){

  if(!Array.isArray(jobs) || !jobs.length){

    categoryBox.innerHTML = `
      <div class="loadingBox">
        No open opportunities available.
      </div>
    `;

    return;
  }

  const grouped = {};

  jobs.forEach(job=>{

    const cat = job.category || "Other";

    if(!grouped[cat]){
      grouped[cat] = [];
    }

    grouped[cat].push(job);

  });

  categoryBox.innerHTML = Object.entries(grouped).map(([category,items])=>`

    <div class="categoryItem active">

      <button class="categoryBtn" type="button">

        <span>
          ${escapeHtml(category)} (${items.length})
        </span>

        <span class="arrow">▶</span>

      </button>

      <div class="jobsWrap">

        ${items.map(job=>`

          <div class="jobCard">

            <h3>
              ${escapeHtml(job.title)}
            </h3>

            <div class="jobMeta">

              ${escapeHtml(job.category)}

              &nbsp;&nbsp;

              ${escapeHtml(job.location || "Online")}

              &nbsp;&nbsp;

              ${escapeHtml(job.type || "")}

              ${
                job.closingDate
                ? `&nbsp;&nbsp; Closing: ${new Date(job.closingDate).toLocaleDateString("en-ZA")}`
                : ""
              }

            </div>

            <div class="jobDesc">
              ${escapeHtml(job.description)}
            </div>

            ${job.requirements ? `

              <div class="jobDesc">

                <strong>
                  Requirements:
                </strong>

                ${escapeHtml(job.requirements)}

              </div>

            ` : ""}

            <button
              class="applyBtn"
              type="button"
              onclick="selectRole('${escapeHtml(job.title)}')"
            >
              Apply for this role
            </button>

          </div>

        `).join("")}

      </div>

    </div>

  `).join("");

  document.querySelectorAll(".categoryBtn").forEach(btn=>{

    btn.addEventListener("click",()=>{

      btn.parentElement.classList.toggle("active");

    });

  });

}

/* ================= LOAD ================= */

async function loadOpportunities(){

  const cached = localStorage.getItem(CACHE_KEY);

  if(cached){

    try{

      renderOpportunities(JSON.parse(cached));

    }catch{

      localStorage.removeItem(CACHE_KEY);

    }
  }

  try{

    const controller = new AbortController();

    const timer = setTimeout(()=>controller.abort(),8000);

    const res = await fetch(`${API}/api/opportunities`,{
      cache:"no-store",
      signal:controller.signal
    });

    clearTimeout(timer);

    const jobs = await res.json();

    if(!res.ok){
      throw new Error("Could not load opportunities");
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(jobs));

    renderOpportunities(jobs);

  }catch(error){

    if(!cached){

      categoryBox.innerHTML = `
        <div class="loadingBox">
          Could not load opportunities. Please refresh.
        </div>
      `;
    }
  }
}

/* ================= APPLY ================= */

function selectRole(role){

  document.getElementById("role").value = role;

  document.getElementById("applicationSection")
  .classList.add("show");

  document.getElementById("applicationSection")
  .scrollIntoView({
    behavior:"smooth"
  });
}

loadOpportunities();

</script>

</body>
</html>
