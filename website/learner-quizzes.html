<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Practice | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --easy:#22c55e;
  --moderate:#3b82f6;
  --hard:#ef4444;
  --track:#e9eef5;
  --bar:#1b1648;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

/* ===== QUIZ (UPDATED) ===== */
.quiz-squares{
  display:flex;
  gap:6px; /* tight spacing */
  margin-top:8px;
  flex-wrap:wrap;
}

.quiz-square{
  width:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}

.quiz-icon-wrap{
  position:relative;
  width:60px;
  height:66px;
}

.quiz-fill{
  position:absolute;
  left:8px;
  top:8px;
  width:42px;
  height:46px;
  border-radius:6px;
}

.quiz-square.pass .quiz-fill{background:#dcfce7}
.quiz-square.fail .quiz-fill{background:#fee2e2}

.quiz-square-base{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.quiz-mark{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-weight:700;
  font-size:13px;
}

.quiz-q{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:16px;
  font-weight:700;
}

.quiz-number{
  font-size:11px;
  margin-top:2px;
}

/* ===== PAGE ===== */
.wrap{max-width:1150px;margin:0 auto;padding:18px}
.topic-wrap{padding:18px}
.topic-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}
.topic-title{font-size:14px;font-weight:400}

</style>

<script>
const API = "https://practice-backend-msgn.onrender.com";
const token = localStorage.getItem("token");

let quizzes = [];
let resultsMap = {};

function getState(id){
  const r = resultsMap[id];
  if(!r) return {type:"new"};

  const percent = Math.round((r.score / r.total) * 100);
  return {
    type:"done",
    score: percent + "%",
    state: percent >= 50 ? "pass" : "fail"
  };
}

/* ===== RENDER (ORDERED) ===== */
function render(list){
  const groups = {};

  list.forEach(q => {
    const topic = q.topic || "General";
    if(!groups[topic]) groups[topic] = [];
    groups[topic].push(q);
  });

  const html = Object.keys(groups).map(topic => {

    const topicQuizzes = groups[topic].sort((a, b) => {
      return new Date(a.createdAt) - new Date(b.createdAt);
    });

    return `
    <div class="topic-card">
      <div class="topic-title">${topic}</div>

      <div class="quiz-squares">
        ${topicQuizzes.map((q, i) => {
          const s = getState(q._id);
          return `
          <div class="quiz-square ${s.state || ""}">
            <div class="quiz-icon-wrap">
              <div class="quiz-fill"></div>
              ${
                s.type === "new"
                  ? `<div class="quiz-q">?</div>`
                  : `<div class="quiz-mark">${s.score}</div>`
              }
            </div>
            <div class="quiz-number">${i + 1}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");

  document.getElementById("quizList").innerHTML = html;
}

/* ===== LOAD ===== */
async function loadPage(){
  const quizzesRes = await fetch(`${API}/api/quizzes`, {
    headers:{Authorization:`Bearer ${token}`}
  });
  quizzes = await quizzesRes.json();

  const resultsRes = await fetch(`${API}/api/results/my`, {
    headers:{Authorization:`Bearer ${token}`}
  });
  const results = await resultsRes.json();

  resultsMap = {};
  results.forEach(r => {
    const id = r.quizId?._id || r.quizId;
    resultsMap[id] = r;
  });

  render(quizzes);
}

loadPage();
</script>

</head>

<body>
<div class="wrap">
  <div id="quizList" class="topic-wrap"></div>
</div>
</body>
</html>
