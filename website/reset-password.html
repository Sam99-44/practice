<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting | Practice Online</title>

  <meta http-equiv="refresh" content="2; url=forgot-password.html" />

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --nav:#1b1648;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    /* NAV */
    .topbar{
      background:var(--nav);
      padding:14px 20px;
    }

    .navBar{
      max-width:1100px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .brand{
      color:#fff;
      text-decoration:none;
      font-weight:600;
      font-size:18px;
    }

    /* CONTENT */
    .wrap{
      max-width:1100px;
      margin:auto;
      padding:24px;
      display:flex;
      justify-content:center;
      align-items:center;
      height:calc(100vh - 64px);
    }

    .card{
      width:100%;
      max-width:420px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:24px;
      box-shadow:var(--shadow);
      text-align:center;
    }

    h2{
      margin:0 0 10px;
      font-weight:600;
    }

    p{
      margin:6px 0 14px;
      color:var(--muted);
    }

    .loader{
      margin:16px auto;
      width:40px;
      height:40px;
      border:4px solid #ddd;
      border-top:4px solid var(--accent);
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="navBar">
    <a href="index.html" class="brand">Practice Online</a>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h2>Redirecting...</h2>
    <p>Taking you to the reset page.</p>

    <div class="loader"></div>

    <p>If nothing happens, <a href="forgot-password.html">click here</a>.</p>
  </div>
</main>

<script>
  setTimeout(() => {
    window.location.href = "forgot-password.html";
  }, 2000);
</script>

</body>
</html>
