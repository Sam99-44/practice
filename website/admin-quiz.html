<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin | Add Quiz</title>
  <style>
    body{font-family:Arial; padding:20px; max-width:900px; margin:auto; background:#f6f7fb;}
    .card{background:#fff; border:1px solid #e6e6e6; border-radius:14px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,0.06);}
    input, textarea, select{width:100%; padding:10px; margin:8px 0; border-radius:10px; border:1px solid #ddd; outline:none;}
    button{padding:10px 14px; cursor:pointer; border:none; border-radius:10px;}
    .btn{background:#111827; color:#fff;}
    .btn:disabled{opacity:0.6; cursor:not-allowed;}
    .btn2{background:#fff; border:1px solid #ddd; color:#111827;}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
    .msg{margin-top:10px;}
    .topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
    .muted{color:#555;}
    .error{color:#b91c1c;}
    .ok{color:#065f46;}
    a.btn2{display:inline-block; padding:10px 12px; border-radius:10px; text-decoration:none;}

    .qcard{border:1px solid #e6e6e6; border-radius:12px; padding:12px; margin-top:12px; background:#fff;}
    .qhead{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
    .smallbtn{border:1px solid #ddd; background:#fff; color:#111827; padding:8px 10px; border-radius:10px;}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    hr{border:none; border-top:1px solid #eee; margin:14px 0;}
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <h2 style="margin:0;">Practice Online – Admin (Add Quiz)</h2>
      <div class="muted" id="who">Checking login...</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <a class="btn2" href="admin-dashboard.html">Dashboard</a>
      <a class="btn2" href="learner-quizzes.html">Learner View</a>
      <button class="btn" id="logoutBtn" data-auth>Logout</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Grade</label>
        <select id="grade">
          <option value="">Select Grade</option>
          <option value="8">Grade 8</option>
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
        </select>
      </div>

      <div>
        <label>Topic</label>
        <select id="topic">
          <option value="">Select Topic</option>
          <option>Integers</option>
          <option>Algebra</option>
          <option>Geometry</option>
          <option>Trigonometry</option>
          <option>Functions</option>
          <option>Sequences</option>
          <option>Probability</option>
          <option>Statistics</option>
        </select>
      </div>

      <!-- ✅ NEW: time limit -->
      <div>
        <label>Time Limit (minutes)</label>
        <input id="timeLimit" type="number" min="1" max="180" value="10" placeholder="e.g. 10" />
      </div>
    </div>

    <label>Quiz Title</label>
    <input id="title" placeholder="e.g. Integers Quiz 1" />

    <hr>

    <div class="qhead">
      <h3 style="margin:0;">Questions (4 options A–D)</h3>
      <button class="smallbtn" id="addQuestionBtn" type="button">+ Add Question</button>
    </div>

    <div id="questionsWrap"></div>

    <hr>

    <button class="btn" id="saveBtn" disabled>Save Quiz</button>
    <p class="msg muted" id="msg"></p>
  </div>

  <script src="nav.js"></script>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";

    const msg = document.getElementById("msg");
    const who = document.getElementById("who");
    const saveBtn = document.getElementById("saveBtn");

    const gradeEl = document.getElementById("grade");
    const topicEl = document.getElementById("topic");
    const timeLimitEl = document.getElementById("timeLimit"); // ✅ NEW
    const titleEl = document.getElementById("title");

    const addQuestionBtn = document.getElementById("addQuestionBtn");
    const questionsWrap = document.getElementById("questionsWrap");

    function setMsg(text, type="muted"){
      msg.className = "msg " + type;
      msg.textContent = text;
    }

    function logout(){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      window.location.href = "login.html";
    }
    document.getElementById("logoutBtn").addEventListener("click", logout);

    // ✅ Normalize: trim, remove extra spaces
    function cleanSpaces(s){
      return String(s || "").trim().replace(/\s+/g, " ");
    }

    // ✅ Title Case
    function toTitleCase(s){
      const t = cleanSpaces(s).toLowerCase();
      if (!t) return "";
      return t.replace(/\b\w/g, c => c.toUpperCase());
    }

    // -------------------- Admin lock --------------------
    (async () => {
      const token = localStorage.getItem("token");
      if (!token) return window.location.href = "login.html";

      let meRes;
      try{
        meRes = await fetch(`${API}/api/auth/me`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
      } catch {
        setMsg("Network error. Please refresh and try again.", "error");
        return;
      }

      const me = await meRes.json().catch(() => null);

      if (!meRes.ok || !me) {
        alert("Session expired. Please login again.");
        return logout();
      }

      if (me.role !== "admin") {
        alert("Admin only");
        return window.location.href = "learner-quizzes.html";
      }

      who.textContent = `Logged in as: ${me.username} (admin)`;
      saveBtn.disabled = false;
      setMsg("Ready to add a quiz.", "ok");
    })();

    // -------------------- Question builder (A–D) --------------------
    let qCount = 0;

    function questionCardHtml(id){
      return `
        <div class="qcard" data-qid="${id}">
          <div class="qhead">
            <b>Question ${id}</b>
            <button type="button" class="smallbtn removeBtn">Remove</button>
          </div>

          <label>Question Text</label>
          <input class="qText" placeholder="Type your question here" />

          <label>Image URL (optional)</label>
          <input class="qImage" placeholder="https://res.cloudinary.com/...png" />

          <div class="grid2">
            <div>
              <label>Option A</label>
              <input class="optA" placeholder="A" />
            </div>
            <div>
              <label>Option B</label>
              <input class="optB" placeholder="B" />
            </div>
            <div>
              <label>Option C</label>
              <input class="optC" placeholder="C" />
            </div>
            <div>
              <label>Option D</label>
              <input class="optD" placeholder="D" />
            </div>
          </div>

          <label>Correct Answer</label>
          <select class="correct">
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
          </select>
        </div>
      `;
    }

    function addQuestion(){
      qCount += 1;
      questionsWrap.insertAdjacentHTML("beforeend", questionCardHtml(qCount));
    }

    addQuestionBtn.addEventListener("click", addQuestion);

    questionsWrap.addEventListener("click", (e) => {
      if (e.target.classList.contains("removeBtn")) {
        e.target.closest(".qcard").remove();
      }
    });

    addQuestion();

    function collectQuestions(){
      const cards = [...questionsWrap.querySelectorAll(".qcard")];
      if (cards.length === 0) throw new Error("Add at least 1 question.");

      const questions = [];

      for (const card of cards) {
        const text = cleanSpaces(card.querySelector(".qText").value);
        const imageUrl = cleanSpaces(card.querySelector(".qImage").value);

        const A = cleanSpaces(card.querySelector(".optA").value);
        const B = cleanSpaces(card.querySelector(".optB").value);
        const C = cleanSpaces(card.querySelector(".optC").value);
        const D = cleanSpaces(card.querySelector(".optD").value);

        const correctIndex = Number(card.querySelector(".correct").value);

        if (!text) throw new Error("Please fill in all question texts.");
        if (!A || !B || !C || !D) throw new Error("Please fill in all options A–D for every question.");

        questions.push({
          text,
          imageUrl: imageUrl || undefined,
          options: [A, B, C, D],
          correctIndex
        });
      }

      return questions;
    }

    // -------------------- Save quiz --------------------
    saveBtn.addEventListener("click", async () => {
      const token = localStorage.getItem("token");
      if (!token) return window.location.href = "login.html";

      const grade = Number(gradeEl.value);

      // ✅ normalize
      const topic = toTitleCase(topicEl.value);
      const title = toTitleCase(titleEl.value);

      // ✅ NEW: time limit
      const timeLimitMinutes = Number(timeLimitEl.value);

      try{
        if (!grade) return setMsg("Please select grade.", "error");
        if (!topic) return setMsg("Please select topic.", "error");
        if (!title) return setMsg("Please enter quiz title.", "error");

        if (!Number.isFinite(timeLimitMinutes) || timeLimitMinutes < 1 || timeLimitMinutes > 180) {
          return setMsg("Please enter a valid time limit (1–180 minutes).", "error");
        }

        const questions = collectQuestions();

        saveBtn.disabled = true;
        setMsg("Saving quiz...", "muted");

        const res = await fetch(`${API}/api/quizzes`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ grade, title, topic, timeLimitMinutes, questions })
        });

        const data = await res.json().catch(()=>({}));

        if (res.ok) {
          setMsg("✅ Quiz saved!", "ok");
          titleEl.value = "";
          gradeEl.value = "";
          topicEl.value = "";
          timeLimitEl.value = "10"; // ✅ reset default

          questionsWrap.innerHTML = "";
          qCount = 0;
          addQuestion();
        } else {
          setMsg("❌ Error: " + (data.message || "Could not save quiz"), "error");
        }
      } catch (err){
        setMsg(err.message || "Something went wrong.", "error");
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
