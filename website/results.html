<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Results | Practice Online</title>

<style>
/* (ALL YOUR ORIGINAL STYLES — UNCHANGED) */
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#5f6b7a;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* KEEP EVERYTHING SAME (no changes above this point) */
</style>

<script>
if(!localStorage.getItem("token")){
  location.href="login.html";
}
</script>
</head>

<body>

<!-- KEEP YOUR FULL HEADER + UI SAME -->

<div class="wrap">
  <div class="section">

    <div class="pageHead">
      <h1>Results</h1>
      <p>View your past quiz attempts, marks, and retry any assessment.</p>
    </div>

    <div class="controls">
      <div class="searchWrap">
        <input id="search" placeholder="Search topic or assessment">
      </div>

      <select id="topicFilter">
        <option value="all">All Topics</option>
      </select>

      <select id="periodFilter">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
      </select>
    </div>

    <div id="tableWrap">
      <div class="empty">Loading results...</div>
    </div>

  </div>
</div>

<script>
const API = "https://api.practiceonline.co.za";
const token = localStorage.getItem("token");

const ICON_EYE = "https://res.cloudinary.com/dopoxadlr/image/upload/v1773884664/eye_wcd3ak.svg";
const ICON_RETRY = "https://res.cloudinary.com/dopoxadlr/image/upload/v1773884662/retry_hdbczv.svg";

let allResults = [];

async function loadResults(){
  try{
    const res = await fetch(`${API}/api/results/my`,{
      headers:{Authorization:`Bearer ${token}`}
    });

    const data = await res.json().catch(()=>[]);
    allResults = Array.isArray(data) ? data : [];

    apply();
  }catch(err){
    document.getElementById("tableWrap").innerHTML = `<div class="empty">Failed to load results.</div>`;
  }
}

function apply(){
  render(allResults);
}

function render(data){
  const wrap = document.getElementById("tableWrap");

  if(!data.length){
    wrap.innerHTML = `<div class="empty">No results found.</div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Topic</th>
            <th>Assessment</th>
            <th>Mark</th>
            <th>Status</th>
            <th>View</th>
            <th>Retry</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(r => {
            const percent = Math.round(Number(r.percent) || 0);
            return `
            <tr>
              <td>${new Date(r.createdAt).toLocaleString()}</td>
              <td>${r.topic || ""}</td>
              <td>${r.title || ""}</td>

              <!-- ✅ ONLY CHANGE -->
              <td class="markText">
                <div><strong>${r.score || 0}/${r.total || 0}</strong></div>
                <div style="font-size:11px;color:#64748b;">
                  ${percent}% • #${r.rank || "-"}${r.totalStudents ? " / " + r.totalStudents : ""}
                </div>
              </td>

              <td class="status">${percent >= 50 ? "Pass" : "Fail"}</td>

              <td>
                <span class="iconActionBtn"
                  onclick="location.href='review.html?resultId=${r._id}'">
                  <img src="${ICON_EYE}">
                  View
                </span>
              </td>

              <td>
                <span class="iconActionBtn"
                  onclick="location.href='attempt.html?quizId=${r.quizId}'">
                  <img src="${ICON_RETRY}">
                  Retry
                </span>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

loadResults();
</script>

</body>
</html>
