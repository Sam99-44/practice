<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Logs | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --blue:#0b3c5d;
  --blueDark:#082f49;
  --red:#c81e1e;
  --redDark:#a81818;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --soft:#f8fafc;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:"Times New Roman",Times,serif;
  background:#fff;
  color:var(--text);
}

a{text-decoration:none;color:inherit}
button,input,select,option{font-family:"Times New Roman",Times,serif}

.topbar{
  background:var(--nav);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar-inner{
  width:100%;
  padding:12px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.accountLeft{display:flex;align-items:center;gap:12px;min-width:0}
.accountIcon{width:40px;height:40px;filter:brightness(0) invert(1) contrast(180%)}
.accountName{font-size:14px;font-weight:700;color:#fff}
.accountType{font-size:13px;color:#e0e7ff;margin-top:3px}
.topbarRight{display:flex;align-items:center;gap:18px}
.iconBtn{min-width:50px;height:50px;display:flex;align-items:center;justify-content:center}
.iconBtn img{width:30px;height:30px;filter:brightness(0) invert(1) contrast(180%)}
.menuLink{color:#fff;font-size:13px;font-weight:700;background:transparent;border:0;cursor:pointer}

.wrap{width:100%;max-width:none;padding:12px}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:0;
  box-shadow:none;
  overflow:hidden;
  margin:0 0 12px;
}

.cardHead{padding:14px 18px;border-bottom:1px solid #ececec;background:#fff}
.cardHead h1,.cardHead h2{margin:0;font-size:14px;font-weight:700;text-transform:uppercase}
.body{padding:16px}

.summaryGrid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

.summaryBox{
  border:1px solid #e5e7eb;
  background:#fff;
  padding:12px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.summaryIcon{width:26px;height:26px;object-fit:contain}
.metricLabel{font-size:13px;color:#475569;margin-bottom:6px}
.metricValue{font-size:24px;font-weight:700}
.metricNote{font-size:13px;color:#475569;margin-top:4px}

.toolbar{
  display:grid;
  grid-template-columns:160px 170px 150px 160px 1fr auto;
  gap:10px;
  align-items:end;
  margin-bottom:10px;
}

label{display:block;font-size:14px;font-weight:400;margin-bottom:6px;color:#111827}
input,select{
  width:100%;
  padding:9px 10px;
  border-radius:0;
  border:1px solid #d6d3d1;
  background:#fff;
  font-size:14px;
  outline:none;
}
input:focus,select:focus{border-color:#cbd5e1;box-shadow:0 0 0 4px rgba(226,232,240,.7)}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  color:#fff;
  border:1px solid var(--blue);
  background:var(--blue);
  border-radius:6px;
  height:36px;
  padding:8px 12px;
  min-width:90px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.btn:hover{background:var(--blueDark);border-color:var(--blueDark)}
.btn.secondary{background:#fff;color:#111827;border:1px solid #d1d5db}
.btn.secondary:hover{background:var(--soft);border-color:#d1d5db}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--redDark);border-color:var(--redDark)}
.btn.small{min-width:auto;height:30px;padding:6px 9px}
.btn img{width:15px;height:15px;filter:brightness(0) invert(1)}

.tableWrap{width:100%;overflow:auto;border:1px solid #e5e7eb;background:#fff}
.tableWrap::-webkit-scrollbar{height:10px;width:10px}
.tableWrap::-webkit-scrollbar-thumb{background:#9ca3af;border-radius:20px}

table{width:100%;border-collapse:collapse;min-width:1120px}
th,td{
  padding:9px 10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:14px;
  vertical-align:middle;
  white-space:nowrap;
}
th{background:#f8fafc;color:#111827;font-size:13px;font-weight:700;position:sticky;top:0;z-index:10}
tr:hover td{background:#f8fafc}

.badge{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:4px;
  font-size:12px;
  font-weight:600;
  background:#f8fafc;
  color:#334155;
  border:1px solid #d9dee7;
}

.msgBox{display:none;margin-bottom:12px;padding:12px;border:1px solid #e5e7eb;font-size:14px}
.msgBox.ok{display:block;color:#065f46;background:#f0fdf4}
.msgBox.error{display:block;color:#b91c1c;background:#fef2f2}

.modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.25);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999;
  padding:16px;
}
.modalOverlay.show{display:flex}
.modalCard{
  width:min(760px,100%);
  background:#fff;
  border:1px solid #d9dee7;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.modalHead{
  padding:14px 18px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.modalTitle{font-size:16px;font-weight:700;text-transform:uppercase}
.modalBody{padding:18px;max-height:70vh;overflow:auto}
.detailGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.detailBox{border:1px solid #e5e7eb;padding:10px;background:#fff}
.detailLabel{font-size:13px;color:#475569;margin-bottom:5px}
.detailValue{font-size:14px;font-weight:700;word-break:break-word;white-space:pre-wrap}
.fullDetail{grid-column:1/-1}

@media(max-width:1100px){
  .summaryGrid{grid-template-columns:repeat(2,1fr)}
  .toolbar{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .wrap{padding:10px}
  .body{padding:12px}
  .cardHead{padding:12px}
  .summaryGrid,.toolbar,.detailGrid{grid-template-columns:1fr}
  .accountName,.accountType{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>
</head>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="accountLeft">
      <img class="accountIcon" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg" alt="">
      <div>
        <div class="accountName">Practice Online</div>
        <div class="accountType" id="userPill">Employee Logs</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="employee-portal.html" class="iconBtn" title="Portal">
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="">
      </a>
      <button class="menuLink" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="msg" class="msgBox"></div>

  <div class="card">
    <div class="cardHead"><h1>Employee Logs</h1></div>
    <div class="body">
      <div class="summaryGrid">
        <div class="summaryBox">
          <div>
            <div class="metricLabel">Total Logs</div>
            <div class="metricValue" id="totalCount">0</div>
            <div class="metricNote">All activity records</div>
          </div>
        </div>
        <div class="summaryBox">
          <div>
            <div class="metricLabel">Critical Logs</div>
            <div class="metricValue" id="criticalCount">0</div>
            <div class="metricNote">High-risk actions</div>
          </div>
        </div>
        <div class="summaryBox">
          <div>
            <div class="metricLabel">Today</div>
            <div class="metricValue" id="todayCount">0</div>
            <div class="metricNote">Actions today</div>
          </div>
        </div>
        <div class="summaryBox">
          <div>
            <div class="metricLabel">Active Employees</div>
            <div class="metricValue" id="activeCount">0</div>
            <div class="metricNote">Active today</div>
          </div>
          <img class="summaryIcon" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1781654916/Approved_dbtwvt.svg" alt="">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="cardHead"><h2>Activity Logs</h2></div>
    <div class="body">
      <div class="toolbar">
        <div>
          <label>Department</label>
          <select id="departmentFilter">
            <option value="all">All</option>
            <option value="academic">Academic</option>
            <option value="operations">Operations</option>
            <option value="finance">Finance</option>
            <option value="support">Support</option>
            <option value="tutor">Tutor</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div>
          <label>Employee</label>
          <select id="employeeFilter">
            <option value="all">All employees</option>
          </select>
        </div>
        <div>
          <label>Severity</label>
          <select id="severityFilter">
            <option value="all">All</option>
            <option value="critical">Critical</option>
            <option value="warning">Warning</option>
            <option value="info">Info</option>
          </select>
        </div>
        <div>
          <label>Date filter</label>
          <select id="dateFilter">
            <option value="all">All dates</option>
            <option value="today">Today</option>
            <option value="thisWeek">This week</option>
            <option value="lastWeek">Last week</option>
            <option value="thisMonth">This month</option>
            <option value="lastMonth">Last month</option>
            <option value="thisYear">This year</option>
          </select>
        </div>
        <div>
          <label>Search</label>
          <input id="searchBox" type="search" placeholder="Search">
        </div>
        <div class="actions">
          <button class="btn" id="criticalBtn">Critical Only</button>
          <button class="btn" id="excelBtn">Export Excel</button>
          <button class="btn secondary" id="csvBtn">Export CSV</button>
        </div>
      </div>

      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>Date</th>
              <th>Employee</th>
              <th>Role</th>
              <th>Department</th>
              <th>Action</th>
              <th>Severity</th>
              <th>Status</th>
              <th>View</th>
            </tr>
          </thead>
          <tbody id="logRows">
            <tr><td colspan="9">Loading logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="logModal" class="modalOverlay">
  <div class="modalCard">
    <div class="modalHead">
      <div class="modalTitle">Log Details</div>
      <button class="btn small secondary" id="closeModalBtn">Close</button>
    </div>
    <div class="modalBody">
      <div class="detailGrid" id="modalDetails"></div>
    </div>
  </div>
</div>

<script>
const API = "https://api.practiceonline.co.za";
let logs = [];
let criticalOnly = false;
const $ = id => document.getElementById(id);

function token(){return localStorage.getItem("employeeToken") || localStorage.getItem("token") || ""}
function logout(){localStorage.clear();location.href="employee-login.html"}
function esc(v){return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function show(text,type="ok"){const m=$("msg");m.textContent=text;m.className="msgBox "+type;setTimeout(()=>{m.className="msgBox"},4500)}

async function safeJson(res){try{return await res.json()}catch{return {}}}
async function fetchJson(path){
  const res = await fetch(API + path,{headers:{Authorization:"Bearer " + token()}});
  const data = await safeJson(res);
  if(!res.ok) throw new Error(data.message || "Request failed");
  return data;
}
function normaliseArray(data){if(Array.isArray(data))return data;return data.items||data.data||data.logs||data.results||[]}

async function requireEmployee(){
  if(!token()){location.href="employee-login.html";return null}
  try{
    const u = await fetchJson("/api/employees/me");
    const role = String(u.role || "").toLowerCase();
    if(!["admin","tester"].includes(role)){location.href="employee-dashboard.html";return null}
    $("userPill").textContent = `${u.fullName || u.username || "Employee"} • ${role}`;
    return u;
  }catch(e){logout();return null}
}

function normaliseDepartment(value){
  const v = String(value || "").toLowerCase().trim();
  if(v === "academic") return "academic";
  if(v === "operations") return "operations";
  if(v === "finance") return "finance";
  if(v === "support") return "support";
  if(v === "tutors" || v === "tutor") return "tutor";
  if(v === "employees" || v === "admin") return "admin";
  return v || "-";
}
function departmentLabel(value){
  const v = normaliseDepartment(value);
  if(v === "academic") return "Academic";
  if(v === "operations") return "Operations";
  if(v === "finance") return "Finance";
  if(v === "support") return "Support";
  if(v === "tutor") return "Tutor";
  if(v === "admin") return "Admin";
  return "-";
}

function normaliseLog(l,i){
  const employeeObj = l.employee || {};
  return {
    id:l._id || l.id || `log-${i}`,
    date:l.createdAt || l.date || l.timestamp || "",
    employee:employeeObj.fullName || employeeObj.username || l.fullName || l.username || l.employeeName || "Unknown",
    role:employeeObj.role || l.role || "-",
    department:normaliseDepartment(l.department || employeeObj.department),
    action:l.action || l.event || l.activity || "-",
    severity:String(l.severity || "info").toLowerCase(),
    status:l.status || "success",
    details:l.details || l.description || l.message || "",
    ipAddress:l.ipAddress || "",
    userAgent:l.userAgent || "",
    raw:l
  };
}

async function loadLogs(){
  try{
    let data;
    try{data = await fetchJson("/api/employees/logs/recent?limit=200");}
    catch(e){data = await fetchJson("/api/employees/logs");}
    logs = normaliseArray(data).map(normaliseLog);
    criticalOnly = false;
    $("severityFilter").value = "all";
    $("criticalBtn").textContent = "Critical Only";
    fillEmployeeFilter();
    updateCounts();
    renderLogs();
  }catch(e){
    console.error("Could not load logs",e);
    logs = [];
    fillEmployeeFilter();
    updateCounts();
    renderLogs();
  }
}

function fillEmployeeFilter(){
  const names = [...new Set(logs.map(l=>l.employee).filter(Boolean))].sort();
  $("employeeFilter").innerHTML = `<option value="all">All employees</option>` + names.map(n=>`<option>${esc(n)}</option>`).join("");
}

function sameDay(a,b){
  const da = new Date(a), db = new Date(b);
  if(isNaN(da.getTime()) || isNaN(db.getTime())) return false;
  return da.toDateString() === db.toDateString();
}
function formatDate(v){
  if(!v) return "-";
  const d = new Date(v);
  if(isNaN(d.getTime())) return esc(v);
  return d.toLocaleString("en-ZA");
}
function badge(text){return `<span class="badge">${esc(text || "-")}</span>`}
function severityBadge(severity){
  const s = String(severity || "info").toLowerCase();
  if(s === "critical") return badge("Critical");
  if(s === "warning") return badge("Warning");
  return badge("Info");
}
function statusBadge(status){return badge(status || "-")}

function updateCounts(){
  const today = new Date();
  const todayLogs = logs.filter(l=>sameDay(l.date,today));
  const activeEmployees = new Set(todayLogs.map(l=>l.employee).filter(Boolean));
  $("totalCount").textContent = logs.length;
  $("criticalCount").textContent = logs.filter(l=>l.severity === "critical").length;
  $("todayCount").textContent = todayLogs.length;
  $("activeCount").textContent = activeEmployees.size;
}

function getLogDate(log){const d = new Date(log.date || "");return isNaN(d.getTime()) ? null : d}
function startOfDay(d){const x = new Date(d);x.setHours(0,0,0,0);return x}
function startOfWeek(d){const x=startOfDay(d);const day=x.getDay();const diff=day===0?6:day-1;x.setDate(x.getDate()-diff);return x}
function passesDateFilter(log){
  const f = $("dateFilter").value;
  if(f === "all") return true;
  const d = getLogDate(log);
  if(!d) return false;
  const now = new Date();
  const today = startOfDay(now);
  const thisWeek = startOfWeek(now);
  const lastWeek = new Date(thisWeek);lastWeek.setDate(lastWeek.getDate()-7);
  const thisMonth = new Date(now.getFullYear(),now.getMonth(),1);
  const lastMonth = new Date(now.getFullYear(),now.getMonth()-1,1);
  const nextThisMonth = new Date(now.getFullYear(),now.getMonth()+1,1);
  if(f === "today") return d >= today;
  if(f === "thisWeek") return d >= thisWeek;
  if(f === "lastWeek") return d >= lastWeek && d < thisWeek;
  if(f === "thisMonth") return d >= thisMonth && d < nextThisMonth;
  if(f === "lastMonth") return d >= lastMonth && d < thisMonth;
  if(f === "thisYear") return d.getFullYear() === now.getFullYear();
  return true;
}

function filteredLogs(){
  const department = $("departmentFilter").value;
  const employee = $("employeeFilter").value;
  const severity = $("severityFilter").value;
  const q = $("searchBox").value.toLowerCase().trim();
  return logs.filter(l=>{
    if(criticalOnly && l.severity !== "critical") return false;
    if(department !== "all" && l.department !== department) return false;
    if(employee !== "all" && l.employee !== employee) return false;
    if(severity !== "all" && l.severity !== severity) return false;
    if(!passesDateFilter(l)) return false;
    if(q && !Object.values(l).join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderLogs(){
  const rows = filteredLogs();
  updateCounts();
  $("logRows").innerHTML = rows.length ? rows.map((l,i)=>`
    <tr>
      <td>${i + 1}</td>
      <td>${formatDate(l.date)}</td>
      <td>${esc(l.employee)}</td>
      <td>${esc(l.role)}</td>
      <td>${esc(departmentLabel(l.department))}</td>
      <td>${esc(l.action)}</td>
      <td>${severityBadge(l.severity)}</td>
      <td>${statusBadge(l.status)}</td>
      <td><button class="btn small secondary" onclick="openLogDetails('${esc(l.id)}')">View</button></td>
    </tr>
  `).join("") : `<tr><td colspan="9">No logs found.</td></tr>`;
}

function detailBox(label,value,full=false){
  return `<div class="detailBox ${full ? "fullDetail" : ""}"><div class="detailLabel">${esc(label)}</div><div class="detailValue">${esc(value || "-")}</div></div>`;
}
function openLogDetails(id){
  const log = logs.find(l=>l.id === id);
  if(!log) return;
  $("modalDetails").innerHTML = [
    detailBox("Employee",log.employee),
    detailBox("Role",log.role),
    detailBox("Department",departmentLabel(log.department)),
    detailBox("Action",log.action),
    detailBox("Severity",log.severity),
    detailBox("Status",log.status),
    detailBox("Date",formatDate(log.date)),
    detailBox("Log ID",log.id),
    detailBox("IP Address",log.ipAddress),
    detailBox("User Agent",log.userAgent,true),
    detailBox("Details",typeof log.details === "object" ? JSON.stringify(log.details,null,2) : log.details || JSON.stringify(log.raw,null,2),true)
  ].join("");
  $("logModal").classList.add("show");
}
function closeModal(){$("logModal").classList.remove("show")}

function exportRows(format){
  const rows = filteredLogs();
  if(!rows.length) return show("No logs to export.","error");
  const headers = ["No","Date","Employee","Role","Department","Action","Severity","Status","IP Address","User Agent","Details"];
  const body = rows.map((l,i)=>[i+1,formatDate(l.date),l.employee,l.role,departmentLabel(l.department),l.action,l.severity,l.status,l.ipAddress,l.userAgent,typeof l.details === "object" ? JSON.stringify(l.details) : l.details]);

  if(format === "csv"){
    const csv = [headers.join(","),...body.map(row=>row.map(c=>`"${String(c ?? "").replaceAll('"','""')}"`).join(","))].join("\n");
    const blob = new Blob([csv],{type:"text/csv"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "employee-logs.csv";
    a.click();
    URL.revokeObjectURL(url);
    return show("CSV file exported.");
  }

  const table = `<table border="1"><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${body.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  const blob = new Blob([`<html><head><meta charset="UTF-8"></head><body>${table}</body></html>`],{type:"application/vnd.ms-excel"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "employee-logs.xls";
  a.click();
  URL.revokeObjectURL(url);
  show("Excel file exported.");
}

$("criticalBtn").onclick = ()=>{criticalOnly = !criticalOnly;$("criticalBtn").textContent = criticalOnly ? "Show All" : "Critical Only";renderLogs()};
$("excelBtn").onclick = ()=>exportRows("excel");
$("csvBtn").onclick = ()=>exportRows("csv");
$("closeModalBtn").onclick = closeModal;
$("departmentFilter").onchange = renderLogs;
$("employeeFilter").onchange = renderLogs;
$("severityFilter").onchange = renderLogs;
$("dateFilter").onchange = renderLogs;
$("searchBox").oninput = renderLogs;
$("logModal").addEventListener("click",e=>{if(e.target.id === "logModal") closeModal()});

document.addEventListener("DOMContentLoaded",()=>{
  updateCounts();
  if(!token()){
    $("logRows").innerHTML = `<tr><td colspan="9">Please login again.</td></tr>`;
    return;
  }
  requireEmployee().then(user=>{if(user)loadLogs()});
});
</script>
</body>
</html>
