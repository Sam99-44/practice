<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Results | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --nav:#1b1648;
      --accent:#0b3c5d;
      --red:#e11d2e;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --radius:14px;
      --shadow:0 8px 22px rgba(0,0,0,.06);
      --focus:0 0 0 4px rgba(207,233,255,.65);
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
    a{text-decoration:none;color:inherit}

    .topbar{background:var(--nav);color:#fff;}
    .topbar-inner{
      max-width:1100px;margin:0 auto;padding:14px 18px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }

    .brand{font-weight:700;letter-spacing:.15px;}
    .nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .nav a{padding:8px 10px;border-radius:8px;color:#e7e9ff;font-weight:600;font-size:13px;}
    .nav a.active{border-bottom:3px solid var(--red);color:#fff;}
    .nav a:hover{background:rgba(255,255,255,.10)}
    .logoutBtn{
      background:transparent;
      color:#fff;
      border:1px solid rgba(255,255,255,.22);
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
    }
    .logoutBtn:hover{background:rgba(255,255,255,.08)}

    .wrap{max-width:1100px;margin:0 auto;padding:18px;}

    .controls{
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    }

    select{
      padding:8px 10px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      background:#fff;
      font-size:13px;
      font-weight:600;
      outline:none;
      min-width:160px;
    }
    select:focus{box-shadow:var(--focus);border-color:#cfe9ff;}

    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin-top:14px;
      padding:14px;
    }

    .tiles{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:12px;
    }
    @media(max-width:820px){
      .tiles{grid-template-columns:repeat(2,1fr)}
    }

    .tile{
      background:#fff;
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
    }

    .tileLabel{
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      font-weight:600;
      letter-spacing:.06em;
    }

    .tileValue{
      font-size:22px;
      font-weight:700;
      color:var(--accent);
      margin-top:2px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }

    th, td{
      padding:8px;
      border-bottom:1px solid #eee;
      text-align:left;
      vertical-align:top;
    }

    th{
      background:#f8fafc;
      font-size:11px;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:600;
      letter-spacing:.06em;
    }

    .status.pass{color:#065f46;font-weight:700;}
    .status.fail{color:#9a3412;font-weight:700;}

    .smallBtn{
      padding:6px 10px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      cursor:pointer;
      font-weight:600;
    }
    .smallBtn:hover{background:#f8fafc}

    .empty{
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
      color:var(--muted);
      font-weight:600;
    }
  </style>

  <script>
    if(!localStorage.getItem("token")){
      location.href="login.html";
    }
  </script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Practice Online</div>
    <nav class="nav">
      <a href="learner-quizzes.html">Practice</a>
      <a class="active" href="results.html">Results</a>
      <a href="support.html">Support</a>
      <a href="about.html">About</a>
      <a href="admin-quiz.html" data-admin style="display:none;">Admin</a>
      <button class="logoutBtn" id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ✅ Filters (NO Continue button) -->
  <div class="controls">
    <select id="topicFilter">
      <option value="">All Topics</option>
    </select>

    <select id="statusFilter">
      <option value="">All</option>
      <option value="pass">Pass</option>
      <option value="fail">Fail</option>
    </select>

    <select id="yearSelect">
      <option value="">All Years</option>
    </select>

    <!-- ✅ NEW: Month filter -->
    <select id="monthSelect">
      <option value="">All Months</option>
    </select>
  </div>

  <section class="section">
    <div class="tiles">
      <div class="tile">
        <div class="tileLabel">Average</div>
        <div class="tileValue" id="avgBox">0%</div>
      </div>
      <div class="tile">
        <div class="tileLabel">Attempts</div>
        <div class="tileValue" id="attemptsBox">0</div>
      </div>
      <div class="tile">
        <div class="tileLabel">Pass Rate</div>
        <div class="tileValue" id="passRateBox">0%</div>
      </div>
      <div class="tile">
        <div class="tileLabel">Best Mark</div>
        <div class="tileValue" id="bestBox">0%</div>
      </div>
    </div>
  </section>

  <section class="section" id="tableWrap">
    <div class="empty">Loading results…</div>
  </section>

</main>

<!-- ✅ IMPORTANT: include nav.js so window.API + admin visibility works -->
<script src="nav.js"></script>

<script>
const API = window.API || "https://practice-backend-msgn.onrender.com";
const token = localStorage.getItem("token");

const topicFilter = document.getElementById("topicFilter");
const statusFilter = document.getElementById("statusFilter");
const yearSelect = document.getElementById("yearSelect");
const monthSelect = document.getElementById("monthSelect");

const avgBox = document.getElementById("avgBox");
const attemptsBox = document.getElementById("attemptsBox");
const passRateBox = document.getElementById("passRateBox");
const bestBox = document.getElementById("bestBox");

let allResults = [];

document.getElementById("logoutBtn").onclick = ()=>{
  localStorage.removeItem("token");
  localStorage.removeItem("username");
  localStorage.removeItem("me_cache");
  location.href="login.html";
};

// Auto-apply filters (no Continue button)
topicFilter.addEventListener("change", renderEverything);
statusFilter.addEventListener("change", renderEverything);
yearSelect.addEventListener("change", renderEverything);
monthSelect.addEventListener("change", renderEverything);

loadResults();

async function loadResults(){
  const res = await fetch(`${API}/api/results/my`,{
    headers:{Authorization:`Bearer ${token}`}
  });

  if(res.status === 401){
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("me_cache");
    location.href="login.html";
    return;
  }

  const data = await res.json().catch(()=>[]);
  allResults = Array.isArray(data)?data:[];
  buildFilters(allResults);
  renderEverything();
}

function buildFilters(data){
  // Topics
  const topics=[...new Set(data.map(r=>r.topic||"General"))].sort((a,b)=>a.localeCompare(b));
  topicFilter.innerHTML=`<option value="">All Topics</option>`+
    topics.map(t=>`<option value="${escapeHtmlAttr(t)}">${escapeHtml(t)}</option>`).join("");

  // Years
  const years=[...new Set(data.map(r=>{
    const d=new Date(r.createdAt);
    return isNaN(d)?null:d.getFullYear();
  }).filter(Boolean))].sort((a,b)=>b-a);

  yearSelect.innerHTML=`<option value="">All Years</option>`+
    years.map(y=>`<option value="${y}">${y}</option>`).join("");

  // ✅ Months (1-12) based on available data
  const monthNums=[...new Set(data.map(r=>{
    const d=new Date(r.createdAt);
    return isNaN(d)?null:(d.getMonth()+1);
  }).filter(Boolean))].sort((a,b)=>a-b);

  monthSelect.innerHTML=`<option value="">All Months</option>`+
    monthNums.map(m=>{
      const name = new Date(2000, m-1, 1).toLocaleString(undefined,{month:"long"});
      return `<option value="${m}">${name}</option>`;
    }).join("");
}

function renderEverything(){
  const filtered=applyFilters(allResults);

  const attempts=filtered.length;
  const avg=attempts?Math.round(filtered.reduce((s,r)=>s+(Number(r.percent)||0),0)/attempts):0;
  const best=attempts?Math.max(...filtered.map(r=>Number(r.percent)||0)):0;
  const passCount=filtered.filter(r=>(Number(r.percent)||0)>=50).length;
  const passRate=attempts?Math.round((passCount/attempts)*100):0;

  avgBox.textContent=avg+"%";
  attemptsBox.textContent=attempts;
  passRateBox.textContent=passRate+"%";
  bestBox.textContent=best+"%";

  renderTable(filtered);
}

function applyFilters(data){
  const topic=topicFilter.value;
  const status=statusFilter.value;
  const year=yearSelect.value;
  const month=monthSelect.value; // ✅ NEW

  return data.filter(r=>{
    if(topic && String(r.topic||"General")!==topic) return false;

    const p = Number(r.percent)||0;
    if(status==="pass" && p<50) return false;
    if(status==="fail" && p>=50) return false;

    const d=new Date(r.createdAt);
    if(year){
      if(isNaN(d) || String(d.getFullYear())!==String(year)) return false;
    }

    // ✅ Month filter (works with or without year)
    if(month){
      if(isNaN(d) || String(d.getMonth()+1)!==String(month)) return false;
    }

    return true;
  });
}

function renderTable(data){
  const wrap=document.getElementById("tableWrap");
  if(!data.length){
    wrap.innerHTML=`<div class="empty">No results found.</div>`;
    return;
  }

  wrap.innerHTML=`
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Grade</th>
          <th>Topic</th>
          <th>Assessment</th>
          <th>Mark</th>
          <th>Status</th>
          <th>Review</th>
        </tr>
      </thead>
      <tbody>
        ${data.map(r=>{
          const d=new Date(r.createdAt);
          const dateTxt = isNaN(d) ? "" : d.toLocaleString();
          const percent = Number(r.percent)||0;
          const pass=percent>=50;
          return `
          <tr>
            <td>${escapeHtml(dateTxt)}</td>
            <td>${escapeHtml(String(r.grade??""))}</td>
            <td>${escapeHtml(String(r.topic||"General"))}</td>
            <td>${escapeHtml(String(r.title||"Assessment"))}</td>
            <td>${percent}%</td>
            <td class="status ${pass?"pass":"fail"}">${pass?"Pass":"Fail"}</td>
            <td><button class="smallBtn" type="button" onclick="location.href='review.html?resultId=${encodeURIComponent(r._id)}'">Review</button></td>
          </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
}

function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeHtmlAttr(str){
  return escapeHtml(str).replaceAll('"',"&quot;");
}
</script>

</body>
</html>
