<script>
document.addEventListener("DOMContentLoaded", () => {
  // ✅ Render backend
  const API = "https://practice-backend-msgn.onrender.com";

  const params = new URLSearchParams(window.location.search);
  const quizId = params.get("quizId");

  // Elements (now safe because DOM is loaded)
  const quizTitle = document.getElementById("quizTitle");
  const quizInfo = document.getElementById("quizInfo");
  const questionsDiv = document.getElementById("questions");
  const submitBtn = document.getElementById("submitBtn");
  const resultEl = document.getElementById("result");
  const msgEl = document.getElementById("msg");
  const metaPill = document.getElementById("metaPill");

  let quizData = null;
  let isSubmitted = false;

  // ✅ Basic guard: if elements missing, show clear error
  if (!quizTitle || !questionsDiv || !submitBtn || !msgEl) {
    document.body.innerHTML = "<h2 style='padding:20px;color:#b91c1c'>Page HTML missing required elements.</h2>";
    return;
  }

  // Welcome line
  const username = localStorage.getItem("username") || "Learner";
  const welcomeSub = document.getElementById("welcomeSub");
  if (welcomeSub) welcomeSub.textContent = `Welcome, ${username}`;

  if (!quizId) {
    quizTitle.textContent = "Quiz not found";
    msgEl.textContent = "Missing quizId in the URL.";
    msgEl.className = "error";
    submitBtn.disabled = true;
    return;
  }

  loadQuiz();

  async function loadQuiz() {
    try {
      msgEl.textContent = "Loading quiz...";
      msgEl.className = "muted";

      const res = await fetch(`${API}/api/quizzes/${encodeURIComponent(quizId)}`);
      if (!res.ok) throw new Error("Quiz not found");

      quizData = await res.json();

      quizTitle.textContent = escapeHtml(quizData.title || "Quiz");
      const topic = quizData.topic ? escapeHtml(quizData.topic) : "Maths";
      const grade = quizData.grade ?? "-";
      const count = (quizData.questions || []).length;

      quizInfo.textContent = `Grade ${grade} • ${topic} • ${count} questions`;
      metaPill.style.display = "inline-block";
      metaPill.textContent = `${count} questions`;

      renderQuestions(quizData.questions || []);

      msgEl.textContent = "";
    } catch (err) {
      console.error("loadQuiz error:", err);
      quizTitle.textContent = "Quiz not found";
      msgEl.textContent = "Could not load this quiz. Check the quizId and backend.";
      msgEl.className = "error";
      submitBtn.disabled = true;
    }
  }

  // ✅ UPDATED: supports q.imageUrl safely
  function renderQuestions(questions) {
    questionsDiv.innerHTML = questions.map((q, idx) => {
      const safeText = escapeHtml(q.text ?? "");
      const safeImage = q.imageUrl ? escapeAttr(q.imageUrl) : "";

      return `
        <div class="q" data-qindex="${idx}">
          <h3>${idx + 1}. ${safeText}</h3>

          ${safeImage ? `
            <img
              src="${safeImage}"
              alt="Question image"
              loading="lazy"
              onerror="this.style.display='none';"
              style="max-width:100%; margin:10px 0; border-radius:12px; border:1px solid #e6e6e6;"
            />
          ` : ""}

          ${(q.options || []).map((opt, j) => `
            <label class="opt">
              <input type="radio" name="q${idx}" value="${j}">
              ${escapeHtml(opt)}
            </label>
          `).join("")}
        </div>
      `;
    }).join("");
  }

  submitBtn.addEventListener("click", () => {
    if (!quizData || isSubmitted) return;

    const total = (quizData.questions || []).length;
    let score = 0;
    let answered = 0;

    quizData.questions.forEach((q, idx) => {
      const chosen = document.querySelector(`input[name="q${idx}"]:checked`);
      const options = document.querySelectorAll(`input[name="q${idx}"]`);

      // reset styles
      options.forEach((opt) => {
        const label = opt.closest("label");
        label.style.border = "1px solid #ddd";
        label.style.background = "#fff";
      });

      if (chosen) answered++;

      // paint correct answer green
      options.forEach((opt, j) => {
        if (j === q.correctIndex) {
          const label = opt.closest("label");
          label.style.border = "1px solid #16a34a";
          label.style.background = "#dcfce7";
        }
      });

      // paint chosen wrong red
      if (chosen) {
        if (Number(chosen.value) === q.correctIndex) {
          score++;
        } else {
          const wrongLabel = chosen.closest("label");
          wrongLabel.style.border = "1px solid #dc2626";
          wrongLabel.style.background = "#fee2e2";
        }
      }
    });

    if (answered < total) {
      msgEl.textContent = `Please answer all questions (${answered}/${total}).`;
      msgEl.className = "error";
      resultEl.textContent = "";
      return;
    }

    const percent = Math.round((score / total) * 100);
    resultEl.textContent = `Score: ${score}/${total} (${percent}%)`;
    msgEl.textContent = "Submitted.";
    msgEl.className = "ok";

    isSubmitted = true;
    submitBtn.textContent = "Submitted";
    submitBtn.disabled = true;
    document.querySelectorAll("input[type=radio]").forEach(r => r.disabled = true);
  });

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // ✅ for attributes like src=""
  function escapeAttr(str) {
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll('"',"&quot;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }
});
</script>
