<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password | Practice Online</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f6f7fb;
      color:#0f172a;
    }

    .card{
      max-width:520px;
      margin:50px auto;
      background:#fff;
      border:1px solid #e6e6e6;
      border-radius:14px;
      padding:20px;
    }

    h2,h3{
      margin:0 0 8px 0;
    }

    p{
      margin:6px 0 14px;
      color:#334155;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:600;
    }

    input,button{
      width:100%;
      padding:10px;
      margin-top:6px;
      border-radius:10px;
      border:1px solid #ddd;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    button{
      background:#0b3c5d;
      color:#fff;
      border:none;
      font-weight:700;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    @media(max-width:520px){
      .row{
        grid-template-columns:1fr;
      }
    }

    .msg{
      margin-top:12px;
      white-space:pre-wrap;
      font-weight:600;
    }

    .error{
      color:#b91c1c;
    }

    .ok{
      color:#065f46;
    }

    .muted{
      color:#64748b;
      font-size:12px;
      margin-top:8px;
    }

    a{
      color:#0b3c5d;
    }

    hr{
      margin:18px 0;
      border:none;
      border-top:1px solid #eee;
    }

    .hidden{
      display:none;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Forgot Password</h2>
  <p>Enter your email to receive a 6-digit code.</p>

  <div id="step1">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="Enter your email" />
    <button id="sendBtn" type="button">Send Code</button>
  </div>

  <div id="resetSection" class="hidden">
    <hr />

    <h3>Change Password</h3>
    <div class="muted">Paste the 6-digit code from your email.</div>

    <label for="code">6-digit Code</label>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="Enter code" />

    <div class="row">
      <div>
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="New password" />
      </div>
      <div>
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" />
      </div>
    </div>

    <button id="resetBtn" type="button" style="margin-top:12px;">Reset Password</button>
  </div>

  <p id="msg" class="msg"></p>

  <div class="muted">
    <a href="login.html">Back to login</a>
  </div>
</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";

  const emailInput = document.getElementById("email");
  const codeInput = document.getElementById("code");
  const newPasswordInput = document.getElementById("newPassword");
  const confirmPasswordInput = document.getElementById("confirmPassword");

  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");
  const resetSection = document.getElementById("resetSection");
  const msg = document.getElementById("msg");

  function setMsg(text, type = "") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function isValidEmail(email) {
    const e = String(email || "").trim().toLowerCase();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  }

  async function safeJson(res) {
    try {
      return await res.json();
    } catch {
      return {};
    }
  }

  sendBtn.onclick = async () => {
    const email = emailInput.value.trim().toLowerCase();

    if (!email) return setMsg("Enter your email.", "error");
    if (!isValidEmail(email)) return setMsg("Enter a valid email address.", "error");

    sendBtn.disabled = true;
    setMsg("Sending code...");

    try {
      const res = await fetch(API + "/api/forgot-password-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });

      const data = await safeJson(res);

      setMsg(
        data.message || "If the email exists, a reset code has been sent.",
        res.ok ? "ok" : "error"
      );

      if (res.ok) {
        resetSection.classList.remove("hidden");
        emailInput.readOnly = true;
        codeInput.focus();
      }
    } catch {
      setMsg("Network error. Try again.", "error");
    } finally {
      sendBtn.disabled = false;
    }
  };

  resetBtn.onclick = async () => {
    const email = emailInput.value.trim().toLowerCase();
    const code = codeInput.value.trim();
    const newPassword = newPasswordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (!email || !code || !newPassword || !confirmPassword) {
      return setMsg("Fill in the code and both password fields.", "error");
    }

    if (!isValidEmail(email)) {
      return setMsg("Enter a valid email address.", "error");
    }

    if (newPassword.length < 6) {
      return setMsg("Password must be at least 6 characters.", "error");
    }

    if (newPassword !== confirmPassword) {
      return setMsg("Passwords do not match.", "error");
    }

    resetBtn.disabled = true;
    setMsg("Resetting password...");

    try {
      const res = await fetch(API + "/api/reset-password-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, code, newPassword })
      });

      const data = await safeJson(res);

      if (res.ok) {
        setMsg(data.message || "Password reset successful. Redirecting...", "ok");
        setTimeout(() => {
          location.href = "login.html";
        }, 1500);
      } else {
        setMsg(data.message || "Reset failed.", "error");
      }
    } catch {
      setMsg("Network error. Try again.", "error");
    } finally {
      resetBtn.disabled = false;
    }
  };
</script>

</body>
</html>
