<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Review Attempt | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
      --good-bg:#dcfce7;
      --good-bd:#16a34a;
      --bad-bg:#fee2e2;
      --bad-bd:#dc2626;
      --pick-bd:#0b3c5d;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--text);}
    .wrap{max-width:1000px; margin:0 auto; padding:24px;}
    .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:12px;}
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{width:38px; height:38px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800;}
    .nav{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .nav a,.nav button{
      text-decoration:none; font-size:14px; padding:8px 12px; border-radius:10px; border:none; cursor:pointer;
    }
    .nav a{color:var(--text);}
    .nav .btn{background:var(--accent); color:#fff;}
    h1{margin:0; font-size:22px;}
    .muted{color:var(--muted);}
    .error{color:var(--error);}
    .ok{color:var(--ok);}

    .meta{
      display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;
      font-size:14px; color:var(--muted);
    }
    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #cfe9ff;
      background:#eef7ff;
      color:#0b3c5d;
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }

    .q{
      margin-top:16px; padding-top:16px; border-top:1px solid #eee;
    }
    .qtitle{font-weight:700; margin:0 0 10px 0;}
    .opt{
      display:block;
      padding:10px;
      border:1px solid #ddd;
      border-radius:10px;
      margin-bottom:8px;
      background:#fff;
    }
    .opt.correct{
      border-color:var(--good-bd);
      background:var(--good-bg);
    }
    .opt.wrongPick{
      border-color:var(--bad-bd);
      background:var(--bad-bg);
    }
    .opt.picked{
      outline:2px solid var(--pick-bd);
      outline-offset:2px;
    }

    .empty{
      margin-top:12px;
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
    }
  </style>

  <script>
    const t = localStorage.getItem("token");
    if (!t) window.location.href = "login.html";
  </script>
</head>

<body>
  <div class="wrap">

    <div class="topbar">
      <div class="brand">
        <div class="logo">PO</div>
        <div>
          <strong>Practice Online</strong>
          <div class="muted" id="welcomeSub">Review Attempt</div>
        </div>
      </div>

      <div class="nav">
        <a href="results.html">Back to Results</a>
        <a href="learner-quizzes.html">Practice</a>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start;">
        <div>
          <h1 id="title">Loading…</h1>
          <div class="meta" id="meta"></div>
        </div>
        <div>
          <span class="pill" id="scorePill">—</span>
        </div>
      </div>

      <p id="status" class="muted" style="margin:10px 0 0 0;"></p>

      <div id="answersWrap"></div>
    </div>

  </div>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";
    const token = localStorage.getItem("token");
    const username = localStorage.getItem("username") || "Learner";
    document.getElementById("welcomeSub").textContent = `Welcome, ${username}`;

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      window.location.href = "login.html";
    };

    const params = new URLSearchParams(location.search);
    const resultId = params.get("resultId");

    const titleEl = document.getElementById("title");
    const metaEl = document.getElementById("meta");
    const scorePill = document.getElementById("scorePill");
    const statusEl = document.getElementById("status");
    const answersWrap = document.getElementById("answersWrap");

    if (!resultId) {
      titleEl.textContent = "Attempt not found";
      statusEl.className = "error";
      statusEl.textContent = "Missing resultId in the URL.";
    } else {
      loadReview();
    }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function loadReview(){
      try{
        statusEl.className = "muted";
        statusEl.textContent = "Loading attempt…";

        const res = await fetch(`${API}/api/results/${encodeURIComponent(resultId)}`, {
          headers: { Authorization: "Bearer " + token }
        });

        if (res.status === 401) {
          localStorage.removeItem("token");
          window.location.href = "login.html";
          return;
        }

        if (!res.ok) {
          const txt = await res.text().catch(()=> "");
          throw new Error(txt || `Request failed (HTTP ${res.status})`);
        }

        const r = await res.json();

        const quizTitle = r.title || "Quiz";
        const topic = r.topic || "General";
        const grade = r.grade ?? "-";
        const dateStr = r.createdAt ? new Date(r.createdAt).toLocaleString() : "-";
        const timeTaken = Number(r.timeTakenSeconds || 0);

        titleEl.textContent = quizTitle;

        metaEl.innerHTML = `
          <span>Grade <b>${esc(grade)}</b></span>
          <span>• Topic <b>${esc(topic)}</b></span>
          <span>• Date <b>${esc(dateStr)}</b></span>
          <span>• Time Taken <b>${esc(timeTaken)}s</b></span>
        `;

        scorePill.textContent = `${r.score}/${r.total} (${r.percent}%) • ${r.status}`;

        const answers = Array.isArray(r.answers) ? r.answers : [];
        if (answers.length === 0) {
          statusEl.className = "error";
          statusEl.textContent = "No saved answers found for this attempt (older attempt or answers not saved).";
          answersWrap.innerHTML = `
            <div class="empty">
              <b>Nothing to review.</b>
              <div class="muted" style="margin-top:6px;">
                Try submitting a new quiz attempt after updating attempt.html (answers saving).
              </div>
            </div>
          `;
          return;
        }

        statusEl.textContent = "";

        answersWrap.innerHTML = answers
          .sort((a,b) => (a.questionIndex ?? 0) - (b.questionIndex ?? 0))
          .map((a, idx) => {
            const qText = a.questionText || `Question ${idx + 1}`;
            const opts = Array.isArray(a.options) ? a.options : [];
            const chosen = Number(a.chosenIndex);
            const correct = Number(a.correctIndex);

            return `
              <div class="q">
                <div class="qtitle">${esc((a.questionIndex ?? idx) + 1)}. ${esc(qText)}</div>

                ${opts.map((opt, j) => {
                  const isCorrect = j === correct;
                  const isChosen = j === chosen;

                  let cls = "opt";
                  if (isCorrect) cls += " correct";
                  if (isChosen && !isCorrect) cls += " wrongPick";
                  if (isChosen) cls += " picked";

                  let tag = "";
                  if (isCorrect && isChosen) tag = `<span class="muted"> ✅ Your answer (Correct)</span>`;
                  else if (isCorrect) tag = `<span class="muted"> ✅ Correct</span>`;
                  else if (isChosen) tag = `<span class="muted"> ❌ Your answer</span>`;

                  return `<div class="${cls}">${esc(opt)}${tag}</div>`;
                }).join("")}
              </div>
            `;
          }).join("");

      }catch(err){
        statusEl.className = "error";
        statusEl.textContent = "Could not load review: " + (err.message || "");
      }
    }
  </script>
</body>
</html>
