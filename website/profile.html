<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Profile | Practice Online</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#222222;
  --muted:#5f6b7a;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{text-decoration:none;color:inherit}
button,input{font:inherit}

.topbar{
  background:var(--nav);
  color:#fff;
}

.topbar-inner{
  max-width:1150px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
}

.brand{font-weight:800}
.brand small{display:block;font-size:12px;opacity:.9}

.nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.nav a{
  padding:8px 10px;
  border-radius:8px;
  color:#eef2ff;
  font-weight:700;
  font-size:13px;
}

.nav a:hover{
  background:rgba(255,255,255,.08);
}

.nav a.active{
  border-bottom:3px solid var(--red);
}

.logoutBtn{
  background:transparent;
  border:1px solid rgba(255,255,255,.28);
  color:#fff;
  padding:8px 14px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.wrap{
  max-width:1150px;
  margin:0 auto;
  padding:18px;
}

.hero{
  background:linear-gradient(180deg,#eef6ff 0%, #f8fbff 100%);
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
  display:grid;
  grid-template-columns:92px 1fr auto;
  gap:18px;
  align-items:center;
  margin-bottom:16px;
}

.profilePhoto{
  width:92px;
  height:92px;
  border-radius:50%;
  object-fit:cover;
  background:#dbe4f0;
}

.profileInitials{
  width:92px;
  height:92px;
  border-radius:50%;
  background:#dbe4f0;
  color:#1b1648;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:800;
}

.hidden{display:none !important}

.heroText h1{
  margin:0;
  font-size:26px;
  color:var(--nav);
}

.heroText p{
  margin-top:4px;
  font-size:14px;
  color:var(--muted);
}

.btn{
  padding:10px 14px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  background:#fff;
  font-weight:800;
  cursor:pointer;
}

/* 🔥 ICON GRID */
.quickGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:16px;
}

.quickCard{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  transition:.16s ease;
}

.quickCard:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(15,23,42,.06);
}

.quickIcon{
  margin-bottom:10px;
}

.quickIcon img,
.quickIcon svg{
  width:28px;
  height:28px;
}

.icon-dark{filter:brightness(0)}
.icon-blue{
  filter: invert(48%) sepia(80%) saturate(1200%) hue-rotate(190deg);
}
.icon-gold{filter:none !important}
.icon-color{filter:none !important}

.quickCard h3{
  margin:0 0 6px;
  font-size:15px;
  color:var(--nav);
}

.quickCard p{
  margin:0;
  font-size:13px;
  color:var(--muted);
}

/* sections unchanged */
.mainGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
}

.sectionHead{
  padding:16px;
  border-bottom:1px solid var(--border);
}

.sectionBody{padding:0 16px}

.row{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid #edf2f7;
}

.row:last-child{border-bottom:none}

.label{color:var(--muted)}
.value{font-weight:700}
</style>

<script>
if(!localStorage.getItem("token")){
  location.href="login.html";
}
</script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      Practice Online
      <small>Progress Dashboard</small>
    </div>

    <nav class="nav">
      <a href="profile.html" class="active">Profile</a>
      <a href="learner-quizzes.html">Practice</a>
      <a href="results.html">Results</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="support.html">Support</a>
      <a href="announcements.html">Announcements</a>
      <button class="logoutBtn" id="logoutBtn">Logout</button>
    </nav>
  </div>
</header>

<main class="wrap">

<section class="hero">
  <div id="profileInitials" class="profileInitials">U</div>

  <div class="heroText">
    <h1 id="displayName">Loading...</h1>
    <p id="displayRole">Loading profile...</p>
  </div>

  <button class="btn" onclick="location.href='learner-quizzes.html'">
    Open Practice
  </button>
</section>

<section class="quickGrid">

<a class="quickCard" href="learner-quizzes.html">
  <div class="quickIcon">
    <svg class="icon-dark" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15"></path>
    </svg>
  </div>
  <h3>Practice</h3>
</a>

<a class="quickCard" href="results.html">
  <div class="quickIcon">
    <img class="icon-blue" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/results_qgdct1.svg">
  </div>
  <h3>Results</h3>
</a>

<a class="quickCard" href="dashboard.html">
  <div class="quickIcon">
    <img class="icon-dark" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg">
  </div>
  <h3>Dashboard</h3>
</a>

<a class="quickCard" href="leaderboard.html">
  <div class="quickIcon">
    <img class="icon-gold" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777661/leaderboard_yfjgjf.svg">
  </div>
  <h3>Leaderboard</h3>
</a>

<a class="quickCard" href="support.html">
  <div class="quickIcon">
    <img class="icon-dark" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/support_bs175s.svg">
  </div>
  <h3>Support</h3>
</a>

<a class="quickCard" href="announcements.html">
  <div class="quickIcon">
    <img class="icon-color" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/announcement_gg5tqs.svg">
  </div>
  <h3>Announcements</h3>
</a>

</section>

</main>

<script src="nav.js"></script>

<script>
document.getElementById("logoutBtn").onclick = () => {
  localStorage.clear();
  location.href = "login.html";
};
</script>

</body>
</html>
