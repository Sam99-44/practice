<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Practice Online</title>

  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#0f172a}
    .card{max-width:420px;margin:60px auto;background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:20px}
    h2{margin:0 0 6px}
    p{margin:6px 0 14px;color:#334155}
    label{display:block;margin-top:12px;font-weight:600}
    input,button{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
    button{background:#0b3c5d;color:#fff;border:none;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:12px;white-space:pre-wrap}
    .error{color:#b91c1c}
    .ok{color:#065f46}
    .links{display:flex;justify-content:space-between;margin-top:12px;font-size:14px}
    a{color:#0b3c5d;text-decoration:none}
  </style>
</head>
<body>

<div class="card">
  <h2>Login</h2>
  <p>Enter your email and password</p>

  <label>Email</label>
  <input id="email" type="email" placeholder="you@gmail.com" autocomplete="email" />

  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password" />

  <button id="loginBtn" type="button">Login</button>

  <p id="msg" class="msg"></p>

  <div class="links">
    <a href="register.html">Create account</a>
    <a href="reset-otp.html">Forgot password?</a>
  </div>
</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";

  const loginBtn = document.getElementById("loginBtn");
  const msg = document.getElementById("msg");

  function setMsg(text, type="") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  async function safeJson(res){
    try { return await res.json(); } catch { return {}; }
  }

  loginBtn.onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      return setMsg("Email and password are required.", "error");
    }

    loginBtn.disabled = true;
    setMsg("Logging in...");

    try {
      const res = await fetch(API + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await safeJson(res);

      if (res.ok) {
        setMsg("Login successful ✅ Redirecting...", "ok");

        // store token (for dashboard later)
        localStorage.setItem("authToken", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        // redirect (change later if needed)
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } else {
        setMsg((data.message || "Login failed.") + ` (HTTP ${res.status})`, "error");
        loginBtn.disabled = false;
      }
    } catch (e) {
      setMsg("Network error. Try again.", "error");
      loginBtn.disabled = false;
    }
  };

  setMsg("Ready ✅", "ok");
</script>

</body>
</html>
