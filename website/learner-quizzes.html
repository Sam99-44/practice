<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Practice | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --easy:#22c55e;
  --moderate:#3b82f6;
  --hard:#ef4444;
  --track:#e9eef5;
  --bar:#1b1648;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

/* ===== TOPBAR ===== */
.topbar{
  background:var(--nav);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
  font-family:Arial, Helvetica, sans-serif;
}
.topbar-inner{
  max-width:1150px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.accountLeft{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  cursor:default;
  user-select:none;
}
.accountIconWrap{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.accountIcon{
  width:40px;
  height:40px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}
.accountMeta{min-width:0;line-height:1.1}
.accountName{
  font-size:16px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
}
.accountType{
  font-size:13px;
  color:#e0e7ff;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
  text-transform:capitalize;
}
.topbarRight{
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
}
.iconBtn{
  min-width:50px;
  height:50px;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:0 4px;
}
.iconBtn img{
  width:30px;
  height:30px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}
.bellBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.navBadge{
  min-width:auto;
  height:auto;
  padding:0;
  margin-left:2px;
  background:transparent;
  color:#ffd6db;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}
.menuBtn{
  min-width:auto;
  height:50px;
  padding:0;
  gap:8px;
  border:none;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.menuBtnText{
  font-size:10px;
  font-weight:700;
  color:#fff;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
  top:-1px;
}
.menuBtn img{
  width:28px;
  height:28px;
  filter:brightness(0) invert(1) contrast(180%);
  display:block;
}
.menuDropdown{
  position:absolute;
  top:48px;
  right:0;
  width:210px;
  background:#f7f7f8;
  color:#111827;
  border:1px solid #d9dee7;
  border-radius:16px;
  box-shadow:0 14px 30px rgba(15,23,42,.14);
  padding:10px 0;
  display:none;
  font-family:Arial, Helvetica, sans-serif;
}
.menuDropdown.open{display:block}
.menuItem{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 18px;
  color:#111827;
  font-size:10px;
  font-weight:700;
  background:transparent;
  border:none;
  text-align:left;
  cursor:pointer;
}
.menuItem:hover{background:#eef2f7}
.menuItem img{
  width:18px;
  height:18px;
  display:block;
  flex-shrink:0;
}
.menuItem.profileTextOnly{padding-left:38px}
.menuDivider{
  height:1px;
  background:#dde4ec;
  margin:8px 0 6px;
}
.logoutMenuBtn{
  width:100%;
  border:none;
  background:transparent;
  cursor:pointer;
  text-align:left;
}

/* ===== PAGE ===== */
.wrap{
  max-width:1150px;
  margin:0 auto;
  padding:18px;
}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
}
.cardHead{
  padding:18px;
  border-bottom:1px solid var(--border);
}
h1{
  font-size:22px;
  margin:0;
  color:var(--nav);
}
.muted{
  font-size:10px;
  color:var(--muted);
  margin-top:5px;
}
.controls{
  padding:14px 18px;
  display:grid;
  grid-template-columns:1fr 160px 140px 150px;
  gap:10px;
}
.searchWrap{position:relative}
.searchWrap svg{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  color:#64748b;
  pointer-events:none;
}
input,select{
  font-size:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  width:100%;
  outline:none;
  background:#fff;
}
#search{padding-left:38px}
.filters{
  padding:0 18px;
  display:flex;
  gap:22px;
  border-bottom:1px solid #eee;
}
.fbtn{
  background:none;
  border:none;
  font-size:13px;
  cursor:pointer;
  position:relative;
  padding:10px 0;
  color:#64748b;
}
.fbtn::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-2px;
  height:3px;
  transform:scaleX(0);
  transition:.2s;
}
.fbtn[data-diff="easy"]::after{background:var(--easy)}
.fbtn[data-diff="moderate"]::after{background:var(--moderate)}
.fbtn[data-diff="hard"]::after{background:var(--hard)}
.fbtn[data-diff="all"]::after{background:#94a3b8}
.fbtn.active::after{transform:scaleX(1)}

.topic-wrap{
  padding:18px;
}
.topic-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  content-visibility:auto;
  contain-intrinsic-size:260px;
}
.topic-top{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:flex-start;
}
.topic-title{
  font-size:13px;
  font-weight:400;
  color:#0f172a;
  font-family:Arial, Helvetica, sans-serif;
}
.topic-stats{
  display:flex;
  flex-direction:column;
  gap:3px;
  font-size:12px;
  color:#475569;
  font-family:Arial, Helvetica, sans-serif;
  align-items:flex-start;
}
.progressWrap{
  margin-top:10px;
}
.progressLabels{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
  font-size:12px;
  color:#475569;
  font-family:Arial, Helvetica, sans-serif;
}
.progressTrack{
  width:100%;
  height:8px;
  background:var(--track);
  border-radius:999px;
  overflow:hidden;
}
.progressBar{
  height:100%;
  background:var(--bar);
  border-radius:999px;
  width:0%;
}

.quiz-squares{
  display:flex;
  gap:6px;
  margin-top:12px;
  flex-wrap:wrap;
}
.quiz-square{
  width:46px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}
.quiz-icon-wrap{
  position:relative;
  width:36px;
  height:40px;
}
.quiz-fill{
  position:absolute;
  left:6px;
  top:6px;
  width:24px;
  height:28px;
  border-radius:3px;
  z-index:1;
}
.quiz-square.pass .quiz-fill{background:#dcfce7}
.quiz-square.fail .quiz-fill{background:#fee2e2}
.quiz-square-base{
  position:absolute;
  inset:0;
  border:2px solid #111827;
  border-radius:3px;
  background:#fff;
  z-index:2;
}
.quiz-mark,.quiz-q{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:3;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:700;
  line-height:1;
  pointer-events:none;
}
.quiz-square.pass .quiz-mark{color:#166534}
.quiz-square.fail .quiz-mark{color:#b91c1c}
.quiz-mark{font-size:9px}
.quiz-q{
  font-size:10px;
  color:#0f172a;
}
.quiz-number{
  font-family:Arial, Helvetica, sans-serif;
  font-size:9px;
  text-align:center;
  margin-top:2px;
  color:#475569;
}

.first-topic-shell{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}
.first-topic-title{
  width:240px;
  max-width:58%;
  height:16px;
  border-radius:8px;
  background:#eef2f7;
}
.first-topic-meta{
  width:220px;
  max-width:52%;
  height:12px;
  border-radius:8px;
  background:#f1f5f9;
  margin-top:10px;
}
.first-topic-progress{
  width:100%;
  height:8px;
  border-radius:999px;
  background:#eef2f7;
  margin-top:16px;
}
.first-topic-squares{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}
.first-topic-square{
  width:36px;
  height:40px;
  border-radius:4px;
  background:#f1f5f9;
}
.empty{
  font-size:10px;
  color:var(--muted);
  padding:8px 0;
}
.rendering-note{
  font-size:13px;
  color:var(--muted);
  padding-top:8px;
}
.defer-list{
  min-height:20px;
}
.defer-toggle{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:0 12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:10px;
  font-weight:700;
  cursor:pointer;
}
.defer-toggle:hover{background:#f9fafb}

@media (max-width:900px){
  .controls{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .controls{grid-template-columns:1fr}
  .topbar-inner{padding:12px 14px}
  .accountName,.accountType{max-width:120px}
  .menuDropdown{width:200px}
  .menuBtnText{display:none}
}
</style>

<script>
if(!localStorage.getItem("token")){
  location.href="login.html";
}
</script>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="accountLeft">
      <div class="accountIconWrap">
        <img
          class="accountIcon"
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
          alt="Account"
          loading="eager"
          decoding="async"
        >
      </div>

      <div class="accountMeta">
        <div class="accountName" id="topAccountName">Loading...</div>
        <div class="accountType" id="topAccountType">Account</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="announcements.html" class="iconBtn bellBtn" title="Announcements" aria-label="Announcements">
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="Announcements" loading="eager" decoding="async">
        <span class="navBadge" id="navAnnouncementBadge">0</span>
      </a>

      <button class="menuBtn" id="menuToggleBtn" title="Menu" aria-label="Menu" type="button">

          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="">

<div class="wrap">
  <div class="card">
    <div class="cardHead">
      <h1>Practice</h1>
      <div class="muted" id="gradeText">Loading...</div>
    </div>

    <div class="controls">
      <div class="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>

        </svg>

      </div>

      <select id="topicFilter">
        <option value="all">All Topics</option>
      </select>

        <div class="first-topic-squares">
          <div class="first-topic-square"></div><div class="first-topic-square"></div><div class="first-topic-square"></div>
          <div class="first-topic-square"></div>

<script>
const API = "https://practice-backend-msgn.onrender.com";
const token = localStorage.getItem("token");

const topAccountName = document.getElementById("topAccountName");
const topAccountType = document.getElementById("topAccountType");
const menuToggleBtn = document.getElementById("menuToggleBtn");
const menuDropdown = document.getElementById("menuDropdown");
const logoutBtn = document.getElementById("logoutBtn");

const searchEl = document.getElementById("search");
const topicFilter = document.getElementById("topicFilter");
const paperFilter = document.getElementById("paperFilter");
const periodFilter = document.getElementById("periodFilter");
const quizListEl = document.getElementById("quizList");

let quizzes = [];
let resultsMap = {};
let diff = "all";
let renderToken = 0;
let groupedByTopic = [];
let filterTimer = null;
let lastRenderedGroups = [];
let manualExpand = false;

if(logoutBtn){
  logoutBtn.onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("me_cache");
    localStorage.removeItem("user");
    localStorage.removeItem("role");
    location.href = "login.html";
  };
}

if(menuToggleBtn && menuDropdown){
  menuToggleBtn.addEventListener("click", function(e){
    e.stopPropagation();
    menuDropdown.classList.toggle("open");
  });

  document.addEventListener("click", function(e){
    if(!menuDropdown.contains(e.target) && !menuToggleBtn.contains(e.target)){
      menuDropdown.classList.remove("open");
    }
  });
}

async function loadTopbarProfile(){
  try{
    const res = await fetch(`${API}/api/profile/me`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if(res.status === 401){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      location.href = "login.html";
      return;
    }

    const data = await res.json();
    topAccountName.textContent = data.fullName || data.username || "User";
    topAccountType.textContent = data.accountType || data.role || "Account";
  }catch(err){
    topAccountName.textContent = "User";
    topAccountType.textContent = "Account";
  }
}

async function loadTopbarAnnouncementCount(){
  try{
    const res = await fetch(`${API}/api/announcements/profile-summary`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    const data = await res.json().catch(() => ({}));
    document.getElementById("navAnnouncementBadge").textContent = Number(data.count || 0);
  }catch(err){
    document.getElementById("navAnnouncementBadge").textContent = "0";
  }
}

function getState(id){
  const r = resultsMap[id];
  if(!r) return {type:"new"};

  const score = Number(r.score || 0);
  const total = Number(r.total || 0);
  const percent = total ? Math.round((score / total) * 100) : Math.round(Number(r.percent || 0));

  return {
    type:"done",
    score: percent + "%",
    state: percent >= 50 ? "pass" : "fail",
    percent
  };
}

function isWithinPeriod(ts, period){
  if(period === "all") return true;
  if(!ts) return false;

  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

  if(period === "today") return ts >= todayStart;

  if(period === "week"){
    const today = new Date(todayStart);
    const day = today.getDay();
    const diffToMonday = (day === 0 ? 6 : day - 1);
    today.setDate(today.getDate() - diffToMonday);
    return ts >= today.getTime();
  }

  if(period === "month"){
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    return ts >= monthStart;
  }

  return true;
}

function preprocessQuizzes(rawQuizzes){
  return rawQuizzes.map(q => {
    const createdTime = q.createdAt ? new Date(q.createdAt).getTime() : 0;
    const updatedTime = q.updatedAt ? new Date(q.updatedAt).getTime() : 0;
    return {
      ...q,
      _topic: q.topic || "General",
      _titleLower: String(q.title || "").toLowerCase(),
      _topicLower: String(q.topic || "").toLowerCase(),
      _paperLower: String(q.paper || "").toLowerCase(),
      _difficultyLower: String(q.difficulty || "").toLowerCase(),
      _timeValue: createdTime || updatedTime || 0
    };
  });
}

function rebuildGroupedTopics(){
  const groups = {};
  for(const q of quizzes){
    const topic = q._topic;
    if(!groups[topic]) groups[topic] = [];
    groups[topic].push(q);
  }

  groupedByTopic = Object.keys(groups)
    .sort((a, b) => a.localeCompare(b))
    .map(topic => ({
      topic,
      quizzes: groups[topic].sort((a, b) => a._timeValue - b._timeValue)
    }));
}

function apply(){
  const q = searchEl.value.toLowerCase().trim();
  const selectedTopic = topicFilter.value;
  const selectedPaper = paperFilter.value;
  const selectedPeriod = periodFilter.value;
  const selectedDiff = diff;

  const filteredGroups = groupedByTopic
    .map(group => {
      const filteredQuizzes = group.quizzes.filter(x => {
        const matchesSearch = !q || x._titleLower.includes(q) || x._topicLower.includes(q);
        const matchesTopic = selectedTopic === "all" || x._topic === selectedTopic;
        const matchesPaper = selectedPaper === "all" || x._paperLower === selectedPaper;
        const matchesDiff = selectedDiff === "all" || x._difficultyLower === selectedDiff;
        const matchesPeriod = isWithinPeriod(x._timeValue, selectedPeriod);
        return matchesSearch && matchesTopic && matchesPaper && matchesDiff && matchesPeriod;
      });

      if(!filteredQuizzes.length) return null;
      return { topic: group.topic, quizzes: filteredQuizzes };
    })
    .filter(Boolean);

  manualExpand = false;
  lastRenderedGroups = filteredGroups;
  requestAnimationFrame(() => render(filteredGroups));
}

function getTopicStats(topicQuizzes){
  const attempted = topicQuizzes.filter(q => resultsMap[q._id]);
  const completed = attempted.length;
  const total = topicQuizzes.length;
  const progress = total ? Math.round((completed / total) * 100) : 0;

  let avg = 0;
  if(completed){
    const sum = attempted.reduce((acc, q) => {
      const r = resultsMap[q._id];
      const score = Number(r.score || 0);
      const totalMarks = Number(r.total || 0);
      const percent = totalMarks ? Math.round((score / totalMarks) * 100) : Math.round(Number(r.percent || 0));
      return acc + percent;
    }, 0);
    avg = Math.round(sum / completed);
  }

  return {completed, total, progress, avg};
}

function buildTopicCard(topic, topicQuizzes){
  const stats = getTopicStats(topicQuizzes);

  return `
    <div class="topic-card">
      <div class="topic-top">
        <div class="topic-title">${escapeHtml(topic)}</div>
        <div class="topic-stats">
          <span>Average: ${stats.avg}%</span>
          <span>Completed: ${stats.completed}/${stats.total}</span>
        </div>
      </div>

      <div class="progressWrap">
        <div class="progressLabels">
          <span>Progress</span>
          <span>${stats.progress}%</span>
        </div>
        <div class="progressTrack">
          <div class="progressBar" style="width:${stats.progress}%"></div>
        </div>
      </div>

      <div class="quiz-squares">
        ${topicQuizzes.map((q, i) => {
          const s = getState(q._id);
          return `
          <div class="quiz-square ${s.state || ""}" data-quiz-id="${encodeURIComponent(q._id || "")}">
            <div class="quiz-icon-wrap">
              <div class="quiz-fill"></div>
              <div class="quiz-square-base" aria-hidden="true"></div>
              ${
                s.type === "new"
                  ? `<div class="quiz-q">?</div>`
                  : `<div class="quiz-mark">${escapeHtml(s.score)}</div>`
              }
            </div>
            <div class="quiz-number">${i + 1}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

function appendTopicBatch(cards, tokenValue, startIndex, targetEl){
  if(tokenValue !== renderToken || !targetEl) return;

  const batchSize = 2;
  const nextCards = cards.slice(startIndex, startIndex + batchSize);

  if(!nextCards.length){
    const note = targetEl.querySelector(".rendering-note");
    if(note) note.remove();
    return;
  }

  const fragment = document.createRange().createContextualFragment(nextCards.join(""));
  const note = targetEl.querySelector(".rendering-note");

  if(note){
    targetEl.insertBefore(fragment, note);
  }else{
    targetEl.appendChild(fragment);
  }

  const nextIndex = startIndex + batchSize;

  if(nextIndex < cards.length){
    if(note){
      note.textContent = `Loading more topics... ${nextIndex}/${cards.length}`;
    }

    const scheduleNext = window.requestIdleCallback
      ? (cb) => requestIdleCallback(cb, { timeout: 200 })
      : (cb) => setTimeout(cb, 40);

    scheduleNext(() => appendTopicBatch(cards, tokenValue, nextIndex, targetEl));
  }else{
    const latestNote = targetEl.querySelector(".rendering-note");
    if(latestNote) latestNote.remove();
  }
}

function render(groups){
  renderToken += 1;
  const tokenValue = renderToken;

  if(!groups.length){
    quizListEl.innerHTML = `<div class="empty">No assessments found.</div>`;
    return;
  }

  const firstGroup = groups[0];
  const remainingGroups = groups.slice(1);
  const firstCardHtml = buildTopicCard(firstGroup.topic, firstGroup.quizzes);
  const remainingCards = remainingGroups.map(group => buildTopicCard(group.topic, group.quizzes));

  let deferredHtml = '';
  if(remainingCards.length){
    deferredHtml = `
      <div class="defer-list" id="deferList">
        <button class="defer-toggle" id="showMoreTopicsBtn" type="button">
          Show more topics (${remainingCards.length})
        </button>
      </div>
    `;
  }

  quizListEl.innerHTML = firstCardHtml + deferredHtml;

  if(remainingCards.length && !manualExpand){
    const scheduleExpand = (cb) => setTimeout(cb, 900);

    scheduleExpand(() => {
      if(tokenValue !== renderToken) return;
      const deferList = document.getElementById('deferList');
      if(!deferList) return;
      deferList.innerHTML = `<div class="rendering-note">Loading more topics... 0/${remainingCards.length}</div>`;
      appendTopicBatch(remainingCards, tokenValue, 0, deferList);
    });
  }
}

function expandRemainingTopicsNow(){
  if(!lastRenderedGroups.length || lastRenderedGroups.length < 2) return;
  manualExpand = true;
  const tokenValue = renderToken;
  const remainingCards = lastRenderedGroups.slice(1).map(group => buildTopicCard(group.topic, group.quizzes));
  const deferList = document.getElementById('deferList');
  if(!deferList) return;
  deferList.innerHTML = `<div class="rendering-note">Loading more topics... 0/${remainingCards.length}</div>`;
  appendTopicBatch(remainingCards, tokenValue, 0, deferList);
}

function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.querySelectorAll(".fbtn").forEach(b => {
  b.onclick = () => {
    diff = b.dataset.diff;
    document.querySelectorAll(".fbtn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    apply();
  };
});

searchEl.oninput = () => {
  clearTimeout(filterTimer);
  filterTimer = setTimeout(apply, 180);
};

topicFilter.onchange = apply;
paperFilter.onchange = apply;
periodFilter.onchange = apply;

quizListEl.addEventListener("click", function(e){
  const showMoreBtn = e.target.closest("#showMoreTopicsBtn");
  if(showMoreBtn){
    expandRemainingTopicsNow();
    return;
  }

  const square = e.target.closest(".quiz-square[data-quiz-id]");
  if(!square) return;
  const quizId = square.dataset.quizId;
  if(!quizId) return;
  location.href = `attempt.html?quizId=${quizId}`;
});

async function loadPage(){
  try{
    const headers = { Authorization: `Bearer ${token}` };

    const [meRes, quizzesRes, resultsRes] = await Promise.all([
      fetch(`${API}/api/auth/me`, { headers }),
      fetch(`${API}/api/quizzes`, { headers }),
      fetch(`${API}/api/results/my`, { headers })
    ]);

    if(meRes.status === 401){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      location.href = "login.html";
      return;
    }

    const me = await meRes.json().catch(() => ({}));
    document.getElementById("gradeText").textContent = "Grade: " + (me.grade || "-");

    const rawQuizzes = await quizzesRes.json().catch(() => []);
    quizzes = Array.isArray(rawQuizzes) ? preprocessQuizzes(rawQuizzes) : [];

    const results = await resultsRes.json().catch(() => []);
    const safeResults = Array.isArray(results) ? results : [];

    resultsMap = {};
    safeResults.forEach(r => {
      const id = r.quizId?._id || r.quizId;
      if(id) resultsMap[id] = r;
    });

    rebuildGroupedTopics();

    const topics = [...new Set(quizzes.map(q => q._topic).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));

    topicFilter.innerHTML =
      `<option value="all">All Topics</option>` +
      topics.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");

    apply();
  }catch(err){
    quizListEl.innerHTML = `<div class="empty">Could not load quizzes.</div>`;
  }
}

loadTopbarProfile();
loadTopbarAnnouncementCount();
loadPage();
</script>
