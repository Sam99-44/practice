<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --blue:#0b3c5d;
  --blueDark:#082f49;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --danger:#dc2626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Times New Roman", Times, serif;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
}

.topbar{
  background:var(--nav);
  color:#fff;
  padding:12px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:40px;
  height:40px;
  filter:brightness(0) invert(1);
}

.brand h2{
  font-size:16px;
  font-weight:700;
}

.brand p{
  font-size:13px;
  margin-top:2px;
  color:#e0e7ff;
}

.page{
  min-height:calc(100vh - 64px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
}

.loginCard{
  width:100%;
  max-width:500px;
  background:#fff;
  border:1px solid var(--border);
  padding:36px;
  text-align:center;
}

.heroBird{
  width:220px;
  max-width:100%;
  display:block;
  margin:0 auto 10px;
}

.loginCard h1{
  font-size:25px;
  margin-bottom:6px;
  color:#0f172a;
}

.intro{
  font-size:14px;
  color:var(--muted);
  margin-bottom:24px;
}

.formArea{
  text-align:left;
}

.error{
  display:none;
  margin-bottom:16px;
  background:#fef2f2;
  color:var(--danger);
  padding:12px;
  border:1px solid #fecaca;
  font-size:14px;
  text-align:left;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:700;
  color:#111827;
}

input{
  width:100%;
  height:45px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:0;
  margin-bottom:16px;
  font-size:15px;
  background:#fff;
}

input:focus{
  outline:none;
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(11,60,93,.08);
}

.btn{
  width:100%;
  height:47px;
  border:none;
  border-radius:0;
  background:var(--blue);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.btn:hover{
  background:var(--blueDark);
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.footerLinks{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:18px;
}

.footerLinks a{
  color:var(--blue);
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.securityNote{
  margin-top:22px;
  border:1px solid var(--border);
  background:#f8fafc;
  padding:12px;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
  text-align:left;
}

@media(max-width:520px){
  .topbar{
    padding:12px 14px;
  }

  .loginCard{
    padding:24px 18px;
  }

  .heroBird{
    width:170px;
  }

  .footerLinks{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg" alt="">
    <div>
      <h2>Practice Online</h2>
      <p>Employee Portal</p>
    </div>
  </div>
</header>

<main class="page">

  <div class="loginCard">

    <img
      class="heroBird"
      src="https://res.cloudinary.com/dopoxadlr/image/upload/v1781711717/bird_ijxmjp.svg"
      alt="Practice Online"
    >

    <h1>Welcome Back</h1>
    

    <div class="error" id="errorBox"></div>

    <form id="loginForm" class="formArea">

      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" class="btn" id="loginBtn">
        Login
      </button>

    </form>

    <div class="footerLinks">
      <a href="../forgot-password.html">Forgot Password?</a>
      <a href="../index.html">Back Home</a>
    </div>


   
    </div>

  </div>

</main>

<script>
const API = "https://api.practiceonline.co.za";

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("errorBox");
const loginBtn = document.getElementById("loginBtn");

function showError(message){
  errorBox.style.display = "block";
  errorBox.textContent = message || "Login failed. Please try again.";
}

function getEmployee(data){
  return data.employee || data.user || data.staff || null;
}

function goToDepartment(employee){
  const role = String(employee?.role || "").toLowerCase();
  const department = String(employee?.department || "").toLowerCase();

  if(role === "finance" || department === "finance"){
    location.href = "finance-admin.html";
    return;
  }

  if(role === "academic" || role === "editor" || department === "academic"){
    location.href = "academic-admin.html";
    return;
  }

  if(role === "operations" || department === "operations"){
    location.href = "operations-admin.html";
    return;
  }

  if(role === "support" || department === "support"){
    location.href = "support-admin.html";
    return;
  }

  if(role === "tutor" || department === "tutor"){
    location.href = "tutor-dashboard.html";
    return;
  }

  location.href = "employee-dashboard.html";
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  errorBox.style.display = "none";
  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try{
    const response = await fetch(API + "/api/employees/login",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email:document.getElementById("email").value.trim(),
        password:document.getElementById("password").value
      })
    });

    const data = await response.json().catch(()=>({}));

    if(!response.ok){
      throw new Error(data.message || "Login failed.");
    }

    const employee = getEmployee(data);

    if(!data.token){
      throw new Error("Login failed. Please try again.");
    }

    localStorage.setItem("employeeToken", data.token);
    localStorage.setItem("employeeUser", JSON.stringify(employee || {}));

    localStorage.setItem("token", data.token);
    localStorage.setItem("employee", JSON.stringify(employee || {}));

    goToDepartment(employee);

  }catch(error){
    showError(error.message);
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});
</script>

</body>
</html>
