<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Practice | Practice Online</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#e6e6e6;
  --text:#0f172a;
  --muted:#475569;
  --accent:#0b3c5d;
  --accent-soft:#e7eef5;
  --radius:14px;
  --shadow:0 8px 22px rgba(0,0,0,0.06);
  --focus:0 0 0 4px rgba(207,233,255,.65);

  /* difficulty */
  --easy:#22c55e;
  --moderate:#3b82f6;
  --hard:#ef4444;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header.topbar{
  background:var(--nav);
  color:#fff;
}
.topbar-inner{
  max-width:1100px;margin:0 auto;padding:14px 18px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;font-weight:700;color:#fff;text-decoration:none}
.brand small{opacity:.85}
nav.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav.nav a{
  padding:8px 10px;border-radius:10px;color:#e7e9ff;font-weight:600;font-size:13px;text-decoration:none;
}
nav.nav a:hover{background:rgba(255,255,255,.10)}
nav.nav a.active{
  color:#fff;border-bottom:3px solid var(--red);padding-bottom:5px;
}
.btnTop{
  background:transparent;color:#fff;border:1px solid rgba(255,255,255,.22);
  padding:8px 12px;border-radius:12px;font-weight:600;cursor:pointer;
}
.btnTop:hover{background:rgba(255,255,255,.08)}

/* PAGE */
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.cardHead{
  padding:14px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#f4f7ff,#eef4ff);
  display:flex;justify-content:space-between;flex-wrap:wrap;
}
h1{margin:0;font-size:18px;font-weight:600}
.muted{color:var(--muted)}

.controls{padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap}
input{
  width:100%;max-width:520px;padding:11px 12px;border-radius:12px;
  border:1px solid #ddd;font-weight:600;
}
input:focus{border-color:#cfe9ff;box-shadow:var(--focus)}

/* ---------- TABS (clean, native-looking) ---------- */
.filters{
  padding:0 14px;
  display:flex;
  gap:18px;
  align-items:flex-end;
  border-bottom:1px solid #eee;
}

/* tab button */
.fbtn{
  appearance:none;
  border:none;
  background:transparent;
  padding:12px 2px 10px;
  font-weight:700;
  font-size:13px;
  color:#64748b;
  cursor:pointer;
  position:relative;
  line-height:1;
}

/* underline */
.fbtn::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:3px;
  border-radius:3px;
  background:transparent;
  transform:scaleX(.45);
  transform-origin:center;
  transition:transform .12s ease, background .12s ease;
}

/* hover */
.fbtn:hover{color:#0f172a}
.fbtn:hover::after{
  background:#cbd5e1;
  transform:scaleX(.75);
}

/* active states + colored underline */
.fbtn.active{
  color:#0f172a;
}
.fbtn.active::after{
  transform:scaleX(1);
}
.fbtn.active[data-diff="all"]::after{ background:#94a3b8; }      /* neutral */
.fbtn.active[data-diff="easy"]::after{ background:var(--easy); }
.fbtn.active[data-diff="moderate"]::after{ background:var(--moderate); }
.fbtn.active[data-diff="hard"]::after{ background:var(--hard); }

/* make colors visible even before selected (light underline) */
.fbtn[data-diff="easy"]::after{ background:color-mix(in srgb, var(--easy) 35%, transparent); }
.fbtn[data-diff="moderate"]::after{ background:color-mix(in srgb, var(--moderate) 35%, transparent); }
.fbtn[data-diff="hard"]::after{ background:color-mix(in srgb, var(--hard) 35%, transparent); }
.fbtn[data-diff="all"]::after{ background:color-mix(in srgb, #94a3b8 35%, transparent); }

/* if browser doesn't support color-mix, it will just ignore, still looks fine */
@supports not (background: color-mix(in srgb, #000 10%, transparent)) {
  .fbtn[data-diff="easy"]::after{ background:rgba(34,197,94,.25); }
  .fbtn[data-diff="moderate"]::after{ background:rgba(59,130,246,.25); }
  .fbtn[data-diff="hard"]::after{ background:rgba(239,68,68,.25); }
  .fbtn[data-diff="all"]::after{ background:rgba(148,163,184,.25); }
}

/* CONTENT */
.topic-wrap{padding:14px;display:flex;flex-direction:column;gap:12px}

.topic-card{
  border:1px solid var(--border);
  border-radius:16px;padding:12px;background:#fff;
}

.topic-head{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
}

.topic-title{font-size:15px;font-weight:700;color:var(--accent)}

.quiz-squares{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

/* QUIZ SQUARE */
.quiz-square{
  width:66px;height:66px;border-radius:16px;
  border:1px solid var(--border);
  border-bottom-width:4px;
  background:#f8fafc;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;font-weight:700;transition:.12s;
  position:relative;
}
.quiz-square:hover{background:#eef7ff;transform:translateY(-1px)}

.quiz-square.diff-easy{border-bottom-color:var(--easy)}
.quiz-square.diff-moderate{border-bottom-color:var(--moderate)}
.quiz-square.diff-hard{border-bottom-color:var(--hard)}

.status{font-size:10px;font-weight:700;margin-top:4px;color:#64748b;text-transform:uppercase}

.hidden{display:none!important}
</style>

<script>
const authToken = localStorage.getItem("token");
if(!authToken) window.location.href="login.html";
</script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <div>Practice Online</div>
      <small>Practice</small>
    </a>

    <nav class="nav">
      <a href="learner-quizzes.html" class="active">Practice</a>
      <a href="results.html">Results</a>
      <a href="support.html">Support</a>
      <a href="about.html">About</a>
      <button class="btnTop" id="logoutBtn">Logout</button>
    </nav>
  </div>
</header>

<div class="wrap">
<div class="card">

<div class="cardHead">
  <div>
    <h1>Practice</h1>
    <p class="muted" id="pageSub">Loading your grade…</p>
  </div>
</div>

<div class="controls">
  <input id="topicSearch" placeholder="Search topic or assessment…" disabled />
</div>

<!-- TABS -->
<div class="filters">
  <button class="fbtn active" data-diff="all" type="button">All</button>
  <button class="fbtn" data-diff="easy" type="button">Easy Level</button>
  <button class="fbtn" data-diff="moderate" type="button">Moderate Level</button>
  <button class="fbtn" data-diff="hard" type="button">Hard Level</button>
</div>

<div id="quizList" class="topic-wrap"></div>

</div>
</div>

<script>
const API="https://practice-backend-msgn.onrender.com";
const token=localStorage.getItem("token");
const quizList=document.getElementById("quizList");
const diffButtons=[...document.querySelectorAll("[data-diff]")];
let difficultyFilter="all";

diffButtons.forEach(btn=>{
  btn.onclick=()=>{
    difficultyFilter=btn.dataset.diff;
    diffButtons.forEach(b=>b.classList.toggle("active",b===btn));
    applyFilter();
  };
});

function applyFilter(){
  document.querySelectorAll("[data-square]").forEach(sq=>{
    const d=sq.dataset.diff;
    sq.style.display=(difficultyFilter==="all"||d===difficultyFilter)?"":"none";
  });
}

(async()=>{
  const me=await fetch(`${API}/api/auth/me`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
  document.getElementById("pageSub").textContent="Grade: "+me.grade;

  const quizzes=await fetch(`${API}/api/quizzes`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());

  const groups={};
  quizzes.forEach(q=>{
    const t=q.topic||"General";
    if(!groups[t]) groups[t]=[];
    groups[t].push(q);
  });

  const topics=Object.keys(groups).sort();

  quizList.innerHTML=topics.map((topic,i)=>{
    const squares=groups[topic].map((q,n)=>{
      const diff=(q.difficulty||"moderate").toLowerCase();
      return `
      <div class="quiz-square diff-${diff}" data-square data-diff="${diff}"
           onclick="location.href='attempt.html?quizId=${q._id}'">
        <div>${n+1}</div>
        <div class="status">Start</div>
      </div>`;
    }).join("");

    return `
    <div class="topic-card">
      <div class="topic-head">
        <div class="topic-title">${topic}</div>
      </div>
      <div class="quiz-squares">${squares}</div>
    </div>`;
  }).join("");

})();
</script>

</body>
</html>
