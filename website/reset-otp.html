<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password | Practice Online</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#0f172a}
.card{max-width:520px;margin:40px auto;background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:20px}
h2{margin:0 0 6px}
p{margin:6px 0 14px;color:#334155}
label{display:block;margin-top:12px;font-weight:600}
input,button{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
button{background:#0b3c5d;color:#fff;border:none;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.msg{margin-top:12px;white-space:pre-wrap}
.error{color:#b91c1c}
.ok{color:#065f46}
.hidden{display:none}
</style>
</head>

<body>

<div class="card">
  <h2>Reset Password</h2>
  <p>Enter your email to receive a code.</p>

  <!-- STEP 1 -->
  <div id="step1">
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" />
    <button id="sendBtn">Send Code</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="hidden">
    <hr />

    <h3>Change Password</h3>
    <p>Enter the 6-digit code sent to your email.</p>

    <label>6-digit Code</label>
    <input id="code" inputmode="numeric" maxlength="6" />

    <div class="row">
      <input id="newPassword" type="password" placeholder="New password" />
      <input id="confirmPassword" type="password" placeholder="Confirm password" />
    </div>

    <button id="resetBtn">Reset Password</button>
  </div>

  <p id="msg" class="msg"></p>
</div>

<script>
const API = "https://api.practiceonline.co.za";

const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const msg = document.getElementById("msg");

const emailInput = document.getElementById("email");
const codeInput = document.getElementById("code");
const newPasswordInput = document.getElementById("newPassword");
const confirmPasswordInput = document.getElementById("confirmPassword");

const step2 = document.getElementById("step2");

function setMsg(text, type = "") {
  msg.className = "msg " + type;
  msg.textContent = text;
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email).trim());
}

async function safeJson(res){
  try { return await res.json(); } catch { return {}; }
}

/* SEND CODE */
sendBtn.onclick = async () => {
  const email = emailInput.value.trim().toLowerCase();

  if (!email) return setMsg("Enter your email.", "error");
  if (!isValidEmail(email)) return setMsg("Enter a valid email.", "error");

  sendBtn.disabled = true;
  setMsg("Sending code...");

  try {
    const res = await fetch(API + "/api/forgot-password-otp", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ email })
    });

    const data = await safeJson(res);

    setMsg(data.message || "Code sent.", res.ok ? "ok" : "error");

    if (res.ok) {
      step2.classList.remove("hidden");   // ✅ show step 2
      emailInput.readOnly = true;         // ✅ lock email
      codeInput.focus();
    }

  } catch {
    setMsg("Network error.", "error");
  } finally {
    sendBtn.disabled = false;
  }
};

/* RESET PASSWORD */
resetBtn.onclick = async () => {
  const email = emailInput.value.trim().toLowerCase();
  const code = codeInput.value.trim();
  const newPassword = newPasswordInput.value;
  const confirmPassword = confirmPasswordInput.value;

  if (!code || !newPassword || !confirmPassword) {
    return setMsg("Fill all fields.", "error");
  }

  if (newPassword.length < 6) {
    return setMsg("Password must be at least 6 characters.", "error");
  }

  if (newPassword !== confirmPassword) {
    return setMsg("Passwords do not match.", "error");
  }

  resetBtn.disabled = true;
  setMsg("Resetting...");

  try {
    const res = await fetch(API + "/api/reset-password-otp", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ email, code, newPassword })
    });

    const data = await safeJson(res);

    if (res.ok) {
      setMsg("Password reset successful. Redirecting...", "ok");
      setTimeout(() => location.href = "login.html", 1200);
    } else {
      setMsg(data.message || "Reset failed.", "error");
    }

  } catch {
    setMsg("Network error.", "error");
  } finally {
    resetBtn.disabled = false;
  }
};
</script>

</body>
</html>
