<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Announcements | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#64748b;
  --red:#e11d2e;
  --success:#15803d;
  --danger:#b91c1c;
  --info:#1d4ed8;
}
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

/* ===== CONSISTENT HEADER ===== */
.topbar{
  background:var(--nav);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar-inner{
  max-width:1150px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.accountLeft{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  user-select:none;
}

.accountIconWrap{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.accountIcon{
  width:40px;
  height:40px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.accountMeta{
  min-width:0;
  line-height:1.1;
}

.accountName{
  font-size:14px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
}

.accountType{
  font-size:13px;
  color:#e0e7ff;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
  text-transform:capitalize;
  font-weight:400;
}

.topbarRight{
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
}

.iconBtnTop{
  min-width:50px;
  height:50px;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:0 4px;
}

.iconBtnTop img{
  width:30px;
  height:30px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.bellBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.navBadge{
  color:#ffd6db;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}

.menuBtn{
  height:50px;
  padding:0;
  gap:8px;
  border:none;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-family:Arial, Helvetica, sans-serif;
}

.menuBtnText{
  font-size:13px;
  font-weight:700;
  color:#fff;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
  top:-1px;
}

.menuBtn img{
  width:28px;
  height:28px;
  filter:brightness(0) invert(1) contrast(180%);
  display:block;
}

.menuDropdown{
  position:absolute;
  top:48px;
  right:0;
  width:210px;
  background:#f7f7f8;
  color:#111827;
  border:1px solid #d9dee7;
  border-radius:16px;
  box-shadow:0 14px 30px rgba(15,23,42,.14);
  padding:10px 0;
  display:none;
}

.menuDropdown.open{
  display:block;
}

.menuItem{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 18px;
  color:#111827;
  font-size:14px;
  font-weight:400;
  background:transparent;
  border:none;
  text-align:left;
  cursor:pointer;
  font-family:Arial, Helvetica, sans-serif;
}

.menuItem:hover{
  background:#eef2f7;
}

.menuItem img{
  width:18px;
  height:18px;
  display:block;
  flex-shrink:0;
}

.menuItem.profileTextOnly{
  padding-left:38px;
}

.menuDivider{
  height:1px;
  background:#dde4ec;
  margin:8px 0 6px;
}

.logoutMenuBtn{
  width:100%;
  border:none;
  background:transparent;
  cursor:pointer;
  text-align:left;
}

.wrap{
  max-width:1150px;
  margin:0 auto;
  padding:18px;
}

.hero{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}

.hero h2{
  margin:0 0 8px;
  font-size:20px;
  font-weight:700;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}

.section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:20px;
  overflow:hidden;
}

.sectionHead{
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  background:#fff;
}

.sectionBody{
  padding:18px;
}

.grid{
  display:grid;
  gap:16px;
}

.card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  background:#fff;
}

.title{
  font-weight:700;
  font-size:16px;
  margin:0 0 8px;
}

.meta{
  font-size:13px;
  color:var(--muted);
  margin-top:8px;
  line-height:1.7;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
  align-items:center;
}

input,select{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  font-family:Arial, Helvetica, sans-serif;
  font-size:14px;
}

.toolbar{
  display:flex;
  margin-bottom:15px;
}

.searchBox{
  position:relative;
  width:100%;
}

.searchBox img{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  opacity:.75;
  pointer-events:none;
}

.searchBox input{
  width:100%;
  padding:12px 14px 12px 38px;
  border-radius:12px;
  border:1px solid var(--border);
  font-family:Arial, Helvetica, sans-serif;
  font-size:14px;
  background:#fff;
}

.searchBox input:focus{
  outline:none;
  border-color:#cbd5e1;
  box-shadow:0 0 0 2px rgba(148,163,184,0.15);
}

.status{
  display:none;
  padding:13px 14px;
  border-radius:12px;
  margin-bottom:14px;
  font-size:14px;
}

.status.show{display:block}
.status.info{background:#eef4ff;border:1px solid #c7d7fe;color:var(--info)}
.status.error{background:#fef2f2;border:1px solid #fecaca;color:var(--danger)}
.status.success{background:#ecfdf5;border:1px solid #bbf7d0;color:var(--success)}

.empty{
  color:var(--muted);
  font-size:14px;
}

.card.skeletonCard{
  pointer-events:none;
}

.skeletonLine{
  height:12px;
  border-radius:4px;
  background:linear-gradient(90deg,#eef2f7 25%,#f8fafc 50%,#eef2f7 75%);
  background-size:200% 100%;
  animation:announcementsShimmer 1.3s linear infinite;
  margin-bottom:10px;
}

.skeletonLine.title{
  height:16px;
  width:44%;
}

.skeletonLine.meta{
  width:100%;
}

.skeletonLine.meta.short{
  width:58%;
}

.skeletonActions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.skeletonAction{
  width:34px;
  height:34px;
  border-radius:8px;
  background:linear-gradient(90deg,#eef2f7 25%,#f8fafc 50%,#eef2f7 75%);
  background-size:200% 100%;
  animation:announcementsShimmer 1.3s linear infinite;
}

@keyframes announcementsShimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.actions{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:14px;
}

.iconBtn{
  min-height:34px;
  border:none;
  background:transparent;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s ease;
  padding:6px 8px;
  font-family:Arial, Helvetica, sans-serif;
}

.iconBtn img{
  width:18px;
  height:18px;
  display:block;
  flex-shrink:0;
}

.iconBtn.copy img{
  width:20px;
  height:20px;
}

.iconBtn:hover{
  background:#f1f5f9;
}

.actionTextBtn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:none;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  font-family:Arial, Helvetica, sans-serif;
}

.actionTextBtn img{
  width:16px;
  height:16px;
  display:block;
}

.actionTextBtn.accept{
  background:#ecfdf5;
  color:var(--success);
}

.actionTextBtn.reject{
  background:#fef2f2;
  color:var(--danger);
}

.actionTextBtn.accept:hover{
  background:#dcfce7;
}

.actionTextBtn.reject:hover{
  background:#fee2e2;
}

.actionTextBtn.selected.accept{
  background:#bbf7d0;
  box-shadow:inset 0 0 0 1px #86efac;
}

.actionTextBtn.selected.reject{
  background:#fecaca;
  box-shadow:inset 0 0 0 1px #fca5a5;
}

.actionTextBtn:disabled{
  opacity:.9;
  cursor:not-allowed;
}

.responseBadge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700;
}

.responseBadge.available{
  background:#ecfdf5;
  color:var(--success);
}

.responseBadge.unavailable{
  background:#fef2f2;
  color:var(--danger);
}

.linkText{
  color:#1d4ed8;
  text-decoration:underline;
  font-size:13px;
  font-weight:700;
}

.sectionHead strong{
  font-size:16px;
}

::placeholder{
  font-family:Arial, Helvetica, sans-serif;
  color:#94a3b8;
}

@media(max-width:640px){
  .topbar-inner{
    padding:12px 14px;
  }

  .accountName,
  .accountType{
    max-width:120px;
  }

  .menuDropdown{
    width:200px;
  }

  .menuBtnText{
    display:none;
  }

  .wrap{
    padding:14px;
  }

  .hero,
  .sectionBody,
  .sectionHead{
    padding-left:14px;
    padding-right:14px;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="accountLeft">
      <div class="accountIconWrap">
        <img
          class="accountIcon"
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
          alt="Account"
        >
      </div>

      <div class="accountMeta">
        <div class="accountName" id="topAccountName">Loading...</div>
        <div class="accountType" id="topAccountType">Account</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="announcements.html" class="iconBtnTop bellBtn" title="Announcements" aria-label="Announcements">
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="Announcements">
        <span class="navBadge" id="navAnnouncementBadge">0</span>
      </a>

      <button class="menuBtn" id="menuToggleBtn" title="Menu" aria-label="Menu" type="button">
        <span class="menuBtnText">Menu</span>
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773952155/menu_q2xag6.svg" alt="Menu">
      </button>

      <div class="menuDropdown" id="menuDropdown">
        <a class="menuItem profileTextOnly" href="profile.html">
          <span>Profile</span>
        </a>

        <a class="menuItem" href="learner-quizzes.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777660/practice_ubgfso.svg" alt="">
          <span>Practice</span>
        </a>

        <a class="menuItem" href="results.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/results_qgdct1.svg" alt="Results">
          <span>Results</span>
        </a>

        <a class="menuItem" href="progress-dashboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="">
          <span>Dashboard</span>
        </a>

        <a class="menuItem" href="leaderboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777661/leaderboard_yfjgjf.svg" alt="">
          <span>Leaderboard</span>
        </a>

        <a class="menuItem" href="support.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/support_bs175s.svg" alt="">
          <span>Support</span>
        </a>

        <a class="menuItem" href="announcements.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="">
          <span>Announcements</span>
        </a>

        <div class="menuDivider"></div>

        <button class="menuItem logoutMenuBtn" id="logoutBtn" type="button">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773768418/logout_uay6y8.svg" alt="">
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h2>Announcements</h2>
    <p>View general updates, class announcements, and quiz notices for your grade.</p>
  </div>

  <div id="statusBox" class="status info"></div>

  <div class="toolbar">
    <div class="searchBox">
      <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773873674/searchaddress_hae4sp.svg" alt="Search">
      <input id="search" placeholder="Search by title, message or grade...">
    </div>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>General Announcements</strong></div>
    <div class="sectionBody">
      <div id="generalGrid" class="grid"></div>
    </div>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>Class Announcements</strong></div>
    <div class="sectionBody">
      <div id="classGrid" class="grid"></div>
    </div>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>Quiz Announcements</strong></div>
    <div class="sectionBody">
      <div id="quizGrid" class="grid"></div>
    </div>
  </div>
</div>

<script>
const API = window.API || "https://practice-backend-msgn.onrender.com";
let dataStore = null;

const ANNOUNCEMENTS_CACHE_KEY = "announcements_v6_cache";
const ANNOUNCEMENTS_CACHE_MAX_AGE_MS = 5 * 60 * 1000;

const statusBox = document.getElementById("statusBox");

const topAccountName = document.getElementById("topAccountName");
const topAccountType = document.getElementById("topAccountType");
const menuToggleBtn = document.getElementById("menuToggleBtn");
const menuDropdown = document.getElementById("menuDropdown");

const ICONS = {
  thumbsUp: "https://res.cloudinary.com/dopoxadlr/image/upload/v1773870202/thumbup_p6d1cb.svg",
  thumbsDown: "https://res.cloudinary.com/dopoxadlr/image/upload/v1773870185/thumbdown_bqpjk9.svg",
  copy: "https://res.cloudinary.com/dopoxadlr/image/upload/v1773871489/copy_gymbsv.svg"
};

document.getElementById("logoutBtn").onclick = ()=>{
  localStorage.clear();
  location.href = "login.html";
};

menuToggleBtn.addEventListener("click", function(e){
  e.stopPropagation();
  menuDropdown.classList.toggle("open");
});

document.addEventListener("click", function(e){
  if(!menuDropdown.contains(e.target) && !menuToggleBtn.contains(e.target)){
    menuDropdown.classList.remove("open");
  }
});

async function loadTopbarProfile(){
  try{
    const res = await fetch(`${API}/api/profile/me`, {
      headers: tokenHeaders()
    });

    if(res.status === 401){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      location.href = "login.html";
      return;
    }

    const data = await res.json().catch(()=>null);
    if(!data) return;

    topAccountName.textContent = data.fullName || data.username || "User";
    topAccountType.textContent = data.accountType || data.role || "Account";
  }catch{
    topAccountName.textContent = "User";
    topAccountType.textContent = "Account";
  }
}

async function loadTopbarAnnouncementCount(){
  try{
    const res = await fetch(`${API}/api/announcements/profile-summary`, {
      headers: tokenHeaders()
    });

    const data = await res.json().catch(() => ({}));
    document.getElementById("navAnnouncementBadge").textContent = Number(data.count || 0);
  }catch{
    document.getElementById("navAnnouncementBadge").textContent = "0";
  }
}

function showStatus(message, type = "info") {
  statusBox.className = `status show ${type}`;
  statusBox.textContent = message;
}

function hideStatus() {
  statusBox.className = "status info";
  statusBox.textContent = "";
}

function escapeHtml(text){
  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeJsString(text){
  return String(text || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "");
}

function formatDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if (Number.isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString("en-ZA",{year:"numeric",month:"short",day:"numeric"});
}

function tokenHeaders() {
  const token = localStorage.getItem("token");
  return {
    "Content-Type":"application/json",
    ...(token ? { Authorization:`Bearer ${token}` } : {})
  };
}

function matchFilter(item){
  const q = document.getElementById("search").value.toLowerCase();

  const text = `
    ${item.title || ""}
    ${item.message || ""}
    ${item.grade || ""}
    ${item.meetingDate || ""}
    ${item.meetingTime || ""}
    ${item.dueDate || ""}
  `.toLowerCase();

  return !q || text.includes(q);
}

function getMyResponse(item){
  const mine = item?.myResponse || item?.response || "";
  if (mine === "accepted") return "accepted";
  if (mine === "rejected") return "rejected";
  return "";
}

function renderGeneral(list){
  const el = document.getElementById("generalGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>`
    <div class="card">
      <div class="title">${escapeHtml(i.title)}</div>
      <div class="meta">${escapeHtml(i.message)}</div>
      <div class="meta">Grade: ${escapeHtml(i.grade || "allGrades")}</div>
      <div class="meta">Posted: ${escapeHtml(formatDate(i.createdAt))}</div>
      <div class="actions">
        <button class="iconBtn copy" onclick="copyText('${safeJsString(i.message || "")}')" title="Copy">
          <img src="${ICONS.copy}" alt="Copy">
        </button>
      </div>
    </div>
  `).join("") : `<div class="empty">No general announcements.</div>`;
}

function renderClass(list){
  const el = document.getElementById("classGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>{
    const myResponse = getMyResponse(i);
    const isAvailable = myResponse === "accepted";
    const isUnavailable = myResponse === "rejected";
    const hasResponse = !!myResponse;

    return `
      <div class="card">
        <div class="title">${escapeHtml(i.title)}</div>
        <div class="meta">${escapeHtml(i.message)}</div>
        <div class="meta">Grade: ${escapeHtml(i.grade || "allGrades")}</div>
        <div class="meta">Date: ${escapeHtml(formatDate(i.meetingDate))}</div>
        <div class="meta">Time: ${escapeHtml(i.meetingTime || "—")}</div>

        ${hasResponse ? `
          <div class="row">
            <span class="responseBadge ${isAvailable ? "available" : "unavailable"}">
              ${isAvailable ? "You are Available" : "You are Unavailable"}
            </span>
          </div>
        ` : ``}

        <div class="actions">
          ${i.meetingLink ? `<a class="linkText" href="${escapeHtml(i.meetingLink)}" target="_blank" rel="noopener noreferrer">Join Meeting</a>` : ``}

          ${i.meetingLink ? `
            <button class="iconBtn copy" onclick="copyText('${safeJsString(i.meetingLink)}')" title="Copy link">
              <img src="${ICONS.copy}" alt="Copy">
            </button>
          ` : ``}

          <button
            class="actionTextBtn accept ${isAvailable ? "selected" : ""}"
            onclick="respond('${i._id}','accepted')"
            title="Available"
            ${hasResponse ? "disabled" : ""}
          >
            <img src="${ICONS.thumbsUp}" alt="Available">
            <span>Available</span>
          </button>

          <button
            class="actionTextBtn reject ${isUnavailable ? "selected" : ""}"
            onclick="respond('${i._id}','rejected')"
            title="Unavailable"
            ${hasResponse ? "disabled" : ""}
          >
            <img src="${ICONS.thumbsDown}" alt="Unavailable">
            <span>Unavailable</span>
          </button>
        </div>
      </div>
    `;
  }).join("") : `<div class="empty">No class announcements.</div>`;
}

function renderQuiz(list){
  const el = document.getElementById("quizGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>`
    <div class="card">
      <div class="title">${escapeHtml(i.title)}</div>
      <div class="meta">${escapeHtml(i.message)}</div>
      <div class="meta">Grade: ${escapeHtml(i.grade || "allGrades")}</div>
      <div class="meta">Due: ${escapeHtml(formatDate(i.dueDate))}</div>
      <div class="meta">Status: ${escapeHtml(i.quizStatus || "Open")}</div>
      <div class="actions">
        <button class="iconBtn copy" onclick="copyText('${safeJsString(i.message || "")}')" title="Copy">
          <img src="${ICONS.copy}" alt="Copy">
        </button>
      </div>
    </div>
  `).join("") : `<div class="empty">No quiz announcements.</div>`;
}


function saveAnnouncementsCache(data){
  try{
    localStorage.setItem(ANNOUNCEMENTS_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      data: data || {}
    }));
  }catch(err){}
}

function loadAnnouncementsCache(){
  try{
    const raw = localStorage.getItem(ANNOUNCEMENTS_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.savedAt || !parsed.data) return null;
    if(Date.now() - Number(parsed.savedAt) > ANNOUNCEMENTS_CACHE_MAX_AGE_MS) return null;
    return parsed.data;
  }catch(err){
    return null;
  }
}

function skeletonCardHtml(){
  return `
    <div class="card skeletonCard">
      <div class="skeletonLine title"></div>
      <div class="skeletonLine meta"></div>
      <div class="skeletonLine meta short"></div>
      <div class="skeletonLine meta short"></div>
      <div class="actions skeletonActions">
        <div class="skeletonAction"></div>
        <div class="skeletonAction"></div>
      </div>
    </div>
  `;
}

function renderSkeletons(){
  const generalEl = document.getElementById("generalGrid");
  const classEl = document.getElementById("classGrid");
  const quizEl = document.getElementById("quizGrid");
  const cards = skeletonCardHtml() + skeletonCardHtml();
  generalEl.innerHTML = cards;
  classEl.innerHTML = cards;
  quizEl.innerHTML = cards;
}

function renderAll(){
  if(!dataStore) return;
  renderGeneral(dataStore.generalAnnouncements || []);
  renderClass(dataStore.classAnnouncements || []);
  renderQuiz(dataStore.quizAnnouncements || []);
}

async function load(){
  const cached = loadAnnouncementsCache();
  if(cached){
    dataStore = cached;
    renderAll();
    hideStatus();
  }else{
    showStatus("Loading announcements...", "info");
    renderSkeletons();
  }

  try {
    const res = await fetch(`${API}/api/announcements`, {
      headers: tokenHeaders()
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.message || "Failed to load announcements.");
    }

    dataStore = data;
    renderAll();
    saveAnnouncementsCache(data);
    hideStatus();
  } catch (err) {
    console.error(err);
    if(!cached){
      showStatus(err.message || "Could not load announcements.", "error");
    } else {
      showStatus(err.message || "Could not refresh announcements.", "error");
    }
  }
}

async function respond(id,response){
  try {
    showStatus("Saving response...", "info");

    const res = await fetch(`${API}/api/announcements/${id}/respond`,{
      method:"POST",
      headers: tokenHeaders(),
      body:JSON.stringify({response})
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.message || "Failed to save response.");
    }

    showStatus(
      response === "accepted"
        ? "Saved as Available."
        : "Saved as Unavailable.",
      "success"
    );

    await load();
  } catch (err) {
    console.error(err);
    showStatus(err.message || "Could not save response.", "error");
  }
}

function copyText(text){
  navigator.clipboard.writeText(text)
    .then(() => showStatus("Copied successfully.", "success"))
    .catch(() => showStatus("Could not copy.", "error"));
}

let announcementsSearchTimer;
document.getElementById("search").addEventListener("input", () => {
  clearTimeout(announcementsSearchTimer);
  announcementsSearchTimer = setTimeout(renderAll, 180);
});

loadTopbarProfile();
loadTopbarAnnouncementCount();
load();
</script>

</body>
</html>
