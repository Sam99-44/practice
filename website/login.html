<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Practice Online</title>

  <meta name="robots" content="noindex, nofollow" />

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#d9dee7;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --nav:#1b1648;
      --red:#e11d2e;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    button,input{
      font-family:Arial, Helvetica, sans-serif;
    }

    /* ===== SAME HEADER STYLE ===== */
    .topbar{
      background:var(--nav);
      color:#fff;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .topbar-inner{
      max-width:1150px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .accountLeft{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      user-select:none;
    }

    .accountIconWrap{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .accountIcon{
      width:40px;
      height:40px;
      display:block;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .accountMeta{
      min-width:0;
      line-height:1.1;
    }

    .accountName{
      font-size:14px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .accountType{
      font-size:13px;
      color:#e0e7ff;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
      font-weight:400;
    }

    .topbarRight{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .topLink{
      color:#e7e9ff;
      font-size:13px;
      font-weight:700;
      padding:8px 0;
      border-bottom:3px solid transparent;
    }

    .topLink:hover{
      color:#fff;
    }

    .topLink.active{
      color:#fff;
      border-bottom:3px solid var(--red);
    }

    /* ===== PAGE ===== */
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:24px;
    }

    .card{
      max-width:420px;
      margin:46px auto;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:18px;
      box-shadow:var(--shadow);
    }

    h2{
      margin:0 0 6px;
      font-size:22px;
      font-weight:700;
    }

    p{
      margin:6px 0 14px;
      color:var(--muted);
      font-size:14px;
      font-weight:400;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:700;
      font-size:14px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:6px;
      border-radius:12px;
      border:1px solid #ddd;
      background:#fff;
      font-size:14px;
      outline:none;
      font-weight:400;
    }

    input:focus{
      border-color:#cbd5e1;
      box-shadow:0 0 0 4px rgba(226,232,240,.7);
    }

    button{
      width:100%;
      padding:12px;
      margin-top:14px;
      border-radius:12px;
      border:none;
      background:var(--accent);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      transition:transform .08s ease, box-shadow .2s ease;
      font-size:14px;
    }

    button:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 24px rgba(11,60,93,.18);
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .ghostBtn{
      background:#fff;
      color:var(--accent);
      border:1px solid #d8dee8;
      display:none;
    }

    .ghostBtn:hover{
      background:var(--accent-soft);
      box-shadow:none;
      transform:none;
    }

    .msg{
      margin-top:12px;
      font-size:14px;
      font-weight:400;
    }

    .error{color:var(--error)}
    .ok{color:var(--ok)}

    .links{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:14px;
      font-size:14px;
      flex-wrap:wrap;
    }

    .links a{
      color:var(--accent);
      text-decoration:none;
      font-weight:700;
    }

    .links a:hover{
      text-decoration:underline;
    }

    @media(max-width:640px){
      .topbar-inner{
        padding:12px 14px;
      }

      .accountName,
      .accountType{
        max-width:120px;
      }

      .wrap{
        padding:16px;
      }

      .card{
        margin:26px auto;
        padding:16px;
      }

      .topbarRight{
        gap:12px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="accountLeft">
        <div class="accountIconWrap">
          <img
            class="accountIcon"
            src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
            alt="Practice Online"
          >
        </div>

        <div class="accountMeta">
          <div class="accountName">Practice Online</div>
          <div class="accountType">Sign in</div>
        </div>
      </div>

      <div class="topbarRight">
        <a href="login.html" class="topLink active">Login</a>
        <a href="register.html" class="topLink">Register</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="card">
      <h2>Login</h2>
      <p>Access your Practice Online account</p>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        spellcheck="false"
        autocapitalize="none"
        placeholder="name@example.com"
      />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />

      <button id="loginBtn" type="button">Login</button>
      <button id="resendBtn" class="ghostBtn" type="button">Resend Verification Email</button>

      <p id="msg" class="msg"></p>

      <div class="links">
        <a href="register.html">Create account</a>
        <a href="reset-otp.html">Forgot password?</a>
      </div>
    </div>
  </main>

<script>
  const API = "https://api.practiceonline.co.za";

  const loginBtn = document.getElementById("loginBtn");
  const resendBtn = document.getElementById("resendBtn");
  const msg = document.getElementById("msg");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");

  function setMsg(text, type = "") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function showResend(show) {
    resendBtn.style.display = show ? "block" : "none";
  }

  function isValidEmail(email) {
    const e = String(email || "").trim().toLowerCase();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  }

  async function safeJson(res) {
    try {
      return await res.json();
    } catch {
      return {};
    }
  }

  function getDefaultRedirect(user = {}) {
    const role = String(user.role || "").toLowerCase();

    if (role === "admin") return "admin-dashboard.html";
    if (role === "editor") return "admin-dashboard.html";
    return "profile.html";
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });

  loginBtn.onclick = async () => {
    const email = emailEl.value.trim().toLowerCase();
    const password = passwordEl.value;

    showResend(false);

    if (!email || !password) {
      return setMsg("Email and password are required.", "error");
    }

    if (!isValidEmail(email)) {
      return setMsg("Please enter a valid email address.", "error");
    }

    loginBtn.disabled = true;
    resendBtn.disabled = true;
    setMsg("Signing in...");

    try {
      const res = await fetch(`${API}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await safeJson(res);

      if (!res.ok) {
        loginBtn.disabled = false;
        resendBtn.disabled = false;

        const errorMessage = data.message || "Invalid email or password.";
        setMsg(errorMessage, "error");

        if (
          res.status === 403 &&
          String(errorMessage).toLowerCase().includes("verify your email")
        ) {
          showResend(true);
        }

        return;
      }

      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user || {}));
      localStorage.setItem("username", data.user?.username || "");
      localStorage.setItem("role", data.user?.role || "");

      const next = new URLSearchParams(window.location.search).get("next");
      window.location.href = next ? decodeURIComponent(next) : getDefaultRedirect(data.user || {});

    } catch {
      loginBtn.disabled = false;
      resendBtn.disabled = false;
      setMsg("Network error. Please try again.", "error");
    }
  };

  resendBtn.onclick = async () => {
    const email = emailEl.value.trim().toLowerCase();

    if (!email) {
      return setMsg("Please enter your email first.", "error");
    }

    if (!isValidEmail(email)) {
      return setMsg("Please enter a valid email address.", "error");
    }

    resendBtn.disabled = true;
    loginBtn.disabled = true;
    setMsg("Sending verification email...");

    try {
      const res = await fetch(`${API}/api/resend-verification-email`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });

      const data = await safeJson(res);

      resendBtn.disabled = false;
      loginBtn.disabled = false;

      if (!res.ok) {
        return setMsg(data.message || "Could not resend verification email.", "error");
      }

      setMsg(
        data.message || "Verification email sent. Please check your inbox.",
        "ok"
      );
    } catch {
      resendBtn.disabled = false;
      loginBtn.disabled = false;
      setMsg("Network error. Please try again.", "error");
    }
  };
</script>

</body>
</html>
