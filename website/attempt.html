<script>
  const API = window.API || "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");

  const params = new URLSearchParams(window.location.search);
  const quizId = params.get("quizId");

  const quizTitle = document.getElementById("quizTitle");
  const quizInfo = document.getElementById("quizInfo");
  const questionsDiv = document.getElementById("questions");
  const submitBtn = document.getElementById("submitBtn");
  const resultEl = document.getElementById("result");
  const msgEl = document.getElementById("msg");
  const metaPill = document.getElementById("metaPill");
  const lockBox = document.getElementById("lockBox");

  let quizData = null;
  let isSubmitted = false;
  let alreadyAttempted = false;
  let previousResult = null;

  // ✅ username is REQUIRED by backend
  const username = localStorage.getItem("username") || "Learner";
  document.getElementById("welcomeSub").textContent = `Welcome, ${username}`;

  if (!quizId) {
    quizTitle.textContent = "Quiz not found";
    msgEl.textContent = "Missing quizId in the URL.";
    msgEl.className = "error";
    submitBtn.disabled = true;
  } else {
    start();
  }

  async function start() {
    await checkAttemptStatus();
    await loadQuiz();
    if (alreadyAttempted && previousResult) {
      lockQuizWithPreviousResult(previousResult);
    }
  }

  async function checkAttemptStatus() {
    try {
      const res = await fetch(`${API}/api/results/mine/${quizId}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      alreadyAttempted = data.attempted;
      previousResult = data.result;
    } catch {}
  }

  async function loadQuiz() {
    const res = await fetch(`${API}/api/quizzes/${quizId}`);
    quizData = await res.json();

    quizTitle.textContent = quizData.title;
    quizInfo.textContent = `Grade ${quizData.grade} • ${quizData.topic}`;
    metaPill.style.display = "inline-block";
    metaPill.textContent = `${quizData.questions.length} questions`;

    renderQuestions(quizData.questions);
  }

  function renderQuestions(questions) {
    questionsDiv.innerHTML = questions.map((q, i) => `
      <div class="q">
        <h3>${i + 1}. ${q.text}</h3>

        ${q.imageUrl ? `<img src="${q.imageUrl}" style="max-width:100%;margin:10px 0;border-radius:12px;">` : ""}

        ${q.options.map((o, j) => `
          <label class="opt">
            <input type="radio" name="q${i}" value="${j}"> ${o}
          </label>
        `).join("")}
      </div>
    `).join("");
  }

  function lockQuizWithPreviousResult(r) {
    lockBox.style.display = "block";
    lockBox.innerHTML = `
      <b>One attempt only.</b><br>
      Score: ${r.score}/${r.total} (${r.percent}%)
    `;

    submitBtn.disabled = true;
    submitBtn.textContent = "Already Submitted";
    document.querySelectorAll("input[type=radio]").forEach(r => r.disabled = true);
  }

  submitBtn.addEventListener("click", async () => {
    if (isSubmitted || alreadyAttempted) return;

    let score = 0;
    const total = quizData.questions.length;
    const answers = [];

    quizData.questions.forEach((q, i) => {
      const chosen = document.querySelector(`input[name="q${i}"]:checked`);
      const chosenIndex = chosen ? Number(chosen.value) : null;

      if (chosenIndex === q.correctIndex) score++;

      answers.push({
        qIndex: i,
        chosenIndex,
        correctIndex: q.correctIndex,
        isCorrect: chosenIndex === q.correctIndex
      });
    });

    if (answers.some(a => a.chosenIndex === null)) {
      msgEl.textContent = "Please answer all questions.";
      msgEl.className = "error";
      return;
    }

    const percent = Math.round((score / total) * 100);

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving...";

    // ✅ FIXED PAYLOAD (username added)
    const payload = {
      quizId,
      username,               // ✅ REQUIRED
      quizTitle: quizData.title,
      grade: quizData.grade,
      topic: quizData.topic,
      score,
      total,
      percent,
      answers
    };

    try {
      const res = await fetch(`${API}/api/results`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error();

      resultEl.textContent = `Score: ${score}/${total} (${percent}%)`;
      msgEl.textContent = "Submitted and saved ✅";
      msgEl.className = "ok";
      submitBtn.textContent = "Submitted";
      isSubmitted = true;
    } catch {
      msgEl.textContent = "Submitted, but could not save result.";
      msgEl.className = "error";
      submitBtn.textContent = "Retry Save";
      submitBtn.disabled = false;
    }
  });
</script>
