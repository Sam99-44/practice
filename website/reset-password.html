<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | Practice Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#0f172a}
    .card{max-width:520px;margin:40px auto;background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:20px}
    label{display:block;margin-top:12px;font-weight:600}
    input{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    @media(max-width:520px){.row{grid-template-columns:1fr}}
    .btn{margin-top:14px;background:#0b3c5d;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;width:100%}
    .msg{margin-top:12px;white-space:pre-wrap;font-size:14px}
    .error{color:#b91c1c}
    .ok{color:#065f46}
    a{color:#0b3c5d}
    .small{font-size:12px;color:#475569;margin-top:10px}
  </style>
</head>
<body>

<div class="card">
  <h2>Reset Password</h2>
  <p>Create a new password.</p>

  <div class="small" id="info"></div>

  <div class="row">
    <div>
      <label>New Password</label>
      <input id="newPassword" type="password" />
    </div>
    <div>
      <label>Confirm New Password</label>
      <input id="confirmPassword" type="password" />
    </div>
  </div>

  <button id="resetBtn" class="btn" type="button">Reset Password</button>

  <p id="msg" class="msg"></p>
  <div id="debug" class="small"></div>

  <p class="small"><a href="login.html">Back to Login</a></p>
</div>

<script>
  const API_BASE = "https://practice-backend-msgn.onrender.com";
  const URL = API_BASE + "/api/reset-password";

  const info = document.getElementById("info");
  const msg = document.getElementById("msg");
  const debug = document.getElementById("debug");
  const btn = document.getElementById("resetBtn");

  function setMsg(text, type="") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function qp(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  async function safeJson(res) {
    try { return await res.json(); } catch { return {}; }
  }

  const token = qp("token");
  const email = qp("email");

  if (!token || !email) {
    info.textContent = "Invalid reset link (missing token/email).";
    setMsg("Please use the reset link from your email.", "error");
    btn.disabled = true;
  } else {
    info.textContent = "Reset for: " + email;
  }

  btn.onclick = async () => {
    const newPassword = document.getElementById("newPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (!newPassword || !confirm) return setMsg("Enter password and confirm it.", "error");
    if (newPassword.length < 6) return setMsg("Password must be at least 6 characters.", "error");
    if (newPassword !== confirm) return setMsg("Passwords do not match.", "error");

    btn.disabled = true;
    setMsg("Updating password...");
    debug.textContent = "POST " + URL;

    try {
      const res = await fetch(URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, token, newPassword })
      });

      const data = await safeJson(res);

      if (res.ok) {
        setMsg((data.message || "Password updated ✅") + "\nRedirecting to login...", "ok");
        setTimeout(() => window.location.href = "login.html", 1500);
      } else {
        setMsg((data.message || "Reset failed.") + ` (HTTP ${res.status})`, "error");
        btn.disabled = false;
      }
    } catch (e) {
      setMsg("Network error.", "error");
      btn.disabled = false;
    }
  };

  setMsg("Ready ✅", "ok");
</script>

</body>
</html>
