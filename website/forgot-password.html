<!doctype html>
<html>
<head>
<title>Forgot Password</title>
<style>
body{font-family:Arial;background:#f6f7fb}
.card{max-width:420px;margin:60px auto;background:#fff;padding:20px;border-radius:12px}
input,button{width:100%;padding:10px;margin-top:8px}
button{background:#0b3c5d;color:#fff;border:none;border-radius:8px;font-weight:bold}
.msg{margin-top:10px;color:green}
</style>
</head>
<body>

<div class="card">
<h2>Forgot Password</h2>
<input id="email" placeholder="Email">
<button onclick="send()">Send Reset Link</button>
<p id="msg"></p>
</div>

<script>
const API="https://practice-backend-msgn.onrender.com";

async function send(){
  const r=await fetch(API+"/api/forgot-password",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:email.value})
  });
  const d=await r.json();
  msg.textContent=d.message;
}
</script>

</body>
</html>
