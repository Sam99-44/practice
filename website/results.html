<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Results | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --bg:#f6f7fb;
  --border:#e6e6e6;
  --text:#0f172a;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Calibri Light",Calibri,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--nav);
  color:#fff;
}
.topbar-inner{
  max-width:1100px;
  margin:auto;
  padding:14px;
  display:flex;
  justify-content:space-between;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:18px;
}
.section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:12px;
}

.searchWrap{
  position:relative;
  flex:1 1 420px;
  min-width:260px;
  max-width:100%;
}

.searchWrap img{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  opacity:0.6;
  pointer-events:none;
}

#search{
  width:100%;
  min-width:0;
  padding:9px 10px 9px 36px;
  border-radius:8px;
  border:1px solid #ddd;
  font-family:Arial,"Calibri Light",Calibri,sans-serif;
  font-size:14px;
}

.controls select{
  width:150px;
  padding:9px 10px;
  border-radius:8px;
  border:1px solid #ddd;
  font-family:Arial,"Calibri Light",Calibri,sans-serif;
  font-size:14px;
  flex:0 0 auto;
}

/* TABLE */
.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  font-family:Arial,"Calibri Light",Calibri,sans-serif;
  table-layout:fixed;
}

th,td{
  padding:10px 8px;
  border-bottom:1px solid #eee;
  vertical-align:middle;
}

th{
  font-size:11px;
  text-transform:uppercase;
  color:#64748b;
  font-weight:700;
  letter-spacing:.04em;
}

th:nth-child(1), td:nth-child(1){width:23%;}
th:nth-child(2), td:nth-child(2){width:12%;}
th:nth-child(3), td:nth-child(3){width:20%;}
th:nth-child(4), td:nth-child(4){width:10%; text-align:left;}
th:nth-child(5), td:nth-child(5){width:10%; text-align:left;}
th:nth-child(6), td:nth-child(6){width:12.5%; text-align:center;}
th:nth-child(7), td:nth-child(7){width:12.5%; text-align:center;}

td:nth-child(6),
td:nth-child(7),
th:nth-child(6),
th:nth-child(7){
  white-space:nowrap;
}

.status{
  font-weight:400;
  color:#0f172a;
}

.markText{
  font-weight:400;
  color:#0f172a;
}

/* BUTTONS */
.iconActionBtn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:82px;
  padding:6px 10px;
  border-radius:6px;
  border:1px solid #e5e7eb;
  background:#f8fafc;
  cursor:pointer;
  font-family:Arial,"Calibri Light",Calibri,sans-serif;
  font-size:12px;
  color:#0f172a;
  line-height:1;
}

.iconActionBtn img{
  width:18px;
  height:18px;
  display:block;
}

.eyeBtn img{
  filter: invert(46%) sepia(83%) saturate(548%) hue-rotate(86deg);
}

.retryBtn img{
  filter: invert(28%) sepia(97%) saturate(1784%) hue-rotate(210deg);
}

.iconActionBtn:hover{
  background:#eef2f7;
}

.empty{
  padding:14px;
  color:#64748b;
  font-family:Arial,"Calibri Light",Calibri,sans-serif;
}

@media (max-width:760px){
  .controls{
    flex-direction:column;
    align-items:stretch;
  }

  .searchWrap{
    flex:1 1 auto;
    min-width:0;
  }

  .controls select{
    width:100%;
  }

  table{
    min-width:860px;
  }
}
</style>
</head>

<body>

<header>
  <div class="topbar-inner">
    <strong>Practice Online</strong>
  </div>
</header>

<div class="wrap">
  <div class="section">

    <div class="controls">
      <div class="searchWrap">
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773873674/searchaddress_hae4sp.svg" alt="">
        <input id="search" placeholder="Search topic or assessment">
      </div>

      <select id="topicFilter">
        <option value="all">All Topics</option>
      </select>

      <select id="periodFilter">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
      </select>
    </div>

    <div id="tableWrap">
      <div class="empty">Loading results…</div>
    </div>

  </div>
</div>

<script>
const API = "https://api.practiceonline.co.za";
const token = localStorage.getItem("token");

const ICON_EYE = "https://res.cloudinary.com/dopoxadlr/image/upload/v1773884664/eye_wcd3ak.svg";
const ICON_RETRY = "https://res.cloudinary.com/dopoxadlr/image/upload/v1773884662/retry_hdbczv.svg";

let allResults = [];

loadResults();

async function loadResults(){
  const res = await fetch(`${API}/api/results/my`,{
    headers:{Authorization:`Bearer ${token}`}
  });

  const data = await res.json().catch(()=>[]);
  allResults = Array.isArray(data) ? data : [];

  buildTopics();
  apply();
}

function isWithinPeriod(date, period){
  if(period==="all") return true;

  const d = new Date(date);
  const now = new Date();

  if(period==="today"){
    return d.toDateString() === now.toDateString();
  }

  if(period==="week"){
    const weekAgo = new Date();
    weekAgo.setDate(now.getDate()-7);
    return d >= weekAgo;
  }

  if(period==="month"){
    const monthAgo = new Date();
    monthAgo.setMonth(now.getMonth()-1);
    return d >= monthAgo;
  }

  return true;
}

function buildTopics(){
  const topics = [...new Set(allResults.map(r=>r.topic || "General"))];

  document.getElementById("topicFilter").innerHTML =
    `<option value="all">All Topics</option>` +
    topics.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
}

function apply(){
  const q = document.getElementById("search").value.toLowerCase();
  const topic = document.getElementById("topicFilter").value;
  const period = document.getElementById("periodFilter").value;

  let filtered = allResults.filter(r=>{
    const title = String(r.title || "").toLowerCase();
    const resultTopic = String(r.topic || "General");
    return (
      (!q || title.includes(q) || resultTopic.toLowerCase().includes(q)) &&
      (topic==="all" || resultTopic===topic) &&
      isWithinPeriod(r.createdAt,period)
    );
  });

  filtered.sort((a,b)=>(Number(b.percent)||0)-(Number(a.percent)||0));

  render(filtered);
}

function render(data){
  const wrap = document.getElementById("tableWrap");

  if(!data.length){
    wrap.innerHTML = `<div class="empty">No results found.</div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Topic</th>
            <th>Assessment</th>
            <th>Mark</th>
            <th>Status</th>
            <th>View</th>
            <th>Retry</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(r=>{
            const percent = Math.round(Number(r.percent)||0);
            return `
            <tr>
              <td>${escapeHtml(formatDateTime(r.createdAt))}</td>
              <td>${escapeHtml(r.topic||"")}</td>
              <td>${escapeHtml(r.title||"")}</td>
              <td class="markText">${percent}%</td>
              <td class="status">${percent>=50?"Pass":"Fail"}</td>
              <td>
                <span class="iconActionBtn eyeBtn"
                  onclick="location.href='review.html?resultId=${encodeURIComponent(r._id)}'">
                  <img src="${ICON_EYE}" alt="View">
                  View
                </span>
              </td>
              <td>
                <span class="iconActionBtn retryBtn"
                  onclick="location.href='attempt.html?quizId=${encodeURIComponent(r.quizId)}'">
                  <img src="${ICON_RETRY}" alt="Retry">
                  Retry
                </span>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function formatDateTime(value){
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return d.toLocaleString();
}

function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.getElementById("search").oninput = apply;
document.getElementById("topicFilter").onchange = apply;
document.getElementById("periodFilter").onchange = apply;
</script>

</body>
</html>
