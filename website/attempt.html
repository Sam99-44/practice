<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Attempt Quiz | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--text);}
    .wrap{max-width:1000px; margin:0 auto; padding:24px;}
    .error{color:var(--error);}
    .ok{color:var(--ok);}
    .muted{color:var(--muted);}
    .hidden{display:none;}

    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:12px;}
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{width:38px; height:38px; border-radius:10px; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-weight:700;}
    .brand span{font-size:13px; color:var(--muted);}

    .nav{display:flex; align-items:center; gap:14px;}
    .nav a{text-decoration:none; font-size:14px; color:var(--text); padding:6px 8px; border-radius:8px;}
    .nav a:hover{ background:var(--accent-soft); }
    .nav .nav-btn{background:var(--accent); color:white; padding:8px 12px; border-radius:10px;}
    .nav .logout{background:var(--accent); color:white; border:none; padding:8px 12px; border-radius:10px; cursor:pointer;}

    .menu-btn{display:none;}
    @media (max-width:720px){
      .nav{display:none;}
      .menu-btn{display:inline-flex;}
    }

    .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
    h1{margin:0; font-size:22px;}

    .q{margin-top:14px; padding-top:14px; border-top:1px solid #eee;}
    .opt{display:block; padding:10px; border:1px solid #ddd; border-radius:10px; margin-bottom:8px; cursor:pointer;}

    .btn{background:var(--accent); color:#fff; padding:10px 12px; border:none; border-radius:10px; cursor:pointer;}
    .btn:disabled{opacity:0.6; cursor:not-allowed;}
    .btn2{background:#fff; border:1px solid #ddd; padding:10px 12px; border-radius:10px; cursor:pointer;}

    .lockBox{border:1px dashed #ddd; background:#fafafa; padding:14px; border-radius:12px; margin-top:10px;}
  </style>

  <script>
    if (!localStorage.getItem("token")) {
      window.location.href = "login.html";
    }
  </script>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <span id="welcomeSub">Attempt Quiz</span>
      </div>
    </div>

    <nav class="nav">
      <a href="learner-quizzes.html" class="nav-btn">Back to Practice</a>
      <a href="results.html">Results</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </nav>
  </div>

  <div class="card">
    <h1 id="quizTitle">Loading...</h1>
    <p class="muted" id="quizInfo"></p>

    <div id="lockNotice" class="lockBox hidden">
      <b class="error">This quiz is locked.</b>
      <div class="muted">You already attempted this quiz.</div>
    </div>

    <div id="questions"></div>

    <button class="btn" id="submitBtn">Submit</button>
    <button class="btn2" id="viewResultsBtn" disabled>View Results</button>

    <p id="msg"></p>
  </div>
</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");
  const quizId = new URLSearchParams(window.location.search).get("quizId");

  const quizTitle = document.getElementById("quizTitle");
  const quizInfo = document.getElementById("quizInfo");
  const questionsDiv = document.getElementById("questions");
  const submitBtn = document.getElementById("submitBtn");
  const viewResultsBtn = document.getElementById("viewResultsBtn");
  const msgEl = document.getElementById("msg");
  const lockNotice = document.getElementById("lockNotice");

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    window.location.href = "login.html";
  };

  if (!quizId) {
    quizTitle.textContent = "Quiz not found";
    submitBtn.disabled = true;
  } else {
    loadQuiz();
  }

  async function loadQuiz() {
    const res = await fetch(`${API}/api/quizzes/${quizId}`, {
      headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) {
      quizTitle.textContent = "Quiz not found";
      submitBtn.disabled = true;
      return;
    }

    const quiz = await res.json();
    quizTitle.textContent = quiz.title;
    quizInfo.textContent = `Grade ${quiz.grade} • ${quiz.topic}`;

    questionsDiv.innerHTML = quiz.questions.map((q, i) => `
      <div class="q">
        <b>${i + 1}. ${q.text}</b>
        ${q.options.map((o, j) => `
          <label class="opt">
            <input type="radio" name="q${i}" value="${j}"> ${o}
          </label>
        `).join("")}
      </div>
    `).join("");

    submitBtn.onclick = () => submitQuiz(quiz);
  }

  async function submitQuiz(quiz) {
    let score = 0;

    quiz.questions.forEach((q, i) => {
      const chosen = document.querySelector(`input[name="q${i}"]:checked`);
      if (chosen && Number(chosen.value) === q.correctIndex) score++;
    });

    const res = await fetch(`${API}/api/results`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify({ quizId, score, total: quiz.questions.length })
    });

    if (res.status === 409) {
      lockNotice.classList.remove("hidden");
    }

    msgEl.className = "ok";
    msgEl.textContent = "Result saved!";
    viewResultsBtn.disabled = false;
    viewResultsBtn.onclick = () => window.location.href = "results.html";
    submitBtn.disabled = true;
  }
</script>
</body>
</html>
