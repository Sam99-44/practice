<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard | Practice Online</title>
  <style>
    body{font-family:Arial; background:#f6f7fb; margin:0;}
    .wrap{max-width:1000px; margin:0 auto; padding:20px;}
    .top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
    .btn{background:#111827; color:#fff; padding:10px 12px; border:none; border-radius:10px; cursor:pointer; text-decoration:none; font-weight:700;}
    .btn2{background:#fff; color:#111827; border:1px solid #ddd;}
    .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:14px;}
    .card{background:#fff; border:1px solid #e6e6e6; border-radius:14px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,0.06);}
    h1{margin:0;}
    .big{font-size:28px; font-weight:bold; margin-top:6px;}
    .muted{color:#555;}
    .error{color:#b91c1c;}
    .ok{color:#065f46;}
  </style>

  <script>
    const authToken = localStorage.getItem("token");
    if (!authToken) window.location.href = "login.html";
  </script>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Admin Dashboard</h1>
        <p class="muted" id="who">Checking login...</p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a class="btn btn2" href="admin-quiz.html">Add Assessment</a>
        <a class="btn btn2" href="edit-assessment.html">Edit / Freeze / Delete</a>
        <a class="btn btn2" href="learner-quizzes.html">Learner View</a>
        <button class="btn" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="muted">Total Users</div>
        <div class="big" id="totalUsers">-</div>
      </div>
      <div class="card">
        <div class="muted">Total Assessments</div>
        <div class="big" id="totalAssessments">-</div>
      </div>
      <div class="card">
        <div class="muted">Assessments by Grade</div>
        <div id="byGrade" class="muted" style="margin-top:10px;">-</div>
      </div>
    </div>

    <p id="msg" class="muted" style="margin-top:14px;"></p>
  </div>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";
    const token = localStorage.getItem("token");

    function logout(){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      window.location.href = "login.html";
    }
    document.getElementById("logoutBtn").addEventListener("click", logout);

    (async () => {
      if (!token) return logout();

      // ✅ Check admin
      const meRes = await fetch(`${API}/api/auth/me`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const me = await meRes.json().catch(()=>null);
      if (!meRes.ok || !me) return logout();

      if (me.role !== "admin") {
        alert("Admin only");
        window.location.href = "learner-quizzes.html";
        return;
      }

      document.getElementById("who").textContent = `Logged in as: ${me.username} (admin)`;

      // ✅ Load stats
      const msg = document.getElementById("msg");
      msg.className = "muted";
      msg.textContent = "Loading stats...";

      const res = await fetch(`${API}/api/admin/stats`, {
        headers: { Authorization: `Bearer ${token}` }
      });

      const data = await res.json().catch(()=>null);

      if (!res.ok || !data) {
        msg.className = "error";
        msg.textContent = "Could not load stats.";
        return;
      }

      document.getElementById("totalUsers").textContent = data.totalUsers ?? 0;
      document.getElementById("totalAssessments").textContent =
        (data.totalAssessments ?? data.totalQuizzes ?? 0);

      const by = Array.isArray(data.quizzesByGrade) ? data.quizzesByGrade : [];
      document.getElementById("byGrade").innerHTML =
        by.length
          ? by.map(x => `Grade ${x.grade}: <b>${x.count}</b>`).join("<br>")
          : "No data";

      msg.className = "ok";
      msg.textContent = "✅ Stats loaded.";
    })();
  </script>

  <script src="nav.js"></script>
</body>
</html>
