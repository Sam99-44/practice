<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root{
      --nav:#1b1648;
      --red:#e11d2e;

      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#d9dee7;
      --text:#0f172a;
      --muted:#475569;

      --radius:14px;
      --shadow:0 10px 28px rgba(2,6,23,.08);

      --soft:#f8fafc;
      --focus:0 0 0 4px rgba(226,232,240,.7);

      --greenBg:#ecfdf5;
      --greenBd:#bbf7d0;

      --redBg:#fff1f2;
      --redBd:#fecaca;

      --fs-12:12px;
      --fs-13:13px;
      --fs-14:14px;
      --fs-15:15px;
      --lh:1.5;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
    }

    body{
      font-family:"Times New Roman", Times, serif;
      font-weight:400;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    a{color:inherit;text-decoration:none}
    .wrap{max-width:1150px;margin:0 auto;padding:18px}
    .muted{color:var(--muted); font-weight:400;}
    .hidden{display:none!important}

    /* ===== CONSISTENT HEADER ===== */
    .topbar{
      background:var(--nav);
      color:#fff;
      position:sticky;
      top:0;
      z-index:1000;
      font-family:"Times New Roman", Times, serif;
    }

    .topbar-inner{
      max-width:1150px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .accountLeft{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      user-select:none;
    }

    .accountIconWrap{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .accountIcon{
      width:40px;
      height:40px;
      display:block;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .accountMeta{
      min-width:0;
      line-height:1.1;
    }

    .accountName{
      font-size:14px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .accountType{
      font-size:13px;
      color:#e0e7ff;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
      text-transform:capitalize;
      font-weight:400;
    }

    .topbarRight{
      display:flex;
      align-items:center;
      gap:14px;
      position:relative;
    }

    .iconBtn{
      min-width:50px;
      height:50px;
      border:none;
      background:transparent;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      padding:0 4px;
    }

    .iconBtn img{
      width:30px;
      height:30px;
      display:block;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .bellBtn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
    }

    .navBadge{
      color:#ffd6db;
      font-size:13px;
      font-weight:700;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
    }

    .menuBtn{
      height:50px;
      padding:0;
      gap:8px;
      border:none;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .menuBtnText{
      font-size:13px;
      font-weight:700;
      color:#fff;
      line-height:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      position:relative;
      top:-1px;
    }

    .menuBtn img{
      width:28px;
      height:28px;
      filter:brightness(0) invert(1) contrast(180%);
      display:block;
    }

    .menuDropdown{
      position:absolute;
      top:48px;
      right:0;
      width:210px;
      background:#f7f7f8;
      color:#111827;
      border:1px solid #d9dee7;
      border-radius:16px;
      box-shadow:0 14px 30px rgba(15,23,42,.14);
      padding:10px 0;
      display:none;
    }

    .menuDropdown.open{
      display:block;
    }

    .menuItem{
      width:100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 18px;
      color:#111827;
      font-size:14px;
      font-weight:400;
      background:transparent;
      border:none;
      text-align:left;
      cursor:pointer;
      font-family:"Times New Roman", Times, serif;
    }

    .menuItem:hover{
      background:#eef2f7;
    }

    .menuItem img{
      width:18px;
      height:18px;
      display:block;
      flex-shrink:0;
    }

    .menuItem.profileTextOnly{
      padding-left:38px;
    }

    .menuDivider{
      height:1px;
      background:#dde4ec;
      margin:8px 0 6px;
    }

    .logoutMenuBtn{
      width:100%;
      border:none;
      background:transparent;
      cursor:pointer;
      text-align:left;
    }

    /* ===== PAGE ===== */
    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-top:14px;
    }

    .sectionHead{
      background:#fff;
      border-bottom:1px solid var(--border);
      padding:16px 18px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .sectionHead h1{
      margin:0;
      font-size:20px;
      font-weight:700;
      font-family:"Times New Roman", Times, serif;
    }

    .sectionBody{padding:14px}

    .controls{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .counter{
      font-weight:700;
      font-size:var(--fs-13);
      font-family:"Times New Roman", Times, serif;
    }

    select{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      background:#fff;
      min-width:240px;
      font-size:var(--fs-14);
      outline:none;
      font-weight:400;
      font-family:"Times New Roman", Times, serif;
    }

    select:focus{
      box-shadow:var(--focus);
      border-color:#cbd5e1;
    }

    .qBox{
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px;
      background:#fff;
    }

    .qHead{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:10px;
    }

    .qTitle{
      font-weight:700;
      line-height:1.35;
      margin:0;
      min-width:0;
      flex:1 1 auto;
      word-break:break-word;
      font-size:var(--fs-15);
      font-family:"Times New Roman", Times, serif;
    }

    .qRight{
      flex:0 0 auto;
      white-space:nowrap;
      font-weight:400;
      font-size:var(--fs-12);
      color:var(--muted);
      padding-top:2px;
      font-family:"Times New Roman", Times, serif;
    }

    .hint{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      color:#334155;
      font-size:var(--fs-13);
      font-weight:400;
      line-height:var(--lh);
      font-family:"Times New Roman", Times, serif;
    }

    .opt{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      margin-bottom:8px;
      background:#fff;
      font-weight:400;
      line-height:var(--lh);
      word-break:break-word;
      font-size:var(--fs-14);
      font-family:"Times New Roman", Times, serif;
    }

    .opt.correct{ background:var(--greenBg); border-color:var(--greenBd); }
    .opt.wrong{ background:var(--redBg); border-color:var(--redBd); }

    .answerGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }

    .answerCard{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #e6e6e6;
      font-weight:700;
      word-break:break-word;
      background:#fff;
      font-size:var(--fs-13);
      line-height:1.4;
      font-family:"Times New Roman", Times, serif;
    }

    .answerCard.good{ background:var(--greenBg); border-color:var(--greenBd); }
    .answerCard.bad{ background:var(--redBg); border-color:var(--redBd); }

    .solutionBox{
      margin-top:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#ffffff;
      padding:12px;
    }

    .solutionTop{
      font-weight:700;
      font-size:var(--fs-13);
      margin:0 0 8px 0;
      color:#111827;
      font-family:"Times New Roman", Times, serif;
    }

    .solutionBody{
      font-weight:400;
      font-size:var(--fs-14);
      line-height:1.8;
      white-space:pre-wrap;
      word-break:break-word;
      padding:8px 10px;
      border:1px solid #f0f0f0;
      border-radius:10px;
      background:#ffffff;
      font-family:"Times New Roman", Times, serif;
    }

    .solutionBody mjx-container{
      margin:0 !important;
      padding:0 !important;
    }

    mjx-container[display="true"]{
      margin:0.35rem 0 !important;
    }

    .resultInfo{
      margin-top:12px;
      font-weight:700;
      color:#111827;
      font-size:var(--fs-13);
      font-family:"Times New Roman", Times, serif;
    }

    .navBtns{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid #ddd;
      background:#fff;
      cursor:pointer;
      font-weight:700;
      font-size:var(--fs-13);
      white-space:nowrap;
      font-family:"Times New Roman", Times, serif;
    }

    button:hover{background:#f8fafc}
    button:disabled{opacity:.6; cursor:not-allowed;}

    .errorBox{
      margin-top:12px;
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
      color:#334155;
      font-weight:700;
      display:none;
      font-size:var(--fs-13);
      font-family:"Times New Roman", Times, serif;
    }

    @media (max-width:700px){
      .answerGrid{grid-template-columns:1fr;}
      select{min-width:100%;}
      .qHead{flex-wrap:wrap;}
      .qRight{padding-top:0}
    }

    @media (max-width:640px){
      .topbar-inner{
        padding:12px 14px;
      }

      .accountName,
      .accountType{
        max-width:120px;
      }

      .menuDropdown{
        width:200px;
      }

      .menuBtnText{
        display:none;
      }

      .wrap{
        padding:14px;
      }

      .sectionHead{
        padding:14px;
      }

      .sectionBody{
        padding:12px 14px 14px;
      }
    }
  
/* ===== MATCH attempt.html ===== */
.wrap{max-width:1150px;margin:0 auto;padding:18px}
.section{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  box-shadow:none;
  overflow:hidden;
  margin-top:14px;
}
.sectionHead{
  background:#fff;
  border-bottom:1px solid #ececec;
  padding:18px 22px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.sectionHead h1{
  margin:0;
  font-size:18px;
  letter-spacing:-0.01em;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:700;
}
.sectionBody{
  padding:22px;
  background:#ffffff;
}
.paper{
  background:#ffffff;
  border:none;
  border-radius:0;
  padding:12px 6px 20px;
  box-shadow:none;
  max-width:860px;
  margin:0 auto;
}
.paper, .paper *{
  font-family:"Times New Roman", Times, serif;
}
.q{
  padding:18px 0;
  border-top:none;
}
.q:first-child{padding-top:0}
.qMainHeading{
  font-size:14px;
  font-weight:700;
  text-transform:uppercase;
  color:#111827;
  margin:26px 0 18px;
  line-height:1.5;
}
.qSectionStem{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:18px;
  align-items:start;
  margin:18px 0 10px;
  color:#111827;
  line-height:1.5;
  font-size:14px;
}
.qSectionLeft{
  display:grid;
  grid-template-columns:56px minmax(0,1fr);
  gap:12px;
  align-items:start;
  min-width:0;
}
.qSectionNo{
  min-width:56px;
  font-weight:700;
}
.qSectionText{
  min-width:0;
  font-weight:400;
}
.qHead{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:18px;
  align-items:start;
  margin-bottom:6px;
}
.qTitle{
  font-weight:400;
  line-height:1.5;
  margin:0;
  min-width:0;
  word-break:break-word;
  font-size:14px;
  display:grid;
  grid-template-columns:56px minmax(0,1fr);
  gap:12px;
  align-items:start;
  color:#111827;
}
.qNo{
  font-weight:700;
  color:#111827;
  min-width:56px;
}
.qText{
  min-width:0;
  font-weight:400;
}
.marksMeta{
  display:flex;
  align-items:flex-start;
  gap:0;
  color:#111827;
  font-size:14px;
  line-height:1.3;
  white-space:nowrap;
  justify-self:end;
  margin:0;
  text-align:right;
  min-width:32px;
}
.marksMeta::before{content:"(";}
.marksMeta::after{content:")";}
.marksBox{
  margin:0;
  padding:0;
  background:transparent;
  display:block;
  font-weight:400;
  color:#111827;
  line-height:1.2;
  font-size:14px;
}
.noteBox{
  border:none;
  background:#fff;
  border-radius:0;
  padding:4px 0 8px;
  color:#111827;
  font-weight:400;
  line-height:1.45;
  word-break:break-word;
  font-size:14px;
}
.qimg{
  display:block;
  width:100%;
  max-width:560px;
  height:auto;
  border-radius:0;
  border:1px solid #d9dee7;
  margin:0 0 14px 68px;
}
.opt{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:5px 0 5px 68px;
  border:none;
  border-radius:0;
  margin-bottom:0;
  background:transparent;
  font-weight:400;
  font-size:14px;
  line-height:1.45;
}
.optText{
  font-weight:400;
  line-height:1.55;
  display:block;
}
.reviewBadge{
  display:inline-block;
  margin-left:68px;
  margin-top:6px;
  padding:6px 8px;
  border:1px solid #e5e7eb;
  background:#fff;
  color:#334155;
  font-size:12px;
  line-height:1.4;
}
.jumpBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.navBtns{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
@media(max-width:640px){
  .wrap{padding:14px}
  .sectionBody{padding:14px}
  .sectionHead{padding:12px 14px}
  .paper{padding:16px 14px}
  .qMainHeading{font-size:14px;margin:22px 0 14px}
  .qSectionStem{
    font-size:14px;
    gap:12px;
    margin:16px 0 10px;
  }
  .qSectionLeft{
    grid-template-columns:46px minmax(0,1fr);
    gap:10px;
  }
  .qSectionNo{min-width:46px}
  .qTitle{
    font-size:14px;
    grid-template-columns:46px minmax(0,1fr);
    gap:10px;
  }
  .qNo{min-width:46px}
  .marksBox,.marksMeta{font-size:14px;min-width:26px}
  .qimg{
    max-width:100%;
    margin-left:56px;
  }
  .opt{padding-left:56px;font-size:14px}
  .reviewBadge{margin-left:56px}
}

</style>

<script>
  const API = window.API || "https://api.practiceonline.co.za";
  const token = localStorage.getItem("token");
  const resultId = new URLSearchParams(window.location.search).get("resultId");

  const titleEl = document.getElementById("title");
  const counterEl = document.getElementById("counter");
  const qTextEl = document.getElementById("qText");
  const qRightEl = document.getElementById("qRight");
  const hintEl = document.getElementById("hint");
  const bodyEl = document.getElementById("body");
  const solutionWrap = document.getElementById("solutionWrap");
  const resultInfoEl = document.getElementById("resultInfo");
  const errEl = document.getElementById("err");
  const jumpSelect = document.getElementById("jumpSelect");

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  const topAccountName = document.getElementById("topAccountName");
  const topAccountType = document.getElementById("topAccountType");
  const menuToggleBtn = document.getElementById("menuToggleBtn");
  const menuDropdown = document.getElementById("menuDropdown");

  let answers = [];
  let idx = 0;

  let qNumberByIndex = new Map();
  let totalQuestionsOnly = 0;

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("me_cache");
    localStorage.removeItem("user");
    localStorage.removeItem("role");
    window.location.href = "login.html";
  };

  menuToggleBtn.addEventListener("click", function(e){
    e.stopPropagation();
    menuDropdown.classList.toggle("open");
  });

  document.addEventListener("click", function(e){
    if(!menuDropdown.contains(e.target) && !menuToggleBtn.contains(e.target)){
      menuDropdown.classList.remove("open");
    }
  });

  async function loadTopbarProfile(){
    try{
      const res = await fetch(`${API}/api/profile/me`, {
        headers:{ Authorization:`Bearer ${token}` }
      });

      if(res.status === 401){
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        localStorage.removeItem("me_cache");
        location.href = "login.html";
        return;
      }

      const data = await res.json().catch(()=>null);
      if(!data) return;

      topAccountName.textContent = data.fullName || data.username || "User";
      topAccountType.textContent = data.accountType || data.role || "Account";
    }catch{
      topAccountName.textContent = "User";
      topAccountType.textContent = "Account";
    }
  }

  async function loadTopbarAnnouncementCount(){
    try{
      const res = await fetch(`${API}/api/announcements/profile-summary`, {
        headers:{ Authorization:`Bearer ${token}` }
      });

      const data = await res.json().catch(() => ({}));
      document.getElementById("navAnnouncementBadge").textContent = Number(data.count || 0);
    }catch{
      document.getElementById("navAnnouncementBadge").textContent = "0";
    }
  }

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  function showErr(message){
    errEl.style.display = "block";
    errEl.textContent = message;
  }

  function clearErr(){
    errEl.style.display = "none";
    errEl.textContent = "";
  }

  function typesetMath(root=document){
    if (window.MathJax?.typesetPromise) {
      window.MathJax.typesetPromise([root]).catch(()=>{});
    }
  }

  function buildNumbering(){
    qNumberByIndex = new Map();
    let qNum = 0;

    for (let i = 0; i < answers.length; i++){
      const type = String(answers[i]?.type || "mcq").toLowerCase();
      if (type !== "note") {
        qNum += 1;
        qNumberByIndex.set(i, qNum);
      }
    }
    totalQuestionsOnly = qNum;
  }

  function buildJump(){
    jumpSelect.innerHTML = answers.map((a, i) => {
      const type = String(a?.type || "mcq").toLowerCase();
      if (type === "note") return `<option value="${i}">Note / Heading</option>`;
      const n = qNumberByIndex.get(i) || (i + 1);
      return `<option value="${i}">Question ${n}</option>`;
    }).join("");

    jumpSelect.onchange = () => {
      const v = Number(jumpSelect.value);
      if (Number.isFinite(v) && v >= 0 && v < answers.length) {
        idx = v;
        render();
      }
    };
  }

  async function load(){
    if (!resultId) {
      showErr("Missing resultId in the URL.");
      return;
    }

    try{
      const res = await fetch(`${API}/api/results/my`, {
        headers: { Authorization: "Bearer " + token }
      });

      if (res.status === 401) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
        return;
      }

      if (!res.ok) {
        const txt = await res.text().catch(()=> "");
        throw new Error(txt || `Request failed (HTTP ${res.status})`);
      }

      const rows = await res.json().catch(() => []);
      const list = Array.isArray(rows) ? rows : [];
      const r = list.find(x => String(x?._id || "") === String(resultId));

      if (!r) {
        throw new Error("Result not found.");
      }

      titleEl.textContent = cleanSpaces(r.title || "Assessment Review");

      answers = Array.isArray(r.answers) ? r.answers : [];
      if (!answers.length) {
        showErr("No saved answers found for this attempt.");
        return;
      }

      buildNumbering();
      buildJump();

      idx = 0;
      render();

      typesetMath(document.querySelector(".section"));
    } catch(e){
      showErr("Could not load review: " + (e.message || ""));
    }
  }

  function renderSolutionBox(a){
    const sol = cleanSpaces(a?.solution || "");
    if (!sol){
      solutionWrap.style.display = "none";
      solutionWrap.innerHTML = "";
      return;
    }

    solutionWrap.style.display = "block";
    solutionWrap.innerHTML = `
      <div class="solutionBox" role="note" aria-label="Solution">
        <div class="solutionTop">Solution:</div>
        <div class="solutionBody">${escapeHtml(sol)}</div>
      </div>
    `;

    typesetMath(solutionWrap);
  }

  function toIndexSet(arr){
    if (!Array.isArray(arr)) return new Set();
    return new Set(arr.filter(n => Number.isInteger(n) && n >= 0));
  }

  function letter(i){
    return String.fromCharCode(65 + i);
  }

  function formatLetters(indexes){
    const a = Array.from(indexes).sort((x,y)=>x-y);
    if (!a.length) return "";
    return a.map(letter).join(", ");
  }

  function getCorrectSet(a){
    const set = toIndexSet(a.correctIndexes);
    if (set.size) return set;
    const ci = Number(a.correctIndex);
    return Number.isFinite(ci) && ci >= 0 ? new Set([ci]) : new Set();
  }

  function getChosenSet(a){
    const set = toIndexSet(a.chosenIndexes);
    if (set.size) return set;
    const c = Number(a.chosenIndex);
    return Number.isFinite(c) && c >= 0 ? new Set([c]) : new Set();
  }


  function looksLikeMathContent(value){
    const s = String(value || "");
    return /\\\(|\\\[|\\frac|\\sqrt|\$/.test(s) ||
           /[a-zA-Z]\^\d/.test(s) ||
           /sqrt\s*\(/i.test(s) ||
           /(?:<=|>=|!=|\bpi\b|≤|≥)/i.test(s) ||
           /(?:\d+|\)|[a-zA-Z])\s*\^\s*\(/.test(s) ||
           /(?:=|<|>|\\leq|\\geq)/.test(s) && /[a-zA-Z0-9]/.test(s);
  }

  function autoConvertMixedLatex(value){
    const raw = String(value || "").trim();
    if (!raw) return "";
    if (/\\\(|\\\[|\\frac|\\sqrt|\$/.test(raw)) return raw;

    let converted = raw.replace(/(^|[\s:;,])sqrt\s*\(([^()]+)\)/gi, (m, pre, inner) => {
      return `${pre}$\\sqrt{${inner}}$`;
    });

    converted = converted.replace(/([A-Za-z0-9)\]])\s*\^\s*\(([^()]+)\)/g, '$1^{$2}');
    converted = converted.replace(/([A-Za-z0-9)\]])\s*\^\s*([+-]?\d+)/g, '$1^{$2}');
    converted = converted
      .replace(/<=/g, '\\leq ')
      .replace(/>=/g, '\\geq ')
      .replace(/!=/g, '\\neq ')
      .replace(/≤/g, '\\leq ')
      .replace(/≥/g, '\\geq ');

    if (looksLikeMathContent(converted)) {
      if (/^\$.*\$$/.test(converted.trim())) return converted.trim();
      return `$${converted.trim()}$`;
    }

    return converted;
  }

  function render(){
    clearErr();

    const a = answers[idx] || {};
    const type = String(a.type || "mcq").toLowerCase();
    jumpSelect.value = String(idx);

    hintEl.style.display = "none";
    hintEl.textContent = "";
    bodyEl.innerHTML = "";
    resultInfoEl.textContent = "";
    qTextEl.textContent = "";
    qRightEl.textContent = "";
    solutionWrap.style.display = "none";
    solutionWrap.innerHTML = "";

    if (type === "note") {
      counterEl.textContent = `Note / Heading`;
      bodyEl.innerHTML = `<div class="noteBox">${escapeHtml(autoConvertMixedLatex(cleanSpaces(a.questionText || "")))}</div>`;
      typesetMath(bodyEl);
      updateNavButtons();
      return;
    }

    const qNum = qNumberByIndex.get(idx) || 1;
    counterEl.textContent = `Question ${qNum} of ${totalQuestionsOnly}`;

    qTextEl.innerHTML = escapeHtml(autoConvertMixedLatex(cleanSpaces(a.questionText || "")));

    const pts = Number(a.points || 0);
    qRightEl.textContent = pts ? `(${pts}) marks` : "";

    const hint = cleanSpaces(a.hint || "");
    if (hint){
      hintEl.style.display = "block";
      hintEl.innerHTML = "Hint: " + escapeHtml(autoConvertMixedLatex(hint));
    }

    if (type === "text") {
      const userAns = autoConvertMixedLatex(cleanSpaces(a.textAnswer || ""));
      const correctAns = autoConvertMixedLatex(cleanSpaces(a.correctText || ""));
      const isCorrect = !!a.isCorrect;

      bodyEl.innerHTML = `
        <div class="answerGrid">
          <div class="answerCard ${isCorrect ? "good" : "bad"}">
            <b>Your Answer:</b> ${escapeHtml(userAns || "No answer")}
          </div>
          <div class="answerCard good">
            <b>Correct Answer:</b> ${escapeHtml(correctAns || "Not saved")}
          </div>
        </div>
      `;

      resultInfoEl.textContent = isCorrect ? "Correct" : "Incorrect";
    } else {
      const options = Array.isArray(a.options) ? a.options : [];

      const correctSet = getCorrectSet(a);
      const chosenSet  = getChosenSet(a);

      bodyEl.innerHTML = options.map((opt, i) => {
        const isCorrect = correctSet.has(i);
        const isChosen  = chosenSet.has(i);

        let cls = "";
        if (isCorrect) cls = "correct";
        if (isChosen && !isCorrect) cls = "wrong";

        return `<div class="opt ${cls}">
          ${letter(i)}. ${escapeHtml(autoConvertMixedLatex(cleanSpaces(opt)))}
        </div>`;
      }).join("");

      const correctLetters = formatLetters(correctSet);
      resultInfoEl.innerHTML = correctLetters ? `Correct Answer: ${escapeHtml(autoConvertMixedLatex(correctLetters))}` : "Correct Answer: (not saved)";
    }

    renderSolutionBox(a);

    typesetMath(qTextEl);
    typesetMath(hintEl);
    typesetMath(bodyEl);
    typesetMath(resultInfoEl);

    updateNavButtons();
  }

  function updateNavButtons(){
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === answers.length - 1;
  }

  prevBtn.onclick = () => {
    if (idx > 0){ idx--; render(); }
  };

  nextBtn.onclick = () => {
    if (idx < answers.length - 1){ idx++; render(); }
  };

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") prevBtn.click();
    if (e.key === "ArrowRight") nextBtn.click();
  });

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  loadTopbarProfile();
  loadTopbarAnnouncementCount();
  load();
</script>

</body>
</html>
