<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request Quote | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --ok:#065f46;
  --error:#b91c1c;
  --accent:#0b3c5d;
  --soft:#f8fafc;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:"Times New Roman", Times, serif;
  background:#ffffff;
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

button,input,textarea,select,option{
  font-family:"Times New Roman", Times, serif;
}

.topbar{
  background:var(--nav);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar-inner{
  max-width:1150px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.accountLeft{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.accountIcon{
  width:40px;
  height:40px;
  filter:brightness(0) invert(1) contrast(180%);
}

.accountName{
  font-size:14px;
  font-weight:700;
  color:#fff;
}

.accountType{
  font-size:13px;
  color:#e0e7ff;
  margin-top:3px;
}

.topbarRight{
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
}

.iconBtn{
  min-width:50px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.iconBtn img{
  width:30px;
  height:30px;
  filter:brightness(0) invert(1) contrast(180%);
}

.navBadge{
  color:#ffd6db;
  font-size:13px;
  font-weight:700;
}

.menuLink{
  color:#fff;
  font-size:13px;
  font-weight:700;
}

.wrap{
  max-width:1150px;
  margin:0 auto;
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:0;
  box-shadow:none;
  overflow:hidden;
  max-width:860px;
  margin:0 auto;
}

.cardHead{
  padding:14px 22px;
  border-bottom:1px solid #ececec;
  background:#fff;
}

.cardHead h1{
  margin:0;
  font-size:14px;
  font-weight:700;
  text-transform:uppercase;
}

.cardHead .subText{
  margin-top:6px;
  color:#111827;
  font-size:14px;
  font-weight:400;
  line-height:1.45;
}

.body{
  padding:22px;
  background:#fff;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  font-size:14px;
  font-weight:400;
  margin-top:14px;
  margin-bottom:6px;
  color:#111827;
}

input,
select{
  width:100%;
  padding:10px 12px;
  border-radius:0;
  border:1px solid #d6d3d1;
  font-size:14px;
  background:#fff;
  outline:none;
}

input:focus,
select:focus{
  border-color:#cbd5e1;
  box-shadow:0 0 0 4px rgba(226,232,240,.7);
}

.btnRow{
  margin-top:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  background:var(--red);
  color:#fff;
  padding:10px 14px;
  border:1px solid var(--red);
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  min-width:110px;
  height:34px;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.msg{
  margin-top:14px;
  font-size:14px;
  color:var(--muted);
  font-weight:400;
  line-height:1.45;
}

.msg.ok{color:var(--ok)}
.msg.error{color:var(--error)}

@media(max-width:700px){
  .row{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:14px;
  }

  .body{
    padding:14px;
  }

  .cardHead{
    padding:12px 14px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div class="accountLeft">
      <img
        class="accountIcon"
        src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
        alt="Account"
      >

      <div>
        <div class="accountName">Practice Online</div>
        <div class="accountType">Request Quote</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="announcements.html" class="iconBtn">
        <img
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg"
          alt="Announcements"
        >
        <span class="navBadge">0</span>
      </a>

      <a href="profile.html" class="menuLink">Profile</a>
    </div>

  </div>
</header>

<div class="wrap">

  <div class="card">

    <div class="cardHead">
      <h1>Request Quote</h1>
      <div class="subText">
        Please complete the form below and we will send you a quotation for our online Mathematics classes.
      </div>
    </div>

    <div class="body">

      <form id="quoteForm">

        <div class="row">
          <div>
            <label>Full Name</label>
            <input type="text" name="fullName" required>
          </div>

          <div>
            <label>Email Address</label>
            <input type="email" name="email" required>
          </div>
        </div>

        <div class="row">
          <div>
            <label>Cellphone Number</label>
            <input type="text" name="cellphone" required>
          </div>

          <div>
            <label>Grade</label>
            <select name="grade" required>
              <option value="">Select Grade</option>
              <option>Grade 8</option>
              <option>Grade 9</option>
              <option>Grade 10</option>
              <option>Grade 11</option>
              <option>Grade 12</option>
            </select>
          </div>
        </div>

        <label>Subject</label>
        <select name="subject" required>
          <option value="">Select Subject</option>
          <option>Mathematics</option>
          <option>Mathematical Literacy</option>
        </select>

        <label>Interested Package</label>
        <select name="package" required>
          <option value="">Select Package</option>
          <option>Monthly Classes</option>
          <option>Per Lesson</option>
          <option>Exam Preparation</option>
          <option>One-on-One Tutoring</option>
        </select>

        <div class="btnRow">
          <button type="submit" class="btn" id="submitBtn">
            Submit
          </button>
        </div>

        <div id="msg" class="msg"></div>

      </form>

    </div>

  </div>

</div>

<script>
const API = "https://api.practiceonline.co.za";

const form = document.getElementById("quoteForm");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const payload = Object.fromEntries(
    new FormData(form).entries()
  );

  try{

    submitBtn.disabled = true;
    msg.className = "msg";
    msg.textContent = "Submitting...";

    const res = await fetch(API + "/api/request-quote", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    });

    const data = await res.json().catch(()=>({}));

    if(!res.ok){
      msg.className = "msg error";
      msg.textContent = data.message || "We could not submit your request. Please try again.";
      return;
    }

    msg.className = "msg ok";
    msg.textContent = "Submitted successfully.";

    form.reset();

  }catch{

    msg.className = "msg error";
    msg.textContent = "Network error. Please try again.";

  }finally{
    submitBtn.disabled = false;
  }

});
</script>

</body>
</html>
