<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Maths Support | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --radius:14px;
  --shadow:0 8px 22px rgba(0,0,0,.06);
  --ok:#065f46;
  --error:#b91c1c;
  --soft:#f8fafc;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

button,input,textarea,select,option{
  font-family:Arial, Helvetica, sans-serif;
}

.topbar{
  background:var(--nav);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar-inner{
  max-width:1150px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.accountLeft{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  user-select:none;
}

.accountIconWrap{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.accountIcon{
  width:40px;
  height:40px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.accountMeta{
  min-width:0;
  line-height:1.1;
}

.accountName{
  font-size:14px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
}

.accountType{
  font-size:13px;
  color:#e0e7ff;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
  text-transform:capitalize;
  font-weight:400;
}

.topbarRight{
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
}

.iconBtn{
  min-width:50px;
  height:50px;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:0 4px;
}

.iconBtn img{
  width:30px;
  height:30px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.bellBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.navBadge{
  color:#ffd6db;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}

.menuBtn{
  height:50px;
  padding:0;
  gap:8px;
  border:none;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.menuBtnText{
  font-size:13px;
  font-weight:700;
  color:#fff;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
  top:-1px;
}

.menuBtn img{
  width:28px;
  height:28px;
  filter:brightness(0) invert(1) contrast(180%);
  display:block;
}

.menuDropdown{
  position:absolute;
  top:48px;
  right:0;
  width:210px;
  background:#f7f7f8;
  color:#111827;
  border:1px solid #d9dee7;
  border-radius:16px;
  box-shadow:0 14px 30px rgba(15,23,42,.14);
  padding:10px 0;
  display:none;
}

.menuDropdown.open{
  display:block;
}

.menuItem{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 18px;
  color:#111827;
  font-size:14px;
  font-weight:400;
  background:transparent;
  border:none;
  text-align:left;
  cursor:pointer;
}

.menuItem:hover{
  background:#eef2f7;
}

.menuItem img{
  width:18px;
  height:18px;
  display:block;
  flex-shrink:0;
}

.menuItem.profileTextOnly{
  padding-left:38px;
}

.menuDivider{
  height:1px;
  background:#dde4ec;
  margin:8px 0 6px;
}

.logoutMenuBtn{
  width:100%;
  border:none;
  background:transparent;
  cursor:pointer;
  text-align:left;
}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.cardHead{
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  background:#fff;
}

.cardHead h1{
  margin:0;
  font-size:20px;
  font-weight:700;
}

.cardHead .subText{
  margin-top:6px;
  color:var(--muted);
  font-size:14px;
  font-weight:400;
}

.body{
  padding:14px 18px 18px;
}

label{
  display:block;
  font-size:14px;
  font-weight:400;
  margin-top:14px;
  margin-bottom:6px;
  color:#334155;
}

input,
textarea,
select{
  width:100%;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:14px;
  font-weight:400;
  background:#fff;
  outline:none;
  font-family:Arial, Helvetica, sans-serif;
}

select option{
  font-size:14px;
  font-family:Arial, Helvetica, sans-serif;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#cbd5e1;
  box-shadow:0 0 0 4px rgba(226,232,240,.7);
}

.helperText{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}

.inlineChangeRow{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:10px;
  align-items:end;
  margin-top:6px;
}

.inlineWord{
  font-size:14px;
  color:var(--muted);
  padding:0 4px 10px;
  white-space:nowrap;
}

.hidden{
  display:none;
}

.btnRow{
  margin-top:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  background:var(--red);
  color:#fff;
  padding:10px 14px;
  border:none;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.btn2{
  background:#fff;
  border:1px solid #ddd;
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.btn2:hover{
  background:var(--soft);
}

.msg{
  margin-top:14px;
  font-size:14px;
  color:var(--muted);
  font-weight:400;
}

.msg.ok{color:var(--ok)}
.msg.error{color:var(--error)}

@media(max-width:640px){
  .topbar-inner{
    padding:12px 14px;
  }

  .accountName,
  .accountType{
    max-width:120px;
  }

  .menuDropdown{
    width:200px;
  }

  .menuBtnText{
    display:none;
  }

  .wrap{
    padding:14px;
  }

  .body{
    padding:12px 14px 14px;
  }

  .cardHead{
    padding:14px;
  }

  .inlineChangeRow{
    grid-template-columns:1fr;
    gap:8px;
  }

  .inlineWord{
    padding:0;
  }
}
</style>

<script>
if(!localStorage.getItem("token")) location.href="login.html";
</script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="accountLeft">
      <div class="accountIconWrap">
        <img
          class="accountIcon"
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
          alt="Account"
        >
      </div>

      <div class="accountMeta">
        <div class="accountName" id="topAccountName">Loading...</div>
        <div class="accountType" id="topAccountType">Account</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="announcements.html" class="iconBtn bellBtn" title="Announcements" aria-label="Announcements">
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="Announcements">
        <span class="navBadge" id="navAnnouncementBadge">0</span>
      </a>

      <button class="menuBtn" id="menuToggleBtn" title="Menu" aria-label="Menu" type="button">
        <span class="menuBtnText">Menu</span>
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773952155/menu_q2xag6.svg" alt="Menu">
      </button>

      <div class="menuDropdown" id="menuDropdown">
        <a class="menuItem profileTextOnly" href="profile.html">
          <span>Profile</span>
        </a>

        <a class="menuItem" href="learner-quizzes.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777660/practice_ubgfso.svg" alt="">
          <span>Practice</span>
        </a>

        <a class="menuItem" href="results.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/results_qgdct1.svg" alt="Results">
          <span>Results</span>
        </a>

        <a class="menuItem" href="progress-dashboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="">
          <span>Dashboard</span>
        </a>

        <a class="menuItem" href="leaderboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777661/leaderboard_yfjgjf.svg" alt="">
          <span>Leaderboard</span>
        </a>

        <a class="menuItem" href="support.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/support_bs175s.svg" alt="">
          <span>Support</span>
        </a>

        <a class="menuItem" href="announcements.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="">
          <span>Announcements</span>
        </a>

        <div class="menuDivider"></div>

        <button class="menuItem logoutMenuBtn" id="logoutBtn" type="button">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773768418/logout_uay6y8.svg" alt="">
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="cardHead">
      <h1>Maths Support</h1>
      <div class="subText">
        Please select your request type and enter your message.
      </div>
    </div>

    <div class="body">
      <label for="requestType">Request Type</label>
      <select id="requestType">
        <option value="">Select</option>
        <option value="Math help">Math help</option>
        <option value="Change of account">Change of account</option>
        <option value="Other">Other</option>
      </select>

      <div id="otherFollowUpWrap" class="hidden">
        <label for="otherFollowUp">Please specify your request</label>
        <input id="otherFollowUp">
      </div>

      <div id="changeAccountWrap" class="hidden">
        <label>Change account</label>

        <div class="inlineChangeRow">
          <select id="currentAccountType">
            <option value="">Current account</option>
            <option value="student">Student</option>
            <option value="materials">Materials</option>
          </select>

          <div class="inlineWord">to</div>

          <select id="newAccountType">
            <option value="">New account</option>
            <option value="student">Student</option>
            <option value="materials">Materials</option>
          </select>
        </div>

        <div class="helperText"></div>
      </div>

      <label for="contact">Contact Number</label>
      <input id="contact">

      <label for="message">Message</label>
      <textarea id="message" placeholder="Please explain your request clearly..."></textarea>

      <div class="btnRow">
        <button class="btn" id="submitBtn" type="button">Submit</button>
        <button class="btn2" id="resetBtn" type="button">Reset</button>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </div>
</div>

<script>
const API = window.API || "https://api.practiceonline.co.za";
const token = localStorage.getItem("token");

const topAccountName = document.getElementById("topAccountName");
const topAccountType = document.getElementById("topAccountType");
const menuToggleBtn = document.getElementById("menuToggleBtn");
const menuDropdown = document.getElementById("menuDropdown");

const requestTypeEl = document.getElementById("requestType");
const otherFollowUpWrap = document.getElementById("otherFollowUpWrap");
const otherFollowUpEl = document.getElementById("otherFollowUp");

const changeAccountWrap = document.getElementById("changeAccountWrap");
const currentAccountTypeEl = document.getElementById("currentAccountType");
const newAccountTypeEl = document.getElementById("newAccountType");

const contactEl = document.getElementById("contact");
const messageEl = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");
const resetBtn = document.getElementById("resetBtn");
const msgEl = document.getElementById("msg");

document.getElementById("logoutBtn").onclick = ()=>{
  localStorage.clear();
  location.href = "login.html";
};

menuToggleBtn.addEventListener("click", function(e){
  e.stopPropagation();
  menuDropdown.classList.toggle("open");
});

document.addEventListener("click", function(e){
  if(!menuDropdown.contains(e.target) && !menuToggleBtn.contains(e.target)){
    menuDropdown.classList.remove("open");
  }
});

function clean(s){
  return String(s || "").trim().replace(/\s+/g, " ");
}

function setMsg(text, type){
  msgEl.className = "msg" + (type ? (" " + type) : "");
  msgEl.textContent = text || "";
}

function syncNewAccountOptions(){
  const currentValue = clean(currentAccountTypeEl.value);
  const previousNewValue = clean(newAccountTypeEl.value);

  newAccountTypeEl.innerHTML = `
    <option value="">New account</option>
    ${currentValue !== "student" ? '<option value="student">Student</option>' : ""}
    ${currentValue !== "materials" ? '<option value="materials">Materials</option>' : ""}
  `;

  if(previousNewValue && previousNewValue !== currentValue){
    newAccountTypeEl.value = previousNewValue;
  } else {
    newAccountTypeEl.value = "";
  }
}

function updateRequestTypeUI(){
  const value = clean(requestTypeEl.value);

  otherFollowUpWrap.classList.add("hidden");
  changeAccountWrap.classList.add("hidden");

  otherFollowUpEl.value = "";
  currentAccountTypeEl.value = "";
  syncNewAccountOptions();

  if(value === "Other"){
    otherFollowUpWrap.classList.remove("hidden");
  }

  if(value === "Change of account"){
    changeAccountWrap.classList.remove("hidden");
  }
}

requestTypeEl.addEventListener("change", updateRequestTypeUI);
currentAccountTypeEl.addEventListener("change", syncNewAccountOptions);

async function loadTopbarProfile(){
  try{
    const res = await fetch(`${API}/api/profile/me`, {
      headers:{ Authorization:`Bearer ${token}` }
    });

    if(res.status === 401){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      location.href = "login.html";
      return;
    }

    const data = await res.json().catch(()=>null);
    if(!data) return;

    topAccountName.textContent = data.fullName || data.username || "User";
    topAccountType.textContent = data.accountType || data.role || "Account";

    const phone =
      data.cellphone ||
      data.phone ||
      data.phoneNumber ||
      data.contact ||
      data.contactNumber ||
      data.whatsapp ||
      "";

    if(phone){
      contactEl.value = phone;
    }
  }catch{
    topAccountName.textContent = "User";
    topAccountType.textContent = "Account";
  }
}

async function loadTopbarAnnouncementCount(){
  try{
    const res = await fetch(`${API}/api/announcements/profile-summary`, {
      headers:{ Authorization:`Bearer ${token}` }
    });

    const data = await res.json().catch(() => ({}));
    document.getElementById("navAnnouncementBadge").textContent = Number(data.count || 0);
  }catch{
    document.getElementById("navAnnouncementBadge").textContent = "0";
  }
}

function resetForm(){
  requestTypeEl.value = "";
  otherFollowUpEl.value = "";
  currentAccountTypeEl.value = "";
  syncNewAccountOptions();
  messageEl.value = "";
  setMsg("");
  updateRequestTypeUI();
}

resetBtn.addEventListener("click", resetForm);

submitBtn.onclick = async ()=>{
  setMsg("");

  const requestType = clean(requestTypeEl.value);
  const otherFollowUp = clean(otherFollowUpEl.value);
  const currentAccountType = clean(currentAccountTypeEl.value);
  const newAccountType = clean(newAccountTypeEl.value);
  const contact = clean(contactEl.value);
  const message = clean(messageEl.value);

  if(!requestType){
    return setMsg("Please select a request type.", "error");
  }

  if(requestType === "Other" && !otherFollowUp){
    return setMsg("Please specify your request:", "error");
  }

  if(requestType === "Change of account"){
    if(!currentAccountType || !newAccountType){
      return setMsg("Please select both account types.", "error");
    }
    if(currentAccountType === newAccountType){
      return setMsg("You cannot change student to student or materials to materials.", "error");
    }
  }

  if(!message){
    return setMsg("Please enter your message.", "error");
  }

  submitBtn.disabled = true;
  setMsg("Submitting...");

  const payload = {
    subject: "Maths",
    requestType,
    requestFollowUp: requestType === "Other" ? otherFollowUp : "",
    changeAccount: requestType === "Change of account"
      ? {
          currentAccountType,
          newAccountType
        }
      : null,
    message,
    contact
  };

  try{
    const r = await fetch(`${API}/api/support`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:`Bearer ${token}`
      },
      body: JSON.stringify(payload)
    });

    if(!r.ok){
      submitBtn.disabled = false;
      return setMsg("We could not submit your request. Please try again.", "error");
    }

    submitBtn.disabled = false;
    setMsg("Your support request has been submitted successfully.", "ok");
    resetForm();

  }catch{
    submitBtn.disabled = false;
    setMsg("Network error. Please try again.", "error");
  }
};

loadTopbarProfile();
loadTopbarAnnouncementCount();
syncNewAccountOptions();
updateRequestTypeUI();
</script>

</body>
</html>
