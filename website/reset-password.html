<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password</title>
</head>
<body style="font-family:Arial; max-width:520px; margin:40px auto;">
  <h2>Reset Password</h2>

  <p id="info"></p>

  <input id="newPassword" type="password" placeholder="New password (6+ characters)"
         style="width:100%; padding:10px;" />

  <button id="btn" style="margin-top:10px; padding:10px 14px;">Reset password</button>

  <p id="msg" style="margin-top:10px;"></p>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";
    const params = new URLSearchParams(location.search);

    const token = params.get("token");
    const email = params.get("email");

    const info = document.getElementById("info");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    if (!token || !email) {
      info.textContent = "Reset link is missing token or email.";
      btn.disabled = true;
    } else {
      info.textContent = `Resetting password for: ${email}`;
    }

    btn.addEventListener("click", async () => {
      const newPassword = document.getElementById("newPassword").value;

      if (!newPassword || newPassword.length < 6) {
        msg.textContent = "Password must be 6+ characters.";
        return;
      }

      btn.disabled = true;
      msg.textContent = "Resetting...";

      try {
        const res = await fetch(`${API}/api/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, email, newPassword })
        });

        const data = await res.json().catch(()=>({}));

        if (!res.ok) {
          msg.textContent = data.message || "Reset failed.";
          btn.disabled = false;
          return;
        }

        msg.textContent = "✅ Password updated. Redirecting to login...";
        setTimeout(() => location.href = "login.html", 1200);
      } catch (e) {
        msg.textContent = "Network error. Please try again.";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
