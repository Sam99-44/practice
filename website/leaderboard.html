<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Leaderboard | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;

  --bg:#ffffff;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --white:#ffffff;
  --focus:0 0 0 4px rgba(226,232,240,.7);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:"Times New Roman", Times, serif;
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

button,
select{
  font:inherit;
}

/* ===== PROFILE HEADER ===== */
.topbar{
  background:var(--nav);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
  font-family:Arial, Helvetica, sans-serif;
}

.topbar-inner{
  max-width:1150px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.accountLeft{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  cursor:default;
  user-select:none;
}

.accountIconWrap{
  width:auto;
  height:auto;
  background:transparent;
  border:none;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.accountIcon{
  width:40px;
  height:40px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.accountMeta{
  min-width:0;
  line-height:1.1;
}

.accountName{
  font-size:16px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
}

.accountType{
  font-size:13px;
  color:#e0e7ff;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
  text-transform:capitalize;
}

.topbarRight{
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
}

.iconBtn{
  min-width:50px;
  height:50px;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:0 4px;
}

.iconBtn img{
  width:30px;
  height:30px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.bellBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.bellBtn:hover{
  opacity:.92;
}

.navBadge{
  min-width:auto;
  height:auto;
  padding:0;
  margin-left:2px;
  border-radius:0;
  background:transparent;
  color:#ffd6db;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  font-family:Arial, Helvetica, sans-serif;
}

.menuBtn{
  min-width:auto;
  height:50px;
  padding:0;
  gap:8px;
  border:none;
  background:transparent;
  border-radius:0;
  box-shadow:none;
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.menuBtn:hover{
  opacity:1;
}

.menuBtnText{
  font-size:14px;
  font-weight:700;
  color:#fff;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
  top:-1px;
}

.menuBtn img{
  width:28px;
  height:28px;
  filter:brightness(0) invert(1) contrast(180%);
  display:block;
}

.menuDropdown{
  position:absolute;
  top:48px;
  right:0;
  width:210px;
  background:#f7f7f8;
  color:#111827;
  border:1px solid #d9dee7;
  border-radius:16px;
  box-shadow:0 14px 30px rgba(15,23,42,.14);
  padding:10px 0;
  display:none;
  font-family:Arial, Helvetica, sans-serif;
}

.menuDropdown.open{
  display:block;
}

.menuItem{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 18px;
  color:#111827;
  font-size:14px;
  font-weight:700;
  background:transparent;
  border:none;
  text-align:left;
  cursor:pointer;
}

.menuItem:hover{
  background:#eef2f7;
}

.menuItem img{
  width:18px;
  height:18px;
  display:block;
  flex-shrink:0;
}

.menuItem.profileTextOnly{
  padding-left:38px;
}

.menuDivider{
  height:1px;
  background:#dde4ec;
  margin:8px 0 6px;
}

.logoutMenuBtn{
  width:100%;
  border:none;
  background:transparent;
  cursor:pointer;
  text-align:left;
}

/* ===== PAGE ===== */
.wrap{
  max-width:1150px;
  margin:0 auto;
  padding:18px;
}

.section{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:0;
  box-shadow:none;
  overflow:hidden;
  margin-top:14px;
}

.sectionHead{
  background:#fff;
  border-bottom:1px solid #ececec;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:58px;
}

.sectionHead h2{
  margin:0;
  font-size:14px;
  letter-spacing:0;
  font-family:"Times New Roman", Times, serif;
  font-weight:700;
  color:#111827;
  text-transform:uppercase;
}

.sectionBody{
  padding:22px;
  background:#ffffff;
}

.filters{
  display:grid;
  grid-template-columns:repeat(3, minmax(160px, 190px));
  gap:8px;
  margin-bottom:16px;
}

.selectLike{
  width:100%;
  padding:6px 10px;
  border:1px solid #d1d5db;
  border-radius:0;
  background:#fff;
  font-size:12px;
  font-weight:600;
  color:#111827;
  outline:none;
  font-family:Arial, Helvetica, sans-serif;
  height:34px;
}

.selectLike:focus{
  border-color:#cbd5e1;
  box-shadow:var(--focus);
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1.95fr) minmax(250px,.85fr);
  gap:18px;
  align-items:start;
}

.card{
  border:1px solid #e5e7eb;
  border-radius:0;
  overflow:hidden;
  background:#fff;
  width:100%;
  box-shadow:none;
}

.cardHead{
  padding:13px 16px;
  background:#fff;
  border-bottom:1px solid #ececec;
}

.cardHead h3{
  margin:0;
  font-size:14px;
  font-weight:700;
  color:#111827;
  font-family:"Times New Roman", Times, serif;
  text-transform:uppercase;
}

.cardBody{
  padding:0;
}

.tableWrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  min-width:100%;
  table-layout:auto;
}

th,
td{
  padding:11px 12px;
  border-bottom:1px solid #ececec;
  text-align:left;
  white-space:nowrap;
}

th{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:#475569;
  font-weight:700;
  background:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

td{
  font-family:"Times New Roman", Times, serif;
  color:#111827;
}

tbody tr:last-child td{
  border-bottom:none;
}

.rank{
  width:52px;
  font-weight:700;
  color:#111827;
}

.score{
  font-weight:700;
}

.meRow{
  background:#f8fafc;
}

.summary{
  padding:14px;
  display:grid;
  gap:10px;
}

.summaryItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border:1px solid #e5e7eb;
  border-radius:0;
  background:#fff;
}

.summaryItem.currentPosition{
  border-color:#bbf7d0;
  background:#f0fdf4;
}

.summaryLabel{
  font-size:12px;
  color:#475569;
  font-weight:700;
  font-family:Arial, Helvetica, sans-serif;
  text-transform:uppercase;
  letter-spacing:.03em;
}

.summaryValue{
  font-size:14px;
  font-weight:700;
  color:#111827;
  font-family:"Times New Roman", Times, serif;
}

.summaryItem.currentPosition .summaryLabel{
  color:#166534;
}

.summaryItem.currentPosition .summaryValue{
  color:#166534;
  font-weight:700;
}

.stateRow td{
  text-align:center;
  color:#475569;
  padding:18px 12px;
}

.leaderboardSkeletonRow td{
  padding:11px 12px;
  border-bottom:1px solid #ececec;
}

.leaderboardSkeletonCell{
  height:12px;
  border-radius:4px;
  background:linear-gradient(90deg,#eef2f7 25%,#f8fafc 50%,#eef2f7 75%);
  background-size:200% 100%;
  animation:leaderboardShimmer 1.3s linear infinite;
}

@keyframes leaderboardShimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

.errorBox{
  margin-top:14px;
  padding:10px 12px;
  border-radius:0;
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  display:none;
  font-size:13px;
  font-family:Arial, Helvetica, sans-serif;
}

@media (max-width: 980px){
  .grid{
    grid-template-columns:1fr;
  }

  .filters{
    grid-template-columns:repeat(2, minmax(170px, 1fr));
  }
}

@media (max-width: 640px){
  .topbar-inner{
    padding:12px 14px;
  }

  .accountName,
  .accountType{
    max-width:120px;
  }

  .menuDropdown{
    width:200px;
  }

  .menuBtnText{
    display:none;
  }

  .wrap{
    padding:14px;
  }

  .sectionHead{
    padding:12px 14px;
    min-height:52px;
  }

  .sectionBody{
    padding:14px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .selectLike{
    width:100%;
    min-width:0;
  }

  .summary{
    padding:12px;
  }

  .summaryItem{
    padding:10px 11px;
  }

  .summaryLabel,
  .summaryValue{
    font-size:13px;
  }

  table{
    min-width:760px;
  }
}
</style>

<script>
if(!localStorage.getItem("token")){
  location.href="login.html";
}
</script>

<script>
const API = window.API || "https://practice-backend-msgn.onrender.com";
const token = localStorage.getItem("token");

const topAccountName = document.getElementById("topAccountName");
const topAccountType = document.getElementById("topAccountType");
const menuToggleBtn = document.getElementById("menuToggleBtn");
const menuDropdown = document.getElementById("menuDropdown");
const tableBody = document.getElementById("tableBody");
const gradeFilter = document.getElementById("gradeFilter");
const periodFilter = document.getElementById("periodFilter");
const provinceFilter = document.getElementById("provinceFilter");
const errorBox = document.getElementById("errorBox");

const myRank = document.getElementById("myRank");
const myAverage = document.getElementById("myAverage");
const myBest = document.getElementById("myBest");
const myAttempts = document.getElementById("myAttempts");
const myGrade = document.getElementById("myGrade");
const myProvince = document.getElementById("myProvince");

let me = null;

const LEADERBOARD_CACHE_KEY = "leaderboard_v6_cache";
const LEADERBOARD_CACHE_MAX_AGE_MS = 5 * 60 * 1000;

document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("token");
  localStorage.removeItem("username");
  localStorage.removeItem("me_cache");
  localStorage.removeItem("user");
  localStorage.removeItem("role");
  location.href = "login.html";
};

menuToggleBtn.addEventListener("click", function(e){
  e.stopPropagation();
  menuDropdown.classList.toggle("open");
});

document.addEventListener("click", function(e){
  if(!menuDropdown.contains(e.target) && !menuToggleBtn.contains(e.target)){
    menuDropdown.classList.remove("open");
  }
});

function showError(message){
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

function clearError(){
  errorBox.style.display = "none";
  errorBox.textContent = "";
}

function escapeHtml(value){
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatPercent(value){
  const num = Number(value);
  if(Number.isNaN(num)) return "-";
  return `${num}%`;
}

function buildQuery(){
  const p = new URLSearchParams();
  if(gradeFilter.value) p.set("grade", gradeFilter.value);
  if(periodFilter.value) p.set("period", periodFilter.value);
  if(provinceFilter.value) p.set("province", provinceFilter.value);
  return p.toString();
}

function isMe(row){
  if(!me || !row) return false;

  const rowUsername = String(row.username || "").trim().toLowerCase();
  const rowLearnerNumber = String(row.learnerNumber || "").trim().toLowerCase();

  const myUsername = String(me.username || "").trim().toLowerCase();
  const myLearnerNumber = String(me.learnerNumber || me.studentNumber || "").trim().toLowerCase();

  return (rowUsername && rowUsername === myUsername) ||
         (rowLearnerNumber && myLearnerNumber && rowLearnerNumber === myLearnerNumber);
}

function renderLeaderboard(rows){
  if(!Array.isArray(rows) || rows.length === 0){
    tableBody.innerHTML = `
      <tr class="stateRow">
        <td colspan="6">No data</td>
      </tr>
    `;
    setMySummary(null);
    return;
  }

  let myRow = null;

  tableBody.innerHTML = rows.map((r, i) => {
    const mine = isMe(r);
    if(mine) myRow = r;

    return `
      <tr class="${mine ? "meRow" : ""}">
        <td class="rank">#${r.rank || (i + 1)}</td>
        <td>${escapeHtml(r.learnerNumber || "-")}</td>
        <td>${escapeHtml(r.province || "-")}</td>
        <td class="score">${formatPercent(r.average)}</td>
        <td>${formatPercent(r.best)}</td>
        <td>${Number(r.attempts || 0)}</td>
      </tr>
    `;
  }).join("");

  setMySummary(myRow);
}

function setMySummary(row){
  if(row){
    myRank.textContent = `#${row.rank || "-"}`;
    myAverage.textContent = formatPercent(row.average);
    myBest.textContent = formatPercent(row.best);
    myAttempts.textContent = Number(row.attempts || 0);
    myGrade.textContent = row.grade || me?.grade || "-";
    myProvince.textContent = row.province || me?.province || "-";
    return;
  }

  myRank.textContent = "-";
  myAverage.textContent = "-";
  myBest.textContent = "-";
  myAttempts.textContent = "-";
  myGrade.textContent = me?.grade || "-";
  myProvince.textContent = me?.province || "-";
}

async function loadTopbarProfile(){
  try{
    const res = await fetch(`${API}/api/profile/me`, {
      headers:{ Authorization:`Bearer ${token}` }
    });

    if(res.status === 401){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      location.href = "login.html";
      return;
    }

    const data = await res.json().catch(()=>null);
    if(!data) return;

    me = data;

    topAccountName.textContent = data.fullName || data.username || "User";
    topAccountType.textContent = data.accountType || data.role || "Account";

    myGrade.textContent = data.grade || "-";
    myProvince.textContent = data.province || "-";
  }catch{
    topAccountName.textContent = "User";
    topAccountType.textContent = "Account";
  }
}

async function loadTopbarAnnouncementCount(){
  try{
    const res = await fetch(`${API}/api/announcements/profile-summary`, {
      headers:{ Authorization:`Bearer ${token}` }
    });

    const data = await res.json().catch(() => ({}));
    document.getElementById("navAnnouncementBadge").textContent = Number(data.count || 0);
  }catch{
    document.getElementById("navAnnouncementBadge").textContent = "0";
  }
}


function saveLeaderboardCache(filtersKey, rows){
  try{
    localStorage.setItem(LEADERBOARD_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      filtersKey,
      rows: Array.isArray(rows) ? rows : []
    }));
  }catch(err){}
}

function loadLeaderboardCache(filtersKey){
  try{
    const raw = localStorage.getItem(LEADERBOARD_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.savedAt) return null;
    if(Date.now() - Number(parsed.savedAt) > LEADERBOARD_CACHE_MAX_AGE_MS) return null;
    if(parsed.filtersKey !== filtersKey) return null;
    return Array.isArray(parsed.rows) ? parsed.rows : null;
  }catch(err){
    return null;
  }
}

async function loadLeaderboard(){
  clearError();

  const filtersKey = buildQuery();
  const cachedRows = loadLeaderboardCache(filtersKey);

  if(cachedRows){
    renderLeaderboard(cachedRows);
  }else{
    renderLeaderboardSkeleton();
  }

  try{
    const res = await fetch(`${API}/api/leaderboard?${buildQuery()}`, {
      headers:{ Authorization:`Bearer ${token}` }
    });

    const data = await res.json().catch(() => ({}));

    if(!res.ok){
      if(!cachedRows){
        tableBody.innerHTML = `
          <tr class="stateRow">
            <td colspan="6">Failed to load leaderboard</td>
          </tr>
        `;
        setMySummary(null);
      }
      showError(data.message || "Failed to load leaderboard.");
      return;
    }

    const rows = Array.isArray(data.rows) ? data.rows : [];
    renderLeaderboard(rows);
    saveLeaderboardCache(filtersKey, rows);
  }catch(err){
    if(!cachedRows){
      tableBody.innerHTML = `
        <tr class="stateRow">
          <td colspan="6">Failed to load leaderboard</td>
        </tr>
      `;
      setMySummary(null);
    }
    showError("Could not connect to the server.");
  }
}

gradeFilter.addEventListener("change", loadLeaderboard);
periodFilter.addEventListener("change", loadLeaderboard);
provinceFilter.addEventListener("change", loadLeaderboard);

(async function init(){
  await loadTopbarProfile();
  await loadTopbarAnnouncementCount();
  await loadLeaderboard();
})();
