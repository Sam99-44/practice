<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Practice | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --easy:#22c55e;
  --moderate:#3b82f6;
  --hard:#ef4444;
  --track:#e9eef5;
  --bar:#1b1648;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

button,input,select{
  font:inherit;
}

/* ===== EXACT TOPBAR ===== */
.topbar{
  background:var(--nav);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
  font-family:Arial, Helvetica, sans-serif;
}

.topbar-inner{
  max-width:1150px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.accountLeft{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  cursor:default;
  user-select:none;
}

.accountIconWrap{
  width:auto;
  height:auto;
  background:transparent;
  border:none;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.accountIcon{
  width:40px;
  height:40px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.accountMeta{
  min-width:0;
  line-height:1.1;
}

.accountName{
  font-size:16px;
  font-weight:700;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
}

.accountType{
  font-size:13px;
  color:#e0e7ff;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:220px;
  text-transform:capitalize;
}

.topbarRight{
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
}

.iconBtn{
  min-width:50px;
  height:50px;
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:0 4px;
}

.iconBtn img{
  width:30px;
  height:30px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.bellBtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.bellBtn:hover{
  opacity:.92;
}

.navBadge{
  min-width:auto;
  height:auto;
  padding:0;
  margin-left:2px;
  border-radius:0;
  background:transparent;
  color:#ffd6db;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  line-height:1;
  font-family:Arial, Helvetica, sans-serif;
}

.menuBtn{
  min-width:auto;
  height:50px;
  padding:0;
  gap:8px;
  border:none;
  background:transparent;
  border-radius:0;
  box-shadow:none;
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.menuBtn:hover{
  background:transparent;
  opacity:1;
}

.menuBtnText{
  font-size:14px;
  font-weight:700;
  color:#fff;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  position:relative;
  top:-1px;
}

.menuBtn img{
  width:28px;
  height:28px;
  filter:brightness(0) invert(1) contrast(180%);
  display:block;
}

.menuDropdown{
  position:absolute;
  top:48px;
  right:0;
  width:210px;
  background:#f7f7f8;
  color:#111827;
  border:1px solid #d9dee7;
  border-radius:16px;
  box-shadow:0 14px 30px rgba(15,23,42,.14);
  padding:10px 0;
  display:none;
  font-family:Arial, Helvetica, sans-serif;
}

.menuDropdown.open{
  display:block;
}

.menuItem{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 18px;
  color:#111827;
  font-size:14px;
  font-weight:700;
  background:transparent;
  border:none;
  text-align:left;
  cursor:pointer;
}

.menuItem:hover{
  background:#eef2f7;
}

.menuItem img{
  width:18px;
  height:18px;
  display:block;
  flex-shrink:0;
}

.menuItem.profileTextOnly{
  padding-left:38px;
}

.menuDivider{
  height:1px;
  background:#dde4ec;
  margin:8px 0 6px;
}

.logoutMenuBtn{
  width:100%;
  border:none;
  background:transparent;
  cursor:pointer;
  text-align:left;
}

/* ===== PAGE ===== */
.wrap{
  max-width:1150px;
  margin:0 auto;
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
}

.cardHead{
  padding:18px;
  border-bottom:1px solid var(--border);
}

h1{
  font-size:22px;
  margin:0;
  color:var(--nav);
}

.muted{
  font-size:14px;
  color:var(--muted);
  margin-top:5px;
}

/* CONTROLS */
.controls{
  padding:14px 18px;
  display:grid;
  grid-template-columns:1fr 160px 140px 150px;
  gap:10px;
}

.searchWrap{
  position:relative;
}

.searchWrap svg{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  color:#64748b;
  pointer-events:none;
}

input,select{
  font-family:Arial, Helvetica, sans-serif;
  font-size:14px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  width:100%;
  outline:none;
  background:#fff;
}

#search{
  padding-left:38px;
}

/* FILTER BUTTONS */
.filters{
  padding:0 18px;
  display:flex;
  gap:22px;
  border-bottom:1px solid #eee;
}

.fbtn{
  background:none;
  border:none;
  font-family:Arial, Helvetica, sans-serif;
  font-size:13px;
  cursor:pointer;
  position:relative;
  padding:10px 0;
  color:#64748b;
}

.fbtn::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-2px;
  height:3px;
  transform:scaleX(0);
  transition:.2s;
}

.fbtn[data-diff="easy"]::after{background:var(--easy)}
.fbtn[data-diff="moderate"]::after{background:var(--moderate)}
.fbtn[data-diff="hard"]::after{background:var(--hard)}
.fbtn[data-diff="all"]::after{background:#94a3b8}
.fbtn.active::after{transform:scaleX(1)}

/* TOPICS */
.topic-wrap{
  padding:18px;
}

.topic-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

.topic-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.topic-title{
  font-family:Arial, Helvetica, sans-serif;
  font-size:14px;
  font-weight:400;
  color:#0f172a;
}

.topic-stats{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-family:Arial, Helvetica, sans-serif;
  font-size:13px;
  color:#475569;
}

.progressWrap{
  margin-top:10px;
}

.progressLabels{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
  font-family:Arial, Helvetica, sans-serif;
  font-size:12px;
  color:#475569;
}

.progressTrack{
  width:100%;
  height:8px;
  background:var(--track);
  border-radius:999px;
  overflow:hidden;
}

.progressBar{
  height:100%;
  background:var(--bar);
  border-radius:999px;
  width:0%;
}

/* QUIZ */
.quiz-squares{
  display:flex;
  gap:16px;
  margin-top:12px;
  flex-wrap:wrap;
}

.quiz-square{
  width:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}

.quiz-icon-wrap{
  position:relative;
  width:64px;
  height:70px;
}

.quiz-fill{
  position:absolute;
  left:10px;
  top:10px;
  width:44px;
  height:50px;
  border-radius:6px;
}

.quiz-square.pass .quiz-fill{background:#dcfce7}
.quiz-square.fail .quiz-fill{background:#fee2e2}

.quiz-square-base{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.quiz-mark{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-family:Arial, Helvetica, sans-serif;
  font-weight:700;
  font-size:14px;
}

.quiz-q{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:18px;
  font-weight:700;
}

.quiz-number{
  font-family:Arial, Helvetica, sans-serif;
  font-size:12px;
  text-align:center;
  margin-top:2px;
}

.empty{
  font-size:14px;
  color:var(--muted);
  padding:8px 0;
}

@media (max-width:900px){
  .controls{
    grid-template-columns:1fr 1fr;
  }
}

@media (max-width:640px){
  .controls{
    grid-template-columns:1fr;
  }

  .topbar-inner{
    padding:12px 14px;
  }

  .accountName,
  .accountType{
    max-width:120px;
  }

  .menuDropdown{
    width:200px;
  }

  .menuBtnText{
    display:none;
  }
}
</style>

<script>
if(!localStorage.getItem("token")){
  location.href="login.html";
}
</script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="accountLeft">
      <div class="accountIconWrap">
        <img
          class="accountIcon"
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
          alt="Account"
        >
      </div>

      <div class="accountMeta">
        <div class="accountName" id="topAccountName">Loading...</div>
        <div class="accountType" id="topAccountType">Account</div>
      </div>
    </div>

    <div class="topbarRight">
      <a href="announcements.html" class="iconBtn bellBtn" title="Announcements" aria-label="Announcements">
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="Announcements">
        <span class="navBadge" id="navAnnouncementBadge">0</span>
      </a>

      <button class="menuBtn" id="menuToggleBtn" title="Menu" aria-label="Menu" type="button">
        <span class="menuBtnText">Menu</span>
        <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773952155/menu_q2xag6.svg" alt="Menu">
      </button>

      <div class="menuDropdown" id="menuDropdown">
        <a class="menuItem profileTextOnly" href="profile.html">
          <span>Profile</span>
        </a>

        <a class="menuItem" href="learner-quizzes.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777660/practice_ubgfso.svg" alt="">
          <span>Practice</span>
        </a>

        <a class="menuItem" href="results.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/results_qgdct1.svg" alt="Results">
          <span>Results</span>
        </a>

        <a class="menuItem" href="progress-dashboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="">
          <span>Dashboard</span>
        </a>

        <a class="menuItem" href="leaderboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777661/leaderboard_yfjgjf.svg" alt="">
          <span>Leaderboard</span>
        </a>

        <a class="menuItem" href="support.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/support_bs175s.svg" alt="">
          <span>Support</span>
        </a>

        <a class="menuItem" href="announcements.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg" alt="">
          <span>Announcements</span>
        </a>

        <div class="menuDivider"></div>

        <button class="menuItem logoutMenuBtn" id="logoutBtn" type="button">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773768418/logout_uay6y8.svg" alt="">
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card">

    <div class="cardHead">
      <h1>Practice</h1>
      <div class="muted" id="gradeText">Loading...</div>
    </div>

    <div class="controls">
      <div class="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input id="search" placeholder="Search topic or assessment">
      </div>

      <select id="topicFilter">
        <option value="all">All Topics</option>
      </select>

      <select id="paperFilter">
        <option value="all">All Papers</option>
        <option value="paper1">Paper 1</option>
        <option value="paper2">Paper 2</option>
      </select>

      <select id="periodFilter">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
      </select>
    </div>

    <div class="filters">
      <button class="fbtn active" data-diff="all">All</button>
      <button class="fbtn" data-diff="easy">Easy</button>
      <button class="fbtn" data-diff="moderate">Moderate</button>
      <button class="fbtn" data-diff="hard">Hard</button>
    </div>

    <div id="quizList" class="topic-wrap"></div>

  </div>
</div>

<script>
const API = "https://practice-backend-msgn.onrender.com";
const token = localStorage.getItem("token");

const ICON = "https://res.cloudinary.com/dopoxadlr/image/upload/v1773875474/square_ho8otg.svg";

const topAccountName = document.getElementById("topAccountName");
const topAccountType = document.getElementById("topAccountType");
const menuToggleBtn = document.getElementById("menuToggleBtn");
const menuDropdown = document.getElementById("menuDropdown");
const logoutBtn = document.getElementById("logoutBtn");

const searchEl = document.getElementById("search");
const topicFilter = document.getElementById("topicFilter");
const paperFilter = document.getElementById("paperFilter");
const periodFilter = document.getElementById("periodFilter");

let quizzes = [];
let resultsMap = {};
let diff = "all";

/* ===== MENU ===== */
if(logoutBtn){
  logoutBtn.onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("me_cache");
    localStorage.removeItem("user");
    localStorage.removeItem("role");
    location.href = "login.html";
  };
}

if(menuToggleBtn && menuDropdown){
  menuToggleBtn.addEventListener("click", function(e){
    e.stopPropagation();
    menuDropdown.classList.toggle("open");
  });

  document.addEventListener("click", function(e){
    if(!menuDropdown.contains(e.target) && !menuToggleBtn.contains(e.target)){
      menuDropdown.classList.remove("open");
    }
  });
}

/* ===== TOPBAR PROFILE ===== */
async function loadTopbarProfile(){
  try{
    const res = await fetch(`${API}/api/profile/me`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    if(res.status === 401){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      location.href = "login.html";
      return;
    }

    const data = await res.json();

    topAccountName.textContent = data.fullName || data.username || "User";
    topAccountType.textContent = data.accountType || data.role || "Account";
  }catch(err){
    topAccountName.textContent = "User";
    topAccountType.textContent = "Account";
  }
}

/* ===== TOPBAR ANNOUNCEMENT COUNT ===== */
async function loadTopbarAnnouncementCount(){
  try{
    const res = await fetch(`${API}/api/announcements/profile-summary`, {
      headers: { Authorization: `Bearer ${token}` }
    });

    const data = await res.json().catch(() => ({}));
    document.getElementById("navAnnouncementBadge").textContent = Number(data.count || 0);
  }catch(err){
    document.getElementById("navAnnouncementBadge").textContent = "0";
  }
}

/* ===== QUIZ STATE ===== */
function getState(id){
  const r = resultsMap[id];
  if(!r) return {type:"new"};

  const score = Number(r.score || 0);
  const total = Number(r.total || 0);
  const percent = total ? Math.round((score / total) * 100) : Math.round(Number(r.percent || 0));

  return {
    type:"done",
    score: percent + "%",
    state: percent >= 50 ? "pass" : "fail",
    percent
  };
}

function isWithinPeriod(dateValue, period){
  if(period === "all") return true;
  if(!dateValue) return false;

  const d = new Date(dateValue);
  if(Number.isNaN(d.getTime())) return false;

  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  if(period === "today"){
    return d >= todayStart;
  }

  if(period === "week"){
    const day = todayStart.getDay();
    const diffToMonday = (day === 0 ? 6 : day - 1);
    const weekStart = new Date(todayStart);
    weekStart.setDate(todayStart.getDate() - diffToMonday);
    return d >= weekStart;
  }

  if(period === "month"){
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    return d >= monthStart;
  }

  return true;
}

/* ===== FILTER ===== */
function apply(){
  const q = searchEl.value.toLowerCase().trim();

  const filtered = quizzes.filter(x => {
    const title = String(x.title || "").toLowerCase();
    const topic = String(x.topic || "").toLowerCase();
    const paper = String(x.paper || "").toLowerCase();
    const difficulty = String(x.difficulty || "").toLowerCase();

    const matchesSearch = !q || title.includes(q) || topic.includes(q);
    const matchesTopic = topicFilter.value === "all" || x.topic === topicFilter.value;
    const matchesPaper = paperFilter.value === "all" || paper === paperFilter.value;
    const matchesDiff = diff === "all" || difficulty === diff;
    const matchesPeriod = isWithinPeriod(x.createdAt || x.updatedAt, periodFilter.value);

    return matchesSearch && matchesTopic && matchesPaper && matchesDiff && matchesPeriod;
  });

  render(filtered);
}

/* ===== TOPIC STATS ===== */
function getTopicStats(topicQuizzes){
  const attempted = topicQuizzes.filter(q => resultsMap[q._id]);
  const completed = attempted.length;
  const total = topicQuizzes.length;
  const progress = total ? Math.round((completed / total) * 100) : 0;

  let avg = 0;
  if(completed){
    const sum = attempted.reduce((acc, q) => {
      const r = resultsMap[q._id];
      const score = Number(r.score || 0);
      const totalMarks = Number(r.total || 0);
      const percent = totalMarks ? Math.round((score / totalMarks) * 100) : Math.round(Number(r.percent || 0));
      return acc + percent;
    }, 0);
    avg = Math.round(sum / completed);
  }

  return {completed, total, progress, avg};
}

/* ===== RENDER ===== */
function render(list){
  if(!list.length){
    document.getElementById("quizList").innerHTML = `<div class="empty">No assessments found.</div>`;
    return;
  }

  const groups = {};
  list.forEach(q => {
    const topic = q.topic || "General";
    if(!groups[topic]) groups[topic] = [];
    groups[topic].push(q);
  });

  const html = Object.keys(groups).sort().map(topic => {
    const topicQuizzes = groups[topic].sort((a, b) => {
      return new Date(a.createdAt) - new Date(b.createdAt);
    });

    const stats = getTopicStats(topicQuizzes);

    return `
    <div class="topic-card">
      <div class="topic-top">
        <div class="topic-title">${escapeHtml(topic)}</div>
        <div class="topic-stats">
          <span>Average: ${stats.avg}%</span>
          <span>Completed: ${stats.completed}/${stats.total}</span>
        </div>
      </div>

      <div class="progressWrap">
        <div class="progressLabels">
          <span>Progress</span>
          <span>${stats.progress}%</span>
        </div>
        <div class="progressTrack">
          <div class="progressBar" style="width:${stats.progress}%"></div>
        </div>
      </div>

      <div class="quiz-squares">
        ${topicQuizzes.map((q, i) => {
          const s = getState(q._id);
          return `
          <div class="quiz-square ${s.state || ""}" onclick="location.href='attempt.html?quizId=${encodeURIComponent(q._id || "")}'">
            <div class="quiz-icon-wrap">
              <div class="quiz-fill"></div>
              <img src="${ICON}" class="quiz-square-base" alt="Quiz">
              ${
                s.type === "new"
                  ? `<div class="quiz-q">?</div>`
                  : `<div class="quiz-mark">${escapeHtml(s.score)}</div>`
              }
            </div>
            <div class="quiz-number">${i + 1}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");

  document.getElementById("quizList").innerHTML = html;
}

/* ===== HELPERS ===== */
function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ===== EVENTS ===== */
document.querySelectorAll(".fbtn").forEach(b => {
  b.onclick = () => {
    diff = b.dataset.diff;
    document.querySelectorAll(".fbtn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    apply();
  };
});

searchEl.oninput = apply;
topicFilter.onchange = apply;
paperFilter.onchange = apply;
periodFilter.onchange = apply;

/* ===== LOAD ===== */
async function loadPage(){
  try{
    const meRes = await fetch(`${API}/api/auth/me`, {
      headers:{Authorization:`Bearer ${token}`}
    });

    if(meRes.status === 401){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      location.href = "login.html";
      return;
    }

    const me = await meRes.json();
    document.getElementById("gradeText").textContent = "Grade: " + (me.grade || "-");

    const quizzesRes = await fetch(`${API}/api/quizzes`, {
      headers:{Authorization:`Bearer ${token}`}
    });
    quizzes = await quizzesRes.json().catch(() => []);
    if(!Array.isArray(quizzes)) quizzes = [];

    const resultsRes = await fetch(`${API}/api/results/my`, {
      headers:{Authorization:`Bearer ${token}`}
    });
    const results = await resultsRes.json().catch(() => []);
    const safeResults = Array.isArray(results) ? results : [];

    resultsMap = {};
    safeResults.forEach(r => {
      const id = r.quizId?._id || r.quizId;
      if(id) resultsMap[id] = r;
    });

    const topics = [...new Set(
      quizzes
        .map(q => q.topic || "General")
        .filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));

    topicFilter.innerHTML =
      `<option value="all">All Topics</option>` +
      topics.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");

    apply();
  }catch(err){
    document.getElementById("quizList").innerHTML = `<div class="empty">Could not load quizzes.</div>`;
  }
}

loadTopbarProfile();
loadTopbarAnnouncementCount();
loadPage();
</script>

</body>
</html>
