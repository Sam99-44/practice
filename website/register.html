<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account | Practice Online</title>

  <meta name="robots" content="noindex, nofollow" />

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --nav:#1b1648;
      --red:#e11d2e;
      --radius:0px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      font-weight:400;
    }

    .topbar{background:var(--nav); padding:14px 20px;}
    .navBar{
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .brand{
      color:#fff;
      font-weight:600;
      text-decoration:none;
      font-size:18px;
      letter-spacing:.2px;
    }

    .tabs{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}

    .tabs a{
      color:#c7c9e3;
      text-decoration:none;
      font-weight:500;
      padding-bottom:6px;
      border-bottom:3px solid transparent;
    }

    .tabs a:hover{color:#fff}
    .tabs a.active{color:#fff; border-bottom:3px solid var(--red);}

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:24px;
      min-height:calc(100vh - 64px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width:560px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }

    h2{
      margin:0 0 6px;
      font-size:22px;
      font-weight:600;
    }

    p{
      margin:6px 0 14px;
      color:var(--muted);
      font-weight:400;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:500;
      font-size:14px;
    }

input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:0;
  border:1px solid #ddd;
  background:#fff;
  font-size:14px;
  outline:none;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:400;
    }

textarea{
  resize:vertical;
  min-height:90px;
}

    input:focus,select:focus,textarea:focus{
      border-color:#cfe9ff;
      box-shadow:0 0 0 4px rgba(11,60,93,.10);
    }

    .checkGroup{
      display:grid;
      gap:8px;
      margin-top:8px;
    }

    .checkGroup label{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0;
      font-weight:500;
      color:#334155;
      font-size:14px;
    }

    .checkGroup input{
      width:auto;
      margin:0;
    }

    .charCount{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
      text-align:right;
    }

    .fieldHelp{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
      line-height:1.4;
    }

    .radioRow{
      display:flex;
      gap:16px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .radioRow label{
      font-weight:500;
      margin-top:0;
      display:flex;
      align-items:center;
      gap:8px;
      color:#334155;
    }

    .radioRow input{
      width:auto;
      margin:0;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    .row.oneCol{
      grid-template-columns:1fr;
    }

    @media(max-width:520px){
      .wrap{padding:16px;}
      .row{grid-template-columns:1fr}
    }

    .btn{
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:0px;
      padding:12px;
      font-weight:600;
      cursor:pointer;
      width:100%;
      transition:transform .08s ease, box-shadow .2s ease;
      font-family:Arial, Helvetica, sans-serif;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 24px rgba(11,60,93,.18);
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .ghost{
      background:#fff;
      border:1px solid #ddd;
      border-radius:0px;
      padding:12px;
      font-weight:500;
      cursor:pointer;
      width:100%;
      font-family:Arial, Helvetica, sans-serif;
    }

    .ghost:hover{background:var(--accent-soft);}

    .msg{
      margin-top:10px;
      font-size:14px;
      font-weight:400;
    }

    .error{color:var(--error)}
    .ok{color:var(--ok)}

    .links{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:12px;
      font-size:14px;
      flex-wrap:wrap;
    }

    .links a{
      color:var(--accent);
      text-decoration:none;
      font-weight:500;
    }

    .links a:hover{text-decoration:underline}

    .hide{display:none !important;}

.noteBox{
  background:var(--accent-soft);
  border:1px solid #d8e6f3;
  border-radius:0;
  padding:12px;
  margin:10px 0 12px;
  color:#0f172a;
  font-weight:400;
}

.noteBox b{
  display:block;
  margin-bottom:4px;
  font-weight:600;
}

.noteBox span{
  display:block;
  line-height:1.45;
}
  </style>
</head>

<body>

<header class="topbar">
  <div class="navBar">
    <a href="index.html" class="brand">Practice Online</a>
    <div class="tabs">
      <a href="login.html">Login</a>
      <a href="register.html" class="active">Register</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h2>Register Account</h2>
    <p>Create your Practice Online account</p>

    <div class="noteBox" id="acctNote">
      <b id="acctNoteTitle">Choose Account Type</b>
      <span id="acctNoteText">Please choose Learner, Practice or Guest Account to continue.</span>
    </div>

    <label>Account Type</label>
    <div class="radioRow">
      <label><input type="radio" name="accountType" value="learner"> Learner Account</label>
      <label><input type="radio" name="accountType" value="practice"> Practice Account</label>
      <label><input type="radio" name="accountType" value="guest"> Guest Account</label>
    </div>

    <div class="row">
      <div>
        <label for="firstName">First Name</label>
        <input id="firstName" />
      </div>
      <div>
        <label for="surname">Surname</label>
        <input id="surname" />
      </div>
    </div>

    <div id="usernameWrap">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" />
    </div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" />

    <label>Are you in South Africa?</label>
    <div class="radioRow">
      <label><input type="radio" name="isSA" value="yes" checked> Yes</label>
      <label><input type="radio" name="isSA" value="no"> No</label>
    </div>

    <div id="saWrap">
      <label for="province">Province</label>
      <select id="province">
        <option value="" selected>Select Province</option>
        <option value="Eastern Cape">Eastern Cape</option>
        <option value="Free State">Free State</option>
        <option value="Gauteng">Gauteng</option>
        <option value="KwaZulu-Natal">KwaZulu-Natal</option>
        <option value="Limpopo">Limpopo</option>
        <option value="Mpumalanga">Mpumalanga</option>
        <option value="Northern Cape">Northern Cape</option>
        <option value="North West">North West</option>
        <option value="Western Cape">Western Cape</option>
      </select>

      <label for="district">District</label>
      <select id="district" disabled>
        <option value="" selected>Select District</option>
      </select>
    </div>

    <div id="genderWrap">
      <label for="gender">Gender</label>
      <select id="gender">
        <option value="" selected>Select Gender</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="prefer_not_to_say">Prefer not to say</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="row" id="phoneRow">
      <div>
        <label for="cellphone">Your Cellphone</label>
        <input id="cellphone" inputmode="tel" placeholder="+27" />
   
      </div>
      <div id="guardianCellphoneWrap">
        <label for="guardianCellphone">Guardian Cellphone</label>
        <input id="guardianCellphone" inputmode="tel" placeholder="+27" />
      </div>
    </div>

    <div id="gradeWrap">
      <label for="grade">Grade</label>
      <select id="grade">
        <option value="" selected>Select Grade</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select>
    </div>

    <div id="curriculumWrap">
      <label for="curriculum">Curriculum</label>
      <select id="curriculum">
        <option value="" selected>Select Curriculum</option>
        <option value="CAPS">CAPS</option>
        <option value="IEB">IEB</option>
      </select>
    </div>

    <div id="guestWrap" class="hide">
      <label>Reason for Visiting</label>
      <div class="checkGroup">
        <label><input type="checkbox" name="guestReasons" value="parent_guardian"> Parent / Guardian</label>
        <label><input type="checkbox" name="guestReasons" value="tutoring_service"> Another Tutoring Service</label>
        <label><input type="checkbox" name="guestReasons" value="school_institution"> School / Institution</label>
        <label><input type="checkbox" name="guestReasons" value="request_information"> Request Information</label>
        <label><input type="checkbox" name="guestReasons" value="request_quote"> Request a Quote</label>
        <label><input type="checkbox" name="guestReasons" value="partnership"> Partnership Opportunity</label>
        <label><input type="checkbox" name="guestReasons" value="research"> Research Purposes</label>
        <label><input type="checkbox" name="guestReasons" value="exploring"> Exploring the Platform</label>
        <label><input type="checkbox" name="guestReasons" value="other" id="guestReasonOther"> Other</label>
      </div>

      <div id="otherReasonWrap" class="hide">
        <label for="otherReason">Please Specify</label>
        <input id="otherReason" placeholder="Please tell us your reason for visiting" />
      </div>

      <label for="guestMessage">Message</label>
      <textarea id="guestMessage" maxlength="255" rows="4" placeholder="Tell us more about your visit..."></textarea>
      <div class="charCount" id="guestMessageCount">255 characters remaining</div>
    </div>

    <div id="schoolNameWrap">
      <label for="schoolName">School Name</label>
      <input id="schoolName" />
    </div>

    <div id="currentWrap">
      <label for="currentMarkRange">Current Mark</label>
      <select id="currentMarkRange">
        <option value="" selected>Select Current Mark</option>
        <option value="0-29">0-29</option>
        <option value="30-39">30-39</option>
        <option value="40-49">40-49</option>
        <option value="50-59">50-59</option>
        <option value="60-69">60-69</option>
        <option value="70-79">70-79</option>
        <option value="80-100">80-100</option>
      </select>
    </div>

    <div class="row">
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" />
      </div>
      <div>
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" />
      </div>
    </div>

    <div class="row">
      <button id="registerBtn" class="btn" type="button">Register</button>
      <button id="toggleBtn" class="ghost" type="button">Show Password</button>
    </div>

    <p id="msg" class="msg"></p>

    <div class="links">
      <a href="login.html">Login</a>
      <a href="reset-otp.html">Forgot password?</a>
    </div>
  </div>
</main>

<script>
  const API = "https://api.practiceonline.co.za";

  const msg = document.getElementById("msg");
  const btn = document.getElementById("registerBtn");

  const acctNoteTitle = document.getElementById("acctNoteTitle");
  const acctNoteText  = document.getElementById("acctNoteText");

  const firstNameEl = document.getElementById("firstName");
  const surnameEl = document.getElementById("surname");
  const usernameWrap = document.getElementById("usernameWrap");
  const usernameEl = document.getElementById("username");
  const emailEl = document.getElementById("email");

  const gradeWrap = document.getElementById("gradeWrap");
  const gradeEl = document.getElementById("grade");
  const curriculumWrap = document.getElementById("curriculumWrap");
  const curriculumEl = document.getElementById("curriculum");

  const guestWrap = document.getElementById("guestWrap");
  const guestReasonOtherEl = document.getElementById("guestReasonOther");
  const otherReasonWrap = document.getElementById("otherReasonWrap");
  const otherReasonEl = document.getElementById("otherReason");
  const guestMessageEl = document.getElementById("guestMessage");
  const guestMessageCountEl = document.getElementById("guestMessageCount");

  const schoolNameWrap = document.getElementById("schoolNameWrap");
  const schoolNameEl = document.getElementById("schoolName");
  const currentWrap = document.getElementById("currentWrap");
  const currentMarkRangeEl = document.getElementById("currentMarkRange");

  const passwordEl = document.getElementById("password");
  const confirmEl = document.getElementById("confirmPassword");
  const toggleBtn = document.getElementById("toggleBtn");

  const saWrap = document.getElementById("saWrap");
  const provinceEl = document.getElementById("province");
  const districtEl = document.getElementById("district");

  const genderWrap = document.getElementById("genderWrap");
  const genderEl = document.getElementById("gender");

  const phoneRow = document.getElementById("phoneRow");
  const cellphoneEl = document.getElementById("cellphone");
  const guardianCellphoneWrap = document.getElementById("guardianCellphoneWrap");
  const guardianCellEl = document.getElementById("guardianCellphone");

  function setMsg(text, type = "") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function cleanSpaces(s) {
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  function accountType() {
    return String(
      document.querySelector('input[name="accountType"]:checked')?.value || ""
    )
      .trim()
      .toLowerCase();
  }

  function isSA() {
    return document.querySelector('input[name="isSA"]:checked')?.value === "yes";
  }

  function updateAccountNote() {
    const t = accountType();

    if (!t) {
      acctNoteTitle.textContent = "Choose Account Type";
      acctNoteText.textContent =
        "Select the account that best matches how you will use Practice Online.";
      return;
    }

    if (t === "learner") {
      acctNoteTitle.textContent = "Learner Account";
      acctNoteText.textContent =
        "Join classes, complete assignments, write quizzes and access all learning services.";
      return;
    }

    if (t === "practice") {
      acctNoteTitle.textContent = "Practice Account";
      acctNoteText.textContent =
        "Practice Mathematics independently using quizzes, activities, homework and assignments.";
      return;
    }

    if (t === "guest") {
      acctNoteTitle.textContent = "Guest Account";
      acctNoteText.textContent =
        "Explore Practice Online, request information, request a quote or learn about our services.";
      return;
    }
  }

  function updateGuestMessageCount() {
    const remaining = 255 - String(guestMessageEl.value || "").length;
    guestMessageCountEl.textContent = `${remaining} characters remaining`;
  }

  function selectedGuestReasons() {
    return [...document.querySelectorAll('input[name="guestReasons"]:checked')]
      .map(cb => cb.value);
  }

  function updateOtherReasonField() {
    const show = Boolean(guestReasonOtherEl?.checked);
    otherReasonWrap.classList.toggle("hide", !show);

    if (!show) {
      otherReasonEl.value = "";
    }
  }

  guestReasonOtherEl.addEventListener("change", updateOtherReasonField);

  function normalizePhone(value) {
    return String(value || "").replace(/\s+/g, "");
  }

  function isValidSouthAfricanPhone(value) {
    const phone = normalizePhone(value);
    return /^\+27[6-8][0-9]{8}$/.test(phone);
  }

  function makeGuestUsername(firstName, surname, email) {
    const base = cleanSpaces(`${firstName} ${surname}`)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ".")
      .replace(/^\.+|\.+$/g, "");

    const emailBase = String(email || "")
      .split("@")[0]
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, ".")
      .replace(/^\.+|\.+$/g, "");

    const seed = base || emailBase || "guest";
    return `${seed}.guest.${Date.now().toString().slice(-5)}`;
  }

  function toggleAccountFields() {
    const t = accountType();
    const isLearner = t === "learner";
    const isPractice = t === "practice";
    const isGuest = t === "guest";
    const isLearnerOrPractice = isLearner || isPractice;

    usernameWrap.style.display = isGuest ? "none" : "block";
    genderWrap.style.display = isGuest ? "none" : "block";

    gradeWrap.style.display = isLearnerOrPractice ? "block" : "none";
    curriculumWrap.style.display = isLearnerOrPractice ? "block" : "none";

    schoolNameWrap.style.display = isLearner ? "block" : "none";
    currentWrap.style.display = isLearner ? "block" : "none";

    guardianCellphoneWrap.style.display = isLearner ? "block" : "none";
    phoneRow.classList.toggle("oneCol", !isLearner);

    guestWrap.classList.toggle("hide", !isGuest);

    if (!isLearnerOrPractice) {
      gradeEl.value = "";
      curriculumEl.value = "";
    }

    if (!isLearner) {
      schoolNameEl.value = "";
      currentMarkRangeEl.value = "";
      guardianCellEl.value = "";
    }

    if (isGuest) {
      usernameEl.value = "";
      genderEl.value = "";
    }

    if (!isGuest) {
      document.querySelectorAll('input[name="guestReasons"]').forEach(cb => cb.checked = false);
      otherReasonEl.value = "";
      updateOtherReasonField();
      guestMessageEl.value = "";
      updateGuestMessageCount();
    }
  }

  document.querySelectorAll('input[name="accountType"]').forEach(radio => {
    radio.addEventListener("change", () => {
      updateAccountNote();
      toggleAccountFields();
    });
  });

  guestMessageEl.addEventListener("input", updateGuestMessageCount);

  function ensurePlus27(el) {
    el.addEventListener("focus", () => {
      if (!el.value.trim()) el.value = "+27";
    });

    el.addEventListener("blur", () => {
      if (el.value.trim() === "+27") el.value = "";
    });
  }

  ensurePlus27(cellphoneEl);
  ensurePlus27(guardianCellEl);

  toggleBtn.onclick = () => {
    const show = passwordEl.type === "password";
    passwordEl.type = confirmEl.type = show ? "text" : "password";
    toggleBtn.textContent = show ? "Hide Password" : "Show Password";
  };

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btn.click();
  });

  const DISTRICTS_BY_PROVINCE = {
    "Eastern Cape": [
      "Buffalo City (Metro)",
      "Nelson Mandela Bay (Metro)",
      "Amathole",
      "Chris Hani",
      "Joe Gqabi",
      "OR Tambo",
      "Sarah Baartman"
    ],
    "Free State": [
      "Mangaung (Metro)",
      "Fezile Dabi",
      "Lejweleputswa",
      "Thabo Mofutsanyana",
      "Xhariep"
    ],
    "Gauteng": [
      "City of Johannesburg (Metro)",
      "City of Tshwane (Metro)",
      "Ekurhuleni (Metro)",
      "Sedibeng",
      "West Rand"
    ],
    "KwaZulu-Natal": [
      "eThekwini (Metro)",
      "Amajuba",
      "Harry Gwala",
      "iLembe",
      "King Cetshwayo",
      "Ugu",
      "uMgungundlovu",
      "uMkhanyakude",
      "uMzinyathi",
      "uThukela",
      "Zululand"
    ],
    "Limpopo": [
      "Capricorn",
      "Mopani",
      "Sekhukhune",
      "Vhembe",
      "Waterberg"
    ],
    "Mpumalanga": [
      "Ehlanzeni",
      "Gert Sibande",
      "Nkangala"
    ],
    "Northern Cape": [
      "Frances Baard",
      "John Taolo Gaetsewe",
      "Namakwa",
      "Pixley ka Seme",
      "ZF Mgcawu"
    ],
    "North West": [
      "Bojanala Platinum",
      "Dr Kenneth Kaunda",
      "Dr Ruth Segomotsi Mompati",
      "Ngaka Modiri Molema"
    ],
    "Western Cape": [
      "City of Cape Town (Metro)",
      "Cape Winelands",
      "Central Karoo",
      "Garden Route",
      "Overberg",
      "West Coast"
    ]
  };

  function resetDistrict() {
    districtEl.innerHTML = `<option value="" selected>Select District</option>`;
    districtEl.disabled = true;
  }

  function populateDistricts() {
    const prov = provinceEl.value;
    const list = DISTRICTS_BY_PROVINCE[prov] || [];

    resetDistrict();

    if (!prov || !list.length) return;

    const frag = document.createDocumentFragment();

    list.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      frag.appendChild(opt);
    });

    districtEl.appendChild(frag);
    districtEl.disabled = false;
  }

  provinceEl.addEventListener("change", populateDistricts);

  function toggleSAFields() {
    const yes = isSA();

    saWrap.classList.toggle("hide", !yes);

    if (!yes) {
      provinceEl.value = "";
      resetDistrict();
    } else {
      populateDistricts();
    }
  }

  document.querySelectorAll('input[name="isSA"]').forEach(radio => {
    radio.addEventListener("change", toggleSAFields);
  });

  toggleAccountFields();
  updateAccountNote();
  updateGuestMessageCount();
  updateOtherReasonField();
  toggleSAFields();

  btn.onclick = async () => {
    const type = accountType();

    const firstName = cleanSpaces(firstNameEl.value);
    const surname = cleanSpaces(surnameEl.value);
    const fullName = cleanSpaces(firstName + " " + surname);
    const email = emailEl.value.trim().toLowerCase();

    const usernameInput = cleanSpaces(usernameEl.value);
    const username = type === "guest"
      ? makeGuestUsername(firstName, surname, email)
      : usernameInput;

    const schoolName = cleanSpaces(schoolNameEl.value);
    const currentMarkRange = currentMarkRangeEl.value;
    const curriculum = curriculumEl.value.trim();
    const guestReasons = selectedGuestReasons();
    const otherReason = cleanSpaces(otherReasonEl.value);
    const guestMessage = cleanSpaces(guestMessageEl.value);

    const gender = genderEl.value.trim();
    const cellphone = cellphoneEl.value.trim();
    const guardianCellphone = guardianCellEl.value.trim();

    const province = isSA() ? provinceEl.value.trim() : "";
    const district = isSA() ? districtEl.value.trim() : "";

    const payload = {
      firstName,
      surname,
      fullName,
      username,
      email,
      password: passwordEl.value,
      accountType: type,
      enrollmentStatus: type === "learner" ? "pending" : "not_required",
      phoneVerified: false,

      grade:
        type === "learner" || type === "practice"
          ? gradeEl.value === ""
            ? null
            : Number(gradeEl.value)
          : null,

      curriculum:
        type === "learner" || type === "practice"
          ? curriculum
          : "",

      guestReasons:
        type === "guest"
          ? guestReasons
          : [],

      otherReason:
        type === "guest"
          ? otherReason
          : "",

      guestMessage:
        type === "guest"
          ? guestMessage
          : "",

      schoolName:
        type === "learner"
          ? schoolName
          : "",

      currentMarkRange:
        type === "learner"
          ? currentMarkRange
          : "",

      gender:
        type === "guest"
          ? ""
          : gender,

      province,
      district,

      cellphone: normalizePhone(cellphone),

      guardianCellphone:
        type === "learner"
          ? normalizePhone(guardianCellphone)
          : ""
    };

    if (!type) {
      return setMsg("Please choose an account type.", "error");
    }

    if (!firstName || !surname) {
      return setMsg("Please enter your first name and surname.", "error");
    }

    if (type !== "guest" && !payload.username) {
      return setMsg("Please complete your username.", "error");
    }

    if (!payload.email || !payload.password) {
      return setMsg("Please complete email and password.", "error");
    }

    if (!payload.cellphone) {
      return setMsg("Please enter your cellphone number.", "error");
    }

    if (!isValidSouthAfricanPhone(payload.cellphone)) {
      return setMsg("Please enter a valid South African cellphone number in this format: +27821234567.", "error");
    }

    const strongPasswordRegex =
      /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

    if (!strongPasswordRegex.test(String(payload.password))) {
      return setMsg(
        "Password must be at least 8 characters and include uppercase, lowercase, number, and special character.",
        "error"
      );
    }

    if (payload.password !== confirmEl.value) {
      return setMsg("Passwords do not match.", "error");
    }

    if (
      (type === "learner" || type === "practice") &&
      (!Number.isInteger(payload.grade) ||
        payload.grade < 8 ||
        payload.grade > 12)
    ) {
      return setMsg("Please select a grade from Grade 8 to Grade 12.", "error");
    }

    if ((type === "learner" || type === "practice") && !payload.curriculum) {
      return setMsg("Please select your curriculum: CAPS or IEB.", "error");
    }

    if (isSA() && province && !district) {
      return setMsg("Please select your district.", "error");
    }

    if (type === "guest") {
      if (!province) {
        return setMsg("Please select your province.", "error");
      }

      if (!district) {
        return setMsg("Please select your district.", "error");
      }

      if (!guestReasons.length) {
        return setMsg("Please select at least one reason for visiting.", "error");
      }

      if (guestReasons.includes("other") && !otherReason) {
        return setMsg("Please specify your reason for visiting.", "error");
      }

      if (guestMessage.length > 255) {
        return setMsg("Guest message cannot exceed 255 characters.", "error");
      }
    }

    try {
      btn.disabled = true;
      setMsg("Creating account...");

      const res = await fetch(API + "/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        btn.disabled = false;
        return setMsg(data.message || "Registration failed.", "error");
      }

      setMsg(
        "Registration successful! Please verify your email and cellphone number before logging in.",
        "ok"
      );

      btn.disabled = false;

      document.querySelectorAll("input, select, textarea").forEach(el => {
        el.disabled = true;
      });

      setTimeout(() => {
        location.href = "verify-email-notice.html";
      }, 2500);

    } catch {
      btn.disabled = false;
      setMsg("Network error. Please try again.", "error");
    }
  };
</script>

</body>
</html>
