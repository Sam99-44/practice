<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --bg:#f3f5f9;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --accent:#0b3c5d;
  --shadow:0 8px 22px rgba(0,0,0,.06);
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* TOPBAR */
.topbar{
  background:var(--nav);
  color:#fff;
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:14px;
  font-weight:700;
}

.sub{
  font-size:13px;
  font-weight:700;
}

.links-top a{
  color:#fff;
  margin-left:16px;
  font-size:14px;
  font-weight:700;
  text-decoration:none;
}

/* PAGE */
.wrap{
  display:flex;
  justify-content:center;
  padding-top:90px;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
}

h2{
  margin:0;
  font-size:22px;
  font-weight:700;
}

.subtext{
  margin:12px 0 18px;
  color:#48607d;
  font-size:14px;
}

input{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid #d6d6d6;
  margin-top:6px;
}

button{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.msg{
  margin-top:12px;
  font-size:14px;
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="brand">Practice Online</div>
      <div class="sub">Reset password</div>
    </div>
    <div class="links-top">
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card">

    <h2>Reset Password</h2>
    <p class="subtext">Enter your new password below.</p>

    <input id="pass" type="password" placeholder="New password">
    <input id="confirm" type="password" placeholder="Confirm password">

    <button onclick="reset()">Reset Password</button>

    <p id="msg" class="msg"></p>

  </div>
</div>

<script>
const API="https://practice-backend-msgn.onrender.com";
const token=new URLSearchParams(location.search).get("token");

async function reset(){
  const msgEl=document.getElementById("msg");

  if(pass.value !== confirm.value){
    msgEl.textContent="Passwords do not match";
    msgEl.style.color="red";
    return;
  }

  const r=await fetch(API+"/api/reset-password",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token,newPassword:pass.value})
  });

  const d=await r.json();

  msgEl.textContent=d.message;
  msgEl.style.color = r.ok ? "green" : "red";
}
</script>

</body>
</html>
