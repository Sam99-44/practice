<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Join Online Mathematics Classes</title>

<style>
:root{
  --nav:#1b1648;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#222222;
  --muted:#5f6b7a;
  --ok:#065f46;
  --error:#b91c1c;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:"Times New Roman", Times, serif;
  background:#ffffff;
  color:var(--text);
}

button,input,textarea,select,option{
  font-family:"Times New Roman", Times, serif;
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:0;
  box-shadow:none;
  overflow:hidden;
  max-width:860px;
  margin:0 auto;
}
.cardHead{
  padding:14px 22px;
  border-bottom:1px solid #ececec;
  background:#fff;
}

.cardHead h1{
  margin:0;
  font-size:14px;
  font-weight:700;
  text-transform:uppercase;
}

.cardHead .subText{
  margin-top:6px;
  color:#111827;
  font-size:14px;
  line-height:1.45;
}

.body{
  padding:22px;
}

label{
  font-weight:400;
}
/* ===== TOPBAR ===== */

.topbar{
  background:var(--nav);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar-inner{
  max-width:1150px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.accountLeft{
  display:flex;
  align-items:center;
  gap:12px;
}

.accountIcon{
  width:40px;
  height:40px;
  filter:brightness(0) invert(1);
}

.accountName{
  font-size:16px;
  font-weight:700;
}

.accountType{
  font-size:13px;
  color:#e0e7ff;
  margin-top:2px;
}

.topbarRight{
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
}

.iconBtn{
  background:none;
  border:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.iconBtn img{
  width:28px;
  height:28px;
  filter:brightness(0) invert(1);
}

.navBadge{
  position:absolute;
  top:-2px;
  right:-4px;
  background:var(--red);
  color:#fff;
  font-size:8px;
  min-width:13px;
  height:13px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.menuBtn{
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
}

.menuBtn img{
  width:28px;
  height:28px;
  filter:brightness(0) invert(1);
}

.menuDropdown{
  position:absolute;
  top:48px;
  right:0;
  width:220px;
  background:#fff;
  border:1px solid #d9dee7;
  border-radius:14px;
  box-shadow:0 14px 30px rgba(15,23,42,.15);
  display:none;
  overflow:hidden;
}

.menuDropdown.open{
  display:block;
}

.menuItem{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  font-size:14px;
  font-weight:700;
  color:#111827;
}

.menuItem:hover{
  background:#f3f4f6;
}

.menuItem img{
  width:18px;
  height:18px;
}

.menuDivider{
  height:1px;
  background:#e5e7eb;
}

.logoutMenuBtn{
  width:100%;
  border:none;
  background:none;
  cursor:pointer;
  text-align:left;
}

/* ===== PAGE ===== */

.wrap{
  max-width:900px;
  margin:0 auto;
  padding:22px;
}

label{
  display:block;
  margin-top:16px;
  margin-bottom:6px;
  font-size:14px;
  font-weight:700;
}

select,
textarea,
input{
  width:100%;
  padding:12px;
  border-radius:0;
  border:1px solid #d4dbe5;
  font-size:14px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.btn{
  margin-top:22px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:0;
  background:#0b3c5d;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.note{
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.msg{
  margin-top:14px;
  font-size:14px;
  font-weight:700;
}

.ok{color:var(--ok);}
.error{color:var(--error);}

@media(max-width:640px){

  .topbar-inner{
    flex-direction:row;
  }

  .menuBtnText{
    display:none;
  }

  .hero h1{
    font-size:24px;
  }

  .wrap{
    padding:16px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div class="accountLeft">
      <img
        class="accountIcon"
        src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
        alt="Account"
      >

      <div>
        <div class="accountName" id="topAccountName">Learner</div>
        <div class="accountType">Learner Account</div>
      </div>
    </div>

    <div class="topbarRight">

      <a href="announcements.html" class="iconBtn">
        <img
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773864086/announcement2_upwybn.svg"
          alt=""
        >
        <span class="navBadge">0</span>
      </a>

      <button class="menuBtn" id="menuToggleBtn">
        <span class="menuBtnText">Menu</span>

        <img
          src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773952155/menu_q2xag6.svg"
          alt=""
        >
      </button>

      <div class="menuDropdown" id="menuDropdown">

        <a class="menuItem" href="profile.html">
          <span>Profile</span>
        </a>

        <a class="menuItem" href="learner-quizzes.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777660/practice_ubgfso.svg">
          <span>Practice</span>
        </a>

        <a class="menuItem" href="results.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/results_qgdct1.svg">
          <span>Results</span>
        </a>

        <a class="menuItem" href="progress-dashboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg">
          <span>Dashboard</span>
        </a>

        <a class="menuItem" href="leaderboard.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777661/leaderboard_yfjgjf.svg">
          <span>Leaderboard</span>
        </a>

        <a class="menuItem" href="support.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/support_bs175s.svg">
          <span>Support</span>
        </a>

        <a class="menuItem" href="enrollment.html">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg">
          <span>Join Classes</span>
        </a>

        <div class="menuDivider"></div>

        <button class="menuItem logoutMenuBtn" id="logoutBtn">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773768418/logout_uay6y8.svg">
          <span>Logout</span>
        </button>

      </div>

    </div>
  </div>
</header>

<main class="wrap">

 <div class="card">

  <div class="cardHead">

    <h1>CLASS ENROLLMENT</h1>

<div class="subText">
  Upload your proof of payment and complete the form below to activate access to online Mathematics classes.
</div>

  </div>

  <div class="body">

    <form id="enrollmentForm" enctype="multipart/form-data">

      <label>Learner Number</label>
      <input
        type="text"
        name="learnerNumber"
        required
      >

      <label>Device Used for Classes</label>
      <select name="device" required>
        <option value="">Select Device</option>
        <option>Phone</option>
        <option>Laptop</option>
        <option>Tablet</option>
        <option>Desktop Computer</option>
      </select>

      <label>Internet Access</label>
      <select name="internetAccess" required>
        <option value="">Select Internet Access</option>
        <option>Mobile Data</option>
        <option>Wi-Fi</option>
        <option>Both</option>
      </select>

      <label>Preferred Class Time</label>
      <select name="preferredClassTime" required>
        <option value="">Select Preferred Time</option>
        <option>Afternoon</option>
        <option>Evening</option>
        <option>Weekend</option>
      </select>

      <label>Upload Proof of Payment</label>
      <input
        type="file"
        name="proofOfPayment"
        accept="image/*,.pdf"
        required
      >

      <label>Additional Notes (Optional)</label>

      <textarea
        name="additionalNotes"
        placeholder="Write additional information here..."
      ></textarea>

     <button class="btn" type="submit">
  Join Classes
</button>

<div id="msg" class="msg"></div>

</form>

</div>

</div>

</main>

<script>
const API = "https://api.practiceonline.co.za";

const token = localStorage.getItem("token");

if(!token){
  location.href = "login.html";
}

const form = document.getElementById("enrollmentForm");
const msg = document.getElementById("msg");

const menuBtn = document.getElementById("menuToggleBtn");
const menuDropdown = document.getElementById("menuDropdown");

menuBtn.onclick = () => {
  menuDropdown.classList.toggle("open");
};

document.addEventListener("click", function(e){
  if(
    !menuBtn.contains(e.target) &&
    !menuDropdown.contains(e.target)
  ){
    menuDropdown.classList.remove("open");
  }
});

document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("token");
  location.href = "login.html";
};

async function loadProfile(){
  try{

    const res = await fetch(`${API}/api/profile/me`,{
      headers:{
        Authorization:`Bearer ${token}`
      }
    });

    const data = await res.json();

    document.getElementById("topAccountName").textContent =
      data.fullName || data.username || "Learner";

  }catch(err){}
}

form.addEventListener("submit", async function(e){

  e.preventDefault();

  const formData = new FormData(form);

  try{

    msg.className = "msg";
    msg.textContent = "Submitting enrollment...";

    const res = await fetch(`${API}/api/enrollments`,{
      method:"POST",
      headers:{
        Authorization:`Bearer ${token}`
      },
      body:formData
    });

    const data = await res.json();

    if(!res.ok){
      msg.className = "msg error";
      msg.textContent =
        data.message || "Enrollment failed.";
      return;
    }

    msg.className = "msg ok";

    msg.textContent =
      "Enrollment submitted successfully. Your Mathematics classes will be activated after payment confirmation.";

    form.reset();

  }catch(err){

    msg.className = "msg error";

    msg.textContent =
      "Network error. Please try again.";
  }

});

loadProfile();
</script>

</body>
</html>
