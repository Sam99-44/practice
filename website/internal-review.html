<style>
:root{--gold:#c9a227;--navy:#1b1648;--bg:#f5f7fa;--border:#dfe5ec;--muted:#64748b;--green:#159447;--red:#b91c1c;--star:#f4b400}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#111827}
.topbar{width:100%;background:var(--gold)}.topbarInner{max-width:1500px;min-height:68px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:38px;height:38px}.brandText{display:flex;flex-direction:column;color:#fff}.brandText strong{font-size:14px}.brandText span{font-size:12px;margin-top:2px}
.nav{display:flex;gap:18px;flex-wrap:wrap}.nav a,.nav button{background:transparent;border:0;color:#fff;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;padding:0}
.page{width:calc(100% - 40px);max-width:1500px;margin:auto;padding:20px 0 30px}.heading{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}.heading h1{margin:0;color:var(--navy);font-size:24px}.heading p{margin:6px 0 0;color:var(--muted);font-size:13px}

label{display:block;color:var(--navy);font-size:12px;font-weight:800}input,select,textarea{width:100%;min-height:42px;margin-top:6px;padding:10px 12px;border:1px solid #cfd7e3;border-radius:4px;background:#fff;font:inherit;font-size:14px;outline:none}textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,22,72,.1)}
.actions{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.btn{min-height:40px;padding:9px 14px;border:1px solid var(--navy);border-radius:4px;background:var(--navy);color:#fff;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn2{background:#fff;color:var(--navy);border-color:var(--border)}.btnGold{background:var(--gold);border-color:#a98518}
.summary{display:flex;justify-content:flex-start;gap:10px;flex-wrap:wrap;margin:16px 0;color:var(--muted);font-size:13px}.reviewCountSummary span{
padding:10px 14px;
border:1px solid var(--border);
border-radius:4px;
background:#ffffff;
color:var(--navy);
font-weight:800;
min-width:150px;
text-align:center;
box-shadow:none;
}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.quiz{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;display:flex;flex-direction:column}.quizTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.code{color:var(--navy);font-size:12px;font-weight:900;line-height:1.4}.badge{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;flex:0 0 auto;min-height:28px;min-width:86px;padding:6px 10px;border-radius:4px;background:#f5f4fb;color:var(--navy);font-size:11px;font-weight:800;line-height:1;text-align:center;white-space:nowrap}.title{margin:12px 0 4px;color:var(--navy);font-size:17px;font-weight:800}.meta{color:var(--muted);font-size:12px;line-height:1.6}
.rating{display:flex;align-items:center;gap:8px;margin:16px 0 8px}.stars{color:var(--star);font-size:19px}.score{font-weight:900;color:var(--navy)}.count{font-size:12px;color:var(--muted)}
.dist{display:grid;gap:5px;margin:8px 0 14px}.line{display:grid;grid-template-columns:34px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:11px;color:var(--muted)}.track{height:7px;border-radius:999px;background:#eef1f5;overflow:hidden}.fill{height:100%;background:var(--gold)}
.comment{margin-top:auto;padding:12px;border:1px solid var(--border);border-radius:6px;background:#f8fafc;color:#334155;font-size:12px;line-height:1.5;min-height:62px;white-space:pre-wrap}.quizActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{padding:36px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.58);z-index:9999}.modal.open{display:flex}.modalCard{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:8px}.modalHead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}.modalHead h2{margin:0;color:var(--navy);font-size:18px}.modalBody{padding:18px}.picker{display:flex;gap:8px;margin-top:8px}.picker button{border:0;background:transparent;color:#cbd5e1;font-size:30px;cursor:pointer}.picker button.active{color:var(--star)}.comments{display:grid;gap:10px;margin-top:16px}.commentItem{border:1px solid var(--border);border-radius:6px;padding:12px}.commentHead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-bottom:6px}.commentBody{font-size:13px;line-height:1.55;white-space:pre-wrap}.msg{margin-top:14px;font-size:13px;color:var(--muted)}.error{color:var(--red)}.ok{color:var(--green)}
.reviewMeta{display:block;margin:10px 0;color:#334155;font-size:12px;line-height:1.7;font-weight:600}.reviewPill{padding:4px 8px;border-radius:999px;background:#f8fafc;border:1px solid var(--border);font-size:11px;font-weight:800;color:var(--navy)}.reviewPill.checkedYes{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.reviewPill.checkedNo{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.pendingStatus{background:#fffbeb!important;color:#a16207!important;border-color:#fde68a!important}.reviewedStatus{background:#ecfdf5!important;color:#047857!important;border-color:#a7f3d0!important}.ratingCritical{background:#fef2f2!important;color:#b91c1c!important;border-color:#fecaca!important}.ratingLow{background:#fff7ed!important;color:#c2410c!important;border-color:#fed7aa!important}.ratingAverage{background:#fffbeb!important;color:#a16207!important;border-color:#fde68a!important}.ratingGood{background:#eff6ff!important;color:#1d4ed8!important;border-color:#bfdbfe!important}.ratingExcellent{background:#ecfdf5!important;color:#047857!important;border-color:#a7f3d0!important}.ratingNone{background:#f8fafc!important;color:#64748b!important;border-color:#e2e8f0!important}.dateMeta{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.5}
.actions .btn{width:152px;min-width:152px;min-height:44px;padding:10px 14px;gap:10px;white-space:nowrap;line-height:1}
.iconBtn{gap:10px}
.iconBtn img{width:20px;height:20px;display:block;flex:0 0 20px;object-fit:contain;filter:brightness(0) invert(1)}
#clearFiltersBtn img{filter:none}
.reviewCountSummary span{display:inline-flex;align-items:center;justify-content:center;min-height:42px;line-height:1.25}
.quizActions{margin-top:auto;padding-top:14px}
.quizActions .btn{flex:1 1 auto}
.viewAssessmentBtn{width:100%;margin-top:8px}

@media(max-width:1200px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{justify-content:flex-start}}
@media(max-width:760px){.page{width:calc(100% - 24px)}.topbarInner{padding:10px 14px;flex-direction:column;align-items:flex-start}.filters,.grid{grid-template-columns:1fr}.actions{grid-column:1;display:grid;grid-template-columns:1fr;align-items:stretch;width:100%}.actions .btn{width:100%;min-width:0}}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<body>
<header class="topbar"><div class="topbarInner">
<div class="brand"><img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg" alt="Account"><div class="brandText"><strong>Practice Online</strong><span id="who">Internal Review</span></div></div>
<nav class="nav"><a href="admin-dashboard.html">Dashboard</a><a href="admin-quiz.html">Add Assessment</a><a href="edit-assessment.html">Edit Assessment</a><button id="logoutBtn">Logout</button></nav>
</div></header>
<main class="page">
<div class="heading"><div><h1>Internal Assessment Review</h1></div></div>
<section class="card"><div class="filters">
<div><label>Search title, topic or code</label><input id="searchFilter"></div>
<div><label>Content type</label><select id="contentTypeFilter"><option value="">All content types</option><option value="quiz">Quiz</option><option value="activity">Activity</option><option value="homework">Homework</option><option value="assignment">Assignment</option><option value="gradeChallenge">Grade Challenge</option><option value="weeklyChallenge">Challenge of the Week</option></select></div>
<div><label>Grade</label><select id="gradeFilter"><option value="">All grades</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
<div><label>Difficulty</label><select id="difficultyFilter"><option value="">All difficulty levels</option><option value="easy">Easy</option><option value="moderate">Moderate</option><option value="hard">Hard</option></select></div>
<div><label>Learner rating</label><select id="ratingConditionFilter">
<option value="">All learner ratings</option>
<option value="low">Low: below 3.0</option>
<option value="average">Average: 3.0 to 3.9</option>
<option value="high">High: 4.0 and above</option>
<option value="noRatings">No learner ratings</option>
</select></div>
<div><label>Internal quality</label><select id="internalQualityFilter"><option value="">All quality ratings</option><option value="poor">Poor</option><option value="needs_improvement">Needs Improvement</option><option value="good">Good</option><option value="excellent">Excellent</option></select></div>
<div><label>Checked</label><select id="checkedFilter"><option value="">All</option><option value="yes">Checked: Yes</option><option value="no">Checked: No</option></select></div><div><label>Review status</label><select id="reviewStatusFilter">
<option value="">All review statuses</option>
<option value="pending">Pending Review</option>
<option value="reviewed">Reviewed</option>
</select></div>
<div><label>Date type</label><select id="dateTypeFilter"><option value="updated">Edited date</option><option value="created">Added date</option></select></div>
<div><label>Date period</label><select id="datePeriodFilter"><option value="">Any date</option><option value="today">Today</option><option value="thisWeek">This week</option><option value="lastWeek">Last week</option><option value="lastMonth">Last month</option><option value="month">Choose month</option></select></div>
<div id="monthFilterWrap" style="display:none"><label>Month</label><input id="monthFilter" type="month"></div>
<div class="actions">
<button class="btn btn2 iconBtn" id="clearFiltersBtn" type="button"><img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1785018583/clear-filter_shutdz.svg" alt="" aria-hidden="true">Clear Filters</button>
<button class="btn iconBtn" id="refreshBtn" type="button"><img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773884662/retry_hdbczv.svg" alt="" aria-hidden="true">Refresh</button>
<button class="btn btnGold iconBtn" id="exportExcelBtn" type="button"><img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1785018481/export_lmsnim.svg" alt="" aria-hidden="true">Export Excel</button>
</div>
</div></section>
<div class="summary reviewCountSummary">
  <span id="summaryText">Loading assessments...</span>
  <span id="pendingReviewCountText"></span>
  <span id="reviewedCountText"></span>
  <span id="highRatedText"></span>
  <span id="checkedCountText"></span>
  <span id="qualityCountText"></span>
</div>
<section id="quizGrid" class="grid"></section><p id="msg" class="msg"></p>
</main>
<div id="ratingModal" class="modal"><div class="modalCard">
<div class="modalHead"><div><h2 id="modalTitle">Assessment Rating</h2><div id="modalCode" class="code"></div></div><button class="btn btn2" id="closeModalBtn">Close</button></div>
<div class="modalBody">
<label>Reviewed by</label>
<select id="reviewerNameInput">
<option value="">Select reviewer</option>
<option>Jessey</option>
<option>Mulamuleli</option>
<option>Takalani</option>
<option>Ndamulelo</option>
</select>

<label style="margin-top:16px">Internal quality rating</label>
<select id="internalQualityInput">
  <option value="">Select quality</option>
  <option value="poor">Poor</option>
  <option value="needs_improvement">Needs Improvement</option>
  <option value="good">Good</option>
  <option value="excellent">Excellent</option>
</select>

<label style="margin-top:16px">Has this assessment been checked?</label>
<select id="checkedInput">
  <option value="">Select</option>
  <option value="yes">Yes</option>
  <option value="no">No</option>
</select>

<label style="margin-top:16px">Internal staff star rating</label>
<div id="ratingPicker" class="picker"><button data-rating="1">★</button><button data-rating="2">★</button><button data-rating="3">★</button><button data-rating="4">★</button><button data-rating="5">★</button></div>

<label style="margin-top:16px">Comment</label>
<textarea id="commentInput"></textarea>

<div style="margin-top:12px">
  <button class="btn btnGold" id="saveFeedbackBtn">Save Quality Review</button>
</div>
<div id="commentList" class="comments"></div>
</div>
</div></div>
<script>
const API=window.API||"https://api.practiceonline.co.za",token=localStorage.getItem("token");
const $=id=>document.getElementById(id),quizGrid=$("quizGrid"),msg=$("msg"),summaryText=$("summaryText"),highRatedText=$("highRatedText"),checkedCountText=$("checkedCountText"),qualityCountText=$("qualityCountText"),pendingReviewCountText=$("pendingReviewCountText"),reviewedCountText=$("reviewedCountText");
const searchFilter=$("searchFilter"),contentTypeFilter=$("contentTypeFilter"),gradeFilter=$("gradeFilter"),difficultyFilter=$("difficultyFilter"),ratingConditionFilter=$("ratingConditionFilter"),internalQualityFilter=$("internalQualityFilter"),checkedFilter=$("checkedFilter"),reviewStatusFilter=$("reviewStatusFilter"),dateTypeFilter=$("dateTypeFilter"),datePeriodFilter=$("datePeriodFilter"),monthFilter=$("monthFilter"),monthFilterWrap=$("monthFilterWrap");
const ratingModal=$("ratingModal"),ratingPicker=$("ratingPicker"),commentInput=$("commentInput"),commentList=$("commentList"),saveFeedbackBtn=$("saveFeedbackBtn"),internalQualityInput=$("internalQualityInput"),checkedInput=$("checkedInput"),reviewerNameInput=$("reviewerNameInput");
let quizzes=[],selectedQuiz=null,selectedRating=0,currentRole="";
function logout(){["token","username","me_cache","user","role"].forEach(k=>localStorage.removeItem(k));location.href="login.html"}$("logoutBtn").onclick=logout;
function setMsg(t,c=""){msg.className="msg "+c;msg.textContent=t}function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function label(v){return({quiz:"Quiz",activity:"Activity",homework:"Homework",assignment:"Assignment",gradeChallenge:"Grade Challenge",weeklyChallenge:"Challenge of the Week"})[v]||"Quiz"}
function avg(q){return Number(q?.ratingSummary?.average??q?.averageRating??0)||0}function cnt(q){return Number(q?.ratingSummary?.count??q?.ratingCount??0)||0}
function dist(q){const r=q?.ratingSummary?.distribution||q?.ratingDistribution||{};return{5:+(r[5]||0),4:+(r[4]||0),3:+(r[3]||0),2:+(r[2]||0),1:+(r[1]||0)}}
function comments(q){return q?.ratingComments||q?.comments||q?.feedbackComments||[]}function latest(q){const a=comments(q);if(!a.length)return"No comments yet.";const x=a[a.length-1];return String(x?.comment||x?.text||x||"")}
function stars(v){const n=Math.round(+v||0);return[0,1,2,3,4].map(i=>i<n?"★":"☆").join("")}
function review(q){return q?.internalReview||q?.staffReview||{}}
function quality(q){return String(review(q).quality||q?.internalQuality||"").toLowerCase()}
function qualityLabel(value){
  const labels={
    poor:"Poor",
    needs_improvement:"Needs Improvement",
    good:"Good",
    excellent:"Excellent"
  };
  return labels[String(value||"").toLowerCase()]||"";
}

function checked(q){const v=review(q).checked??q?.isChecked;return v===true||String(v).toLowerCase()==="yes"?"yes":v===false||String(v).toLowerCase()==="no"?"no":""}
function reviewStatus(q){
  const explicit=String(
    review(q).status ||
    q?.reviewStatus ||
    ""
  ).toLowerCase();

  if(explicit==="reviewed") return "reviewed";
  if(explicit==="pending" || explicit==="pending_review") return "pending";

  const hasReview=
    Boolean(quality(q)) ||
    Boolean(checked(q)) ||
    Number(review(q).rating||0)>0 ||
    comments(q).length>0;

  return hasReview ? "reviewed" : "pending";
}
function reviewStatusLabel(q){
  return reviewStatus(q)==="reviewed" ? "Reviewed" : "Pending Review";
}

function getDate(q,type){const raw=type==="created"?(q.createdAt||q.created_at):(q.updatedAt||q.updated_at||q.createdAt);const d=raw?new Date(raw):null;return d&&!Number.isNaN(d.getTime())?d:null}
function startDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function startWeek(d){const x=startDay(d),day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}
function matchesDate(q,type,period,monthValue){if(!period)return true;const d=getDate(q,type);if(!d)return false;const now=new Date();if(period==="today")return d>=startDay(now);if(period==="thisWeek")return d>=startWeek(now);if(period==="lastWeek"){const s=startWeek(now),l=new Date(s);l.setDate(l.getDate()-7);return d>=l&&d<s}if(period==="lastMonth"){const a=new Date(now.getFullYear(),now.getMonth()-1,1),b=new Date(now.getFullYear(),now.getMonth(),1);return d>=a&&d<b}if(period==="month"){const m=String(monthValue||"").match(/^(\d{4})-(\d{2})$/);if(!m)return true;return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1}return true}
function fmtDate(d){return d?d.toLocaleDateString("en-ZA",{year:"numeric",month:"short",day:"2-digit"}):"-"}
function ratingStatus(q){
  const value=avg(q), count=cnt(q);
  if(!count) return {label:"No ratings",cls:"ratingNone"};
  if(value<3) return {label:"Low rating",cls:"ratingLow"};
  if(value<4) return {label:"Average rating",cls:"ratingAverage"};
  return {label:"High rating",cls:"ratingExcellent"};
}


function filtered(){
const s=searchFilter.value.trim().toLowerCase(),ct=contentTypeFilter.value,g=gradeFilter.value,d=difficultyFilter.value,ratingCondition=ratingConditionFilter.value,iq=internalQualityFilter.value,chk=checkedFilter.value,rs=reviewStatusFilter.value,dt=dateTypeFilter.value,dp=datePeriodFilter.value,mv=monthFilter.value;
return quizzes.filter(q=>(!s||[q.title,q.topic,q.assessmentCode].join(" ").toLowerCase().includes(s))&&(!ct||String(q.contentType||"quiz")===ct)&&(!g||String(q.grade)===g)&&(!d||String(q.difficulty||"").toLowerCase()===d)&&(
      !ratingCondition ||
      (ratingCondition==="low" && cnt(q)>0 && avg(q)<3) ||
      (ratingCondition==="average" && avg(q)>=3 && avg(q)<4) ||
      (ratingCondition==="high" && avg(q)>=4) ||
      (ratingCondition==="noRatings" && cnt(q)===0)
    )&&(!iq||quality(q)===iq)&&(!chk||checked(q)===chk)&&(!rs||reviewStatus(q)===rs)&&matchesDate(q,dt,dp,mv)).sort((a,b)=>avg(b)-avg(a)||cnt(b)-cnt(a))
}
function render(){
const a=filtered(),
pending=a.filter(q=>reviewStatus(q)==="pending").length,
reviewed=a.filter(q=>reviewStatus(q)==="reviewed").length,
high=a.filter(q=>avg(q)>=4).length,
checkedYes=a.filter(q=>checked(q)==="yes").length,
excellent=a.filter(q=>quality(q)==="excellent").length;
summaryText.textContent=`${a.length} assessment${a.length===1?"":"s"} found`;
pendingReviewCountText.textContent=`${pending} pending review`;
reviewedCountText.textContent=`${reviewed} reviewed`;
highRatedText.textContent=`${high} high learner rating${high===1?"":"s"}`;
checkedCountText.textContent=`${checkedYes} checked`;
qualityCountText.textContent=`${excellent} excellent`;
if(!a.length){quizGrid.innerHTML='<div class="card empty">No assessments match the selected filters.</div>';return}
quizGrid.innerHTML=a.map(q=>{const r=avg(q),c=cnt(q),ds=dist(q),max=Math.max(...Object.values(ds),1),id=q._id||q.id||"";return`<article class="quiz"><div class="quizTop"><div class="code">${esc(q.assessmentCode||"No assessment code")}</div><span class="badge">${esc(label(q.contentType))}</span></div><div class="title">${esc(q.title||"Untitled Assessment")}</div><div class="meta">Grade ${esc(q.grade||"-")} • ${esc(q.difficulty||"Moderate")} • ${esc(q.topic||"General")}</div><div class="rating"><div class="stars">${stars(r)}</div><div class="score">${r.toFixed(1)}</div><div class="count">(${c} rating${c===1?"":"s"})</div></div><div class="dist">${[5,4,3,2,1].map(n=>`<div class="line"><span>${n}★</span><div class="track"><div class="fill" style="width:${ds[n]/max*100}%"></div></div><span>${ds[n]}</span></div>`).join("")}</div><div class="reviewMeta"><span class="reviewPill ${reviewStatus(q)==="reviewed"?"reviewedStatus":"pendingStatus"}">${reviewStatusLabel(q)}</span><span class="reviewPill ${ratingStatus(q).cls}">${ratingStatus(q).label}</span><span class="reviewPill">${esc(quality(q)?qualityLabel(quality(q)):"Not rated internally")}</span><span class="reviewPill ${checked(q)==="yes"?"checkedYes":checked(q)==="no"?"checkedNo":""}">Checked: ${checked(q)?checked(q).toUpperCase():"Not set"}</span></div><div class="dateMeta">Added: ${fmtDate(getDate(q,"created"))}<br>Last edited: ${fmtDate(getDate(q,"updated"))}</div><div class="comment">${esc(latest(q))}</div><div class="quizActions"><button class="btn" data-feedback="${esc(id)}">View Ratings and Comment</button><a class="btn btn2 iconBtn" href="edit-assessment.html?quizId=${encodeURIComponent(id)}"><img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1780375737/request-quote_qjzj08.svg" alt="" aria-hidden="true">Edit Assessment</a><a class="btn btn2 iconBtn viewAssessmentBtn" href="attempt-quiz.html?quizId=${encodeURIComponent(id)}"><img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773884664/eye_wcd3ak.svg" alt="" aria-hidden="true">View Assessment</a></div></article>`}).join("")}
function setRating(v){selectedRating=+v||0;[...ratingPicker.children].forEach(b=>b.classList.toggle("active",+b.dataset.rating<=selectedRating))}
function renderComments(q){const a=comments(q);commentList.innerHTML=a.length?a.slice().reverse().map(x=>`<div class="commentItem"><div class="commentHead"><span>${esc(x.authorName||x.username||x.author||"Staff")}${x.rating?` • ${x.rating}★`:""}</span><span>${x.createdAt?new Date(x.createdAt).toLocaleString("en-ZA"):""}</span></div><div class="commentBody">${esc(x.comment||x.text||x||"")}</div></div>`).join(""):'<div class="commentItem">No comments yet.</div>'}
function openModal(q){selectedQuiz=q;commentInput.value="";reviewerNameInput.value=String(review(q).reviewerName||"");internalQualityInput.value=quality(q)||"";checkedInput.value=checked(q)||"";setRating(Number(review(q).rating||0));$("modalTitle").textContent=q.title||"Assessment Rating";$("modalCode").textContent=q.assessmentCode||"";renderComments(q);ratingModal.classList.add("open")}function closeModal(){ratingModal.classList.remove("open");selectedQuiz=null}
async function requireAccess(){if(!token){logout();return false}let r;try{r=await fetch(`${API}/api/auth/me`,{headers:{Authorization:`Bearer ${token}`}})}catch{return setMsg("Network error while checking access.","error"),false}const me=await r.json().catch(()=>null);if(!r.ok||!me){logout();return false}const u=me.user||me;currentRole=String(u.role||"").toLowerCase();if(!["admin","editor"].includes(currentRole)){setMsg("Access denied. This page is for Admin and Editor accounts.","error");setTimeout(()=>location.href="learner-quizzes.html",700);return false}$("who").textContent=`Logged in as: ${u.username||"User"} (${currentRole})`;return true}
async function load(){setMsg("Loading ratings...");let r;try{r=await fetch(`${API}/api/quizzes?includeRatings=true&includeInternalReviews=true`,{headers:{Authorization:`Bearer ${token}`}})}catch{return setMsg("Network error while loading assessments.","error")}const d=await r.json().catch(()=>null);if(!r.ok||!d)return setMsg("Could not load assessment ratings.","error");quizzes=Array.isArray(d)?d:(d.quizzes||[]);render();setMsg("Ratings loaded.","ok")}
async function save(){if(!selectedQuiz)return;const comment=commentInput.value.trim();
if(!reviewerNameInput.value){setMsg("Please select who reviewed this assessment.","error");return;}const id=selectedQuiz._id||selectedQuiz.id;saveFeedbackBtn.disabled=true;let r;try{r=await fetch(`${API}/api/quizzes/${encodeURIComponent(id)}/internal-reviews`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({reviewerName:reviewerNameInput.value,rating:selectedRating||null,quality:internalQualityInput.value||null,checked:checkedInput.value||null,comment,reviewStatus:"reviewed"})})}catch{saveFeedbackBtn.disabled=false;return setMsg("Network error while saving feedback.","error")}const d=await r.json().catch(()=>null);if(!r.ok||!d){saveFeedbackBtn.disabled=false;return setMsg(d?.message||"Could not save rating and comment.","error")}const updated=d.quiz||d.assessment||d,i=quizzes.findIndex(q=>String(q._id||q.id)===String(id));if(i>=0){quizzes[i]={...quizzes[i],...updated};selectedQuiz=quizzes[i]}commentInput.value="";setRating(0);renderComments(selectedQuiz);render();saveFeedbackBtn.disabled=false;setMsg("Rating and comment saved.","ok")}
[searchFilter,contentTypeFilter,gradeFilter,difficultyFilter,ratingConditionFilter,internalQualityFilter,checkedFilter,reviewStatusFilter,dateTypeFilter,datePeriodFilter,monthFilter].forEach(e=>e.addEventListener(e.tagName==="INPUT"?"input":"change",render));
$("clearFiltersBtn").onclick=()=>{searchFilter.value=contentTypeFilter.value=gradeFilter.value=difficultyFilter.value=ratingConditionFilter.value=internalQualityFilter.value=checkedFilter.value=reviewStatusFilter.value=datePeriodFilter.value=monthFilter.value="";dateTypeFilter.value="updated";monthFilterWrap.style.display="none";render()};$("refreshBtn").onclick=load;$("closeModalBtn").onclick=closeModal;saveFeedbackBtn.onclick=save;
ratingPicker.onclick=e=>{const b=e.target.closest("button[data-rating]");if(b)setRating(b.dataset.rating)};quizGrid.onclick=e=>{const b=e.target.closest("[data-feedback]");if(!b)return;const q=quizzes.find(x=>String(x._id||x.id)===String(b.dataset.feedback));if(q)openModal(q)};ratingModal.onclick=e=>{if(e.target===ratingModal)closeModal()};

datePeriodFilter.addEventListener("change",()=>{monthFilterWrap.style.display=datePeriodFilter.value==="month"?"block":"none";render()});
$("exportExcelBtn").onclick=()=>{
  const rows=filtered().map(q=>({
    "Assessment Code":q.assessmentCode||"",
    "Title":q.title||"",
    "Topic":q.topic||"",
    "Content Type":label(q.contentType),
    "Grade":q.grade||"",
    "Difficulty":q.difficulty||"",
    "Learner Average Rating":avg(q),
    "Learner Rating Count":cnt(q),
    "Learner Rating Status":ratingStatus(q).label,
    "Review Status":reviewStatusLabel(q),
    "Reviewed By":review(q).reviewerName||"",
    "Internal Quality":quality(q)?qualityLabel(quality(q)):"",
    "Checked":checked(q)?checked(q).toUpperCase():"",
    "Internal Star Rating":review(q).rating||"",
    "Latest Comment":latest(q),
    "Added Date":fmtDate(getDate(q,"created")),
    "Last Edited Date":fmtDate(getDate(q,"updated"))
  }));
  if(!rows.length)return setMsg("There is no filtered data to export.","error");
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Quiz Reviews");
  XLSX.writeFile(wb,`quiz-reviews-${new Date().toISOString().slice(0,10)}.xlsx`);
};
(async()=>{if(await requireAccess())await load()})();
</script>
