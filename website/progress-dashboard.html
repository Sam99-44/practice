<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Progress Dashboard | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --nav:#1b1648;
      --accent:#0b3c5d;
      --red:#e11d2e;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --radius:14px;
      --shadow:0 8px 22px rgba(0,0,0,.06);
      --focus:0 0 0 4px rgba(207,233,255,.65);
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
    a{text-decoration:none;color:inherit}

    header.topbar{background:var(--nav);color:#fff;border-bottom:3px solid rgba(255,255,255,.08);}
    .topbar-inner{
      max-width:1100px;margin:0 auto;padding:14px 18px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .brand{display:flex;flex-direction:column;line-height:1.1;font-weight:700;letter-spacing:.15px;}
    .brand small{opacity:.85;font-weight:600}
    nav.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    nav.nav a{padding:8px 10px;border-radius:10px;color:#e7e9ff;font-weight:600;font-size:13px;}
    nav.nav a.active{border-bottom:3px solid var(--red);color:#fff;border-radius:10px 10px 8px 8px;padding-bottom:5px;}
    nav.nav a:hover{background:rgba(255,255,255,.10)}
    .btnTop{
      background:transparent;color:#fff;border:1px solid rgba(255,255,255,.22);
      padding:8px 12px;border-radius:12px;cursor:pointer;font-weight:600;
    }
    .btnTop:hover{background:rgba(255,255,255,.08)}

    .wrap{max-width:1100px;margin:0 auto;padding:18px;}

    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin-top:14px;
      overflow:hidden;
    }
    .sectionHead{
      padding:14px 14px 12px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,#f4f7ff,#eef4ff);
      display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .sectionHead h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;}
    .muted{color:var(--muted);font-weight:600;font-size:13px;margin-top:6px;min-height:18px;}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;}
    @media(max-width:900px){.grid2{grid-template-columns:1fr;}}

    .chartCard{
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
      padding:12px;
    }
    .chartTitle{margin:0 0 8px 0;font-size:13px;font-weight:800;color:#0f172a;}

    /* ✅ Keep charts compact */
    canvas{width:100%;height:170px;border-radius:10px;background:#fff;display:block;}

    table{width:100%;border-collapse:collapse;font-size:13px;}
    th, td{padding:10px 10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;}
    th{
      background:#f8fafc;
      font-size:11px;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700;
      letter-spacing:.06em;
      white-space:nowrap;
    }

    .topicLink{color:var(--accent);font-weight:800;}
    .topicLink:hover{text-decoration:underline}

    .rec{font-weight:800;color:#0f172a;}
    .rec.low{color:#9a3412;}
    .rec.mid{color:#0b3c5d;}
    .rec.high{color:#065f46;}

    .smallBtn{
      padding:7px 10px;border:1px solid #ddd;border-radius:10px;background:#fff;
      cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap;
    }
    .smallBtn:hover{background:#f8fafc}

    .empty{
      padding:14px;border:1px dashed #ddd;border-radius:12px;
      background:#fafafa;color:var(--muted);font-weight:700;margin:14px;
    }

    .filters{
      padding:12px 14px;
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    }
    select{
      padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;
      font-size:13px;font-weight:700;outline:none;min-width:160px;
    }
    select:focus{box-shadow:var(--focus);border-color:#cfe9ff;}

    .tableWrapInner{overflow:auto;}
    table{min-width:860px;}
  </style>

  <script>
    if(!localStorage.getItem("token")) location.href="login.html";
  </script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div>Practice Online</div>
      <small>Progress Dashboard</small>
    </div>
    <nav class="nav">
      <a href="learner-quizzes.html">Practice</a>
      <a href="results.html">Results</a>
      <a class="active" href="progress-dashboard.html">Dashboard</a>
      <a href="support.html">Support</a>
      <a href="about.html">About</a>
      <a href="admin-quiz.html" data-admin style="display:none;">Admin</a>
      <button class="btnTop" id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="section">
    <div class="sectionHead">
      <div>
        <h1>Topic Progress</h1>
        <!-- ✅ No “Loading…” / No “Showing progress …” -->
        <div class="muted" id="subTxt"></div>
      </div>
    </div>

    <div class="filters">
      <select id="yearSelect">
        <option value="">All Years</option>
      </select>
      <select id="monthSelect">
        <option value="">All Months</option>
      </select>
    </div>

    <div class="grid2">
      <div class="chartCard">
        <div class="chartTitle">Top 5 Topics (Best Pass Rate)</div>
        <canvas id="topChart" height="170"></canvas>
      </div>
      <div class="chartCard">
        <div class="chartTitle">Bottom 5 Topics (Needs Work)</div>
        <canvas id="bottomChart" height="170"></canvas>
      </div>
    </div>
  </section>

  <section class="section" id="tableWrap">
    <div class="empty">Loading dashboard…</div>
  </section>

</main>

<script src="nav.js"></script>

<script>
  const API = window.API || "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");

  const subTxt = document.getElementById("subTxt");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  const tableWrap = document.getElementById("tableWrap");

  const topCanvas = document.getElementById("topChart");
  const bottomCanvas = document.getElementById("bottomChart");

  document.getElementById("logoutBtn").onclick = ()=> {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("me_cache");
    location.href="login.html";
  };

  let allResults = [];
  let allQuizzes = [];

  let topicTotals = new Map();        // topic -> total quizzes
  let quizTopicById = new Map();      // quizId -> topic (most accurate)
  let attemptedQuizIdsByTopic = new Map(); // topic -> Set(quizId)

  yearSelect.addEventListener("change", renderAll);
  monthSelect.addEventListener("change", renderAll);

  // redraw charts on resize (keeps them professional)
  const ro = new ResizeObserver(() => renderAll());
  ro.observe(topCanvas);
  ro.observe(bottomCanvas);

  load();

  async function load(){
    try{
      subTxt.textContent = "";

      // ensure session valid + admin toggle
      const meRes = await fetch(`${API}/api/auth/me`,{
        headers:{Authorization:`Bearer ${token}`}
      });

      if(meRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const me = await meRes.json().catch(()=>null);
      if(!meRes.ok || !me){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      // show admin link if admin
      try{
        const isAdmin = me.role === "admin";
        document.querySelectorAll("[data-admin]").forEach(a => a.style.display = isAdmin ? "" : "none");
      }catch{}

      // quizzes (to match Practice topics exactly)
      const quizzesUrl = (me.role === "admin") ? `${API}/api/quizzes?all=1` : `${API}/api/quizzes`;
      const qRes = await fetch(quizzesUrl,{ headers:{Authorization:`Bearer ${token}`} });

      if(qRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const qData = await qRes.json().catch(()=>[]);
      allQuizzes = Array.isArray(qData) ? qData : [];

      topicTotals = new Map();
      quizTopicById = new Map();

      for(const q of allQuizzes){
        const id = String(q._id || "");
        const t = cleanSpaces(q.topic || "General");
        if (id) quizTopicById.set(id, t);
        topicTotals.set(t, (topicTotals.get(t) || 0) + 1);
      }

      // results
      const rRes = await fetch(`${API}/api/results/my`, {
        headers:{Authorization:`Bearer ${token}`}
      });

      if(rRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const rData = await rRes.json().catch(()=>[]);
      allResults = Array.isArray(rData) ? rData : [];

      buildDateFilters(allResults);
      renderAll();

    }catch(e){
      subTxt.textContent = "Network error. Please refresh.";
      tableWrap.innerHTML = `<div class="empty">Could not load dashboard.</div>`;
    }
  }

  function buildDateFilters(data){
    const years = [...new Set((data||[]).map(r=>{
      const d=new Date(r.createdAt);
      return isNaN(d)?null:d.getFullYear();
    }).filter(Boolean))].sort((a,b)=>b-a);

    yearSelect.innerHTML = `<option value="">All Years</option>` +
      years.map(y=>`<option value="${y}">${y}</option>`).join("");

    const months = [...new Set((data||[]).map(r=>{
      const d=new Date(r.createdAt);
      return isNaN(d)?null:(d.getMonth()+1);
    }).filter(Boolean))].sort((a,b)=>a-b);

    monthSelect.innerHTML = `<option value="">All Months</option>` +
      months.map(m=>{
        const name = new Date(2000, m-1, 1).toLocaleString(undefined,{month:"long"});
        return `<option value="${m}">${name}</option>`;
      }).join("");
  }

  function applyDateFilters(data){
    const y = yearSelect.value;
    const m = monthSelect.value;

    return (data || []).filter(r=>{
      const d=new Date(r.createdAt);
      if(y && (isNaN(d) || String(d.getFullYear()) !== String(y))) return false;
      if(m && (isNaN(d) || String(d.getMonth()+1) !== String(m))) return false;
      return true;
    });
  }

  function buildAttemptedQuizSets(results){
    attemptedQuizIdsByTopic = new Map();

    for(const r of (results || [])){
      const quizId = String(r.quizId || "");
      if(!quizId) continue;

      // ✅ topic from quizzes (most accurate). fallback to result topic.
      const topic = cleanSpaces(quizTopicById.get(quizId) || r.topic || "General");

      if(!attemptedQuizIdsByTopic.has(topic)) attemptedQuizIdsByTopic.set(topic, new Set());
      attemptedQuizIdsByTopic.get(topic).add(quizId);
    }
  }

  function summarizeByTopic(filteredResults){
    // Start from quizzes topics (matches Practice topics exactly)
    const map = new Map();
    for (const [topic, total] of topicTotals.entries()){
      map.set(topic, {
        topic,
        totalQuizzes: total,
        quizzesAttempted: 0,
        attempts: 0,   // attempts (can be > quizzesAttempted)
        sum: 0,
        best: 0,
        passCount: 0
      });
    }

    for(const r of (filteredResults || [])){
      const quizId = String(r.quizId || "");
      const topic = cleanSpaces(quizTopicById.get(quizId) || r.topic || "General");
      if(!map.has(topic)) continue;

      const percent = Number(r.percent) || 0;
      const pass = percent >= 50;

      const o = map.get(topic);
      o.attempts += 1;
      o.sum += percent;
      o.best = Math.max(o.best, percent);
      if(pass) o.passCount += 1;
    }

    // quizzesAttempted = unique quizIds per topic (filtered by date)
    for (const [topic, o] of map.entries()){
      const set = attemptedQuizIdsByTopic.get(topic);
      o.quizzesAttempted = set ? set.size : 0;
    }

    const list = [...map.values()].map(o=>{
      const avg = o.attempts ? Math.round(o.sum / o.attempts) : 0;
      const passRate = o.attempts ? Math.round((o.passCount / o.attempts) * 100) : 0;
      return { ...o, avg, passRate };
    });

    list.sort((a,b)=>a.topic.localeCompare(b.topic));
    return list;
  }

  function recommendation(passRate){
    const p = Number(passRate)||0;
    if(p < 50) return { text:"Practice more", cls:"low" };
    if(p < 75) return { text:"Good progress", cls:"mid" };
    return { text:"Excellent", cls:"high" };
  }

  function renderAll(){
    const filtered = applyDateFilters(allResults);
    buildAttemptedQuizSets(filtered);

    const rows = summarizeByTopic(filtered);

    // ✅ no “Showing progress …” line (keep it clean)
    if (!allQuizzes.length){
      subTxt.textContent = "No assessments found yet.";
    } else if (!allResults.length){
      subTxt.textContent = "No results yet. Attempt some quizzes to see your progress.";
    } else {
      subTxt.textContent = "";
    }

    // charts only from topics with attempts (so charts are meaningful)
    const attemptedTopics = rows.filter(r => r.attempts > 0);

    // best → worst
    const sorted = [...attemptedTopics].sort((a,b)=>b.passRate - a.passRate);

    const top5 = sorted.slice(0,5);
    const bottom5 = [...sorted].reverse().slice(0,5).reverse(); // lowest 5, keep order left->right

    // ✅ Top chart: ONE colour for all bars
    drawBarChart(topCanvas, top5, { mode:"top" });

    // ✅ Bottom chart: different ORANGE shades per bar
    drawBarChart(bottomCanvas, bottom5, { mode:"bottom" });

    renderTable(rows);
  }

  function renderTable(rows){
    if(!rows.length){
      tableWrap.innerHTML = `<div class="empty">No topic progress yet.</div>`;
      return;
    }

    tableWrap.innerHTML = `
      <div class="tableWrapInner">
        <table>
          <thead>
            <tr>
              <th>Topic</th>
              <th>Total Quizzes</th>
              <th>Quizzes Attempted</th>
              <th>Average</th>
              <th>Best</th>
              <th>Recommendation</th>
              <th>Open</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r=>{
              const rec = recommendation(r.passRate);
              const topicUrl = `learner-quizzes.html?search=${encodeURIComponent(r.topic)}`;
              return `
                <tr>
                  <td><a class="topicLink" href="${topicUrl}">${escapeHtml(r.topic)}</a></td>
                  <td>${Number(r.totalQuizzes||0)}</td>
                  <td>${Number(r.quizzesAttempted||0)}</td>
                  <td>${r.avg}%</td>
                  <td>${Math.round(r.best)}%</td>
                  <td class="rec ${rec.cls}">${escapeHtml(rec.text)}</td>
                  <td><button class="smallBtn" type="button" onclick="location.href='${topicUrl}'">View quizzes</button></td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  // ✅ Small bar chart (30° labels) + fixed spacing + fixed canvas sizing
  function drawBarChart(canvas, rows, opts){
    const ctx = canvas.getContext("2d");
    const dp = window.devicePixelRatio || 1;

    // read CSS size correctly
    const cssW = Math.max(260, canvas.getBoundingClientRect().width || canvas.clientWidth || 500);
    const cssH = 170;

    canvas.width = Math.floor(cssW * dp);
    canvas.height = Math.floor(cssH * dp);

    const W = canvas.width;
    const H = canvas.height;

    ctx.clearRect(0,0,W,H);

    const data = (rows || []).slice(0,5);

    const pad = 16 * dp;
    const labelH = 68 * dp;
    const chartH = H - pad - labelH;
    const chartBottom = pad + chartH;

    if(!data.length){
      ctx.fillStyle = "#64748b";
      ctx.font = `${12*dp}px Inter, Arial`;
      ctx.fillText("No data yet", pad, pad + 18*dp);
      return;
    }

    const maxVal = 100;

    // spacing based on count (fixes “only 1 bar” look)
    const count = data.length;
    const gap = Math.max(10*dp, (count === 1 ? 0 : 12*dp));
    const usable = (W - pad*2 - gap*(count-1));
    const barW = Math.max(28*dp, usable / count);

    // colours rule
    const topColor = "#1b1648"; // one colour for all top bars
    const oranges = ["#f59e0b","#fb923c","#f97316","#ea580c","#c2410c"]; // different orange shades

    // axis line
    ctx.strokeStyle = "rgba(15,23,42,.10)";
    ctx.lineWidth = 1 * dp;
    ctx.beginPath();
    ctx.moveTo(pad, chartBottom);
    ctx.lineTo(W - pad, chartBottom);
    ctx.stroke();

    data.forEach((d, i)=>{
      const x = pad + i*(barW+gap);
      const val = Math.max(0, Math.min(maxVal, Number(d.passRate)||0));
      const h = (val / maxVal) * (chartH - 8*dp);
      const y = chartBottom - h;

      const fill = (opts?.mode === "bottom") ? oranges[i % oranges.length] : topColor;

      ctx.fillStyle = fill;
      roundRect(ctx, x, y, barW, h, 12*dp);
      ctx.fill();

      // percent label
      ctx.fillStyle = "rgba(15,23,42,.85)";
      ctx.font = `${11*dp}px Inter, Arial`;
      ctx.textAlign = "center";
      ctx.fillText(`${val}%`, x + barW/2, y - 6*dp);

      // rotated topic label (30 degrees)
      const name = shortLabel(d.topic, 30);
      ctx.save();
      ctx.translate(x + barW/2, chartBottom + 38*dp);
      ctx.rotate(-Math.PI/6); // 30 degrees
      ctx.fillStyle = "#475569";
      ctx.font = `${11*dp}px Inter, Arial`;
      ctx.textAlign = "right";
      ctx.fillText(name, 0, 0);
      ctx.restore();
    });
  }

  function roundRect(ctx, x, y, w, h, r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr, y);
    ctx.arcTo(x+w, y, x+w, y+h, rr);
    ctx.arcTo(x+w, y+h, x, y+h, rr);
    ctx.arcTo(x, y+h, x, y, rr);
    ctx.arcTo(x, y, x+w, y, rr);
    ctx.closePath();
  }

  function shortLabel(s, n){
    const t = cleanSpaces(s);
    if(t.length <= n) return t;
    return t.slice(0, n-1) + "…";
  }

  function cleanSpaces(s){
    return String(s||"").trim().replace(/\s+/g," ");
  }

  function escapeHtml(str){
    return String(str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>

</body>
</html>
