<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Results | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --nav:#1b1648;
      --accent:#0b3c5d;
      --red:#e11d2e;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --radius:14px;
      --shadow:0 8px 22px rgba(0,0,0,.06);
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
    a{text-decoration:none;color:inherit}

    .topbar{background:var(--nav);color:#fff;}
    .topbar-inner{
      max-width:1100px;margin:0 auto;padding:14px 18px;
      display:flex;align-items:center;justify-content:space-between;
    }

    .brand{font-weight:900;}
    .nav{display:flex;gap:10px;align-items:center;}
    .nav a{padding:8px 10px;border-radius:8px;color:#e7e9ff;font-weight:700;font-size:13px;}
    .nav a.active{border-bottom:3px solid var(--red);color:#fff;}
    .logoutBtn{
      background:rgba(255,255,255,.12);
      color:#fff;
      border:1px solid rgba(255,255,255,.2);
      padding:8px 12px;
      border-radius:8px;
      cursor:pointer;
    }

    .wrap{max-width:1100px;margin:0 auto;padding:18px;}

    .controls{display:flex;gap:10px;flex-wrap:wrap;}

    select{
      padding:4px 6px;
      border:1px solid #777;
      background:#fff;
      font-size:13px;
    }

    .btn{
      padding:4px 10px;
      border:1px solid #777;
      background:#efefef;
      cursor:pointer;
    }

    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin-top:14px;
      padding:14px;
    }

    .tiles{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      margin-bottom:12px;
    }

    .tile{
      background:#fff;
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
    }

    .tileLabel{
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      font-weight:800;
    }

    .tileValue{
      font-size:22px;
      font-weight:700;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }

    th, td{
      padding:8px;
      border-bottom:1px solid #eee;
      text-align:left;
    }

    th{
      background:#f8fafc;
      font-size:11px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .status.pass{color:#065f46;font-weight:700;}
    .status.fail{color:#9a3412;font-weight:700;}

    .smallBtn{
      padding:6px 10px;
      border:1px solid #ddd;
      background:#fff;
      cursor:pointer;
    }

    .empty{
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
      color:var(--muted);
    }
  </style>

  <script>
    if(!localStorage.getItem("token")){
      location.href="login.html";
    }
  </script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Practice Online</div>
    <nav class="nav">
      <a href="learner-quizzes.html">Back to Practice</a>
      <a class="active" href="results.html">Results</a>
      <a href="about.html">About</a>
      <button class="logoutBtn" id="logoutBtn">Logout</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="controls">
    <select id="topicFilter">
      <option value="">All Topics</option>
    </select>

    <select id="statusFilter">
      <option value="">All</option>
      <option value="pass">Pass</option>
      <option value="fail">Fail</option>
    </select>

    <select id="yearSelect">
      <option value="">All Years</option>
    </select>

    <button class="btn" id="applyBtn">Continue</button>
  </div>

  <section class="section">
    <div class="tiles">
      <div class="tile">
        <div class="tileLabel">Average</div>
        <div class="tileValue" id="avgBox">0%</div>
      </div>
      <div class="tile">
        <div class="tileLabel">Attempts</div>
        <div class="tileValue" id="attemptsBox">0</div>
      </div>
      <div class="tile">
        <div class="tileLabel">Pass Rate</div>
        <div class="tileValue" id="passRateBox">0%</div>
      </div>
      <div class="tile">
        <div class="tileLabel">Best Mark</div>
        <div class="tileValue" id="bestBox">0%</div>
      </div>
    </div>
  </section>

  <section class="section" id="tableWrap">
    <div class="empty">Loading results…</div>
  </section>

</main>

<script>
const API = "https://api.practiceonline.co.za";
const token = localStorage.getItem("token");

const topicFilter = document.getElementById("topicFilter");
const statusFilter = document.getElementById("statusFilter");
const yearSelect = document.getElementById("yearSelect");
const applyBtn = document.getElementById("applyBtn");

const avgBox = document.getElementById("avgBox");
const attemptsBox = document.getElementById("attemptsBox");
const passRateBox = document.getElementById("passRateBox");
const bestBox = document.getElementById("bestBox");

let allResults = [];

document.getElementById("logoutBtn").onclick = ()=>{
  localStorage.clear();
  location.href="login.html";
};

applyBtn.addEventListener("click", renderEverything);
topicFilter.addEventListener("change", renderEverything);
statusFilter.addEventListener("change", renderEverything);
yearSelect.addEventListener("change", renderEverything);

loadResults();

async function loadResults(){
  const res = await fetch(`${API}/api/results/my`,{
    headers:{Authorization:`Bearer ${token}`}
  });
  const data = await res.json().catch(()=>[]);
  allResults = Array.isArray(data)?data:[];
  buildFilters(allResults);
  renderEverything();
}

function buildFilters(data){
  const topics=[...new Set(data.map(r=>r.topic||"General"))];
  topicFilter.innerHTML=`<option value="">All Topics</option>`+
    topics.map(t=>`<option value="${t}">${t}</option>`).join("");

  const years=[...new Set(data.map(r=>{
    const d=new Date(r.createdAt);
    return isNaN(d)?null:d.getFullYear();
  }).filter(Boolean))];

  yearSelect.innerHTML=`<option value="">All Years</option>`+
    years.map(y=>`<option value="${y}">${y}</option>`).join("");
}

function renderEverything(){
  const filtered=applyFilters(allResults);

  const attempts=filtered.length;
  const avg=attempts?Math.round(filtered.reduce((s,r)=>s+r.percent,0)/attempts):0;
  const best=attempts?Math.max(...filtered.map(r=>r.percent)):0;
  const passCount=filtered.filter(r=>r.percent>=50).length;
  const passRate=attempts?Math.round((passCount/attempts)*100):0;

  avgBox.textContent=avg+"%";
  attemptsBox.textContent=attempts;
  passRateBox.textContent=passRate+"%";
  bestBox.textContent=best+"%";

  renderTable(filtered);
}

function applyFilters(data){
  const topic=topicFilter.value;
  const status=statusFilter.value;
  const year=yearSelect.value;

  return data.filter(r=>{
    if(topic && r.topic!==topic) return false;
    if(status==="pass" && r.percent<50) return false;
    if(status==="fail" && r.percent>=50) return false;
    if(year){
      const d=new Date(r.createdAt);
      if(String(d.getFullYear())!==year) return false;
    }
    return true;
  });
}

function renderTable(data){
  const wrap=document.getElementById("tableWrap");
  if(!data.length){
    wrap.innerHTML=`<div class="empty">No results found.</div>`;
    return;
  }

  wrap.innerHTML=`
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Grade</th>
          <th>Topic</th>
          <th>Assessment</th>
          <th>Mark</th>
          <th>Status</th>
          <th>Review</th>
        </tr>
      </thead>
      <tbody>
        ${data.map(r=>{
          const d=new Date(r.createdAt).toLocaleString();
          const pass=r.percent>=50;
          return `
          <tr>
            <td>${d}</td>
            <td>${r.grade}</td>
            <td>${r.topic}</td>
            <td>${r.title}</td>
            <td>${r.percent}%</td>
            <td class="status ${pass?"pass":"fail"}">${pass?"Pass":"Fail"}</td>
            <td><button class="smallBtn" onclick="location.href='review.html?resultId=${r._id}'">Review</button></td>
          </tr>
          `;
        }).join("")}
      </tbody>
    </table>
  `;
}
</script>

</body>
</html>
