<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Results | Practice Online</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --nav:#1b1648;
  --accent:#0b3c5d;
  --red:#e11d2e;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#e6e6e6;
  --text:#0f172a;
  --muted:#475569;
  --radius:14px;
  --shadow:0 8px 22px rgba(0,0,0,.06);
}

*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
a{text-decoration:none;color:inherit}

.topbar{background:var(--nav);color:#fff;}
.topbar-inner{
  max-width:1100px;margin:0 auto;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}

.brand{font-weight:900;letter-spacing:.2px;}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.nav a{
  padding:8px 10px;border-radius:8px;color:#e7e9ff;
  font-weight:700;font-size:13px;
}
.nav a.active{border-bottom:3px solid var(--red);color:#fff;}
.nav a:hover{background:rgba(255,255,255,.10)}

.logoutBtn{
  background:rgba(255,255,255,.12);
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  font-weight:800;
}
.logoutBtn:hover{background:rgba(255,255,255,.18)}

.wrap{max-width:1100px;margin:0 auto;padding:18px;}

.section{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-top:14px;
  padding:14px;
}

table{width:100%;border-collapse:collapse;font-size:13px;}
th, td{padding:8px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;}

th{
  background:#f8fafc;
  font-size:11px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:800;
  letter-spacing:.06em;
}

.status.pass{color:#065f46;font-weight:800;}
.status.fail{color:#9a3412;font-weight:800;}

/* ✅ NICE BADGE STYLE */
.actionBadge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:#f3f4f6;
  border:1px solid #e5e7eb;
  color:#000;
  font-weight:800;
  cursor:pointer;
  transition:all .15s ease;
  user-select:none;
}

.actionBadge:hover{
  background:#e5e7eb;
  transform:translateY(-1px);
}

.empty{
  padding:14px;
  border:1px dashed #ddd;
  border-radius:12px;
  background:#fafafa;
  color:var(--muted);
  font-weight:700;
}
</style>

<script>
if(!localStorage.getItem("token")){
  location.href="login.html";
}
</script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Practice Online</div>

    <nav class="nav">
      <a href="learner-quizzes.html">Practice</a>
      <a class="active" href="results.html">Results</a>

      <!-- ✅ OTHER TABS -->
      <a href="support.html">Support</a>
      <a href="about.html">About</a>

      <!-- ✅ ADMIN TAB (hidden for learners by nav.js) -->
      <a href="admin-quiz.html" data-admin style="display:none;">Admin</a>

      <button class="logoutBtn" id="logoutBtn">Logout</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="section" id="tableWrap">
    <div class="empty">Loading results…</div>
  </section>
</main>

<!-- ✅ IMPORTANT: include nav.js so window.API + admin visibility works -->
<script src="nav.js"></script>

<script>
const API = window.API || "https://api.practiceonline.co.za";  // ✅ uses nav.js if present
const token = localStorage.getItem("token");
let allResults = [];

document.getElementById("logoutBtn").onclick = ()=>{
  localStorage.removeItem("token");
  localStorage.removeItem("username");
  localStorage.removeItem("me_cache");
  location.href="login.html";
};

loadResults();

async function loadResults(){
  const res = await fetch(`${API}/api/results/my`,{
    headers:{Authorization:`Bearer ${token}`}
  });

  if(res.status===401){
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("me_cache");
    location.href="login.html";
    return;
  }

  const data = await res.json().catch(()=>[]);
  allResults = Array.isArray(data)?data:[];
  renderTable(allResults);
}

function renderTable(data){
  const wrap=document.getElementById("tableWrap");

  if(!data.length){
    wrap.innerHTML=`<div class="empty">No results found.</div>`;
    return;
  }

  wrap.innerHTML=`
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Grade</th>
        <th>Topic</th>
        <th>Assessment</th>
        <th>Mark</th>
        <th>Status</th>
        <th>Solution</th>
        <th>Retry</th>
      </tr>
    </thead>
    <tbody>
      ${data.map(r=>{
        const d=new Date(r.createdAt);
        const dateTxt=isNaN(d)?"":d.toLocaleString();
        const percent=Number(r.percent)||0;
        const pass=percent>=50;

        return `
        <tr>
          <td>${escapeHtml(dateTxt)}</td>
          <td>${escapeHtml(String(r.grade??""))}</td>
          <td>${escapeHtml(String(r.topic||"General"))}</td>
          <td>${escapeHtml(String(r.title||"Assessment"))}</td>
          <td>${percent}%</td>
          <td class="status ${pass?"pass":"fail"}">${pass?"Pass":"Fail"}</td>

          <td>
            <span class="actionBadge"
              onclick="location.href='review.html?resultId=${encodeURIComponent(r._id)}'">
              Solution
            </span>
          </td>

          <td>
            <span class="actionBadge"
              onclick="location.href='attempt.html?quizId=${encodeURIComponent(r.quizId)}&mode=practice'">
              Retry
            </span>
          </td>
        </tr>
        `;
      }).join("")}
    </tbody>
  </table>`;
}

function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
</script>

</body>
</html>
