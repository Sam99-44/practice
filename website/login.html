<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Practice Online</title>

  <meta name="robots" content="noindex, nofollow" />

  
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#d9dee7;
      --text:#0f172a;
      --muted:#475569;
      --nav:#1b1648;
      --gold:#c9a227;
      --gold-dark:#a98518;
      --error:#b91c1c;
      --ok:#065f46;
      --shadow:0 8px 24px rgba(15,23,42,.10);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    body{min-height:100vh}

    a{
      color:inherit;
      text-decoration:none;
    }

    button,input{
      font:inherit;
    }

    .topbar{
      background:var(--nav);
      color:#fff;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .topbar-inner{
      max-width:1150px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .accountLeft{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      user-select:none;
    }

    .accountIconWrap{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .accountIcon{
      width:40px;
      height:40px;
      display:block;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .accountMeta{min-width:0;line-height:1.1}

    .accountName{
      font-size:14px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
    }

    .accountType{
      font-size:13px;
      color:#e0e7ff;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:220px;
      font-weight:400;
    }

    .topbarRight{
      display:flex;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
    }

    .topLink{
      color:#e7e9ff;
      font-size:13px;
      font-weight:700;
      padding:8px 0;
      border-bottom:3px solid transparent;
    }

    .topLink:hover{color:#fff}

    .topLink.active{
      color:#fff;
      border-bottom:3px solid var(--gold);
    }

    .wrap{
      width:100%;
      max-width:1100px;
      margin:0 auto;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:520px;
      margin:34px auto;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:12px;
      padding:20px;
      box-shadow:var(--shadow);
    }

    h2{
      margin:0 0 4px;
      color:var(--nav);
      font-size:24px;
      line-height:1.25;
      font-weight:800;
    }

    p{
      margin:4px 0 14px;
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }

    label{
      display:block;
      margin-top:10px;
      font-weight:700;
      font-size:14px;
      color:#111827;
    }

    input{
      width:100%;
      height:42px;
      padding:0 12px;
      margin-top:6px;
      border-radius:8px;
      border:1px solid #cfd6df;
      background:#fff;
      color:#111827;
      font-size:14px;
      outline:none;
      font-weight:400;
      box-shadow:0 4px 12px rgba(15,23,42,.08);
    }

    input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(201,162,39,.14),0 4px 12px rgba(15,23,42,.08);
    }

    .forgotLink{
      display:inline-block;
      margin:6px 0 14px;
      color:var(--gold-dark);
      font-size:14px;
      font-weight:500;
    }

    .forgotLink:hover{text-decoration:underline}

    button{
      width:100%;
      height:42px;
      padding:0 14px;
      margin-top:0;
      border-radius:8px;
      border:1px solid var(--nav);
      background:var(--nav);
      color:#fff;
      font-weight:800;
      cursor:pointer;
      transition:background .15s ease,transform .08s ease;
      font-size:14px;
    }

    button:hover:not(:disabled){
      background:#120e38;
    }

    button:active:not(:disabled){
      transform:translateY(1px);
    }

    button:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
    }

    .ghostBtn{
      display:none;
      margin-top:10px;
      background:#fff;
      color:var(--nav);
      border:1px solid var(--gold);
    }

    .loginDivider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:16px 0;
      color:#64748b;
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .loginDivider::before,
    .loginDivider::after{
      content:"";
      flex:1;
      height:1px;
      background:#e5e7eb;
    }

    #googleLoginBtn{
      display:flex !important;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin-top:0;
      background:#fff;
      color:#111827;
      border:1px solid #cfd6df;
      font-weight:700;
      box-shadow:none;
    }

    #googleLoginBtn:hover:not(:disabled){
      background:#f8fafc;
      border-color:#b8c2cf;
    }

    #googleLoginBtn img{
      width:20px;
      height:20px;
      display:block;
      flex:0 0 20px;
    }

    .msg{
      min-height:18px;
      margin-top:10px;
      font-size:13px;
      line-height:1.4;
    }

    .error{color:var(--error)}
    .ok{color:var(--ok)}

    .links{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:14px;
      font-size:14px;
      flex-wrap:wrap;
    }

    .links a{
      color:var(--gold-dark);
      font-weight:700;
    }

    .links a:hover{text-decoration:underline}

    @media(max-width:640px){
      .topbar-inner{padding:12px 14px}
      .accountName,.accountType{max-width:120px}
      .wrap{padding:16px}
      .card{
        max-width:100%;
        margin:24px auto;
        padding:18px;
      }
      h2{font-size:22px}
    }
  </style>

</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="accountLeft">
        <div class="accountIconWrap">
          <img
            class="accountIcon"
            src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
            alt="Practice Online"
          >
        </div>

        <div class="accountMeta">
          <div class="accountName">Practice Online</div>
          <div class="accountType">Sign in</div>
        </div>
      </div>

      <div class="topbarRight">
        <a href="login.html" class="topLink active">Login</a>
        <a href="register.html" class="topLink">Register</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="card">
      <h2>Login</h2>
      <p>Access your Practice Online account</p>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        spellcheck="false"
        autocapitalize="none"
        
      />

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />

      <a class="forgotLink" href="reset-otp.html">Forgot password</a>

<button id="loginBtn" type="button">Login</button>

<div class="loginDivider" aria-hidden="true">or</div>

<button
  id="googleLoginBtn"
  type="button"
  aria-label="Continue with Google"
>
  <img
    src="https://www.svgrepo.com/show/475656/google-color.svg"
    width="20"
    height="20"
    alt=""
    aria-hidden="true"
  >
  <span>Continue with Google</span>
</button>

<button id="resendBtn" class="ghostBtn" type="button">Resend Verification Email</button>

      <p id="msg" class="msg"></p>

      <div class="links">
        <span>Don't have an account?</span>
        <a href="register.html">Sign Up</a>
      </div>
    </div>
  </main>

<script>
  const API = "https://api.practiceonline.co.za";

  const loginBtn = document.getElementById("loginBtn");
  const googleLoginBtn = document.getElementById("googleLoginBtn");
  const resendBtn = document.getElementById("resendBtn");
  const msg = document.getElementById("msg");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const params = new URLSearchParams(window.location.search);
  const googleToken = params.get("googleToken");
  const nextFromUrl = params.get("next");

  function googleLearnerNeedsProfileSetup(user = {}) {
    const role = String(user.role || "").trim().toLowerCase();
    const accountType = String(user.accountType || "").trim().toLowerCase();

    if (role === "admin" || role === "editor" || role === "tester") {
      return false;
    }

    const learnerLike =
      role === "learner" ||
      accountType === "learner" ||
      accountType === "practice" ||
      !accountType;

    if (!learnerLike) return false;

    /*
     * This is now the authoritative first-login rule.
     * A new/incomplete Google learner MUST finish the guided setup.
     */
    return user.onboardingCompleted !== true;
  }

  function getGooglePostLoginDestination(user = {}) {
    if (googleLearnerNeedsProfileSetup(user)) {
      const setupUrl = new URL("register.html", window.location.href);
      setupUrl.searchParams.set("googleSetup", "1");

      if (nextFromUrl) {
        setupUrl.searchParams.set("next", nextFromUrl);
      }

      return setupUrl.pathname + setupUrl.search;
    }

    return nextFromUrl
      ? decodeURIComponent(nextFromUrl)
      : getDefaultRedirect(user);
  }

  async function completeGoogleLogin(token) {
    if (!token) return;

    loginBtn.disabled = true;
    googleLoginBtn.disabled = true;
    resendBtn.disabled = true;
    setMsg("Signing in with Google...");

    try {
      localStorage.setItem("token", token);

      const res = await fetch(`${API}/api/auth/me`, {
        method: "GET",
        cache: "no-store",
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const user = await safeJson(res);

      if (!res.ok || !user || typeof user !== "object") {
        throw new Error(user?.message || "Could not complete Google sign in.");
      }

      localStorage.setItem("user", JSON.stringify(user));
      localStorage.setItem("username", user.username || user.email || "");
      localStorage.setItem("role", user.role || "");

      /*
       * Remove the OAuth token from the visible browser URL before
       * navigating away so it is not left in browser history.
       */
      try {
        const cleanUrl = new URL(window.location.href);
        cleanUrl.searchParams.delete("googleToken");
        window.history.replaceState(
          {},
          document.title,
          cleanUrl.pathname + cleanUrl.search + cleanUrl.hash
        );
      } catch {}

      const destination = getGooglePostLoginDestination(user);

      window.location.replace(destination);

    } catch (error) {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      localStorage.removeItem("username");
      localStorage.removeItem("role");

      loginBtn.disabled = false;
      googleLoginBtn.disabled = false;
      resendBtn.disabled = false;

      setMsg(
        error?.message || "Google sign in could not be completed. Please try again.",
        "error"
      );
    }
  }

  if (googleToken) {
    completeGoogleLogin(googleToken);
  }

  googleLoginBtn.addEventListener("click", () => {
    googleLoginBtn.disabled = true;
    loginBtn.disabled = true;
    setMsg("Opening Google sign in...");

    /*
     * Preserve the requested destination if login.html was opened with
     * ?next=..., while remaining compatible with the existing backend route.
     */
    const googleAuthUrl = new URL(`${API}/api/auth/google`);

    if (nextFromUrl) {
      googleAuthUrl.searchParams.set("next", nextFromUrl);
    }

    window.location.assign(googleAuthUrl.toString());
  });
  function setMsg(text, type = "") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function showResend(show) {
    resendBtn.style.display = show ? "block" : "none";
  }

  function isValidEmail(email) {
    const e = String(email || "").trim().toLowerCase();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  }

  async function safeJson(res) {
    try {
      return await res.json();
    } catch {
      return {};
    }
  }

  function getDefaultRedirect(user = {}) {
    const role = String(user.role || "").toLowerCase();

    if (role === "admin") return "admin-dashboard.html";
    if (role === "editor") return "admin-dashboard.html";

    // Learners open the main learner hub with Quizzes as the default section.
    return "learning-content.html#quizzes";
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") loginBtn.click();
  });

  loginBtn.onclick = async () => {
    const email = emailEl.value.trim().toLowerCase();
    const password = passwordEl.value;

    showResend(false);

    if (!email || !password) {
      return setMsg("Email and password are required.", "error");
    }

    if (!isValidEmail(email)) {
      return setMsg("Please enter a valid email address.", "error");
    }

    loginBtn.disabled = true;
    googleLoginBtn.disabled = true;
    resendBtn.disabled = true;
    setMsg("Signing in...");

    try {
      const res = await fetch(`${API}/api/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await safeJson(res);

      if (!res.ok) {
        loginBtn.disabled = false;
        googleLoginBtn.disabled = false;
        resendBtn.disabled = false;

        const errorMessage = data.message || "Invalid email or password.";
        setMsg(errorMessage, "error");

        if (
          res.status === 403 &&
          String(errorMessage).toLowerCase().includes("verify your email")
        ) {
          showResend(true);
        }

        return;
      }

      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user || {}));
      localStorage.setItem("username", data.user?.username || "");
      localStorage.setItem("role", data.user?.role || "");

      const next = new URLSearchParams(window.location.search).get("next");
      window.location.href = next ? decodeURIComponent(next) : getDefaultRedirect(data.user || {});

    } catch {
      loginBtn.disabled = false;
      resendBtn.disabled = false;
      setMsg("Network error. Please try again.", "error");
    }
  };

  resendBtn.onclick = async () => {
    const email = emailEl.value.trim().toLowerCase();

    if (!email) {
      return setMsg("Please enter your email first.", "error");
    }

    if (!isValidEmail(email)) {
      return setMsg("Please enter a valid email address.", "error");
    }

    resendBtn.disabled = true;
    loginBtn.disabled = true;
    googleLoginBtn.disabled = true;
    setMsg("Sending verification email...");

    try {
      const res = await fetch(`${API}/api/resend-verification-email`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });

      const data = await safeJson(res);

      resendBtn.disabled = false;
      loginBtn.disabled = false;
      googleLoginBtn.disabled = false;

      if (!res.ok) {
        return setMsg(data.message || "Could not resend verification email.", "error");
      }

      setMsg(
        data.message || "Verification email sent. Please check your inbox.",
        "ok"
      );
    } catch {
      resendBtn.disabled = false;
      loginBtn.disabled = false;
      googleLoginBtn.disabled = false;
      setMsg("Network error. Please try again.", "error");
    }
  };
</script>

</body>
</html>
