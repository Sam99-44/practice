<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Review Attempt | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--text);}
    .wrap{max-width:1000px; margin:0 auto; padding:24px;}

    .topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{width:38px; height:38px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800;}
    .brand span{display:block; font-size:13px; color:var(--muted);}

    .nav{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
    .nav a,.nav button{
      text-decoration:none;
      font-size:14px;
      padding:8px 12px;
      border-radius:10px;
      border:1px solid #ddd;
      background:#fff;
      cursor:pointer;
      font-weight:700;
      color:var(--text);
    }
    .nav a:hover,.nav button:hover{ background:var(--accent-soft); border-color:transparent; }
    .nav .primary{ background:var(--accent); color:#fff; border:none; }
    .nav .primary:hover{ opacity:.95; }

    .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
    h1{margin:0; font-size:22px;}
    .muted{color:var(--muted);}
    .error{color:var(--error);}
    .ok{color:var(--ok);}

    .metaRow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-top:8px;}
    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #cfe9ff;
      background:#eef7ff;
      color:#0b3c5d;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .pill.ok{ border-color:#bbf7d0; background:#ecfdf5; color:#065f46; }
    .pill.bad{ border-color:#fecaca; background:#fef2f2; color:#b91c1c; }

    .qbox{margin-top:14px; padding-top:14px; border-top:1px solid #eee;}
    .qtitle{font-size:16px; font-weight:800; margin:0 0 10px 0; line-height:1.45;}
    .opt{
      border:1px solid #ddd;
      border-radius:12px;
      padding:10px 12px;
      margin-bottom:10px;
      background:#fff;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .tag{
      font-size:12px;
      font-weight:900;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid #e5e7eb;
      background:#f8fafc;
      white-space:nowrap;
    }
    .opt.correct{ border-color:#16a34a; background:#ecfdf5; }
    .opt.chosenWrong{ border-color:#dc2626; background:#fef2f2; }
    .opt.chosenCorrect{ border-color:#16a34a; background:#ecfdf5; }
    .opt .text{flex:1;}

    .footerBar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
    .btn{
      background:var(--accent);
      color:#fff;
      padding:10px 14px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
      font-size:14px;
    }
    .btn:disabled{opacity:.6; cursor:not-allowed;}
    .btn2{
      background:#fff;
      border:1px solid #ddd;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
      font-size:14px;
    }
    .btn2:hover{ background:var(--accent-soft); border-color:transparent; }

    .small{font-size:13px;}
  </style>

  <script>
    if (!localStorage.getItem("token")) {
      window.location.href = "login.html";
    }
  </script>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <span id="subTitle">Review Attempt</span>
      </div>
    </div>

    <div class="nav">
      <a href="results.html">Back to Results</a>
      <a href="learner-quizzes.html">Practice</a>
      <button class="primary" id="logoutBtn" type="button">Logout</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <div>
        <h1 id="title">Loading…</h1>
        <div class="muted" id="metaLine" style="margin-top:6px;">Please wait…</div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start;">
        <span class="pill" id="progressPill">0/0</span>
        <span class="pill" id="scorePill">Score</span>
      </div>
    </div>

    <div class="qbox" id="qbox"></div>

    <div class="footerBar">
      <button class="btn2" id="prevBtn" type="button">← Previous</button>

      <div class="muted small" id="hint">
        Tip: Green = correct. Red = your wrong choice.
      </div>

      <button class="btn" id="nextBtn" type="button">Next →</button>
    </div>

    <p id="msg" class="muted" style="margin-top:12px;"></p>
  </div>
</div>

<script>
  const API = window.API || "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");

  const params = new URLSearchParams(location.search);
  const resultId = params.get("resultId");

  const titleEl = document.getElementById("title");
  const metaLine = document.getElementById("metaLine");
  const qbox = document.getElementById("qbox");
  const progressPill = document.getElementById("progressPill");
  const scorePill = document.getElementById("scorePill");
  const msgEl = document.getElementById("msg");
  const subTitle = document.getElementById("subTitle");

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  let result = null;
  let idx = 0;

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    window.location.href = "login.html";
  };

  if (!resultId) {
    titleEl.textContent = "Review not available";
    metaLine.textContent = "Missing resultId in the URL. Open from Results page.";
    msgEl.className = "error";
    msgEl.textContent = "Example: review.html?resultId=YOUR_RESULT_ID";
  } else {
    loadResult();
  }

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g, " ");
  }
  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  async function loadResult(){
    try{
      msgEl.className = "muted";
      msgEl.textContent = "Loading attempt…";

      const res = await fetch(`${API}/api/results/${encodeURIComponent(resultId)}`, {
        headers: { Authorization: "Bearer " + token }
      });

      if (res.status === 401) {
        localStorage.removeItem("token");
        localStorage.removeItem("username");
        window.location.href = "login.html";
        return;
      }

      if (!res.ok) {
        const t = await res.text().catch(()=> "");
        throw new Error(t || `Request failed (HTTP ${res.status})`);
      }

      result = await res.json();

      const quizTitle = cleanSpaces(result.title || "Quiz");
      const topic = cleanSpaces(result.topic || "General");
      const grade = result.grade ?? "-";

      subTitle.textContent = `Welcome, ${localStorage.getItem("username") || "Learner"}`;
      titleEl.textContent = quizTitle;

      const timeStr = result.timeTakenSeconds ? ` • Time used ${Math.round(result.timeTakenSeconds/60)} min` : "";
      metaLine.textContent = `Grade ${grade} • ${topic}${timeStr}`;

      const pct = Number(result.percent ?? 0);
      const status = result.status || (pct >= 50 ? "PASS" : "FAIL");
      scorePill.textContent = `${result.score}/${result.total} (${pct}%) • ${status}`;
      scorePill.className = "pill " + (status === "PASS" ? "ok" : "bad");

      const answers = Array.isArray(result.answers) ? result.answers : [];
      if (answers.length === 0) {
        msgEl.className = "error";
        msgEl.textContent = "No answers were saved for this attempt (answers array is empty).";
        qbox.innerHTML = "";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      idx = 0;
      render();
      msgEl.textContent = "";
    } catch(err){
      msgEl.className = "error";
      msgEl.textContent = "Could not load attempt: " + (err.message || "");
    }
  }

  function render(){
    const answers = result.answers || [];
    const total = answers.length;
    idx = Math.max(0, Math.min(idx, total - 1));

    const a = answers[idx];
    const qText = cleanSpaces(a.questionText || `Question ${a.questionIndex + 1}`);
    const opts = Array.isArray(a.options) ? a.options : [];

    progressPill.textContent = `${idx + 1}/${total}`;

    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === total - 1;

    const chosen = Number.isFinite(Number(a.chosenIndex)) ? Number(a.chosenIndex) : -1;
    const correct = Number.isFinite(Number(a.correctIndex)) ? Number(a.correctIndex) : -1;

    qbox.innerHTML = `
      <div class="muted small" style="margin-bottom:8px;">
        Question ${idx + 1} • ${a.isCorrect ? '<span class="ok"><b>Correct</b></span>' : '<span class="error"><b>Wrong</b></span>'}
      </div>
      <div class="qtitle">${escapeHtml(qText)}</div>

      ${(opts.length ? opts : ["(No options saved)"]).map((o, j) => {
        const isCorrect = j === correct;
        const isChosen = j === chosen;

        let cls = "opt";
        let badge = "";

        if (isCorrect) {
          cls += " correct";
          badge = `<span class="tag">Correct</span>`;
        }
        if (isChosen && isCorrect) {
          cls += " chosenCorrect";
          badge = `<span class="tag">Your choice ✓</span>`;
        }
        if (isChosen && !isCorrect) {
          cls += " chosenWrong";
          badge = `<span class="tag">Your choice</span>`;
        }

        return `
          <div class="${cls}">
            ${badge ? badge : `<span class="tag">Option</span>`}
            <div class="text">${escapeHtml(cleanSpaces(o))}</div>
          </div>
        `;
      }).join("")}

      <div class="muted small" style="margin-top:10px;">
        Your answer: <b>${chosen >= 0 ? String.fromCharCode(65 + chosen) : "Not answered"}</b>
        &nbsp;•&nbsp;
        Correct answer: <b>${correct >= 0 ? String.fromCharCode(65 + correct) : "-"}</b>
      </div>
    `;
  }

  prevBtn.addEventListener("click", () => {
    idx -= 1;
    render();
  });

  nextBtn.addEventListener("click", () => {
    idx += 1;
    render();
  });

  // Keyboard support
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && idx > 0) { idx--; render(); }
    if (e.key === "ArrowRight" && result?.answers && idx < result.answers.length - 1) { idx++; render(); }
  });
</script>
</body>
</html>
