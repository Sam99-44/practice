<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit Assessment | Practice Online</title>

  <style>
    body{font-family:Arial; padding:20px; max-width:1000px; margin:auto; background:#f6f7fb;}
    .card{background:#fff; border:1px solid #e6e6e6; border-radius:14px; padding:16px; box-shadow:0 6px 18px rgba(0,0,0,0.06);}
    input, textarea, select{width:100%; padding:10px; margin:8px 0; border-radius:10px; border:1px solid #ddd; outline:none;}
    textarea{min-height:90px; resize:vertical;}
    button{padding:10px 14px; cursor:pointer; border:none; border-radius:10px; font-weight:700;}
    .btn{background:#111827; color:#fff;}
    .btn2{background:#fff; border:1px solid #ddd; color:#111827;}
    .danger{background:#b91c1c; color:#fff;}
    .warn{background:#b45309; color:#fff;}
    .ok{color:#065f46;}
    .muted{color:#555;}
    .error{color:#b91c1c;}
    .topbar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
    .qcard{border:1px solid #e6e6e6; border-radius:12px; padding:12px; margin-top:12px; background:#fff;}
    .qhead{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
    .smallbtn{border:1px solid #ddd; background:#fff; color:#111827; padding:8px 10px; border-radius:10px; font-weight:700;}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    hr{border:none; border-top:1px solid #eee; margin:14px 0;}
    .pill{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #cfe9ff;
      background:#eef7ff;
      color:#0b3c5d;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .pill.red{border-color:#fecaca; background:#fff1f2; color:#b91c1c;}
    .pill.green{border-color:#bbf7d0; background:#f0fdf4; color:#065f46;}
    .actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
    .disabledBox{opacity:.6; pointer-events:none;}
    .tiny{font-size:12px;}
    .note{font-size:12px; color:#64748b; margin-top:-4px;}
  </style>

  <script>
    if (!localStorage.getItem("token")) window.location.href = "login.html";
  </script>
</head>
<body>

  <div class="topbar">
    <div>
      <h2 style="margin:0;">Admin – Edit / Availability</h2>
      <div class="muted" id="who">Checking login...</div>
    </div>
    <div class="actions">
      <a class="btn2" href="admin-dashboard.html" style="text-decoration:none; display:inline-block;">Dashboard</a>
      <a class="btn2" href="admin-quiz.html" style="text-decoration:none; display:inline-block;">Add Assessment</a>
      <a class="btn2" href="learner-quizzes.html" style="text-decoration:none; display:inline-block;">Learner View</a>
      <button class="btn" id="logoutBtn" type="button">Logout</button>
    </div>
  </div>

  <div class="card">

    <!-- Search + Grade filter -->
    <div class="row">
      <div>
        <label>Filter by Grade</label>
        <select id="gradeFilter">
          <option value="">All grades</option>
          <option value="8">Grade 8</option>
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
        </select>
      </div>
      <div>
        <label>Search topic or assessment title</label>
        <input id="searchBox"/>
      </div>
    </div>

    <div class="row" style="margin-top:6px;">
      <div>
        <label>Select Assessment</label>
        <select id="assessmentSelect">
          <option value="">Loading…</option>
        </select>
      </div>
      <div>
        <label>Availability</label>
        <div id="freezePill" class="pill">—</div>
        <div class="note" id="availabilityNote"></div>
      </div>
    </div>

    <div class="actions" style="margin-top:6px;">
      <button class="warn" id="freezeBtn" type="button" disabled>Make Unavailable</button>
      <button class="danger" id="deleteBtn" type="button" disabled>Delete</button>
      <span class="muted" id="msg"></span>
    </div>

    <hr>

    <div id="editArea" class="disabledBox">
      <div class="row">
        <div>
          <label>Grade</label>
          <select id="grade">
            <option value="">Select Grade</option>
            <option value="8">Grade 8</option>
            <option value="9">Grade 9</option>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>

        <div>
          <label>Topic</label>
          <input id="topic" />
        </div>
      </div>

      <label>Assessment Title</label>
      <input id="title" />

      <label>Instructions (shown before starting)</label>
      <textarea id="instructions" placeholder="Example:"></textarea>

      <div class="row">
        <div>
          <label>Available From (optional)</label>
          <input id="availableFrom" type="datetime-local" />
        </div>
        <div>
          <label>Available Until (optional)</label>
          <input id="availableUntil" type="datetime-local" />
        </div>
      </div>

      <label>Time Limit (minutes)</label>
      <input id="timeLimitMinutes" type="number" min="1" max="180" />

      <hr>

      <div class="qhead">
        <h3 style="margin:0;">Questions (4 options A–D)</h3>
        <button class="smallbtn" id="addQuestionBtn" type="button">+ Add Question</button>
      </div>

      <div id="questionsWrap"></div>

      <hr>

      <button class="btn" id="saveBtn" type="button">Save Changes</button>
    </div>
  </div>

  <script>
    // ✅ UPDATED API BASE (important)
    const API = "https://api.practiceonline.co.za";
    const token = localStorage.getItem("token");

    const who = document.getElementById("who");
    const msg = document.getElementById("msg");

    const gradeFilter = document.getElementById("gradeFilter");
    const searchBox = document.getElementById("searchBox");
    const assessmentSelect = document.getElementById("assessmentSelect");

    const freezeBtn = document.getElementById("freezeBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const freezePill = document.getElementById("freezePill");
    const availabilityNote = document.getElementById("availabilityNote");

    const editArea = document.getElementById("editArea");
    const gradeEl = document.getElementById("grade");
    const topicEl = document.getElementById("topic");
    const titleEl = document.getElementById("title");
    const instructionsEl = document.getElementById("instructions");
    const availableFromEl = document.getElementById("availableFrom");
    const availableUntilEl = document.getElementById("availableUntil");
    const timeLimitEl = document.getElementById("timeLimitMinutes");

    const saveBtn = document.getElementById("saveBtn");
    const addQuestionBtn = document.getElementById("addQuestionBtn");
    const questionsWrap = document.getElementById("questionsWrap");

    let currentQuiz = null;
    let allQuizzes = [];

    function setMsg(t, cls="muted"){
      msg.className = cls;
      msg.textContent = t;
    }

    function logout(){
      // ✅ cleaner logout
      localStorage.clear();
      window.location.href = "login.html";
    }
    document.getElementById("logoutBtn").addEventListener("click", logout);

    function cleanSpaces(s){
      return String(s || "").trim().replace(/\s+/g, " ");
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function escapeAttr(str){
      return String(str || "").replaceAll('"', "&quot;");
    }

    function pad2(n){ return String(n).padStart(2,"0"); }

    function isoToLocalInput(iso){
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function localInputToIso(val){
      if (!val) return null;
      const d = new Date(val);
      if (isNaN(d.getTime())) return null;
      return d.toISOString();
    }

    function isUnavailable(q){
      const now = new Date();
      if (q?.isFrozen) return true;

      const from = q?.availableFrom ? new Date(q.availableFrom) : null;
      const until = q?.availableUntil ? new Date(q.availableUntil) : null;

      if (from && now < from) return true;
      if (until && now > until) return true;

      return false;
    }

    function availabilitySummary(q){
      if (!q) return { label:"—", cls:"pill", note:"" };

      const now = new Date();
      const from = q.availableFrom ? new Date(q.availableFrom) : null;
      const until = q.availableUntil ? new Date(q.availableUntil) : null;

      if (q.isFrozen) {
        return { label:"UNAVAILABLE", cls:"pill red", note:"Manually set to unavailable." };
      }

      if (from && now < from) {
        return { label:"SCHEDULED", cls:"pill", note:`Available from ${from.toLocaleString()}` };
      }

      if (until && now > until) {
        return { label:"CLOSED", cls:"pill red", note:`Closed since ${until.toLocaleString()}` };
      }

      if (until) {
        return { label:"AVAILABLE", cls:"pill green", note:`Available until ${until.toLocaleString()}` };
      }

      return { label:"AVAILABLE", cls:"pill green", note:"No schedule set." };
    }

    function questionCardHtml(i, q){
      const text = cleanSpaces(q?.text);
      const imageUrl = cleanSpaces(q?.imageUrl);
      const opts = Array.isArray(q?.options) ? q.options : ["","","",""];
      const correctIndex = Number.isFinite(Number(q?.correctIndex)) ? Number(q.correctIndex) : 0;

      return `
        <div class="qcard" data-index="${i}">
          <div class="qhead">
            <b>Question ${i + 1}</b>
            <button type="button" class="smallbtn removeBtn">Remove</button>
          </div>

          <label>Question Text</label>
          <input class="qText" value="${escapeAttr(text)}" placeholder="Type your question here" />

          <label>Image URL (optional)</label>
          <input class="qImage" value="${escapeAttr(imageUrl)}" placeholder="https://..." />

          <div class="grid2">
            <div><label>Option A</label><input class="optA" value="${escapeAttr(opts[0] || "")}" /></div>
            <div><label>Option B</label><input class="optB" value="${escapeAttr(opts[1] || "")}" /></div>
            <div><label>Option C</label><input class="optC" value="${escapeAttr(opts[2] || "")}" /></div>
            <div><label>Option D</label><input class="optD" value="${escapeAttr(opts[3] || "")}" /></div>
          </div>

          <label>Correct Answer</label>
          <select class="correct">
            <option value="0" ${correctIndex===0?"selected":""}>A</option>
            <option value="1" ${correctIndex===1?"selected":""}>B</option>
            <option value="2" ${correctIndex===2?"selected":""}>C</option>
            <option value="3" ${correctIndex===3?"selected":""}>D</option>
          </select>
        </div>
      `;
    }

    async function requireAdmin(){
      let meRes;
      try{
        meRes = await fetch(`${API}/api/auth/me`, {
          headers: { Authorization: "Bearer " + token }
        });
      } catch {
        setMsg("Network error. Please refresh.", "error");
        return false;
      }

      const me = await meRes.json().catch(()=>null);
      if (!meRes.ok || !me) { alert("Session expired."); logout(); return false; }

      if (me.role !== "admin") {
        alert("Admin only");
        window.location.href = "learner-quizzes.html";
        return false;
      }

      who.textContent = `Logged in as: ${me.username} (admin)`;
      return true;
    }

    function setAvailabilityUI(q){
      const a = availabilitySummary(q);
      freezePill.textContent = a.label;
      freezePill.className = a.cls;
      availabilityNote.textContent = a.note || "";

      // ✅ Freeze button ALWAYS enabled after selection
      freezeBtn.disabled = false;
      freezeBtn.textContent = q?.isFrozen ? "Make Available" : "Make Unavailable";

      // ✅ Delete button ALWAYS enabled after selection
      deleteBtn.disabled = false;

      // ✅ Editing blocked only when frozen
      const frozen = !!q?.isFrozen;
      if (frozen) {
        editArea.classList.add("disabledBox");
        saveBtn.disabled = true;
        addQuestionBtn.disabled = true;
      } else {
        editArea.classList.remove("disabledBox");
        saveBtn.disabled = false;
        addQuestionBtn.disabled = false;
      }
    }

    function renderDropdown(){
      const g = (gradeFilter.value || "").trim();
      const q = (searchBox.value || "").trim().toLowerCase();

      const filtered = allQuizzes.filter(x => {
        const matchGrade = !g || String(x.grade) === String(g);
        if (!matchGrade) return false;

        if (!q) return true;
        const topic = String(x.topic || "General").toLowerCase();
        const title = String(x.title || "Assessment").toLowerCase();
        return topic.includes(q) || title.includes(q);
      });

      if (filtered.length === 0) {
        assessmentSelect.innerHTML = `<option value="">No match found</option>`;
        return;
      }

      assessmentSelect.innerHTML =
        `<option value="">Select assessment</option>` +
        filtered.map(x => {
          const unavailable = isUnavailable(x);
          const label = `Grade ${x.grade} • ${x.topic || "General"} • ${x.title || "Assessment"}${unavailable ? " • Unavailable" : ""}`;
          return `<option value="${escapeAttr(x._id)}">${escapeHtml(label)}</option>`;
        }).join("");
    }

    async function loadAssessments(){
      assessmentSelect.innerHTML = `<option value="">Loading…</option>`;
      setMsg("Loading assessments…", "muted");
      freezeBtn.disabled = true;
      deleteBtn.disabled = true;
      editArea.classList.add("disabledBox");

      let res;
      try{
        res = await fetch(`${API}/api/quizzes`, {
          headers: { Authorization: "Bearer " + token }
        });
      } catch {
        setMsg("Network error loading assessments.", "error");
        return;
      }

      if (res.status === 401) return logout();
      const list = await res.json().catch(()=>[]);
      allQuizzes = Array.isArray(list) ? list : [];

      if (allQuizzes.length === 0) {
        assessmentSelect.innerHTML = `<option value="">No assessments found</option>`;
        setMsg("No assessments to edit.", "muted");
        return;
      }

      renderDropdown();
      setMsg("Use filter/search, then select an assessment.", "ok");
    }

    async function loadAssessmentById(id){
      setMsg("Loading assessment…", "muted");
      freezeBtn.disabled = true;
      deleteBtn.disabled = true;
      editArea.classList.add("disabledBox");
      questionsWrap.innerHTML = "";

      let res;
      try{
        res = await fetch(`${API}/api/quizzes/${encodeURIComponent(id)}`, {
          headers: { Authorization: "Bearer " + token }
        });
      } catch {
        setMsg("Network error loading assessment.", "error");
        return;
      }

      if (res.status === 401) return logout();

      if (!res.ok) {
        setMsg("Could not load assessment.", "error");
        return;
      }

      currentQuiz = await res.json();

      gradeEl.value = String(currentQuiz.grade ?? "");
      topicEl.value = cleanSpaces(currentQuiz.topic || "");
      titleEl.value = cleanSpaces(currentQuiz.title || "");
      instructionsEl.value = String(currentQuiz.instructions || "");
      timeLimitEl.value = String(currentQuiz.timeLimitMinutes ?? 10);

      availableFromEl.value = isoToLocalInput(currentQuiz.availableFrom);
      availableUntilEl.value = isoToLocalInput(currentQuiz.availableUntil);

      const qs = Array.isArray(currentQuiz.questions) ? currentQuiz.questions : [];
      questionsWrap.innerHTML = qs.length
        ? qs.map((q, i) => questionCardHtml(i, q)).join("")
        : questionCardHtml(0, { text:"", imageUrl:"", options:["","","",""], correctIndex:0 });

      setAvailabilityUI(currentQuiz);
      setMsg("Loaded.", "ok");
    }

    function collectQuestions(){
      const cards = [...questionsWrap.querySelectorAll(".qcard")];
      if (cards.length === 0) throw new Error("Add at least 1 question.");

      const questions = [];

      for (const card of cards) {
        const text = cleanSpaces(card.querySelector(".qText").value);
        const imageUrl = cleanSpaces(card.querySelector(".qImage").value);

        const A = cleanSpaces(card.querySelector(".optA").value);
        const B = cleanSpaces(card.querySelector(".optB").value);
        const C = cleanSpaces(card.querySelector(".optC").value);
        const D = cleanSpaces(card.querySelector(".optD").value);

        const correctIndex = Number(card.querySelector(".correct").value);

        if (!text) throw new Error("Please fill in all question texts.");
        if (!A || !B || !C || !D) throw new Error("Please fill in all options A–D.");

        questions.push({
          text,
          imageUrl: imageUrl || "",
          options: [A, B, C, D],
          correctIndex
        });
      }

      return questions;
    }

    addQuestionBtn.addEventListener("click", () => {
      if (!currentQuiz) return;
      const i = questionsWrap.querySelectorAll(".qcard").length;
      questionsWrap.insertAdjacentHTML("beforeend",
        questionCardHtml(i, { text:"", imageUrl:"", options:["","","",""], correctIndex:0 })
      );
    });

    questionsWrap.addEventListener("click", (e) => {
      if (e.target.classList.contains("removeBtn")) {
        e.target.closest(".qcard").remove();
      }
    });

    saveBtn.addEventListener("click", async () => {
      if (!currentQuiz) return;

      if (currentQuiz.isFrozen) {
        return setMsg("This assessment is unavailable. Make it available to edit.", "error");
      }

      try{
        const grade = Number(gradeEl.value);
        const topic = cleanSpaces(topicEl.value);
        const title = cleanSpaces(titleEl.value);
        const instructions = String(instructionsEl.value || "");
        const timeLimitMinutes = Number(timeLimitEl.value);

        const availableFrom = localInputToIso(availableFromEl.value);
        const availableUntil = localInputToIso(availableUntilEl.value);

        if (!grade) return setMsg("Select grade.", "error");
        if (!topic) return setMsg("Enter topic.", "error");
        if (!title) return setMsg("Enter title.", "error");
        if (!Number.isFinite(timeLimitMinutes) || timeLimitMinutes < 1 || timeLimitMinutes > 180) {
          return setMsg("Time limit must be 1–180 minutes.", "error");
        }

        if (availableFrom && availableUntil) {
          const a = new Date(availableFrom).getTime();
          const b = new Date(availableUntil).getTime();
          if (Number.isFinite(a) && Number.isFinite(b) && b <= a) {
            return setMsg("Available Until must be after Available From.", "error");
          }
        }

        const questions = collectQuestions();

        setMsg("Saving changes…", "muted");
        const res = await fetch(`${API}/api/quizzes/${encodeURIComponent(currentQuiz._id)}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
          },
          body: JSON.stringify({
            grade,
            topic,
            title,
            instructions,
            timeLimitMinutes,
            availableFrom,
            availableUntil,
            questions
          })
        });

        const data = await res.json().catch(()=>({}));
        if (!res.ok) return setMsg(data.message || "Could not save.", "error");

        currentQuiz = data;
        setMsg("✅ Saved.", "ok");

        await loadAssessments();
        assessmentSelect.value = currentQuiz._id;
      } catch(err){
        setMsg(err.message || "Could not save.", "error");
      }
    });

    freezeBtn.addEventListener("click", async () => {
      if (!currentQuiz) return;

      const nextFrozen = !currentQuiz.isFrozen;

      const ok = confirm(nextFrozen
        ? "Make this assessment unavailable? Learners will see it but cannot attempt."
        : "Make this assessment available? Learners can attempt if schedule allows."
      );
      if (!ok) return;

      setMsg("Updating availability…", "muted");

      const res = await fetch(`${API}/api/quizzes/${encodeURIComponent(currentQuiz._id)}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({
          isFrozen: nextFrozen,
          frozenAt: nextFrozen ? new Date().toISOString() : null
        })
      });

      const data = await res.json().catch(()=>({}));
      if (!res.ok) return setMsg(data.message || "Could not update availability.", "error");

      currentQuiz = data;
      setAvailabilityUI(currentQuiz);
      setMsg(nextFrozen ? "✅ Set to unavailable." : "✅ Set to available.", "ok");

      await loadAssessments();
      assessmentSelect.value = currentQuiz._id;
    });

    deleteBtn.addEventListener("click", async () => {
      if (!currentQuiz) return;

      // ✅ allow delete even if frozen
      const ok = confirm("Delete this assessment permanently?");
      if (!ok) return;

      setMsg("Deleting…", "muted");

      const res = await fetch(`${API}/api/quizzes/${encodeURIComponent(currentQuiz._id)}`, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + token }
      });

      const data = await res.json().catch(()=>({}));
      if (!res.ok) return setMsg(data.message || "Could not delete.", "error");

      setMsg("✅ Deleted.", "ok");
      currentQuiz = null;

      gradeEl.value = "";
      topicEl.value = "";
      titleEl.value = "";
      instructionsEl.value = "";
      availableFromEl.value = "";
      availableUntilEl.value = "";
      timeLimitEl.value = "";

      questionsWrap.innerHTML = "";
      freezeBtn.disabled = true;
      deleteBtn.disabled = true;
      editArea.classList.add("disabledBox");

      await loadAssessments();
      assessmentSelect.value = "";
      freezePill.textContent = "—";
      freezePill.className = "pill";
      availabilityNote.textContent = "";
    });

    assessmentSelect.addEventListener("change", () => {
      const id = assessmentSelect.value;
      if (!id) {
        currentQuiz = null;
        setMsg("Select an assessment to edit.", "muted");
        freezeBtn.disabled = true;
        deleteBtn.disabled = true;
        editArea.classList.add("disabledBox");
        freezePill.textContent = "—";
        freezePill.className = "pill";
        availabilityNote.textContent = "";
        return;
      }
      loadAssessmentById(id);
    });

    gradeFilter.addEventListener("change", () => {
      renderDropdown();
      assessmentSelect.value = "";
    });
    searchBox.addEventListener("input", () => {
      renderDropdown();
      assessmentSelect.value = "";
    });

    (async () => {
      const ok = await requireAdmin();
      if (!ok) return;
      await loadAssessments();
    })();
  </script>
</body>
</html>
