<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --primary:#0b4a70;
  --bg:#ffffff;
  --border:#d8dde8;
  --text:#0f172a;
  --danger:#dc2626;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Times New Roman", Times, serif;
}

body{
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
}

.topbar{
  background:var(--nav);
  color:white;
  padding:14px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand img{
  width:45px;
  height:45px;
  filter:brightness(0) invert(1);
}

.brand h2{
  font-size:18px;
}

.brand p{
  font-size:13px;
  opacity:0.9;
}

.container{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:50px 20px;
}

.login-card{
  width:100%;
  max-width:520px;
  background:white;
  border:1px solid var(--border);
  border-radius:0;
  padding:30px;
  box-shadow:none;
}

.login-card h1{
  color:#00102e;
  margin-bottom:10px;
  font-size:22px;
}

.login-card p{
  color:#475569;
  margin-bottom:25px;
  font-size:14px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:700;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:0;
  margin-bottom:20px;
  font-size:15px;
}

input:focus{
  outline:none;
  border-color:var(--primary);
}

.btn{
  width:100%;
  border:none;
  background:var(--primary);
  color:white;
  padding:15px;
  border-radius:0;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:hover{background:#083c5b}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  display:none;
  margin-bottom:20px;
  background:#fef2f2;
  color:var(--danger);
  padding:12px;
  border:1px solid #fecaca;
  font-size:14px;
}

.footer-links{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  gap:12px;
}

.footer-links a{
  text-decoration:none;
  color:var(--primary);
  font-weight:600;
  font-size:14px;
}

.roles{
  margin-top:25px;
  background:#f8fafc;
  padding:15px;
  border:1px solid #e5e7eb;
}

.roles h4{margin-bottom:10px}

.role-badge{
  display:inline-block;
  background:#e0ecff;
  color:#1d4ed8;
  padding:6px 10px;
  border-radius:0;
  margin:4px;
  font-size:13px;
  font-weight:700;
}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand">
    <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg" alt="">
    <div>
      <h2>Practice Online</h2>
      <p>Employee Portal Login</p>
    </div>
  </div>
</header>

<div class="container">
  <div class="login-card">
    <h1>Employee Login</h1>
    <p>Access the Practice Online employee portal.</p>

    <div class="error" id="errorBox"></div>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit" class="btn" id="loginBtn">Login</button>
    </form>

    <div class="footer-links">
      <a href="../forgot-password.html">Forgot Password?</a>
      <a href="../index.html">Back Home</a>
    </div>

    <div class="roles">
      <h4>Authorized Roles</h4>
      <span class="role-badge">Admin</span>
      <span class="role-badge">Tester</span>
      <span class="role-badge">Academic</span>
      <span class="role-badge">Editor</span>
      <span class="role-badge">Operations</span>
      <span class="role-badge">Finance</span>
      <span class="role-badge">Support</span>
      <span class="role-badge">Tutor</span>
    </div>
  </div>
</div>

<script>
const API = "https://api.practiceonline.co.za";

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("errorBox");
const loginBtn = document.getElementById("loginBtn");

function showError(message){
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

function getEmployee(data){
  return data.employee || data.user || data.staff || null;
}

function goToDepartment(employee){
  const role = String(employee?.role || "").toLowerCase();
  const department = String(employee?.department || "").toLowerCase();

  if(role === "finance" || department === "finance"){
    location.href = "finance-admin.html";
    return;
  }

  if(role === "academic" || role === "editor" || department === "academic"){
    location.href = "academic-admin.html";
    return;
  }

  if(role === "operations" || department === "operations"){
    location.href = "operations-admin.html";
    return;
  }

  if(role === "support" || department === "support"){
    location.href = "support-admin.html";
    return;
  }

  if(role === "tutor" || department === "tutor"){
    location.href = "tutor-dashboard.html";
    return;
  }

  location.href = "employee-dashboard.html";
}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  errorBox.style.display = "none";
  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try{
    const response = await fetch(API + "/api/employees/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        email:document.getElementById("email").value.trim(),
        password:document.getElementById("password").value
      })
    });

    const data = await response.json().catch(()=>({}));

    if(!response.ok){
      throw new Error(data.message || "Login failed.");
    }

    const employee = getEmployee(data);

    if(!data.token){
      throw new Error("Login succeeded but no employee token was returned.");
    }

    localStorage.setItem("employeeToken", data.token);
    localStorage.setItem("employeeUser", JSON.stringify(employee || {}));

    /* Optional fallback for old pages */
    localStorage.setItem("token", data.token);
    localStorage.setItem("employee", JSON.stringify(employee || {}));

    goToDepartment(employee);

  }catch(error){
    showError(error.message);
  }finally{
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});
</script>
</body>
</html>
