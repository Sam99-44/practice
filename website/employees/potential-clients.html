<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potential Clients | Practice Online</title>

  <style>
    :root{
      --nav:#1b1648;
      --org:#0b3c5d;
      --orgDark:#082f49;
      --red:#c81e1e;
      --redDark:#a81818;
      --border:#d9dee7;
      --text:#0f172a;
      --muted:#475569;
      --soft:#f8fafc;
      --ok:#065f46;
      --error:#991b1b;
    }

    *{ box-sizing:border-box; }

    html,
    body{
      margin:0;
      padding:0;
      font-family:"Times New Roman", Times, serif;
      background:#fff;
      color:var(--text);
    }

    a{ text-decoration:none; color:inherit; }
    button,input,select{ font-family:"Times New Roman", Times, serif; }

    .topbar{
      background:var(--nav);
      color:#fff;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .topbar-inner{
      width:100%;
      padding:12px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .accountLeft{ display:flex; align-items:center; gap:12px; min-width:0; }
    .accountIcon{ width:40px; height:40px; filter:brightness(0) invert(1) contrast(180%); }
    .accountName{ font-size:14px; font-weight:700; color:#fff; }
    .accountType{ font-size:13px; color:#e0e7ff; margin-top:3px; }
    .topbarRight{ display:flex; align-items:center; gap:18px; }

    .iconBtn{
      min-width:50px;
      height:50px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .iconBtn img{
      width:30px;
      height:30px;
      filter:brightness(0) invert(1) contrast(180%);
    }

    .menuLink{
      color:#fff;
      font-size:13px;
      font-weight:700;
      background:transparent;
      border:0;
      cursor:pointer;
    }

    .wrap{ width:100%; padding:14px; }

    .card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:0;
      box-shadow:none;
      overflow:hidden;
      margin:0 0 12px;
    }

    .cardHead{
      padding:14px 18px;
      border-bottom:1px solid #ececec;
      background:#fff;
    }

    .cardHead h1,
    .cardHead h2{
      margin:0;
      font-size:14px;
      font-weight:700;
      text-transform:uppercase;
    }

    .body{ padding:16px; }

    .summaryGrid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:10px;
    }

    .summaryBox{
      border:1px solid #e5e7eb;
      background:#fff;
      padding:12px;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:88px;
    }

    .summaryIcon{
      width:38px;
      height:38px;
      border:1px solid #e5e7eb;
      background:#f8fafc;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }

    .summaryIcon img{ width:22px; height:22px; object-fit:contain; }
    .metricLabel{ font-size:13px; color:var(--muted); margin-bottom:5px; }
    .metricValue{ font-size:24px; font-weight:700; line-height:1; }
    .metricNote{ font-size:13px; color:var(--muted); margin-top:5px; }

    .toolbar{
      display:grid;
      grid-template-columns:150px 170px 170px 170px 1fr auto;
      gap:10px;
      align-items:end;
      margin-bottom:10px;
    }

    .adminBar{
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      padding:10px;
      margin-bottom:10px;
      border:1px solid #e5e7eb;
      background:#f8fafc;
    }

    .adminBar.show{ display:flex; }
    .selectedText{ font-size:13px; color:var(--muted); font-weight:700; }

    label{
      display:block;
      font-size:14px;
      font-weight:400;
      margin-bottom:6px;
      color:#111827;
    }

    input,
    select{
      width:100%;
      padding:9px 10px;
      border-radius:0;
      border:1px solid #d6d3d1;
      background:#fff;
      font-size:14px;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:#cbd5e1;
      box-shadow:0 0 0 4px rgba(226,232,240,.7);
    }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      height:38px;
      padding:0 14px;
      min-width:96px;
      border:1px solid var(--org);
      border-radius:4px;
      background:var(--org);
      color:#fff;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .btn:hover{ background:var(--orgDark); border-color:var(--orgDark); }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .btn.secondary{
      background:#fff;
      color:#111827;
      border:1px solid #d1d5db;
    }

    .btn.secondary:hover{ background:#f8fafc; }
    .btn.danger{ background:var(--red); border-color:var(--red); }
    .btn.danger:hover{ background:var(--redDark); border-color:var(--redDark); }

    .btn img{
      width:15px;
      height:15px;
      object-fit:contain;
      filter:brightness(0) invert(1);
    }

    .tableWrap{
      width:100%;
      overflow:auto;
      border:1px solid #e5e7eb;
      background:#fff;
    }

    .tableWrap::-webkit-scrollbar{ height:10px; width:10px; }
    .tableWrap::-webkit-scrollbar-thumb{ background:#9ca3af; border-radius:20px; }

    table{ width:100%; border-collapse:collapse; min-width:1700px; }

    th,
    td{
      padding:9px 10px;
      border-bottom:1px solid #e5e7eb;
      text-align:left;
      font-size:14px;
      vertical-align:middle;
      white-space:nowrap;
    }

    th{
      background:#f8fafc;
      color:#111827;
      font-size:13px;
      font-weight:700;
      position:sticky;
      top:0;
      z-index:10;
    }

    tr:hover td{ background:#f8fafc; }
    .checkboxCell{ width:38px; text-align:center; }
    .checkboxCell input{ width:auto; box-shadow:none; }

    .editInput,
    .editSelect{
      min-width:120px;
      padding:6px 8px;
      font-size:13px;
    }

    .wideInput{ min-width:180px; }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:4px 8px;
      border-radius:4px;
      font-size:12px;
      font-weight:600;
      background:#f8fafc;
      color:#334155;
      border:1px solid #d9dee7;
    }

    .msgBox{
      display:none;
      margin-bottom:12px;
      padding:12px;
      border:1px solid #e5e7eb;
      font-size:14px;
    }

    .msgBox.ok{ display:block; color:var(--ok); background:#f0fdf4; }
    .msgBox.error{ display:block; color:var(--error); background:#fff; border-color:#fecaca; }
    .loadingRow{ color:var(--muted); font-weight:700; }
    .hidden{ display:none !important; }

    .modalOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.25);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:99999;
    }

    .modalOverlay.show{ display:flex; }

    .modalCard{
      width:420px;
      max-width:calc(100% - 28px);
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 10px 30px rgba(0,0,0,.15);
      padding:20px;
    }

    .modalTitle{ font-size:18px; font-weight:700; margin-bottom:10px; color:var(--text); }
    .modalText{ font-size:14px; color:var(--muted); margin-bottom:20px; }
    .modalButtons{ display:flex; justify-content:flex-end; gap:10px; }

    .modalBtn{
      min-width:90px;
      height:38px;
      border:1px solid var(--border);
      background:#fff;
      color:var(--text);
      cursor:pointer;
      font-weight:600;
    }

    .modalBtn.primary{ background:var(--org); color:#fff; border-color:var(--org); }
    .modalBtn.primary:hover{ background:var(--orgDark); border-color:var(--orgDark); }

    @media(max-width:1150px){
      .toolbar{ grid-template-columns:1fr 1fr 1fr; }
      .summaryGrid{ grid-template-columns:repeat(2, 1fr); }
    }

    @media(max-width:640px){
      .wrap{ padding:10px; }
      .body{ padding:12px; }
      .cardHead{ padding:12px; }
      .summaryGrid,
      .toolbar{ grid-template-columns:1fr; }
      .accountName,
      .accountType{ max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="accountLeft">
        <img class="accountIcon" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg" alt="">
        <div>
          <div class="accountName">Practice Online</div>
          <div class="accountType" id="userPill">Potential Clients</div>
        </div>
      </div>

      <div class="topbarRight">
        <a href="employee-dashboard.html" class="iconBtn" title="Dashboard">
          <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="">
        </a>
        <button class="menuLink" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="msg" class="msgBox"></div>

    <section class="card">
      <div class="cardHead">
        <h1>Potential Clients</h1>
      </div>

      <div class="body">
        <div class="summaryGrid">
          <div class="summaryBox">
            <div class="summaryIcon">
              <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1781823450/client_qxhpzm.svg" alt="">
            </div>
            <div>
              <div class="metricLabel">Total Leads</div>
              <div class="metricValue" id="totalCount">0</div>
              <div class="metricNote">Registered accounts</div>
            </div>
          </div>

          <div class="summaryBox">
            <div class="summaryIcon">
              <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1781654916/Approved_dbtwvt.svg" alt="">
            </div>
            <div>
              <div class="metricLabel">Students</div>
              <div class="metricValue" id="studentCount">0</div>
              <div class="metricNote">Learner accounts</div>
            </div>
          </div>

          <div class="summaryBox">
            <div class="summaryIcon">
              <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1781656873/edit-3_c1gjk0.svg" alt="">
            </div>
            <div>
              <div class="metricLabel">Practice Accounts</div>
              <div class="metricValue" id="practiceCount">0</div>
              <div class="metricNote">Quiz practice only</div>
            </div>
          </div>

          <div class="summaryBox">
            <div class="summaryIcon">
              <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1781654915/Money_lk10o6.svg" alt="">
            </div>
            <div>
              <div class="metricLabel">This Month</div>
              <div class="metricValue" id="monthCount">0</div>
              <div class="metricNote">New registrations</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="cardHead">
        <h2>Registered Learners</h2>
      </div>

      <div class="body">
        <div class="toolbar">
          <div>
            <label>Grade</label>
            <select id="gradeFilter">
              <option value="all">All grades</option>
              <option value="8">Grade 8</option>
              <option value="9">Grade 9</option>
              <option value="10">Grade 10</option>
              <option value="11">Grade 11</option>
              <option value="12">Grade 12</option>
            </select>
          </div>

          <div>
            <label>Account Type</label>
            <select id="typeFilter">
              <option value="all">All types</option>
              <option value="learner">Learner</option>
              <option value="practice">Practice Account</option>
            </select>
          </div>

          <div>
            <label>Province</label>
            <select id="provinceFilter">
              <option value="all">All provinces</option>
            </select>
          </div>

          <div>
            <label>Date Filter</label>
            <select id="dateFilter">
              <option value="all">All records</option>
              <option value="today">Today</option>
              <option value="thisWeek">This week</option>
              <option value="lastWeek">Last week</option>
              <option value="thisMonth">This month</option>
              <option value="lastMonth">Last month</option>
              <option value="thisYear">This year</option>
            </select>
          </div>

          <div>
            <label>Search</label>
            <input id="searchBox" type="search" placeholder="Search name, email, phone, school">
          </div>

          <div class="actions">
            <button class="btn secondary" id="refreshBtn">Refresh</button>
            <button class="btn" id="exportBtn">Export Excel</button>
          </div>
        </div>

        <div class="adminBar" id="adminBar">
          <span class="selectedText" id="selectedCount">0 selected</span>
          <div class="actions">
            <button class="btn" id="saveSelectedBtn">
              <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1781654917/save_jw3yhm.svg" alt="">
              Save Changes
            </button>
            <button class="btn danger" id="removeSelectedBtn">
              <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1781654917/delete_suc2ec.svg" alt="">
              Remove Selected
            </button>
          </div>
        </div>

        <div class="tableWrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="rows">
              <tr>
                <td colspan="16" class="loadingRow">Loading potential clients...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="confirmModal" class="modalOverlay">
    <div class="modalCard">
      <div class="modalTitle">Practice Online</div>
      <div class="modalText" id="modalText">Confirm action</div>
      <div class="modalButtons">
        <button id="modalYes" class="modalBtn primary">Yes</button>
        <button id="modalNo" class="modalBtn">No</button>
        <button id="modalCancel" class="modalBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const API = "https://api.practiceonline.co.za";

    let clients = [];
    let isAdmin = false;
    let selectedIds = new Set();
    let pendingChanges = {};

    const $ = id => document.getElementById(id);

    function token(){
      return localStorage.getItem("employeeToken") || localStorage.getItem("token") || "";
    }

    function logout(){
      localStorage.clear();
      location.href = "employee-login.html";
    }

    function esc(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function show(message, type = "ok"){
      const box = $("msg");
      box.textContent = message;
      box.className = "msgBox " + type;

      setTimeout(() => {
        box.className = "msgBox";
      }, 4500);
    }

    async function safeJson(response){
      try{
        return await response.json();
      }catch{
        return {};
      }
    }

    async function fetchJson(path, options = {}){
      const response = await fetch(API + path, {
        ...options,
        headers:{
          "Content-Type":"application/json",
          Authorization:"Bearer " + token(),
          ...(options.headers || {})
        }
      });

      const data = await safeJson(response);

      if(!response.ok){
        throw new Error(data.message || "Request failed");
      }

      return data;
    }

    function asArray(data){
      if(Array.isArray(data)) return data;
      return data.users || data.learners || data.clients || data.items || data.data || [];
    }

    async function requireEmployee(){
      if(!token()){
        location.href = "employee-login.html";
        return null;
      }

      try{
        const user = await fetchJson("/api/employees/me");
        const role = String(user.role || "").toLowerCase();
        const department = String(user.department || "").toLowerCase();
        const allowed = ["admin", "tester", "finance", "support", "operations"];

        if(!allowed.includes(role) && !allowed.includes(department)){
          location.href = "employee-dashboard.html";
          return null;
        }

        isAdmin = role === "admin";
        $("userPill").textContent = `${user.fullName || user.username || "Employee"} • Potential Clients`;
        $("adminBar").classList.toggle("show", isAdmin);
        renderTableHead();

        return user;
      }catch(error){
        console.error(error);
        return null;
      }
    }

    function normalizeAccountType(value){
      const type = String(value || "").toLowerCase().trim();
      if(type === "student") return "learner";
      if(type === "materials") return "practice";
      if(type === "learner") return "learner";
      if(type === "practice") return "practice";
      return "learner";
    }

    function normaliseUser(user, index){
      return {
        id:String(user._id || user.id || "client-" + index),
        fullName:user.fullName || [user.firstName, user.surname].filter(Boolean).join(" ") || user.username || "",
        username:user.username || "",
        email:user.email || "",
        cellphone:user.cellphone || user.phone || "",
        guardianCellphone:user.guardianCellphone || user.parentPhone || "",
        grade:String(user.grade || ""),
        schoolName:user.schoolName || user.school || "",
        province:user.province || "",
        district:user.district || "",
        currentMarkRange:user.currentMarkRange || "",
        accountType:normalizeAccountType(user.accountType || "learner"),
        learnerNumber:user.learnerNumber || user.studentNumber || "",
        createdAt:user.createdAt || user.date || user.registeredAt || ""
      };
    }

    async function loadClients(showMessage = false){
      $("refreshBtn").disabled = true;
      $("refreshBtn").textContent = "Loading...";

      try{
        const data = await fetchJson("/api/finance/potential-clients");

        clients = asArray(data)
          .map(normaliseUser)
          .filter(client => ["learner", "practice"].includes(client.accountType));

        selectedIds.clear();
        pendingChanges = {};
        fillProvinceFilter();
        renderAll();

        if(showMessage){
          show("Potential clients refreshed.");
        }
      }catch(error){
        console.error("Could not load potential clients:", error);
        clients = [];
        renderAll();
        show("Could not load potential clients. Please check the backend route.", "error");
      }finally{
        $("refreshBtn").disabled = false;
        $("refreshBtn").textContent = "Refresh";
      }
    }

    function fillProvinceFilter(){
      const current = $("provinceFilter").value;
      const provinces = [...new Set(clients.map(client => client.province).filter(Boolean))].sort();

      $("provinceFilter").innerHTML =
        '<option value="all">All provinces</option>' +
        provinces.map(province => `<option value="${esc(province)}">${esc(province)}</option>`).join("");

      if(provinces.includes(current)){
        $("provinceFilter").value = current;
      }
    }

    function formatDate(value){
      if(!value) return "-";
      const date = new Date(value);
      if(isNaN(date.getTime())) return esc(value);
      return date.toLocaleDateString("en-ZA");
    }

    function badge(text){
      return `<span class="badge">${esc(text || "Potential Client")}</span>`;
    }

    function startOfWeek(date){
      const d = new Date(date);
      const day = d.getDay();
      const diff = day === 0 ? 6 : day - 1;
      d.setDate(d.getDate() - diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function passesDateFilter(row){
      const filter = $("dateFilter").value;
      if(filter === "all") return true;
      if(!row.createdAt) return false;

      const created = new Date(row.createdAt);
      if(isNaN(created.getTime())) return false;

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const week = startOfWeek(now);
      const lastWeek = new Date(week);
      const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
      const year = new Date(now.getFullYear(), 0, 1);

      lastWeek.setDate(lastWeek.getDate() - 7);

      if(filter === "today") return created >= today;
      if(filter === "thisWeek") return created >= week;
      if(filter === "lastWeek") return created >= lastWeek && created < week;
      if(filter === "thisMonth") return created >= thisMonth && created < nextMonth;
      if(filter === "lastMonth") return created >= lastMonth && created < thisMonth;
      if(filter === "thisYear") return created >= year;

      return true;
    }

    function filtered(){
      const grade = $("gradeFilter").value;
      const type = $("typeFilter").value;
      const province = $("provinceFilter").value;
      const search = $("searchBox").value.toLowerCase().trim();

      return clients.filter(client => {
        if(grade !== "all" && client.grade !== grade) return false;
        if(type !== "all" && client.accountType !== type) return false;
        if(province !== "all" && client.province !== province) return false;
        if(!passesDateFilter(client)) return false;

        if(search && !Object.values(client).join(" ").toLowerCase().includes(search)){
          return false;
        }

        return true;
      });
    }

    function renderSummary(){
      const now = new Date();

      $("totalCount").textContent = clients.length;
      $("studentCount").textContent = clients.filter(client => client.accountType === "learner").length;
      $("practiceCount").textContent = clients.filter(client => client.accountType === "practice").length;

      $("monthCount").textContent = clients.filter(client => {
        const date = new Date(client.createdAt);
        return !isNaN(date.getTime()) &&
          date.getFullYear() === now.getFullYear() &&
          date.getMonth() === now.getMonth();
      }).length;
    }

    function renderTableHead(){
      $("tableHead").innerHTML = `
        <tr>
          ${isAdmin ? '<th class="checkboxCell"><input type="checkbox" id="selectAllBox"></th>' : ''}
          <th>No.</th>
          <th>Status</th>
          <th>Full Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Cellphone</th>
          <th>Guardian Cellphone</th>
          <th>Grade</th>
          <th>School</th>
          <th>Province</th>
          <th>District</th>
          <th>Current Mark</th>
          <th>Account Type</th>
          <th>Learner Number</th>
          <th>Registered Date</th>
        </tr>
      `;

      const selectAll = $("selectAllBox");
      if(selectAll){
        selectAll.onchange = event => toggleSelectAll(event.target.checked);
      }
    }

    function editInput(client, field, extraClass = ""){
      if(!isAdmin) return esc(client[field] || "-");
      return `<input class="editInput ${extraClass}" value="${esc(client[field] || "")}" onchange="trackChange('${esc(client.id)}','${field}',this.value)">`;
    }

    function gradeInput(client){
      if(!isAdmin) return client.grade ? "Grade " + esc(client.grade) : "-";

      return `
        <select class="editSelect" onchange="trackChange('${esc(client.id)}','grade',this.value)">
          <option value="" ${!client.grade ? "selected" : ""}>None</option>
          <option value="8" ${client.grade === "8" ? "selected" : ""}>Grade 8</option>
          <option value="9" ${client.grade === "9" ? "selected" : ""}>Grade 9</option>
          <option value="10" ${client.grade === "10" ? "selected" : ""}>Grade 10</option>
          <option value="11" ${client.grade === "11" ? "selected" : ""}>Grade 11</option>
          <option value="12" ${client.grade === "12" ? "selected" : ""}>Grade 12</option>
        </select>
      `;
    }

    function accountTypeInput(client){
      if(!isAdmin){
        return esc(client.accountType === "practice" ? "Practice Account" : "Student");
      }

      return `
        <select class="editSelect" onchange="trackChange('${esc(client.id)}','accountType',this.value)">
          <option value="student" ${client.accountType === "learner" ? "selected" : ""}>Student</option>
          <option value="materials" ${client.accountType === "practice" ? "selected" : ""}>Practice Account</option>
        </select>
      `;
    }

    function renderRows(){
      const rows = filtered();
      const colspan = isAdmin ? 16 : 15;

      if(!rows.length){
        $("rows").innerHTML = `<tr><td colspan="${colspan}">No potential clients available.</td></tr>`;
        updateSelectedUI();
        return;
      }

      $("rows").innerHTML = rows.map((client, index) => `
        <tr>
          ${isAdmin ? `<td class="checkboxCell"><input type="checkbox" ${selectedIds.has(client.id) ? "checked" : ""} onchange="toggleSelect('${esc(client.id)}',this.checked)"></td>` : ""}
          <td>${index + 1}</td>
          <td>${badge("Potential Client")}</td>
          <td>${editInput(client, "fullName", "wideInput")}</td>
          <td>${editInput(client, "username")}</td>
          <td>${editInput(client, "email", "wideInput")}</td>
          <td>${editInput(client, "cellphone")}</td>
          <td>${editInput(client, "guardianCellphone")}</td>
          <td>${gradeInput(client)}</td>
          <td>${editInput(client, "schoolName", "wideInput")}</td>
          <td>${editInput(client, "province")}</td>
          <td>${editInput(client, "district")}</td>
          <td>${editInput(client, "currentMarkRange")}</td>
          <td>${accountTypeInput(client)}</td>
          <td>${esc(client.learnerNumber || "-")}</td>
          <td>${formatDate(client.createdAt)}</td>
        </tr>
      `).join("");

      updateSelectedUI();
    }

    function renderAll(){
      renderSummary();
      renderTableHead();
      renderRows();
    }

    function trackChange(id, key, value){
      if(!isAdmin) return;

      if(!pendingChanges[id]) pendingChanges[id] = {};
      pendingChanges[id][key] = value;

      const client = clients.find(row => row.id === id);
      if(client){
        client[key] = value;
      }

      selectedIds.add(id);
      renderSummary();
      updateSelectedUI();
    }

    function toggleSelect(id, checked){
      if(checked){
        selectedIds.add(id);
      }else{
        selectedIds.delete(id);
      }

      updateSelectedUI();
    }

    function toggleSelectAll(checked){
      filtered().forEach(client => {
        if(checked){
          selectedIds.add(client.id);
        }else{
          selectedIds.delete(client.id);
        }
      });

      renderRows();
    }

    function updateSelectedUI(){
      if(!isAdmin) return;

      $("selectedCount").textContent = selectedIds.size + " selected";

      const selectAll = $("selectAllBox");
      if(selectAll){
        const rows = filtered();
        selectAll.checked = rows.length > 0 && rows.every(client => selectedIds.has(client.id));
      }
    }

    async function saveClient(client){
      const patch = pendingChanges[client.id];
      if(!patch) return false;

      const body = { ...patch };

      if("grade" in body){
        body.grade = body.grade ? Number(body.grade) : null;
      }

      await fetchJson(`/api/finance/potential-clients/${encodeURIComponent(client.id)}`, {
        method:"PATCH",
        body:JSON.stringify(body)
      });

      delete pendingChanges[client.id];
      return true;
    }

    async function saveSelected(){
      if(!isAdmin) return;

      const ids = [...selectedIds];

      if(!ids.length){
        return show("Select at least one record to save.", "error");
      }

      const answer = await confirmDialog("Save selected client record changes?");
      if(answer !== true) return;

      let saved = 0;

      try{
        for(const id of ids){
          const client = clients.find(row => row.id === id);
          if(client && pendingChanges[id]){
            await saveClient(client);
            saved++;
          }
        }

        if(!saved){
          return show("No selected records have changes to save.", "error");
        }

        show(saved + " record(s) saved successfully.");
        await loadClients(false);
      }catch(error){
        console.error(error);
        show("Could not save selected records.", "error");
      }
    }

    async function removeSelected(){
      if(!isAdmin) return;

      const ids = [...selectedIds];

      if(!ids.length){
        return show("Select at least one record to delete.", "error");
      }

      const answer = await confirmDialog("Delete selected client records from MongoDB? This cannot be undone.");
      if(answer !== true) return;

      try{
        let removed = 0;

        for(const id of ids){
          await fetchJson(`/api/finance/potential-clients/${encodeURIComponent(id)}`, {
            method:"DELETE"
          });
          removed++;
        }

        selectedIds.clear();
        pendingChanges = {};
        show(removed + " selected record(s) deleted from MongoDB.");
        await loadClients(false);
      }catch(error){
        console.error(error);
        show("Could not remove selected records.", "error");
      }
    }

    function exportExcel(){
      const rows = filtered();

      if(!rows.length){
        return show("No potential clients to export.", "error");
      }

      const headers = [
        "No",
        "Status",
        "Full Name",
        "Username",
        "Email",
        "Cellphone",
        "Guardian Cellphone",
        "Grade",
        "School",
        "Province",
        "District",
        "Current Mark",
        "Account Type",
        "Learner Number",
        "Registered Date"
      ];

      const body = rows.map((client, index) => [
        index + 1,
        "Potential Client",
        client.fullName,
        client.username,
        client.email,
        client.cellphone,
        client.guardianCellphone,
        client.grade,
        client.schoolName,
        client.province,
        client.district,
        client.currentMarkRange,
        client.accountType === "practice" ? "Practice Account" : "Student",
        client.learnerNumber,
        formatDate(client.createdAt)
      ]);

      const table = `
        <table border="1">
          <tr>${headers.map(header => `<th>${esc(header)}</th>`).join("")}</tr>
          ${body.map(row => `<tr>${row.map(cell => `<td>${esc(cell)}</td>`).join("")}</tr>`).join("")}
        </table>
      `;

      const blob = new Blob([
        `<html><head><meta charset="UTF-8"></head><body>${table}</body></html>`
      ], {
        type:"application/vnd.ms-excel"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "potential-clients.xls";
      link.click();

      URL.revokeObjectURL(url);
      show("Excel file exported.");
    }

    function confirmDialog(message){
      return new Promise(resolve => {
        const modal = $("confirmModal");
        const text = $("modalText");
        const yes = $("modalYes");
        const no = $("modalNo");
        const cancel = $("modalCancel");

        text.textContent = message;
        modal.classList.add("show");

        function close(value){
          modal.classList.remove("show");
          yes.onclick = null;
          no.onclick = null;
          cancel.onclick = null;
          resolve(value);
        }

        yes.onclick = () => close(true);
        no.onclick = () => close(false);
        cancel.onclick = () => close(null);
      });
    }

    $("refreshBtn").onclick = () => loadClients(true);
    $("exportBtn").onclick = exportExcel;
    $("saveSelectedBtn").onclick = saveSelected;
    $("removeSelectedBtn").onclick = removeSelected;

    ["gradeFilter", "typeFilter", "provinceFilter", "dateFilter"].forEach(id => {
      $(id).onchange = () => {
        selectedIds.clear();
        renderAll();
      };
    });

    $("searchBox").oninput = () => {
      selectedIds.clear();
      renderAll();
    };

    document.addEventListener("DOMContentLoaded", () => {
      renderAll();

      requireEmployee().then(user => {
        if(user){
          loadClients(false);
        }
      });
    });
  </script>
</body>
</html>
