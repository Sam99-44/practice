<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account | Practice Online</title>

  <meta name="robots" content="noindex, nofollow" />

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --nav:#1b1648;
      --red:#e11d2e;
      --radius:0px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
      font-weight:400;
    }

    .topbar{background:var(--nav); padding:14px 20px;}
    .navBar{
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .brand{
      color:#fff;
      font-weight:600;
      text-decoration:none;
      font-size:18px;
      letter-spacing:.2px;
    }

    .tabs{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}

    .tabs a{
      color:#c7c9e3;
      text-decoration:none;
      font-weight:500;
      padding-bottom:6px;
      border-bottom:3px solid transparent;
    }

    .tabs a:hover{color:#fff}
    .tabs a.active{color:#fff; border-bottom:3px solid var(--red);}

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:24px;
      min-height:calc(100vh - 64px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width:560px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }

    h2{
      margin:0 0 6px;
      font-size:22px;
      font-weight:600;
    }

    p{
      margin:6px 0 14px;
      color:var(--muted);
      font-weight:400;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:500;
      font-size:14px;
    }

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:0;
  border:1px solid #ddd;
  background:#fff;
  font-size:14px;
  outline:none;
  font-family:Arial, Helvetica, sans-serif;
  font-weight:400;
    }

    input:focus,select:focus{
      border-color:#cfe9ff;
      box-shadow:0 0 0 4px rgba(11,60,93,.10);
    }

    .radioRow{
      display:flex;
      gap:16px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .radioRow label{
      font-weight:500;
      margin-top:0;
      display:flex;
      align-items:center;
      gap:8px;
      color:#334155;
    }

    .radioRow input{
      width:auto;
      margin:0;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }

    @media(max-width:520px){
      .wrap{padding:16px;}
      .row{grid-template-columns:1fr}
    }

    .btn{
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:0px;
      padding:12px;
      font-weight:600;
      cursor:pointer;
      width:100%;
      transition:transform .08s ease, box-shadow .2s ease;
      font-family:Arial, Helvetica, sans-serif;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 10px 24px rgba(11,60,93,.18);
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    .ghost{
      background:#fff;
      border:1px solid #ddd;
      border-radius:0px;
      padding:12px;
      font-weight:500;
      cursor:pointer;
      width:100%;
      font-family:Arial, Helvetica, sans-serif;
    }

    .ghost:hover{background:var(--accent-soft);}

    .msg{
      margin-top:10px;
      font-size:14px;
      font-weight:400;
    }

    .error{color:var(--error)}
    .ok{color:var(--ok)}

    .links{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:12px;
      font-size:14px;
      flex-wrap:wrap;
    }

    .links a{
      color:var(--accent);
      text-decoration:none;
      font-weight:500;
    }

    .links a:hover{text-decoration:underline}

    .hide{display:none !important;}

.noteBox{
  background:var(--accent-soft);
  border:1px solid #d8e6f3;
  border-radius:0;
  padding:12px;
  margin:10px 0 12px;
  color:#0f172a;
  font-weight:400;
}

.noteBox b{
  display:block;
  margin-bottom:4px;
  font-weight:600;
}
  </style>
</head>

<body>

<header class="topbar">
  <div class="navBar">
    <a href="index.html" class="brand">Practice Online</a>
    <div class="tabs">
      <a href="login.html">Login</a>
      <a href="register.html" class="active">Register</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h2>Register Account</h2>
    <p>Create your Practice Online account</p>

    <div class="noteBox" id="acctNote">
      <b id="acctNoteTitle">Student Account</b>
      <span id="acctNoteText">Practice the Quizzes + Online Tutorials.</span>
    </div>

    <label>Account Type</label>
    <div class="radioRow">
      <label><input type="radio" name="accountType" value="student" checked> Student</label>
      <label><input type="radio" name="accountType" value="materials"> Practice Account</label>
    </div>

    <div class="row">
      <div>
        <label for="firstName">First Name</label>
        <input id="firstName" />
      </div>
      <div>
        <label for="surname">Surname</label>
        <input id="surname" />
      </div>
    </div>

    <label for="username">Username</label>
    <input id="username" autocomplete="username" />

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" />

    <label>Are you in South Africa?</label>
    <div class="radioRow">
      <label><input type="radio" name="isSA" value="yes" checked> Yes</label>
      <label><input type="radio" name="isSA" value="no"> No</label>
    </div>

    <div id="saWrap">
      <label for="province">Province</label>
      <select id="province">
        <option value="" selected>Select Province</option>
        <option value="Eastern Cape">Eastern Cape</option>
        <option value="Free State">Free State</option>
        <option value="Gauteng">Gauteng</option>
        <option value="KwaZulu-Natal">KwaZulu-Natal</option>
        <option value="Limpopo">Limpopo</option>
        <option value="Mpumalanga">Mpumalanga</option>
        <option value="Northern Cape">Northern Cape</option>
        <option value="North West">North West</option>
        <option value="Western Cape">Western Cape</option>
      </select>

      <label for="district">District</label>
      <select id="district" disabled>
        <option value="" selected>Select District</option>
      </select>
    </div>

    <label for="gender">Gender</label>
    <select id="gender">
      <option value="" selected>Select Gender</option>
      <option value="female">Female</option>
      <option value="male">Male</option>
      <option value="prefer_not_to_say">Prefer not to say</option>
      <option value="other">Other</option>
    </select>

    <div class="row">
      <div>
        <label for="cellphone">Your Cellphone</label>
        <input id="cellphone" inputmode="tel" placeholder="+27" />
      </div>
      <div>
        <label for="guardianCellphone">Guardian Cellphone</label>
        <input id="guardianCellphone" inputmode="tel" placeholder="+27" />
      </div>
    </div>

    <div id="gradeWrap">
      <label for="grade">Grade</label>
      <select id="grade">
        <option value="" selected>Select Grade</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select>
    </div>

    <label for="schoolName">School Name</label>
    <input id="schoolName" />

    <div id="CurrentWrap">
      <label for="currentMarkRange">Current Mark</label>
      <select id="currentMarkRange">
        <option value="" selected>Select Current Mark</option>
        <option value="0-29">0-29</option>
        <option value="30-39">30-39</option>
        <option value="40-49">40-49</option>
        <option value="50-59">50-59</option>
        <option value="60-69">60-69</option>
        <option value="70-79">70-79</option>
        <option value="80-100">80-100</option>
      </select>
    </div>

    <div class="row">
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" />
      </div>
      <div>
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" />
      </div>
    </div>

    <div class="row">
      <button id="registerBtn" class="btn" type="button">Register</button>
      <button id="toggleBtn" class="ghost" type="button">Show Password</button>
    </div>

    <p id="msg" class="msg"></p>

    <div class="links">
      <a href="login.html">Login</a>
      <a href="reset-otp.html">Forgot password?</a>
    </div>
  </div>
</main>

<script>
  const API = "https://api.practiceonline.co.za";

  const msg = document.getElementById("msg");
  const btn = document.getElementById("registerBtn");

  const acctNoteTitle = document.getElementById("acctNoteTitle");
  const acctNoteText  = document.getElementById("acctNoteText");

  const firstNameEl = document.getElementById("firstName");
  const surnameEl = document.getElementById("surname");
  const usernameEl = document.getElementById("username");
  const emailEl = document.getElementById("email");
  const gradeEl = document.getElementById("grade");
  const schoolNameEl = document.getElementById("schoolName");
  const currentMarkRangeEl = document.getElementById("currentMarkRange");
  const passwordEl = document.getElementById("password");
  const confirmEl = document.getElementById("confirmPassword");
  const toggleBtn = document.getElementById("toggleBtn");
  const gradeWrap = document.getElementById("gradeWrap");

  const saWrap = document.getElementById("saWrap");
  const provinceEl = document.getElementById("province");
  const districtEl = document.getElementById("district");

  const genderEl = document.getElementById("gender");
  const cellphoneEl = document.getElementById("cellphone");
  const guardianCellEl = document.getElementById("guardianCellphone");

  function setMsg(text, type = "") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function cleanSpaces(s) {
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  function accountType() {
    return document.querySelector('input[name="accountType"]:checked').value;
  }

  function isSA() {
    return document.querySelector('input[name="isSA"]:checked')?.value === "yes";
  }

  function updateAccountNote() {
    const t = accountType();
    if (t === "student") {
      acctNoteTitle.textContent = "Student Account";
      acctNoteText.textContent = "Practice the Quizzes + Online Tutorials.";
    } else {
      acctNoteTitle.textContent = "Practice Account";
      acctNoteText.textContent = "Practice the Quizzes.";
    }
  }

  function toggleGrade() {
    const isStudent = accountType() === "student";
    gradeWrap.style.display = isStudent ? "block" : "none";
    if (!isStudent) gradeEl.value = "";
  }

  document.querySelectorAll('input[name="accountType"]').forEach(r => {
    r.addEventListener("change", () => {
      toggleGrade();
      updateAccountNote();
    });
  });
  toggleGrade();
  updateAccountNote();

  function ensurePlus27(el) {
    el.addEventListener("focus", () => {
      if (!el.value.trim()) el.value = "+27";
    });
    el.addEventListener("blur", () => {
      if (el.value.trim() === "+27") el.value = "";
    });
  }
  ensurePlus27(cellphoneEl);
  ensurePlus27(guardianCellEl);

  toggleBtn.onclick = () => {
    const show = passwordEl.type === "password";
    passwordEl.type = confirmEl.type = show ? "text" : "password";
    toggleBtn.textContent = show ? "Hide Password" : "Show Password";
  };

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btn.click();
  });

  const DISTRICTS_BY_PROVINCE = {
    "Eastern Cape": [
      "Buffalo City (Metro)",
      "Nelson Mandela Bay (Metro)",
      "Amathole",
      "Chris Hani",
      "Joe Gqabi",
      "OR Tambo",
      "Sarah Baartman"
    ],
    "Free State": [
      "Mangaung (Metro)",
      "Fezile Dabi",
      "Lejweleputswa",
      "Thabo Mofutsanyana",
      "Xhariep"
    ],
    "Gauteng": [
      "City of Johannesburg (Metro)",
      "City of Tshwane (Metro)",
      "Ekurhuleni (Metro)",
      "Sedibeng",
      "West Rand"
    ],
    "KwaZulu-Natal": [
      "eThekwini (Metro)",
      "Amajuba",
      "Harry Gwala",
      "iLembe",
      "King Cetshwayo",
      "Ugu",
      "uMgungundlovu",
      "uMkhanyakude",
      "uMzinyathi",
      "uThukela",
      "Zululand"
    ],
    "Limpopo": [
      "Capricorn",
      "Mopani",
      "Sekhukhune",
      "Vhembe",
      "Waterberg"
    ],
    "Mpumalanga": [
      "Ehlanzeni",
      "Gert Sibande",
      "Nkangala"
    ],
    "Northern Cape": [
      "Frances Baard",
      "John Taolo Gaetsewe",
      "Namakwa",
      "Pixley ka Seme",
      "ZF Mgcawu"
    ],
    "North West": [
      "Bojanala Platinum",
      "Dr Kenneth Kaunda",
      "Dr Ruth Segomotsi Mompati",
      "Ngaka Modiri Molema"
    ],
    "Western Cape": [
      "City of Cape Town (Metro)",
      "Cape Winelands",
      "Central Karoo",
      "Garden Route",
      "Overberg",
      "West Coast"
    ]
  };

  function resetDistrict() {
    districtEl.innerHTML = `<option value="" selected>Select District</option>`;
    districtEl.disabled = true;
  }

  function populateDistricts() {
    const prov = provinceEl.value;
    const list = DISTRICTS_BY_PROVINCE[prov] || [];
    resetDistrict();
    if (!prov || list.length === 0) return;

    const frag = document.createDocumentFragment();
    list.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      frag.appendChild(opt);
    });
    districtEl.appendChild(frag);
    districtEl.disabled = false;
  }

  provinceEl.addEventListener("change", populateDistricts);

  function toggleSAFields() {
    const yes = isSA();
    saWrap.classList.toggle("hide", !yes);

    if (!yes) {
      provinceEl.value = "";
      resetDistrict();
    } else {
      populateDistricts();
    }
  }

  document.querySelectorAll('input[name="isSA"]').forEach(r => {
    r.addEventListener("change", toggleSAFields);
  });
  toggleSAFields();

  btn.onclick = async () => {
    const type = accountType();

    const firstName = cleanSpaces(firstNameEl.value);
    const surname = cleanSpaces(surnameEl.value);
    const fullName = cleanSpaces(firstName + " " + surname);
    const username = cleanSpaces(usernameEl.value);
    const email = emailEl.value.trim();
    const schoolName = cleanSpaces(schoolNameEl.value);
    const currentMarkRange = currentMarkRangeEl.value;

    const gender = genderEl.value.trim();
    const cellphone = cellphoneEl.value.trim();
    const guardianCellphone = guardianCellEl.value.trim();

    const province = isSA() ? provinceEl.value.trim() : "";
    const district = isSA() ? districtEl.value.trim() : "";

    const payload = {
      firstName,
      surname,
      fullName,
      username,
      email,
      password: passwordEl.value,
      accountType: type,
      ...(type === "student" ? { grade: Number(gradeEl.value) } : {}),
      ...(schoolName ? { schoolName } : {}),
      ...(currentMarkRange ? { currentMarkRange } : {}),
      ...(gender ? { gender } : {}),
      ...(province ? { province } : {}),
      ...(district ? { district } : {}),
      ...(cellphone ? { cellphone } : {}),
      ...(guardianCellphone ? { guardianCellphone } : {})
    };

    if (!firstName || !surname) {
      return setMsg("Please enter your first name and surname.", "error");
    }

    if (!payload.username || !payload.email || !payload.password) {
      return setMsg("Please complete username, email and password.", "error");
    }

    const strongPasswordRegex =
      /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

    if (!strongPasswordRegex.test(String(payload.password))) {
      return setMsg(
        "Password must be at least 8 characters and include uppercase, lowercase, number, and special character.",
        "error"
      );
    }

    if (payload.password !== confirmEl.value) {
      return setMsg("Passwords do not match.", "error");
    }

    if (type === "student" && !Number.isFinite(payload.grade)) {
      return setMsg("Please select a grade.", "error");
    }

    if (isSA() && province && !district) {
      return setMsg("Please select your district.", "error");
    }

    try {
      btn.disabled = true;
      setMsg("Creating account...");

      const res = await fetch(API + "/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));

if (!res.ok) {
  btn.disabled = false;
  return setMsg(data.message || "Registration failed.", "error");
}

setMsg(
  "Registration successful! We have sent a verification email to your email address. Please verify your email before logging in.",
  "ok"
);

btn.disabled = false;

document.querySelectorAll("input, select").forEach(el => {
  el.disabled = true;
});

setTimeout(() => {
  location.href = "verify-email-notice.html";
}, 2500);

} catch {
  btn.disabled = false;
  setMsg("Network error. Please try again.", "error");
}
};
</script>

</body>
</html>
