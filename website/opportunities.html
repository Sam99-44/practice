<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Opportunities | Practice Online Academy</title>

<style>

:root{
  --nav:#1b1648;
  --nav-dark:#141038;
  --gold:#f4c400;
  --bg:#f6f7fb;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#64748b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

/* ================= HEADER ================= */

.topbar{
  background:var(--nav);
  color:#fff;
  padding:22px 28px;
  box-shadow:0 4px 18px rgba(15,23,42,.14);
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:700;
}

.top-links{
  display:flex;
  align-items:center;
}

.top-links a{
  color:var(--gold);
  font-weight:700;
  font-size:15px;
  border-bottom:3px solid var(--gold);
  padding-bottom:6px;
  transition:.2s ease;
}

.top-links a:hover{
  color:var(--gold);
}

/* ================= PAGE ================= */

.wrap{
  max-width:1180px;
  margin:auto;
  padding:28px 18px 46px;
}

/* ================= CATEGORY ================= */

.categoryBox{
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:24px;
}

.categoryItem{
  border-bottom:1px solid #e8edf5;
}

.categoryBtn{
  width:100%;
  border:none;
  background:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 24px;
  cursor:pointer;
  font-size:16px;
  font-weight:700;
  color:var(--nav);
}

.jobsWrap{
  display:none;
  padding:0 20px 20px;
  background:#fafcff;
}

.categoryItem.active .jobsWrap{
  display:block;
}

.categoryItem.active .arrow{
  transform:rotate(90deg);
}

.arrow{
  transition:.2s;
}

.jobCard{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:8px;
  padding:24px;
  margin-top:18px;
}

.jobCard h3{
  margin:0;
  color:var(--nav);
  font-size:21px;
}

.jobMeta{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
}

.jobDesc{
  margin-top:14px;
  line-height:1.7;
  color:#334155;
}

/* ================= APPLY BUTTON ================= */

.applyBtn{
  margin-top:18px;

  background:#1b1648;

  color:#ffffff;

  border:none;

  border-radius:3px;

  padding:16px 28px;

  font-size:15px;
  font-weight:700;

  cursor:pointer;

  transition:.2s ease;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:170px;

  box-shadow:none;
}

.applyBtn:hover{
  background:#141038;
  transform:translateY(-1px);
}

/* ================= APPLICATION ================= */

.applicationSection{
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  padding:28px;
  margin-top:28px;
}

.applicationSection h2{
  margin:0 0 6px;
  color:var(--nav);
  font-size:28px;
}

.applicationSection p{
  color:var(--muted);
  line-height:1.6;
}

/* ================= FORM GROUP ================= */

.formGroup{
  border:1px solid #e2e8f0;
  border-radius:8px;
  padding:22px;
  margin-bottom:18px;
  background:#ffffff;
}

.formGroup h3{
  margin:0 0 14px;
  color:var(--nav);
  font-size:20px;
}

/* ================= GRID ================= */

.formGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.formGrid.full{
  grid-template-columns:1fr;
}

/* ================= LABEL ================= */

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:700;
  color:#0f172a;
}

/* ================= INPUTS ================= */

input,
select,
textarea{
  width:100%;
  padding:14px 16px;

  border:1px solid #d7dde7;

  border-radius:8px;

  background:#ffffff;

  font-size:14px;
  font-family:Arial, Helvetica, sans-serif;

  color:#0f172a;

  outline:none;

  transition:.2s ease;

  box-shadow:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#cbd5e1;
  box-shadow:none;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

/* ================= BUTTON ================= */

.submitBtn{
  width:100%;

  background:var(--nav);

  color:#fff;

  border:none;

  border-radius:8px;

  padding:15px;

  font-size:15px;
  font-weight:700;

  cursor:pointer;

  transition:.2s ease;
}

.submitBtn:hover{
  background:var(--nav-dark);
}

.msg{
  margin-top:14px;
  font-weight:700;
  color:#065f46;
}

.req{
  color:#dc2626;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .topbar{
    padding:18px;
  }

  .topbar-inner{
    flex-direction:column;
    gap:14px;
    text-align:center;
  }

  .logo{
    font-size:22px;
  }

  .formGrid{
    grid-template-columns:1fr;
  }

  .applicationSection{
    padding:22px;
  }

  .jobCard{
    padding:20px;
  }

  .jobCard h3{
    font-size:19px;
  }

  .applyBtn{
    width:100%;
  }
}

</style>
</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="logo">
      Practice Online Academy
    </div>

    <div class="top-links">
      <a href="index.html">Home</a>
    </div>

  </div>

</header>

<main class="wrap">

  <section class="categoryBox" id="categoryBox">
    Loading opportunities...
  </section>

  <section class="applicationSection" id="applicationSection">

    <h2>Apply for an Opportunity</h2>

    <p>
      Complete the application form below.
    </p>

    <form id="applicationForm">

      <!-- OPPORTUNITY -->

      <div class="formGroup">

        <h3>Opportunity Information</h3>

        <div class="formGrid">

          <div>

            <label>
              Opportunity Applied For <span class="req">*</span>
            </label>

            <input
              type="text"
              id="role"
              name="opportunityTitle"
              readonly
              required
            >

          </div>

          <div>

            <label>
              Availability <span class="req">*</span>
            </label>

            <select name="availability" required>

              <option value="">
                Select availability
              </option>

              <option>
                Immediately Available
              </option>

              <option>
                Part-Time
              </option>

              <option>
                Weekends Only
              </option>

              <option>
                Evenings Only
              </option>

              <option>
                One Month Notice
              </option>

            </select>

          </div>

        </div>

      </div>

      <!-- PERSONAL -->

      <div class="formGroup">

        <h3>Personal Information</h3>

        <div class="formGrid">

          <div>

            <label>
              Full Name and Surname <span class="req">*</span>
            </label>

            <input
              type="text"
              name="fullName"
              id="fullName"
              required
            >

          </div>

          <div>

            <label>
              Email Address <span class="req">*</span>
            </label>

            <input
              type="email"
              name="email"
              required
            >

          </div>

          <div>

            <label>
              Phone Number <span class="req">*</span>
            </label>

            <input
              type="tel"
              name="phone"
              required
            >

          </div>

          <div>

            <label>
              Highest Qualification
            </label>

            <input
              type="text"
              name="qualification"
            >

          </div>

        </div>

      </div>

      <!-- SUMMARY -->

      <div class="formGroup">

        <h3>Professional Summary</h3>

        <div class="formGrid full">

          <div>

            <label>
              Tell us about yourself <span class="req">*</span>
            </label>

            <textarea
              name="professionalSummary"
              required
            ></textarea>

          </div>

        </div>

      </div>

      <!-- DOCUMENTS -->

      <div class="formGroup">

        <h3>Documents</h3>

        <div class="formGrid">

          <div>

            <label>
              Upload CV
            </label>

            <input
              type="file"
              name="cv"
              accept=".pdf,.doc,.docx,image/*"
            >

          </div>

          <div>

            <label>
              Portfolio / LinkedIn / Website
            </label>

            <input
              type="url"
              name="portfolio"
            >

          </div>

        </div>

      </div>

      <button class="submitBtn" type="submit">
        Submit Professional Application
      </button>

      <div id="msg" class="msg"></div>

    </form>

  </section>

</main>

<script>

const API = "https://practice-backend-msgn.onrender.com";

const categoryBox = document.getElementById("categoryBox");

function escapeHtml(value){

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadOpportunities(){

  try{

    const res = await fetch(`${API}/api/opportunities`);

    const jobs = await res.json();

    if(!jobs.length){

      categoryBox.innerHTML =
      "No open opportunities available.";

      return;
    }

    const grouped = {};

    jobs.forEach(job=>{

      const cat = job.category || "Other";

      if(!grouped[cat]){
        grouped[cat] = [];
      }

      grouped[cat].push(job);

    });

    categoryBox.innerHTML =
    Object.entries(grouped).map(([category,items],index)=>`

      <div class="categoryItem ${index===0?"active":""}">

        <button class="categoryBtn" type="button">

          <span>${escapeHtml(category)} (${items.length})</span>

          <span class="arrow">▶</span>

        </button>

        <div class="jobsWrap">

          ${items.map(job=>`

            <div class="jobCard">

              <h3>${escapeHtml(job.title)}</h3>

              <div class="jobMeta">

                ${escapeHtml(job.category)}
                &nbsp;&nbsp;
                ${escapeHtml(job.location || "Online")}
                &nbsp;&nbsp;
                ${escapeHtml(job.type || "")}

              </div>

              <div class="jobDesc">
                ${escapeHtml(job.description)}
              </div>

              ${job.requirements ? `

                <div class="jobDesc">

                  <strong>Requirements:</strong>

                  ${escapeHtml(job.requirements)}

                </div>

              ` : ""}

              <button
                class="applyBtn"
                type="button"
                onclick="selectRole('${escapeHtml(job.title)}')"
              >

                Apply for this role

              </button>

            </div>

          `).join("")}

        </div>

      </div>

    `).join("");

    document.querySelectorAll(".categoryBtn")
    .forEach(btn=>{

      btn.addEventListener("click",()=>{

        btn.parentElement.classList.toggle("active");

      });

    });

  }catch(error){

    categoryBox.innerHTML =
    "Could not load opportunities.";

  }
}

function selectRole(role){

  document.getElementById("role").value = role;

  document.getElementById("applicationSection")
  .scrollIntoView({
    behavior:"smooth"
  });

  setTimeout(()=>{

    document.getElementById("fullName").focus();

  },400);
}

document.getElementById("applicationForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const msg = document.getElementById("msg");

  msg.textContent = "Submitting application...";

  try{

    const formData = new FormData(this);

    const res = await fetch(`${API}/api/opportunities/apply`,{
      method:"POST",
      body:formData
    });

    const data = await res.json();

    if(!res.ok){

      msg.style.color = "#b91c1c";

      msg.textContent =
      data.message || "Failed to submit application.";

      return;
    }

    msg.style.color = "#065f46";

    msg.textContent =
    "Application submitted successfully.";

    this.reset();

  }catch(error){

    msg.style.color = "#b91c1c";

    msg.textContent =
    "Network error. Please try again.";

  }
});

loadOpportunities();

</script>

</body>
</html>
