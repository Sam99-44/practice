<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account | Practice Online</title>

  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#0f172a}
    .wrap{max-width:560px;margin:40px auto;padding:0 14px}
    .card{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:20px}
    h2{margin:0 0 6px}
    p{margin:6px 0 14px;color:#334155}
    label{display:block;margin-top:12px;font-weight:600}
    input,select{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    @media(max-width:520px){.row{grid-template-columns:1fr}}
    .btn{background:#0b3c5d;color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;width:100%}
    .ghost{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;width:100%}
    .msg{margin-top:10px;white-space:pre-wrap}
    .error{color:#b91c1c}
    .ok{color:#065f46}
    .small{font-size:12px;color:#475569;margin-top:6px}
    .radioRow{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
    .radioRow label{font-weight:500;margin-top:0;display:flex;align-items:center;gap:8px}
    .links{display:flex;justify-content:space-between;margin-top:12px;font-size:14px}
    a{color:#0b3c5d;text-decoration:none}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h2>Register Account</h2>
      <p>Create your Practice Online account</p>

      <label>Account Type</label>
      <div class="radioRow">
        <label>
          <input type="radio" name="accountType" value="student" checked />
          Student
        </label>
        <label>
          <input type="radio" name="accountType" value="materials" />
          Access Materials Only
        </label>
      </div>

      <label>Username</label>
      <input id="username" />

      <label>Email</label>
      <input id="email" type="email" autocomplete="email" />

      <div id="gradeWrap">
        <label>Grade (Students only)</label>
        <select id="grade">
          <option value="">Select Grade</option>
          <option value="8">Grade 8</option>
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
        </select>
      </div>

      <div class="row">
        <div>
          <label>Password</label>
          <input id="password" type="password" autocomplete="new-password" />
        </div>
        <div>
          <label>Confirm Password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" />
        </div>
      </div>

      <div class="row">
        <button id="registerBtn" class="btn" type="button">Register</button>
        <button id="toggleBtn" class="ghost" type="button">Show Password</button>
      </div>

      <p id="msg" class="msg"></p>
      <p class="small" id=""></p>

      <div class="links">
        <a href="login.html">Login</a>
        <a href="reset-otp.html">Forgot password?</a>
      </div>
    </div>
  </div>

  <script>
    // ✅ Use your custom API domain
    const API = "https://api.practiceonline.co.za";

    const btn = document.getElementById("registerBtn");
    const msg = document.getElementById("msg");
    const  = document.getElementById("");

    const usernameEl = document.getElementById("username");
    const emailEl = document.getElementById("email");
    const gradeEl = document.getElementById("grade");
    const passwordEl = document.getElementById("password");
    const confirmEl = document.getElementById("confirmPassword");
    const toggleBtn = document.getElementById("toggleBtn");
    const gradeWrap = document.getElementById("gradeWrap");

    function setMsg(text, type="") {
      msg.className = "msg " + type;
      msg.textContent = text;
    }

    function getAccountType() {
      const picked = document.querySelector('input[name="accountType"]:checked');
      return picked ? picked.value : "materials";
    }

    function updateGradeVisibility() {
      const type = getAccountType();
      gradeWrap.style.display = (type === "student") ? "block" : "none";
      if (type !== "student") gradeEl.value = "";
    }

    document.querySelectorAll('input[name="accountType"]').forEach(r => {
      r.addEventListener("change", updateGradeVisibility);
    });
    updateGradeVisibility();

    toggleBtn.addEventListener("click", () => {
      const show = passwordEl.type === "password";
      passwordEl.type = show ? "text" : "password";
      confirmEl.type = show ? "text" : "password";
      toggleBtn.textContent = show ? "Hide Password" : "Show Password";
    });

    async function safeJson(res){
      try { return await res.json(); } catch { return {}; }
    }

    btn.addEventListener("click", async () => {
      const username = usernameEl.value.trim();
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      const confirmPassword = confirmEl.value;
      const accountType = getAccountType();
      const grade = gradeEl.value;

      if (!username || !email || !password || !confirmPassword) {
        return setMsg("All fields required.", "error");
      }
      if (password.length < 6) {
        return setMsg("Password must be at least 6 characters.", "error");
      }
      if (password !== confirmPassword) {
        return setMsg("Passwords do not match.", "error");
      }
      if (accountType === "student" && !grade) {
        return setMsg("Grade is required for Student accounts.", "error");
      }

      const payload = {
        username, email, password, accountType,
        ...(accountType === "student" ? { grade: Number(grade) } : {})
      };

      btn.disabled = true;
      setMsg("Creating account...");

      try {
        const res = await fetch(API + "/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await safeJson(res);

        if (!res.ok) {
          btn.disabled = false;
          return setMsg((data.message || "Could not register.") + ` (HTTP ${res.status})`, "error");
        }

        setMsg(data.message || "Account created.", "ok");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);

      } catch (e) {
        btn.disabled = false;
        setMsg("Network error / CORS blocked.", "error");
      }
    });
  </script>
</body>
</html>
