<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Announcements | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --bg:#f6f7fb;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#64748b;
  --red:#e11d2e;
  --success:#15803d;
  --danger:#b91c1c;
  --info:#1d4ed8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, "Calibri Light", Calibri, sans-serif;
  background:var(--bg);
  color:var(--text);
}
.topbar{
  background:linear-gradient(135deg,var(--nav),#2b2370);
  color:#fff;
}
.topbar-inner{
  max-width:1100px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.hero{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
}
.hero h2{
  margin:0 0 8px;
  font-size:20px;
}
.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}
.section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  margin-bottom:20px;
  overflow:hidden;
}
.sectionHead{
  padding:18px;
  border-bottom:1px solid var(--border);
  background:#f8fafc;
}
.sectionBody{
  padding:18px;
}
.grid{
  display:grid;
  gap:16px;
}
.card{
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  background:#fff;
}
.title{
  font-weight:700;
  font-size:16px;
  margin:0 0 8px;
}
.meta{
  font-size:13px;
  color:var(--muted);
  margin-top:8px;
  line-height:1.7;
}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
  align-items:center;
}
input,select{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  font-family:Arial, "Calibri Light", Calibri, sans-serif;
  font-size:14px;
}
.toolbar{
  display:flex;
  margin-bottom:15px;
}
.searchBox{
  position:relative;
  width:100%;
}
.searchBox img{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:16px;
  height:16px;
  opacity:.75;
  pointer-events:none;
}
.searchBox input{
  width:100%;
  padding:12px 14px 12px 38px;
  border-radius:12px;
  border:1px solid var(--border);
  font-family:Arial, "Calibri Light", Calibri, sans-serif;
  font-size:14px;
  background:#fff;
}
.searchBox input:focus{
  outline:none;
  border-color:#c7d2fe;
  box-shadow:0 0 0 2px rgba(99,102,241,0.15);
}
.status{
  display:none;
  padding:13px 14px;
  border-radius:12px;
  margin-bottom:14px;
  font-size:14px;
}
.status.show{display:block}
.status.info{background:#eef4ff;border:1px solid #c7d7fe;color:var(--info)}
.status.error{background:#fef2f2;border:1px solid #fecaca;color:var(--danger)}
.status.success{background:#ecfdf5;border:1px solid #bbf7d0;color:var(--success)}
.empty{
  color:var(--muted);
  font-size:14px;
}
.actions{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:14px;
}
.iconBtn{
  min-height:34px;
  border:none;
  background:transparent;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s ease;
  padding:6px 8px;
  font-family:Arial, "Calibri Light", Calibri, sans-serif;
}
.iconBtn img{
  width:18px;
  height:18px;
  display:block;
  flex-shrink:0;
}
.iconBtn.copy img{
  width:20px;
  height:20px;
}
.iconBtn:hover{
  background:#f1f5f9;
}
.actionTextBtn{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:none;
  border-radius:8px;
  padding:7px 10px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  font-family:Arial, "Calibri Light", Calibri, sans-serif;
}
.actionTextBtn img{
  width:16px;
  height:16px;
  display:block;
}
.actionTextBtn.accept{
  background:#ecfdf5;
  color:var(--success);
}
.actionTextBtn.reject{
  background:#fef2f2;
  color:var(--danger);
}
.actionTextBtn.accept:hover{
  background:#dcfce7;
}
.actionTextBtn.reject:hover{
  background:#fee2e2;
}
.linkText{
  color:#1d4ed8;
  text-decoration:underline;
  font-size:13px;
  font-weight:700;
}
.sectionHead strong{
  font-size:16px;
}
::placeholder{
  font-family:Arial, "Calibri Light", Calibri, sans-serif;
  color:#94a3b8;
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <strong>Practice Online</strong>
    <span>Announcements</span>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h2>Announcements</h2>
    <p>View general updates, class announcements, and quiz notices for your grade.</p>
  </div>

  <div id="statusBox" class="status info"></div>

  <div class="toolbar">
    <div class="searchBox">
      <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773873674/searchaddress_hae4sp.svg" alt="Search">
      <input id="search" placeholder="Search by title, message or grade...">
    </div>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>General Announcements</strong></div>
    <div class="sectionBody">
      <div id="generalGrid" class="grid"></div>
    </div>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>Class Announcements</strong></div>
    <div class="sectionBody">
      <div id="classGrid" class="grid"></div>
    </div>
  </div>

  <div class="section">
    <div class="sectionHead"><strong>Quiz Announcements</strong></div>
    <div class="sectionBody">
      <div id="quizGrid" class="grid"></div>
    </div>
  </div>
</div>

<script>
const API = window.API || "https://practice-backend-msgn.onrender.com";
let dataStore = null;

const statusBox = document.getElementById("statusBox");

const ICONS = {
  thumbsUp: "https://res.cloudinary.com/dopoxadlr/image/upload/v1773870202/thumbup_p6d1cb.svg",
  thumbsDown: "https://res.cloudinary.com/dopoxadlr/image/upload/v1773870185/thumbdown_bqpjk9.svg",
  copy: "https://res.cloudinary.com/dopoxadlr/image/upload/v1773871489/copy_gymbsv.svg"
};

function showStatus(message, type = "info") {
  statusBox.className = `status show ${type}`;
  statusBox.textContent = message;
}

function hideStatus() {
  statusBox.className = "status info";
  statusBox.textContent = "";
}

function escapeHtml(text){
  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeJsString(text){
  return String(text || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\n/g, "\\n")
    .replace(/\r/g, "");
}

function formatDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if (Number.isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString("en-ZA",{year:"numeric",month:"short",day:"numeric"});
}

function tokenHeaders() {
  const token = localStorage.getItem("token");
  return {
    "Content-Type":"application/json",
    ...(token ? { Authorization:`Bearer ${token}` } : {})
  };
}

function matchFilter(item){
  const q = document.getElementById("search").value.toLowerCase();

  const text = `
    ${item.title || ""}
    ${item.message || ""}
    ${item.grade || ""}
    ${item.meetingDate || ""}
    ${item.meetingTime || ""}
    ${item.dueDate || ""}
  `.toLowerCase();

  return !q || text.includes(q);
}

function renderGeneral(list){
  const el = document.getElementById("generalGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>`
    <div class="card">
      <div class="title">${escapeHtml(i.title)}</div>
      <div class="meta">${escapeHtml(i.message)}</div>
      <div class="meta">Grade: ${escapeHtml(i.grade || "allGrades")}</div>
      <div class="meta">Posted: ${escapeHtml(formatDate(i.createdAt))}</div>
      <div class="actions">
        <button class="iconBtn copy" onclick="copyText('${safeJsString(i.message || "")}')" title="Copy">
          <img src="${ICONS.copy}" alt="Copy">
        </button>
      </div>
    </div>
  `).join("") : `<div class="empty">No general announcements.</div>`;
}

function renderClass(list){
  const el = document.getElementById("classGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>`
    <div class="card">
      <div class="title">${escapeHtml(i.title)}</div>
      <div class="meta">${escapeHtml(i.message)}</div>
      <div class="meta">Grade: ${escapeHtml(i.grade || "allGrades")}</div>
      <div class="meta">Date: ${escapeHtml(formatDate(i.meetingDate))}</div>
      <div class="meta">Time: ${escapeHtml(i.meetingTime || "—")}</div>

      <div class="actions">
        ${i.meetingLink ? `<a class="linkText" href="${escapeHtml(i.meetingLink)}" target="_blank" rel="noopener noreferrer">Join Meeting</a>` : ``}

        ${i.meetingLink ? `
          <button class="iconBtn copy" onclick="copyText('${safeJsString(i.meetingLink)}')" title="Copy link">
            <img src="${ICONS.copy}" alt="Copy">
          </button>
        ` : ``}

        <button class="actionTextBtn accept" onclick="respond('${i._id}','accepted')" title="Accept">
          <img src="${ICONS.thumbsUp}" alt="Accept">
          <span>Accept</span>
        </button>

        <button class="actionTextBtn reject" onclick="respond('${i._id}','rejected')" title="Reject">
          <img src="${ICONS.thumbsDown}" alt="Reject">
          <span>Reject</span>
        </button>
      </div>
    </div>
  `).join("") : `<div class="empty">No class announcements.</div>`;
}

function renderQuiz(list){
  const el = document.getElementById("quizGrid");
  const items = list.filter(matchFilter);

  el.innerHTML = items.length ? items.map(i=>`
    <div class="card">
      <div class="title">${escapeHtml(i.title)}</div>
      <div class="meta">${escapeHtml(i.message)}</div>
      <div class="meta">Grade: ${escapeHtml(i.grade || "allGrades")}</div>
      <div class="meta">Due: ${escapeHtml(formatDate(i.dueDate))}</div>
      <div class="meta">Status: ${escapeHtml(i.quizStatus || "Open")}</div>
      <div class="actions">
        <button class="iconBtn copy" onclick="copyText('${safeJsString(i.message || "")}')" title="Copy">
          <img src="${ICONS.copy}" alt="Copy">
        </button>
      </div>
    </div>
  `).join("") : `<div class="empty">No quiz announcements.</div>`;
}

function renderAll(){
  if(!dataStore) return;
  renderGeneral(dataStore.generalAnnouncements || []);
  renderClass(dataStore.classAnnouncements || []);
  renderQuiz(dataStore.quizAnnouncements || []);
}

async function load(){
  try {
    showStatus("Loading announcements...", "info");

    const res = await fetch(`${API}/api/announcements`, {
      headers: tokenHeaders()
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.message || "Failed to load announcements.");
    }

    dataStore = data;
    renderAll();
    hideStatus();
  } catch (err) {
    console.error(err);
    showStatus(err.message || "Could not load announcements.", "error");
  }
}

async function respond(id,response){
  try {
    showStatus("Saving response...", "info");

    const res = await fetch(`${API}/api/announcements/${id}/respond`,{
      method:"POST",
      headers: tokenHeaders(),
      body:JSON.stringify({response})
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.message || "Failed to save response.");
    }

    showStatus(`Response saved as ${response}.`, "success");
    await load();
  } catch (err) {
    console.error(err);
    showStatus(err.message || "Could not save response.", "error");
  }
}

function copyText(text){
  navigator.clipboard.writeText(text)
    .then(() => showStatus("Copied successfully.", "success"))
    .catch(() => showStatus("Could not copy.", "error"));
}

document.getElementById("search").addEventListener("input",renderAll);

load();
</script>

</body>
</html>
