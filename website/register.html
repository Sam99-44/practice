<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account | Practice Online</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#0f172a}
    .card{max-width:520px;margin:40px auto;background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:20px}
    label{display:block;margin-top:12px}
    input,select{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    @media(max-width:520px){.row{grid-template-columns:1fr}}
    .btn{background:#0b3c5d;color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
    .ghost{background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
    .msg{margin-top:10px;white-space:pre-wrap}
    .error{color:#b91c1c}
    .ok{color:#065f46}
  </style>
</head>
<body>

<div class="card">
  <h2>Create Account</h2>
  <p>Register and we will send a verification email to activate your account.</p>

  <form id="regForm" onsubmit="return false;">
    <label>Username</label>
    <input id="username" />

    <label>Email</label>
    <input id="email" type="email" />

    <label>Grade</label>
    <select id="grade">
      <option value="">Select Grade</option>
      <option value="8">Grade 8</option>
      <option value="9">Grade 9</option>
      <option value="10">Grade 10</option>
      <option value="11">Grade 11</option>
      <option value="12">Grade 12</option>
    </select>

    <div class="row">
      <div>
        <label>Password</label>
        <input id="password" type="password" />
      </div>
      <div>
        <label>Confirm Password</label>
        <input id="confirmPassword" type="password" />
      </div>
    </div>

    <div class="row">
      <button id="registerBtn" class="btn" type="button">Register</button>
      <button id="toggleBtn" class="ghost" type="button">Show Password</button>
    </div>

    <p id="msg" class="msg"></p>
  </form>
</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com"; // ✅ MUST be Render

  const btn = document.getElementById("registerBtn");
  const msg = document.getElementById("msg");

  const usernameEl = document.getElementById("username");
  const emailEl = document.getElementById("email");
  const gradeEl = document.getElementById("grade");
  const passwordEl = document.getElementById("password");
  const confirmEl = document.getElementById("confirmPassword");
  const toggleBtn = document.getElementById("toggleBtn");

  function setMsg(text, type="") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  toggleBtn.addEventListener("click", () => {
    const show = passwordEl.type === "password";
    passwordEl.type = show ? "text" : "password";
    confirmEl.type = show ? "text" : "password";
    toggleBtn.textContent = show ? "Hide Password" : "Show Password";
  });

  btn.addEventListener("click", async () => {
    const username = usernameEl.value.trim();
    const email = emailEl.value.trim();
    const grade = gradeEl.value;
    const password = passwordEl.value;
    const confirmPassword = confirmEl.value;

    if (!username || !email || !grade || !password || !confirmPassword) {
      return setMsg("All fields required.", "error");
    }
    if (password.length < 6) {
      return setMsg("Password must be at least 6 characters.", "error");
    }
    if (password !== confirmPassword) {
      return setMsg("Passwords do not match.", "error");
    }

    btn.disabled = true;
    setMsg("Creating account...");

    try {
      const res = await fetch(API + "/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, grade, password })
      });

      const data = await res.json().catch(()=> ({}));

      if (res.ok) {
        setMsg(data.message || "Account created ✅ Check your email to verify.", "ok");
      } else {
        setMsg((data.message || "Could not register.") + ` (HTTP ${res.status})`, "error");
        btn.disabled = false;
      }
    } catch (e) {
      setMsg("Network error / CORS blocked. Check Render + Netlify settings.", "error");
      btn.disabled = false;
    }
  });

  setMsg("Ready ✅", "ok");
</script>

</body>
</html>
