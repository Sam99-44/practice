<!doctype html>
<html>
<head>
<title>Reset Password</title>
<style>
body{font-family:Arial;background:#f6f7fb}
.card{max-width:420px;margin:60px auto;background:#fff;padding:20px;border-radius:12px}
input,button{width:100%;padding:10px;margin-top:8px}
button{background:#0b3c5d;color:#fff;border:none;border-radius:8px;font-weight:bold}
.msg{margin-top:10px}
</style>
</head>
<body>

<div class="card">
<h2>Reset Password</h2>
<input id="pass" type="password" placeholder="New password">
<button onclick="reset()">Reset</button>
<p id="msg"></p>
</div>

<script>
const API="https://practice-backend-msgn.onrender.com";
const token=new URLSearchParams(location.search).get("token");

async function reset(){
  const r=await fetch(API+"/api/reset-password",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({token,newPassword:pass.value})
  });
  const d=await r.json();
  msg.textContent=d.message;
}
</script>

</body>
</html>
