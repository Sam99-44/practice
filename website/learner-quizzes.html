<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Practice | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#0f172a}
    .wrap{max-width:1000px;margin:0 auto;padding:24px}
    .card{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:18px}
    .topic{margin-top:14px}
    .topic h3{margin-bottom:8px;color:#0b3c5d}
    .grid{display:flex;gap:10px;flex-wrap:wrap}
    .quiz{
      width:64px;height:64px;border-radius:14px;border:1px solid #ddd;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;background:#f8fafc;font-weight:700
    }
    .quiz:hover{background:#eef7ff}
    select{padding:10px;border-radius:10px;border:1px solid #ddd}
    .muted{color:#475569}
    .error{color:#b91c1c}
  </style>

  <script>
    const authToken = localStorage.getItem("token");
    if (!authToken) window.location.href = "login.html";
  </script>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h2>Select Grade</h2>

    <select id="gradeSelect">
      <option value="">Choose grade</option>
      <option value="8">Grade 8</option>
      <option value="9">Grade 9</option>
      <option value="10">Grade 10</option>
      <option value="11">Grade 11</option>
      <option value="12">Grade 12</option>
    </select>

    <p id="status" class="muted"></p>
    <div id="quizList"></div>
  </div>
</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";
  const gradeSelect = document.getElementById("gradeSelect");
  const quizList = document.getElementById("quizList");
  const status = document.getElementById("status");

  gradeSelect.addEventListener("change", loadQuizzes);

  async function loadQuizzes() {
    const grade = gradeSelect.value;
    quizList.innerHTML = "";
    status.textContent = "";

    if (!grade) return;

    status.textContent = "Loading quizzes...";

    try {
      const res = await fetch(`${API}/api/quizzes?grade=${grade}`, {
        headers: { Authorization: "Bearer " + authToken }
      });

      if (!res.ok) {
        status.className = "error";
        status.textContent = "Failed to load quizzes";
        return;
      }

      const quizzes = await res.json();
      status.textContent = "";

      if (!quizzes.length) {
        quizList.innerHTML = `<p class="muted">No quizzes for Grade ${grade}</p>`;
        return;
      }

      const byTopic = {};
      quizzes.forEach(q => {
        const t = q.topic || "General";
        byTopic[t] ??= [];
        byTopic[t].push(q);
      });

      Object.keys(byTopic).forEach(topic => {
        const div = document.createElement("div");
        div.className = "topic";

        div.innerHTML = `
          <h3>${topic}</h3>
          <div class="grid">
            ${byTopic[topic].map((q,i)=>`
              <div class="quiz"
                onclick="location.href='attempt.html?quizId=${q._id}'">
                <div>${i+1}</div>
                <small>${q.questions.length}Q</small>
              </div>
            `).join("")}
          </div>
        `;
        quizList.appendChild(div);
      });

    } catch (err) {
      status.className = "error";
      status.textContent = "Network error";
    }
  }
</script>
</body>
</html>
