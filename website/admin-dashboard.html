<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .wrap{max-width:1200px;margin:0 auto;padding:20px;}

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .title h1{margin:0;font-size:22px;}
    .title p{margin:6px 0 0 0;}

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }

    .btn{
      background:var(--accent);
      color:#fff;
      padding:10px 12px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      text-decoration:none;
      font-weight:700;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .btn2{
      background:#fff;
      color:var(--text);
      border:1px solid #ddd;
    }
    .btn:disabled{
      opacity:0.65;
      cursor:not-allowed;
    }
    .btn:active{transform:translateY(1px);}

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:14px;
      margin-top:14px;
    }
    @media (max-width: 900px){
      .grid{grid-template-columns:1fr;}
    }
    @media (max-width: 560px){
      .actions{justify-content:flex-start;}
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:var(--shadow);
      min-width:0;
    }

    .muted{color:var(--muted);}
    .error{color:var(--error);}
    .ok{color:var(--ok);}

    .big{
      font-size:30px;
      font-weight:800;
      margin-top:6px;
      letter-spacing:-0.02em;
    }

    .list{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .rowItem{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid #eee;
      border-radius:12px;
      background:#fafafa;
      font-size:14px;
      flex-wrap:wrap;
    }

    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #cfe9ff;
      background:#eef7ff;
      color:var(--accent);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .miniStats{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .miniPill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      border:1px solid #e2e8f0;
      background:#fff;
      color:#334155;
    }

    #msg{margin-top:14px;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="title">
        <h1>Admin Dashboard</h1>
        <p class="muted" id="who">Checking login...</p>
      </div>

      <div class="actions">
        <a class="btn btn2" href="admin-quiz.html">Add Assessment</a>
        <a class="btn btn2" href="edit-assessment.html">Edit / Freeze / Delete</a>
        <a class="btn btn2" href="learner-quizzes.html">Learner View</a>
        <button class="btn btn2" id="refreshBtn" type="button">Refresh</button>
        <button class="btn" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="muted">Total Users</div>
        <div class="big" id="totalUsers">-</div>
      </div>

      <div class="card">
        <div class="muted">Total Assessments</div>
        <div class="big" id="totalAssessments">-</div>
      </div>

      <div class="card">
        <div class="muted">Total Learners (Grades 8–12)</div>
        <div class="big" id="totalLearners">-</div>
      </div>

      <div class="card">
        <div class="muted">Assessments by Grade</div>
        <div id="byGradeAssessments" class="list muted" style="margin-top:10px;">-</div>
      </div>

      <div class="card">
        <div class="muted">Learners by Grade</div>
        <div id="byGradeLearners" class="list muted" style="margin-top:10px;">-</div>
      </div>

      <div class="card">
        <div class="muted">Account Type by Grade</div>
        <div id="byGradeAccountType" class="list muted" style="margin-top:10px;">-</div>
      </div>
    </div>

    <p id="msg" class="muted"></p>
  </div>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";
    const token = localStorage.getItem("token");
    const refreshBtn = document.getElementById("refreshBtn");

    function logout(){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      window.location.href = "login.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("refreshBtn").addEventListener("click", () => loadStats(true));

    function setMsg(text, cls="muted"){
      const el = document.getElementById("msg");
      el.className = cls;
      el.textContent = text;
    }

    function safeNum(x){
      const n = Number(x);
      return Number.isFinite(n) ? n : 0;
    }

    function buildGradeMap(list){
      const map = new Map();
      (Array.isArray(list) ? list : []).forEach(item => {
        map.set(String(item.grade), safeNum(item.count));
      });
      return map;
    }

    function renderAssessmentsByGrade(list){
      const el = document.getElementById("byGradeAssessments");
      const grades = [8, 9, 10, 11, 12];
      const map = buildGradeMap(list);

      el.innerHTML = grades.map(g => `
        <div class="rowItem">
          <span class="pill">Grade ${g}</span>
          <b>${map.get(String(g)) || 0}</b>
        </div>
      `).join("");
    }

    function renderLearnersByGrade(list){
      const el = document.getElementById("byGradeLearners");
      const grades = [8, 9, 10, 11, 12];
      const map = buildGradeMap(list);

      el.innerHTML = grades.map(g => `
        <div class="rowItem">
          <span class="pill">Grade ${g}</span>
          <b>${map.get(String(g)) || 0}</b>
        </div>
      `).join("");
    }

    function renderAccountTypeByGrade(list){
      const el = document.getElementById("byGradeAccountType");
      const rows = Array.isArray(list) ? list : [];
      const grades = [8, 9, 10, 11, 12];

      el.innerHTML = grades.map(g => {
        const row = rows.find(x => Number(x.grade) === g) || {
          grade: g,
          student: 0,
          materials: 0,
          total: 0
        };

        return `
          <div class="rowItem">
            <span class="pill">Grade ${g}</span>
            <div class="miniStats">
              <span class="miniPill">Student: <b>${safeNum(row.student)}</b></span>
              <span class="miniPill">Materials: <b>${safeNum(row.materials)}</b></span>
              <span class="miniPill">Total: <b>${safeNum(row.total)}</b></span>
            </div>
          </div>
        `;
      }).join("");
    }

    async function requireAdmin(){
      let meRes;
      try{
        meRes = await fetch(`${API}/api/auth/me`, {
          headers: { Authorization: `Bearer ${token}` }
        });
      } catch {
        setMsg("Network error. Please refresh.", "error");
        return false;
      }

      const me = await meRes.json().catch(()=>null);
      if (!meRes.ok || !me) {
        logout();
        return false;
      }

      if (me.role !== "admin") {
        setMsg("Admin access only. Redirecting...", "error");
        setTimeout(() => {
          window.location.href = "learner-quizzes.html";
        }, 700);
        return false;
      }

      document.getElementById("who").textContent = `Logged in as: ${me.username} (admin)`;
      return true;
    }

    async function loadStats(showToast){
      refreshBtn.disabled = true;
      setMsg("Loading stats...", "muted");

      let res;
      try{
        res = await fetch(`${API}/api/admin/stats`, {
          headers: { Authorization: `Bearer ${token}` }
        });
      } catch {
        setMsg("Network error loading stats.", "error");
        refreshBtn.disabled = false;
        return;
      }

      const data = await res.json().catch(()=>null);
      if (!res.ok || !data){
        setMsg("Could not load stats.", "error");
        refreshBtn.disabled = false;
        return;
      }

      document.getElementById("totalUsers").textContent = safeNum(data.totalUsers);

      const totalAssessments = (data.totalAssessments != null)
        ? data.totalAssessments
        : data.totalQuizzes;

      document.getElementById("totalAssessments").textContent = safeNum(totalAssessments);

      const totalLearners = (Array.isArray(data.usersByGrade) ? data.usersByGrade : [])
        .reduce((sum, x) => sum + safeNum(x.count), 0);

      document.getElementById("totalLearners").textContent = totalLearners;

      renderAssessmentsByGrade(data.quizzesByGrade);
      renderLearnersByGrade(data.usersByGrade);
      renderAccountTypeByGrade(data.accountTypeByGrade);

      setMsg(showToast ? "Stats refreshed." : "Stats loaded.", "ok");
      refreshBtn.disabled = false;
    }

    (async () => {
      if (!token) return logout();
      const ok = await requireAdmin();
      if (!ok) return;
      await loadStats(false);
    })();
  </script>
</body>
</html>
