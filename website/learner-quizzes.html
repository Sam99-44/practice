<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Practice | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .wrap{max-width:1000px;margin:0 auto;padding:24px;}

    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:12px;}
    .brand{display:flex;align-items:center;gap:10px;}
    .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;}
    .brand span{font-size:13px;color:var(--muted);}

    .nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
    .nav a{text-decoration:none;color:var(--text);padding:6px 8px;border-radius:8px;}
    .nav a.active{font-weight:600;color:var(--accent);}
    .nav a:hover{background:var(--accent-soft);}
    .nav .logout{background:var(--accent);color:white;border:none;padding:8px 12px;border-radius:10px;cursor:pointer;}

    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
    h1{margin:0;font-size:20px;}
    .muted{color:var(--muted);}
    .error{color:var(--error);}

    select,input{padding:10px;border-radius:10px;border:1px solid #ddd;min-width:220px;}
    .controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center;}
    .btn2{background:#fff;border:1px solid #ddd;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;}
    .btn2:disabled{opacity:.6;cursor:not-allowed;}

    .topic-wrap{margin-top:16px;display:flex;flex-direction:column;gap:14px;}
    .topic-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff;}
    .topic-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
    .topic-title{font-size:16px;font-weight:800;color:var(--accent);}
    .toggle{border:1px solid #ddd;background:#fff;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:700;}
    .toggle:hover{background:var(--accent-soft);}

    .quiz-squares{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
    .quiz-square{
      width:64px;height:64px;border-radius:14px;border:1px solid var(--border);
      background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;
      cursor:pointer;font-weight:800;position:relative;
      transition:transform .08s, background .2s, border-color .2s;
      user-select:none;
    }
    .quiz-square:hover{background:#eef7ff;transform:translateY(-1px);border-color:#cfe9ff;}

    /* ✅ Completed mark */
    .quiz-square.done{
      border-color:#86efac;
      background:#f0fdf4;
    }
    .quiz-square.done::after{
      content:"✓";
      position:absolute;
      top:6px;right:10px;
      font-size:14px;
      font-weight:900;
      color:#166534;
    }

    /* ✅ Frozen assessment (locked) */
    .quiz-square.frozen{
      cursor:not-allowed;
      opacity:.75;
      background:#f8fafc;
      border-color:#e5e7eb;
      transform:none !important;
    }
    .quiz-square.frozen:hover{
      background:#f8fafc;
      border-color:#e5e7eb;
    }
    .quiz-square.frozen::before{
      content:"🔒";
      position:absolute;
      top:6px;left:10px;
      font-size:14px;
    }
    .quiz-square .smallTag{
      font-size:10px;
      font-weight:900;
      margin-top:2px;
      color:#64748b;
    }

    .hidden{display:none!important;}
  </style>

  <script>
    const authToken = localStorage.getItem("token");
    if (!authToken) window.location.href = "login.html";
  </script>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <span id="welcomeSub"></span>
      </div>
    </div>

    <nav class="nav">
      <a class="active" href="learner-quizzes.html">Practice</a>
      <a href="results.html">Results</a>
      <a href="about.html">About</a>
      <a href="admin-quiz.html" data-admin>Admin</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </nav>
  </div>

  <div class="card">
    <h1>Select Grade</h1>
    <p class="muted">Choose your grade to view assessments.</p>

    <div class="controls">
      <select id="gradeSelect">
        <option value="">Choose grade</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
        <option value="12">Grade 12</option>
      </select>

      <input id="topicSearch" placeholder="Search topic…" disabled />

      <button class="btn2" id="expandAllBtn" disabled type="button">Expand all</button>
      <button class="btn2" id="collapseAllBtn" disabled type="button">Collapse all</button>
    </div>

    <p id="status" class="muted"></p>
    <div id="quizList"></div>
  </div>

</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";

  document.getElementById("welcomeSub").textContent =
    "Welcome, " + (localStorage.getItem("username") || "Learner");

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.clear();
    window.location.href = "login.html";
  };

  const gradeSelect = document.getElementById("gradeSelect");
  const quizList = document.getElementById("quizList");
  const status = document.getElementById("status");
  const topicSearch = document.getElementById("topicSearch");
  const expandAllBtn = document.getElementById("expandAllBtn");
  const collapseAllBtn = document.getElementById("collapseAllBtn");

  // State
  let topicOpen = {};
  let cachedByTopic = null;      // { topic: [quizzes] }
  let cachedTopics = [];         // [topic names]
  let completedSet = new Set();  // quizIds that have results

  gradeSelect.addEventListener("change", loadQuizzes);
  topicSearch.addEventListener("input", () => filterTopics(topicSearch.value));
  expandAllBtn.addEventListener("click", () => toggleAll(true));
  collapseAllBtn.addEventListener("click", () => toggleAll(false));

  async function loadCompletedResults(){
    try{
      const res = await fetch(`${API}/api/results/my`, {
        headers: { Authorization: `Bearer ${authToken}` }
      });
      if (!res.ok) return;

      const results = await res.json();

      completedSet = new Set(
        results
          .map(r => (r.quizId && r.quizId._id) ? r.quizId._id : r.quizId)
          .filter(Boolean)
      );
    } catch {
      // ignore
    }
  }

  async function loadQuizzes(){
    const grade = gradeSelect.value;
    if (!grade){
      quizList.innerHTML = "";
      status.textContent = "";
      topicSearch.disabled = true;
      expandAllBtn.disabled = true;
      collapseAllBtn.disabled = true;
      return;
    }

    status.className = "muted";
    status.textContent = "Loading assessments...";
    quizList.innerHTML = "";

    await loadCompletedResults();

    let res;
    try{
      res = await fetch(`${API}/api/quizzes?grade=${encodeURIComponent(grade)}`, {
        headers:{ Authorization:`Bearer ${authToken}` }
      });
    } catch {
      status.className = "error";
      status.textContent = "Network error. Please refresh.";
      return;
    }

    if (res.status === 401) {
      localStorage.clear();
      window.location.href = "login.html";
      return;
    }

    const quizzes = await res.json().catch(()=>[]);
    if (!Array.isArray(quizzes) || quizzes.length === 0){
      status.textContent = "No assessments found.";
      cachedByTopic = null;
      cachedTopics = [];
      topicSearch.disabled = true;
      expandAllBtn.disabled = true;
      collapseAllBtn.disabled = true;
      return;
    }

    const byTopic = {};
    quizzes.forEach(q=>{
      const t = (q.topic || "General").trim() || "General";
      (byTopic[t] ||= []).push(q);
      if (typeof topicOpen[t] !== "boolean") topicOpen[t] = true;
    });

    const topics = Object.keys(byTopic).sort((a,b)=>a.localeCompare(b));
    topics.forEach(t=>{
      byTopic[t].sort((a,b)=>{
        const da = new Date(a.createdAt || 0).getTime();
        const db = new Date(b.createdAt || 0).getTime();
        return da - db;
      });
    });

    cachedByTopic = byTopic;
    cachedTopics = topics;

    render();
    topicSearch.disabled = false;
    expandAllBtn.disabled = false;
    collapseAllBtn.disabled = false;
    status.textContent = "";
    filterTopics(topicSearch.value);
  }

  function render(){
    if (!cachedByTopic) return;

    quizList.innerHTML = `
      <div class="topic-wrap">
        ${cachedTopics.map(t=>{
          const list = cachedByTopic[t] || [];
          const open = topicOpen[t] !== false;

          return `
            <div class="topic-card" data-topic="${escapeAttr(t)}">
              <div class="topic-head">
                <div class="topic-title">${escapeHtml(t)}</div>
                <button class="toggle" type="button" data-toggle="${escapeAttr(t)}">
                  ${open ? "Collapse" : "Expand"}
                </button>
              </div>

              <div class="quiz-squares ${open ? "" : "hidden"}" data-body="${escapeAttr(t)}">
                ${list.map((q,i)=>{
                  const isFrozen = !!q.isFrozen;
                  const isDone = completedSet.has(q._id);
                  const cls = `quiz-square ${isDone ? "done" : ""} ${isFrozen ? "frozen" : ""}`.trim();

                  const tip = isFrozen
                    ? `Frozen: you can't attempt this assessment right now`
                    : `Assessment: ${q.title || "Assessment"}`;

                  return `
                    <div class="${cls}"
                      title="${escapeAttr(tip)}"
                      data-quizid="${escapeAttr(q._id)}"
                      data-frozen="${isFrozen ? "1" : "0"}">
                      ${i+1}
                      ${isFrozen ? `<div class="smallTag">Frozen</div>` : ``}
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;

    // Toggle buttons
    document.querySelectorAll("[data-toggle]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const t = btn.getAttribute("data-toggle");
        topicOpen[t] = !(topicOpen[t] !== false);

        const body = document.querySelector(`[data-body="${cssEscape(t)}"]`);
        if (body) body.classList.toggle("hidden", topicOpen[t] === false);
        btn.textContent = (topicOpen[t] === false) ? "Expand" : "Collapse";
      });
    });

    // Click handler for squares (blocks frozen)
    quizList.querySelectorAll(".quiz-square").forEach(sq=>{
      sq.addEventListener("click", ()=>{
        const frozen = sq.getAttribute("data-frozen") === "1";
        const id = sq.getAttribute("data-quizid");
        if (!id) return;

        if (frozen) {
          alert("This assessment is frozen. Please try again later.");
          return;
        }

        window.location.href = `attempt.html?quizId=${encodeURIComponent(id)}`;
      });
    });
  }

  function toggleAll(open){
    Object.keys(topicOpen).forEach(t => topicOpen[t] = open);

    document.querySelectorAll("[data-body]").forEach(body=>{
      body.classList.toggle("hidden", !open);
    });
    document.querySelectorAll("[data-toggle]").forEach(btn=>{
      btn.textContent = open ? "Collapse" : "Expand";
    });
  }

  function filterTopics(q){
    q = (q || "").trim().toLowerCase();
    document.querySelectorAll("[data-topic]").forEach(card=>{
      const topic = (card.getAttribute("data-topic") || "").toLowerCase();
      const match = !q || topic.includes(q);
      card.classList.toggle("hidden", !match);
    });
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function escapeAttr(str){
    return String(str).replaceAll('"',"&quot;");
  }
  function cssEscape(str){
    return String(str).replaceAll('"','\\"');
  }
</script>

</body>
</html>
