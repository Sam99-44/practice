<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Profile | Practice Online</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --nav:#1b1648;
  --bg:#f6f7fb;
  --border:#d9dee7;
  --text:#222;
  --muted:#5f6b7a;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.topbar{
  background:var(--nav);
  color:#fff;
}

.topbar-inner{
  max-width:1150px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-weight:800;
  font-size:18px;
}

/* 🔥 Bold clean logout */
.logoutBtn{
  background:transparent;
  border:none;
  cursor:pointer;
  padding:6px;
}

.logoutBtn img{
  width:22px;
  height:22px;
  filter: brightness(0) invert(1);
  transform:scale(1.1);
  transition:.2s ease;
}

.logoutBtn:hover img{
  transform:scale(1.2);
}

.wrap{
  max-width:1150px;
  margin:auto;
  padding:18px;
}

.quickGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.quickCard{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  transition:.2s ease;
}

.quickCard:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 24px rgba(15,23,42,.08);
}

.quickIcon{
  margin-bottom:14px;
}

.quickIcon img,
.quickIcon svg{
  width:30px;
  height:30px;
}

/* icon styles */
.icon-dark{ filter:brightness(0); }
.icon-color{ filter:none !important; }
.icon-gold{ filter:none !important; }

/* 🔥 Results light blue */
.icon-blue{
  filter: invert(48%) sepia(80%) saturate(1200%) hue-rotate(190deg) brightness(95%) contrast(95%);
}

h3{
  margin:0 0 6px;
  color:var(--nav);
  font-size:16px;
}

p{
  margin:0;
  font-size:13px;
  color:var(--muted);
}

@media (max-width:900px){
  .quickGrid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media (max-width:640px){
  .quickGrid{
    grid-template-columns:1fr;
  }

  .topbar-inner{
    padding:12px 14px;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Practice Online</div>

    <button class="logoutBtn" id="logoutBtn" title="Logout">
      <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773768418/logout_uay6y8.svg" alt="Logout">
    </button>
  </div>
</header>

<main class="wrap">

<section class="quickGrid">

<a class="quickCard" href="profile.html">
  <div class="quickIcon">
    <svg class="icon-dark" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 20c2-4 6-5 8-5s6 1 8 5"></path>
    </svg>
  </div>
  <h3>Profile</h3>
  <p>Manage your profile</p>
</a>

<a class="quickCard" href="learner-quizzes.html">
  <div class="quickIcon">
    <svg class="icon-dark" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15"></path>
    </svg>
  </div>
  <h3>Practice</h3>
  <p>Practice questions</p>
</a>

<a class="quickCard" href="results.html">
  <div class="quickIcon">
    <img class="icon-blue" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/results_qgdct1.svg" alt="Results">
  </div>
  <h3>Results</h3>
  <p>Your scores</p>
</a>

<a class="quickCard" href="progress-dashboard.html">
  <div class="quickIcon">
    <img class="icon-dark" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/dashboard_bstzjj.svg" alt="Dashboard">
  </div>
  <h3>Dashboard</h3>
  <p>Your progress</p>
</a>

<a class="quickCard" href="leaderboard.html">
  <div class="quickIcon">
    <img class="icon-gold" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777661/leaderboard_yfjgjf.svg" alt="Leaderboard">
  </div>
  <h3>Leaderboard</h3>
  <p>Top learners</p>
</a>

<a class="quickCard" href="support.html">
  <div class="quickIcon">
    <img class="icon-dark" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/support_bs175s.svg" alt="Support">
  </div>
  <h3>Support</h3>
  <p>Get help</p>
</a>

<a class="quickCard" href="announcements.html">
  <div class="quickIcon">
    <img class="icon-color" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773777659/announcement_gg5tqs.svg" alt="Announcements">
  </div>
  <h3>Announcements</h3>
  <p>Latest updates</p>
</a>

</section>

</main>

<script>
document.getElementById("logoutBtn").onclick = () => {
  localStorage.clear();
  location.href = "login.html";
};
</script>

</body>
</html>
