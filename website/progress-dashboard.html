<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Progress Dashboard | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --nav:#1b1648;
      --accent:#0b3c5d;
      --red:#e11d2e;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --radius:16px;
      --shadow:0 10px 24px rgba(0,0,0,.06);
      --focus:0 0 0 4px rgba(207,233,255,.65);
      --soft:#f8fafc;
      --soft2:#f1f5f9;
      --green:#065f46;
      --orange:#9a3412;
      --blue:#0b3c5d;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    a{text-decoration:none;color:inherit}

    header.topbar{
      background:var(--nav);
      color:#fff;
      border-bottom:3px solid rgba(255,255,255,.08);
    }

    .topbar-inner{
      max-width:1100px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      flex-direction:column;
      line-height:1.1;
      font-weight:800;
      letter-spacing:.12px;
    }

    .brand small{
      opacity:.85;
      font-weight:600;
      margin-top:4px;
    }

    nav.nav{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    nav.nav a{
      padding:8px 10px;
      border-radius:10px;
      color:#e7e9ff;
      font-weight:600;
      font-size:13px;
    }

    nav.nav a.active{
      border-bottom:3px solid var(--red);
      color:#fff;
      border-radius:10px 10px 8px 8px;
      padding-bottom:5px;
    }

    nav.nav a:hover{
      background:rgba(255,255,255,.10)
    }

    .btnTop{
      background:transparent;
      color:#fff;
      border:1px solid rgba(255,255,255,.22);
      padding:8px 12px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
    }

    .btnTop:hover{
      background:rgba(255,255,255,.08)
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:18px;
    }

    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin-top:14px;
      overflow:hidden;
    }

    .sectionHead{
      padding:16px 16px 14px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,#f8fbff,#eef4ff);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .sectionHead h1{
      margin:0;
      font-size:20px;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .muted{
      color:var(--muted);
      font-weight:600;
      font-size:13px;
      margin-top:6px;
      min-height:18px;
      line-height:1.5;
    }

    .filters{
      padding:14px 16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      background:#fff;
    }

    select{
      padding:10px 12px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      background:#fff;
      font-size:13px;
      font-weight:700;
      outline:none;
      min-width:170px;
      color:var(--text);
    }

    select:focus{
      box-shadow:var(--focus);
      border-color:#cfe9ff;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      padding:16px;
    }

    .summaryCard{
      border:1px solid var(--border);
      border-radius:16px;
      background:#fff;
      overflow:hidden;
    }

    .summaryTitle{
      margin:0;
      padding:13px 14px;
      font-size:13px;
      font-weight:800;
      color:#0f172a;
      border-bottom:1px solid var(--border);
      background:var(--soft);
      letter-spacing:.01em;
    }

    .miniTableWrap,
    .tableWrapInner{
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }

    th, td{
      padding:11px 12px;
      border-bottom:1px solid #eee;
      text-align:left;
      vertical-align:top;
    }

    th{
      background:#f8fafc;
      font-size:11px;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:800;
      letter-spacing:.06em;
      white-space:nowrap;
    }

    .miniTable{
      min-width:100%;
      width:100%;
    }

    .miniTable th,
    .miniTable td{
      padding:11px 12px;
    }

    .rankCell{
      font-weight:800;
      color:var(--muted);
      width:50px;
    }

    .scoreCell{
      font-weight:800;
    }

    .topicLink{
      color:var(--accent);
      font-weight:800;
    }

    .topicLink:hover{
      text-decoration:underline;
    }

    .rec{
      font-weight:800;
      color:#0f172a;
    }

    .rec.low{color:var(--orange);}
    .rec.mid{color:var(--blue);}
    .rec.high{color:var(--green);}

    .smallBtn{
      padding:8px 12px;
      border:1px solid #d6dbe3;
      border-radius:10px;
      background:#fff;
      cursor:pointer;
      font-weight:700;
      font-size:12px;
      white-space:nowrap;
    }

    .smallBtn:hover{
      background:#f8fafc;
    }

    .empty{
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
      color:var(--muted);
      font-weight:700;
      margin:14px;
      line-height:1.5;
    }

    .desktopTable{
      display:block;
    }

    .mobileCards{
      display:none;
      padding:14px;
      gap:12px;
    }

    .topicCard{
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
      padding:14px;
      box-shadow:0 4px 12px rgba(15,23,42,.04);
    }

    .topicCardHead{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:10px;
    }

    .topicCardTitle{
      font-size:15px;
      font-weight:800;
      color:var(--accent);
      line-height:1.4;
    }

    .topicCardGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px 12px;
      margin-top:10px;
      margin-bottom:12px;
    }

    .metric{
      background:#f8fafc;
      border:1px solid #eef2f7;
      border-radius:12px;
      padding:10px 11px;
    }

    .metricLabel{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:var(--muted);
      font-weight:800;
      margin-bottom:5px;
    }

    .metricValue{
      font-size:14px;
      font-weight:800;
      color:var(--text);
    }

    .cardActions{
      display:flex;
      justify-content:flex-end;
    }

    @media(max-width:900px){
      .grid2{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:760px){
      .wrap{
        padding:14px;
      }

      .sectionHead{
        padding:15px 14px 13px;
      }

      .sectionHead h1{
        font-size:18px;
      }

      .filters{
        padding:12px 14px;
      }

      select{
        width:100%;
        min-width:0;
      }

      .desktopTable{
        display:none;
      }

      .mobileCards{
        display:grid;
      }

      .topbar-inner{
        padding:12px 14px;
      }

      nav.nav{
        gap:8px;
      }

      nav.nav a{
        font-size:12px;
        padding:7px 9px;
      }

      .btnTop{
        padding:8px 10px;
        font-size:12px;
      }
    }

    @media(max-width:520px){
      .topicCardGrid{
        grid-template-columns:1fr;
      }

      .summaryTitle{
        font-size:12px;
      }

      .brand{
        font-size:15px;
      }

      .brand small{
        font-size:12px;
      }
    }
  </style>

  <script>
    if(!localStorage.getItem("token")) location.href="login.html";
  </script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div>Practice Online</div>
      <small>Progress Dashboard</small>
    </div>
    <nav class="nav">
      <a href="learner-quizzes.html">Practice</a>
      <a href="results.html">Results</a>
      <a class="active" href="progress-dashboard.html">Dashboard</a>
      <a href="support.html">Support</a>
      <a href="about.html">About</a>
      <a href="admin-quiz.html" data-admin style="display:none;">Admin</a>
      <button class="btnTop" id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="section">
    <div class="sectionHead">
      <div>
        <h1>Topic Progress</h1>
        <div class="muted" id="subTxt"></div>
      </div>
    </div>

    <div class="filters">
      <select id="yearSelect">
        <option value="">All Years</option>
      </select>
      <select id="monthSelect">
        <option value="">All Months</option>
      </select>
    </div>

    <div class="grid2">
      <div class="summaryCard">
        <h3 class="summaryTitle">Top 5 Topics</h3>
        <div id="topTableWrap" class="miniTableWrap">
          <div class="empty" style="margin:12px;">No data yet.</div>
        </div>
      </div>

      <div class="summaryCard">
        <h3 class="summaryTitle">Topics Needing Attention</h3>
        <div id="bottomTableWrap" class="miniTableWrap">
          <div class="empty" style="margin:12px;">No data yet.</div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="tableWrap">
    <div class="empty">Loading dashboard…</div>
  </section>

</main>

<script src="nav.js"></script>

<script>
  const API = window.API || "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");

  const subTxt = document.getElementById("subTxt");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  const tableWrap = document.getElementById("tableWrap");
  const topTableWrap = document.getElementById("topTableWrap");
  const bottomTableWrap = document.getElementById("bottomTableWrap");

  document.getElementById("logoutBtn").onclick = ()=> {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    localStorage.removeItem("me_cache");
    location.href="login.html";
  };

  let allResults = [];
  let allQuizzes = [];

  let topicTotals = new Map();
  let quizTopicById = new Map();
  let attemptedQuizIdsByTopic = new Map();

  yearSelect.addEventListener("change", renderAll);
  monthSelect.addEventListener("change", renderAll);

  load();

  async function load(){
    try{
      subTxt.textContent = "";

      const meRes = await fetch(`${API}/api/auth/me`,{
        headers:{Authorization:`Bearer ${token}`}
      });

      if(meRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const me = await meRes.json().catch(()=>null);
      if(!meRes.ok || !me){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      try{
        const isAdmin = me.role === "admin";
        document.querySelectorAll("[data-admin]").forEach(a => a.style.display = isAdmin ? "" : "none");
      }catch{}

      const quizzesUrl = (me.role === "admin") ? `${API}/api/quizzes?all=1` : `${API}/api/quizzes`;
      const qRes = await fetch(quizzesUrl,{ headers:{Authorization:`Bearer ${token}`} });

      if(qRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const qData = await qRes.json().catch(()=>[]);
      allQuizzes = Array.isArray(qData) ? qData : [];

      topicTotals = new Map();
      quizTopicById = new Map();

      for(const q of allQuizzes){
        const id = String(q._id || "");
        const t = cleanSpaces(q.topic || "General");
        if (id) quizTopicById.set(id, t);
        topicTotals.set(t, (topicTotals.get(t) || 0) + 1);
      }

      const rRes = await fetch(`${API}/api/results/my`, {
        headers:{Authorization:`Bearer ${token}`}
      });

      if(rRes.status === 401){
        localStorage.removeItem("token");
        location.href="login.html";
        return;
      }

      const rData = await rRes.json().catch(()=>[]);
      allResults = Array.isArray(rData) ? rData : [];

      buildDateFilters(allResults);
      renderAll();

    }catch(e){
      subTxt.textContent = "Network error. Please refresh.";
      tableWrap.innerHTML = `<div class="empty">Could not load dashboard.</div>`;
      topTableWrap.innerHTML = `<div class="empty" style="margin:12px;">Could not load summary.</div>`;
      bottomTableWrap.innerHTML = `<div class="empty" style="margin:12px;">Could not load summary.</div>`;
    }
  }

  function buildDateFilters(data){
    const years = [...new Set((data||[]).map(r=>{
      const d=new Date(r.createdAt);
      return isNaN(d)?null:d.getFullYear();
    }).filter(Boolean))].sort((a,b)=>b-a);

    yearSelect.innerHTML = `<option value="">All Years</option>` +
      years.map(y=>`<option value="${y}">${y}</option>`).join("");

    const months = [...new Set((data||[]).map(r=>{
      const d=new Date(r.createdAt);
      return isNaN(d)?null:(d.getMonth()+1);
    }).filter(Boolean))].sort((a,b)=>a-b);

    monthSelect.innerHTML = `<option value="">All Months</option>` +
      months.map(m=>{
        const name = new Date(2000, m-1, 1).toLocaleString(undefined,{month:"long"});
        return `<option value="${m}">${name}</option>`;
      }).join("");
  }

  function applyDateFilters(data){
    const y = yearSelect.value;
    const m = monthSelect.value;

    return (data || []).filter(r=>{
      const d=new Date(r.createdAt);
      if(y && (isNaN(d) || String(d.getFullYear()) !== String(y))) return false;
      if(m && (isNaN(d) || String(d.getMonth()+1) !== String(m))) return false;
      return true;
    });
  }

  function buildAttemptedQuizSets(results){
    attemptedQuizIdsByTopic = new Map();

    for(const r of (results || [])){
      const quizId = String(r.quizId || "");
      if(!quizId) continue;

      const topic = cleanSpaces(quizTopicById.get(quizId) || r.topic || "General");

      if(!attemptedQuizIdsByTopic.has(topic)) attemptedQuizIdsByTopic.set(topic, new Set());
      attemptedQuizIdsByTopic.get(topic).add(quizId);
    }
  }

  function summarizeByTopic(filteredResults){
    const map = new Map();
    for (const [topic, total] of topicTotals.entries()){
      map.set(topic, {
        topic,
        totalQuizzes: total,
        quizzesAttempted: 0,
        attempts: 0,
        sum: 0,
        best: 0,
        passCount: 0
      });
    }

    for(const r of (filteredResults || [])){
      const quizId = String(r.quizId || "");
      const topic = cleanSpaces(quizTopicById.get(quizId) || r.topic || "General");
      if(!map.has(topic)) continue;

      const percent = Number(r.percent) || 0;
      const pass = percent >= 50;

      const o = map.get(topic);
      o.attempts += 1;
      o.sum += percent;
      o.best = Math.max(o.best, percent);
      if(pass) o.passCount += 1;
    }

    for (const [topic, o] of map.entries()){
      const set = attemptedQuizIdsByTopic.get(topic);
      o.quizzesAttempted = set ? set.size : 0;
    }

    const list = [...map.values()].map(o=>{
      const avg = o.attempts ? Math.round(o.sum / o.attempts) : 0;
      const passRate = o.attempts ? Math.round((o.passCount / o.attempts) * 100) : 0;
      return { ...o, avg, passRate };
    });

    list.sort((a,b)=>a.topic.localeCompare(b.topic));
    return list;
  }

  function recommendation(passRate){
    const p = Number(passRate)||0;
    if(p < 50) return { text:"Practice more", cls:"low" };
    if(p < 75) return { text:"Good progress", cls:"mid" };
    return { text:"Excellent", cls:"high" };
  }

  function renderAll(){
    const filtered = applyDateFilters(allResults);
    buildAttemptedQuizSets(filtered);

    const rows = summarizeByTopic(filtered);

    if (!allQuizzes.length){
      subTxt.textContent = "No assessments found yet.";
    } else if (!allResults.length){
      subTxt.textContent = "No results yet. Attempt some quizzes to see your progress.";
    } else {
      subTxt.textContent = "";
    }

    const attemptedTopics = rows.filter(r => r.attempts > 0);
    const sorted = [...attemptedTopics].sort((a,b)=>b.passRate - a.passRate);

    const top5 = sorted.slice(0,5);
    const bottom5 = [...attemptedTopics].sort((a,b)=>a.passRate - b.passRate).slice(0,5);

    renderSummaryTable(topTableWrap, top5);
    renderSummaryTable(bottomTableWrap, bottom5);
    renderTable(rows);
  }

  function renderSummaryTable(container, rows){
    if(!rows.length){
      container.innerHTML = `<div class="empty" style="margin:12px;">No topic results yet.</div>`;
      return;
    }

    container.innerHTML = `
      <table class="miniTable">
        <thead>
          <tr>
            <th style="width:60px;">Rank</th>
            <th>Topic</th>
            <th>Average</th>
            <th>Best</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r, i) => `
            <tr>
              <td class="rankCell">${i + 1}</td>
              <td>${escapeHtml(r.topic)}</td>
              <td class="scoreCell">${r.avg}%</td>
              <td>${Math.round(r.best)}%</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function renderTable(rows){
    if(!rows.length){
      tableWrap.innerHTML = `<div class="empty">No topic progress yet.</div>`;
      return;
    }

    tableWrap.innerHTML = `
      <div class="desktopTable">
        <div class="tableWrapInner">
          <table>
            <thead>
              <tr>
                <th>Topic</th>
                <th>Total Quizzes</th>
                <th>Quizzes Attempted</th>
                <th>Average</th>
                <th>Best</th>
                <th>Recommendation</th>
                <th>Open</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r=>{
                const rec = recommendation(r.passRate);
                const topicUrl = `learner-quizzes.html?search=${encodeURIComponent(r.topic)}`;
                return `
                  <tr>
                    <td><a class="topicLink" href="${topicUrl}">${escapeHtml(r.topic)}</a></td>
                    <td>${Number(r.totalQuizzes||0)}</td>
                    <td>${Number(r.quizzesAttempted||0)}</td>
                    <td>${r.avg}%</td>
                    <td>${Math.round(r.best)}%</td>
                    <td class="rec ${rec.cls}">${escapeHtml(rec.text)}</td>
                    <td><button class="smallBtn" type="button" onclick="location.href='${topicUrl}'">View quizzes</button></td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>

      <div class="mobileCards">
        ${rows.map(r=>{
          const rec = recommendation(r.passRate);
          const topicUrl = `learner-quizzes.html?search=${encodeURIComponent(r.topic)}`;
          return `
            <div class="topicCard">
              <div class="topicCardHead">
                <a class="topicCardTitle" href="${topicUrl}">${escapeHtml(r.topic)}</a>
              </div>

              <div class="topicCardGrid">
                <div class="metric">
                  <div class="metricLabel">Total Quizzes</div>
                  <div class="metricValue">${Number(r.totalQuizzes||0)}</div>
                </div>
                <div class="metric">
                  <div class="metricLabel">Quizzes Attempted</div>
                  <div class="metricValue">${Number(r.quizzesAttempted||0)}</div>
                </div>
                <div class="metric">
                  <div class="metricLabel">Average</div>
                  <div class="metricValue">${r.avg}%</div>
                </div>
                <div class="metric">
                  <div class="metricLabel">Best</div>
                  <div class="metricValue">${Math.round(r.best)}%</div>
                </div>
                <div class="metric" style="grid-column:1/-1;">
                  <div class="metricLabel">Recommendation</div>
                  <div class="metricValue rec ${rec.cls}">${escapeHtml(rec.text)}</div>
                </div>
              </div>

              <div class="cardActions">
                <button class="smallBtn" type="button" onclick="location.href='${topicUrl}'">View quizzes</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  function cleanSpaces(s){
    return String(s||"").trim().replace(/\s+/g," ");
  }

  function escapeHtml(str){
    return String(str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>

</body>
</html>
