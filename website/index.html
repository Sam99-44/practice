<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Practice Online | Learn Smarter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SEO -->
  <meta name="description" content="Practice Online helps Grade 8–12 learners prepare smarter with quizzes, results, and study materials." />

  <style>
    :root{
      --blue:#1b1648;
      --red:#e11d2e;
      --white:#ffffff;
      --muted:#cbd5f5;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Inter", Arial, sans-serif;
      background:var(--blue);
      color:var(--white);
    }

    /* ---------- TOP NAV ---------- */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 40px;
    }

    .logo{
      font-size:20px;
      font-weight:800;
      letter-spacing:.5px;
    }

    .nav-links{
      display:flex;
      gap:24px;
      align-items:center;
    }

    .nav-links a{
      color:var(--white);
      text-decoration:none;
      font-weight:600;
      position:relative;
    }

    .nav-links a.tab::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-6px;
      width:100%;
      height:3px;
      background:var(--red);
    }

    .login-btn{
      padding:8px 16px;
      border:2px solid var(--red);
      border-radius:6px;
      color:var(--white);
      text-decoration:none;
      font-weight:700;
    }

    /* ---------- HERO ---------- */
    .hero{
      display:grid;
      grid-template-columns:1.2fr 1fr;
      gap:40px;
      padding:80px 40px;
      align-items:center;
    }

    .hero h1{
      font-size:48px;
      line-height:1.1;
      margin:0 0 12px;
    }

    .hero p{
      font-size:18px;
      color:var(--muted);
      margin-bottom:24px;
    }

    .cta{
      display:inline-block;
      color:var(--white);
      font-weight:700;
      text-decoration:none;
      border-bottom:3px solid var(--red);
      padding-bottom:4px;
    }

    /* ---------- SEARCH ---------- */
    .search-box{
      display:flex;
      background:var(--white);
      border-radius:6px;
      overflow:hidden;
    }

    .search-box input{
      flex:1;
      padding:18px;
      border:none;
      font-size:16px;
      outline:none;
    }

    .search-box button{
      background:var(--red);
      border:none;
      color:#fff;
      padding:0 26px;
      font-size:18px;
      cursor:pointer;
    }

    .search-tabs{
      display:flex;
      gap:22px;
      margin-top:14px;
      font-weight:600;
    }

    .search-tabs span{
      border-bottom:3px solid var(--red);
      padding-bottom:4px;
    }

    /* ---------- RESPONSIVE ---------- */
    @media(max-width:900px){
      .hero{grid-template-columns:1fr}
      .hero h1{font-size:36px}
    }
  </style>
</head>

<body>

  <!-- TOP NAV -->
  <div class="topbar">
    <div class="logo">PRACTICE ONLINE</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="register.html" class="tab">Register</a>
      <a href="login.html" class="login-btn">Login</a>
    </div>
  </div>

  <!-- HERO SECTION -->
  <section class="hero">
    <div>
      <h1>Join the smart way to learn</h1>
      <p>Practice Online helps Grade 8–12 learners prepare better with quizzes, instant results, and study tools.</p>
      <a href="register.html" class="cta">Find out more</a>
    </div>

    <div>
      <div class="search-box">
        <input placeholder="Search for quizzes or subjects" />
        <button>🔍</button>
      </div>

      <div class="search-tabs">
        <span>Grade 8–9</span>
        <span>Grade 10–12</span>
        <span>Revision</span>
      </div>
    </div>
  </section>

</body>
</html>
