<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forgot Password | Practice Online</title>

<style>
:root{
  --nav:#1b1648;
  --bg:#f3f5f9;
  --card:#ffffff;
  --border:#d9dee7;
  --text:#0f172a;
  --muted:#475569;
  --accent:#0b3c5d;
  --red:#e11d2e;
  --shadow:0 8px 22px rgba(0,0,0,.06);
  --radius:18px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

button,input{
  font-family:Arial, Helvetica, sans-serif;
}

/* TOP BAR */
.topbar{
  background:var(--nav);
  color:#fff;
}

.topbar-inner{
  max-width:1200px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brandWrap{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.brandIcon{
  width:34px;
  height:34px;
  display:block;
  filter:brightness(0) invert(1) contrast(180%);
}

.brandText{
  line-height:1.1;
}

.brandTitle{
  font-size:14px;
  font-weight:700;
  color:#fff;
}

.brandSub{
  font-size:13px;
  font-weight:700;
  color:#fff;
}

.topLinks{
  display:flex;
  align-items:center;
  gap:16px;
}

.topLinks a{
  color:#fff;
  font-size:14px;
  font-weight:700;
}

/* PAGE */
.wrap{
  min-height:calc(100vh - 62px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:84px 16px 24px;
}

.card{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}

h1{
  margin:0;
  font-size:22px;
  font-weight:700;
  color:#0b1736;
}

.subtext{
  margin:14px 0 22px;
  font-size:14px;
  line-height:1.45;
  color:#48607d;
  font-weight:400;
}

.input{
  width:100%;
  height:42px;
  border:1px solid #d6d6d6;
  border-radius:14px;
  padding:0 14px;
  font-size:14px;
  color:#0f172a;
  outline:none;
  background:#fff;
}

.input:focus{
  border-color:#bfc9d9;
  box-shadow:0 0 0 3px rgba(11,60,93,.08);
}

.btn{
  width:100%;
  margin-top:14px;
  height:38px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.links{
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.links a{
  color:#0b1736;
  font-size:14px;
  font-weight:700;
}

.msg{
  margin:12px 0 0;
  font-size:14px;
  font-weight:400;
}

.msg.ok{color:#065f46}
.msg.error{color:#b91c1c}

@media (max-width:640px){
  .topbar-inner{
    padding:12px 14px;
  }

  .wrap{
    padding-top:40px;
  }

  .card{
    max-width:100%;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brandWrap">
      <img
        class="brandIcon"
        src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg"
        alt="Practice Online"
      >
      <div class="brandText">
        <div class="brandTitle">Practice Online</div>
        <div class="brandSub">Reset password</div>
      </div>
    </div>

    <div class="topLinks">
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h1>Forgot Password</h1>
    <p class="subtext">Enter your email to receive a reset link.</p>

    <input id="email" class="input" type="email" placeholder="Email" autocomplete="email">

    <button id="sendBtn" class="btn" type="button" onclick="send()">Send Reset Link</button>

    <div class="links">
      <a href="login.html">Back to login</a>
      <a href="register.html">Create account</a>
    </div>

    <p id="msg" class="msg"></p>
  </div>
</main>

<script>
const API = "https://practice-backend-msgn.onrender.com";

async function send(){
  const emailEl = document.getElementById("email");
  const msgEl = document.getElementById("msg");
  const btn = document.getElementById("sendBtn");

  const email = String(emailEl.value || "").trim();

  if(!email){
    msgEl.className = "msg error";
    msgEl.textContent = "Please enter your email.";
    return;
  }

  try{
    btn.disabled = true;
    msgEl.className = "msg";
    msgEl.textContent = "Sending reset link...";

    const r = await fetch(API + "/api/forgot-password", {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({ email })
    });

    const d = await r.json().catch(() => ({}));

    if(!r.ok){
      msgEl.className = "msg error";
      msgEl.textContent = d.message || "Could not send reset link.";
      btn.disabled = false;
      return;
    }

    msgEl.className = "msg ok";
    msgEl.textContent = d.message || "Reset link sent successfully.";
    btn.disabled = false;
  }catch(err){
    msgEl.className = "msg error";
    msgEl.textContent = "Network error. Please try again.";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
