<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{max-width:1000px; margin:0 auto; padding:24px;}

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
      flex-wrap:wrap;
      gap:12px;
    }
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{
      width:38px; height:38px; border-radius:10px;
      background:var(--accent); color:white;
      display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:16px;
    }
    .brand span{display:block; font-size:13px; color:var(--muted);}

    .nav{display:flex; align-items:center; gap:14px;}
    .nav a{
      text-decoration:none;
      font-size:14px;
      color:var(--text);
      padding:6px 8px;
      border-radius:8px;
      transition:background 0.2s;
    }
    .nav a:hover{ background:var(--accent-soft); }
    .nav a.active{ font-weight:600; color:var(--accent); }
    .nav .nav-btn{
      background:var(--accent);
      color:white;
      padding:8px 12px;
      border-radius:10px;
    }
    .nav .logout{
      background:var(--accent);
      color:white;
      border:none;
      padding:8px 12px;
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
    }

    .menu-btn{
      display:none;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
    }
    .mobile-menu{
      display:none;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:10px;
      margin-bottom:16px;
    }
    .mobile-menu a,
    .mobile-menu button{
      width:100%;
      display:block;
      text-align:left;
      padding:10px 12px;
      border-radius:10px;
      border:none;
      background:transparent;
      color:var(--text);
      text-decoration:none;
      cursor:pointer;
      font-size:14px;
    }
    .mobile-menu a:hover,
    .mobile-menu button:hover{ background:var(--accent-soft); }
    .mobile-menu a.active{ font-weight:600; color:var(--accent); }
    .mobile-menu .logout{
      background:var(--accent);
      color:white;
    }
    @media (max-width: 720px){
      .nav{ display:none; }
      .menu-btn{ display:inline-flex; }
      .mobile-menu.open{ display:block; }
    }

    .center{
      display:grid;
      place-items:center;
      margin-top:22px;
    }
    .card{
      width:100%;
      max-width:480px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
    }
    h1{margin:0 0 8px 0; font-size:22px;}
    .sub{margin:0 0 16px 0; color:var(--muted); line-height:1.6; font-size:14px;}
    label{display:block; margin-top:10px; font-size:14px;}
    input{
      width:100%;
      padding:10px;
      margin-top:6px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
      font-size:14px;
    }
    .btn{
      width:100%;
      margin-top:14px;
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:10px;
      padding:10px 12px;
      cursor:pointer;
      font-size:14px;
      font-weight:600;
    }
    .btn:disabled{opacity:.7; cursor:not-allowed;}
    .msg{margin-top:10px; font-size:14px;}
    .msg.error{color:var(--error);}
    .msg.ok{color:var(--ok);}
    .links{
      margin-top:12px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      font-size:14px;
    }
    .links a{color:var(--accent); text-decoration:none;}
    .links a:hover{text-decoration:underline;}
    footer{
      margin-top:24px;
      text-align:center;
      font-size:13px;
      color:#64748b;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <span>Grades 8–12 Mathematics</span>
      </div>
    </div>
    <nav class="nav">
      <a href="about.html">About</a>
      <a href="login.html" class="active" data-guest>Login</a>
      <a href="register.html" class="nav-btn" data-guest>Register</a>
      <a href="learner-quizzes.html" data-auth>Practice</a>
      <a href="admin-quiz.html" data-admin>Admin</a>
      <button class="logout" id="logoutBtn" data-auth>Logout</button>
    </nav>
    <button class="menu-btn" id="menuBtn">Menu</button>
  </div>

  <div class="center">
    <div class="card">
      <h1>Login</h1>
      <p class="sub">Enter your username and password to continue.</p>
      <label>Username</label>
      <input id="username" />
      <label>Password</label>
      <input id="password" type="password" />
      <button class="btn" id="loginBtn">Login</button>
      <p class="msg" id="msg"></p>
      <div class="links">
        <a href="register.html">Create an account</a>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </div>
  </div>

  <footer>© <span id="year"></span> Practice Online</footer>
</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const API = "https://practice-backend-msgn.onrender.com";

const msg = document.getElementById("msg");
const loginBtn = document.getElementById("loginBtn");

function setMsg(text, type=""){
  msg.className = "msg " + type;
  msg.textContent = text;
}

async function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !password) {
    setMsg("Please enter username and password.", "error");
    return;
  }

  loginBtn.disabled = true;
  setMsg("Logging in...");

  const res = await fetch(`${API}/api/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json().catch(()=> ({}));

  if(res.ok && data.token){
    localStorage.setItem("token", data.token);
    localStorage.setItem("username", data.username || username);
    window.location.href = "learner-quizzes.html";
  } else {
    setMsg(data.message || "Login failed.", "error");
    loginBtn.disabled = false;
  }
}

loginBtn.addEventListener("click", login);
document.getElementById("password").addEventListener("keydown", e => {
  if(e.key === "Enter") login();
});
</script>
</body>
</html>
