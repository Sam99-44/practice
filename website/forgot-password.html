<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password | Practice Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#0f172a}
    .card{max-width:420px;margin:40px auto;background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:20px}
    label{display:block;margin-top:12px;font-weight:600}
    input{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
    .btn{margin-top:14px;background:#0b3c5d;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;width:100%}
    .msg{margin-top:12px;white-space:pre-wrap;font-size:14px}
    .error{color:#b91c1c}
    .ok{color:#065f46}
    a{color:#0b3c5d}
  </style>
</head>
<body>
<div class="card">
  <h2>Forgot Password</h2>
  <p>Enter your email. We will send a reset link.</p>

  <label>Email</label>
  <input id="email" type="email" placeholder="you@email.com" />

  <button id="sendBtn" class="btn" type="button">Send Reset Link</button>
  <p id="msg" class="msg"></p>

  <p><a href="login.html">Back to Login</a></p>
</div>

<script>
  const API_BASE = "https://practice-backend-msgn.onrender.com";
  const URL = API_BASE + "/api/forgot-password";

  const btn = document.getElementById("sendBtn");
  const msg = document.getElementById("msg");

  function setMsg(text, type="") {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  async function safeJson(res) {
    try { return await res.json(); } catch { return {}; }
  }

  btn.onclick = async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) return setMsg("Email is required.", "error");

    btn.disabled = true;
    setMsg("Sending reset link...");

    try {
      const res = await fetch(URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });

      const data = await safeJson(res);
      setMsg(data.message || "If the email exists, a reset link has been sent ✅", "ok");
    } catch (e) {
      setMsg("Network error.", "error");
      btn.disabled = false;
    }
  };

  setMsg("Ready ✅", "ok");
</script>
</body>
</html>
