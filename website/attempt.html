<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Attempt Quiz | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
      --warn:#b45309;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--text);}
    .wrap{max-width:1000px; margin:0 auto; padding:24px;}
    .error{color:var(--error);}
    .ok{color:var(--ok);}
    .muted{color:var(--muted);}
    .hidden{display:none;}

    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{width:38px; height:38px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700;}

    .nav{display:flex; gap:12px; align-items:center;}
    .nav a,.nav button{
      text-decoration:none;
      font-size:14px;
      padding:8px 12px;
      border-radius:10px;
      border:none;
      cursor:pointer;
    }
    .nav a{color:var(--text);}
    .nav .nav-btn{background:var(--accent); color:#fff;}
    .nav .logout{background:var(--accent); color:#fff;}

    .card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
    h1{margin:0 0 6px 0;}

    .metaRow{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
    .timerBox{
      border:1px solid #dbeafe;
      background:#eff6ff;
      color:#1e3a8a;
      padding:8px 12px;
      border-radius:999px;
      font-weight:800;
      font-size:14px;
      white-space:nowrap;
    }
    .timerBox.warn{
      border-color:#fed7aa;
      background:#fff7ed;
      color:var(--warn);
    }

    .q{margin-top:16px; padding-top:16px; border-top:1px solid #eee;}
    .opt{display:block; padding:10px; border:1px solid #ddd; border-radius:10px; margin-bottom:8px; cursor:pointer;}

    .btn{background:var(--accent); color:#fff; padding:10px 14px; border:none; border-radius:10px; cursor:pointer;}
    .btn:disabled{opacity:.6; cursor:not-allowed;}
    .btn2{background:#fff; border:1px solid #ddd; padding:10px 14px; border-radius:10px; cursor:pointer;}

    .lockBox{border:1px dashed #ddd; background:#fafafa; padding:14px; border-radius:12px; margin-top:10px;}
  </style>

  <script>
    if (!localStorage.getItem("token")) {
      window.location.href = "login.html";
    }
  </script>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">PO</div>
      <div>
        <strong>Practice Online</strong>
        <span class="muted" id="welcomeSub">Attempt Quiz</span>
      </div>
    </div>

    <nav class="nav">
      <a href="learner-quizzes.html" class="nav-btn">Back</a>
      <a href="results.html">Results</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </nav>
  </div>

  <div class="card">
    <div class="metaRow">
      <div>
        <h1 id="quizTitle">Loading…</h1>
        <p class="muted" id="quizInfo" style="margin:6px 0 0 0;"></p>
      </div>

      <div id="timerBox" class="timerBox hidden">Time: 00:00</div>
    </div>

    <div id="lockNotice" class="lockBox hidden">
      <b class="error">This quiz is locked.</b>
      <div class="muted">You already attempted this quiz.</div>
    </div>

    <div id="questions"></div>

    <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="submitBtn">Submit</button>
      <button class="btn2" id="viewResultsBtn" disabled>View Results</button>
    </div>

    <p id="msg"></p>
  </div>
</div>

<script>
  const API = "https://practice-backend-msgn.onrender.com";
  const token = localStorage.getItem("token");
  const quizId = new URLSearchParams(window.location.search).get("quizId");

  const quizTitle = document.getElementById("quizTitle");
  const quizInfo = document.getElementById("quizInfo");
  const questionsDiv = document.getElementById("questions");
  const submitBtn = document.getElementById("submitBtn");
  const viewResultsBtn = document.getElementById("viewResultsBtn");
  const msgEl = document.getElementById("msg");
  const lockNotice = document.getElementById("lockNotice");

  // Timer
  const timerBox = document.getElementById("timerBox");
  let timerInterval = null;
  let quizEndAtMs = null;
  let quizData = null;
  let submitted = false;

  // Refresh-safe end-time key per quiz
  const END_KEY = `quiz_end_${quizId}`;

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    window.location.href = "login.html";
  };

  if (!quizId) {
    quizTitle.textContent = "Quiz not found";
    submitBtn.disabled = true;
  } else {
    loadQuiz();
  }

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  async function loadQuiz() {
    const res = await fetch(`${API}/api/quizzes/${quizId}`, {
      headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) {
      quizTitle.textContent = "Quiz not found";
      submitBtn.disabled = true;
      return;
    }

    quizData = await res.json();

    quizTitle.textContent = cleanSpaces(quizData.title || "Quiz");

    const mins = Number(quizData.timeLimitMinutes || 0);
    const timeStr = mins > 0 ? ` • Time ${mins} min` : "";
    quizInfo.textContent = `Grade ${quizData.grade ?? "-"} • ${cleanSpaces(quizData.topic || "General")}${timeStr}`;

    questionsDiv.innerHTML = (quizData.questions || []).map((q, i) => `
      <div class="q">
        <b>${i + 1}. ${cleanSpaces(q.text)}</b>
        ${(q.options || []).map((o, j) => `
          <label class="opt">
            <input type="radio" name="q${i}" value="${j}"> ${cleanSpaces(o)}
          </label>
        `).join("")}
      </div>
    `).join("");

    startTimerWithQuiz(quizData);
    submitBtn.onclick = () => submitQuiz("manual");
  }

  // fallback: 1 min per question (min 5, max 30)
  function calcFallbackSeconds(totalQuestions){
    const raw = totalQuestions * 60;
    return Math.max(5 * 60, Math.min(raw, 30 * 60));
  }

  function startTimerWithQuiz(quiz){
    const now = Date.now();
    const savedEnd = Number(localStorage.getItem(END_KEY));

    if (savedEnd && savedEnd > now) {
      quizEndAtMs = savedEnd;
    } else {
      const mins = Number(quiz.timeLimitMinutes || 0);
      const totalQuestions = (quiz.questions || []).length;

      let secs;
      if (Number.isFinite(mins) && mins > 0) secs = mins * 60;
      else secs = calcFallbackSeconds(totalQuestions);

      quizEndAtMs = now + secs * 1000;
      localStorage.setItem(END_KEY, String(quizEndAtMs));
    }

    timerBox.classList.remove("hidden");
    tickTimer();
    clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 1000);
  }

  function tickTimer(){
    if (!quizEndAtMs || submitted) return;

    const remainingMs = quizEndAtMs - Date.now();

    if (remainingMs <= 0) {
      timerBox.textContent = "Time: 00:00";
      timerBox.classList.add("warn");
      clearInterval(timerInterval);
      timerInterval = null;

      msgEl.className = "error";
      msgEl.textContent = "⏱️ Time is up! Submitting your answers…";
      submitQuiz("auto");
      return;
    }

    const remainingSec = Math.ceil(remainingMs / 1000);
    const mm = String(Math.floor(remainingSec / 60)).padStart(2, "0");
    const ss = String(remainingSec % 60).padStart(2, "0");
    timerBox.textContent = `Time: ${mm}:${ss}`;

    if (remainingSec <= 60) timerBox.classList.add("warn");
  }

  function getTimeTakenSeconds(){
    // timeLimitMinutes (if set) -> compute from end time
    const mins = Number(quizData?.timeLimitMinutes || 0);
    const totalQuestions = (quizData?.questions || []).length;
    const totalSec = (Number.isFinite(mins) && mins > 0)
      ? mins * 60
      : calcFallbackSeconds(totalQuestions);

    const now = Date.now();
    const remainingSec = quizEndAtMs ? Math.max(0, Math.ceil((quizEndAtMs - now) / 1000)) : 0;
    const taken = totalSec - remainingSec;
    return Math.max(0, taken);
  }

  function buildAnswersPayload(){
    // Only store answered questions
    const answers = [];
    (quizData.questions || []).forEach((q, i) => {
      const chosen = document.querySelector(`input[name="q${i}"]:checked`);
      if (chosen) {
        answers.push({
          questionIndex: i,
          chosenIndex: Number(chosen.value)
        });
      }
    });
    return answers;
  }

  async function submitQuiz(mode){
    if (!quizData || submitted) return;

    const total = (quizData.questions || []).length;
    let score = 0;
    let answered = 0;

    quizData.questions.forEach((q, i) => {
      const chosen = document.querySelector(`input[name="q${i}"]:checked`);
      if (chosen) answered++;
      if (chosen && Number(chosen.value) === q.correctIndex) score++;
    });

    if (mode === "manual" && answered < total) {
      msgEl.className = "error";
      msgEl.textContent = `Please answer all questions (${answered}/${total}) before submitting.`;
      return;
    }

    submitted = true;
    submitBtn.disabled = true;

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;

    const timeTakenSeconds = getTimeTakenSeconds();
    localStorage.removeItem(END_KEY);

    const payload = {
      quizId,
      score,
      total,
      answers: buildAnswersPayload(),
      timeTakenSeconds
    };

    const res = await fetch(`${API}/api/results`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify(payload)
    });

    if (res.status === 409) {
      lockNotice.classList.remove("hidden");
      msgEl.className = "error";
      msgEl.textContent = "You already attempted this quiz.";
      return;
    }

    if (!res.ok) {
      msgEl.className = "error";
      msgEl.textContent = "Could not save attempt. Please try again.";
      return;
    }

    const percent = Math.round((score / total) * 100);
    msgEl.className = "ok";
    msgEl.textContent = `✅ Submitted! Score: ${score}/${total} (${percent}%). Time taken: ${timeTakenSeconds}s`;

    viewResultsBtn.disabled = false;
    viewResultsBtn.onclick = () => window.location.href = "results.html";

    document.querySelectorAll("input[type=radio]").forEach(el => el.disabled = true);
  }
</script>
</body>
</html>
