<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Practice Online</title>

  <style>
    :root{
      --nav:#1b1648;
      --red:#e11d2e;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#d9dee7;
      --text:#0f172a;
      --muted:#475569;
      --ok:#065f46;
      --error:#b91c1c;
      --radius:14px;
      --shadow:0 8px 22px rgba(0,0,0,.06);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .topbar{
      background:var(--nav);
      color:#fff;
      padding:16px 20px;
      font-weight:700;
      font-size:18px;
    }

    .wrap{
      max-width:720px;
      margin:30px auto;
      padding:0 16px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px;
    }

    h1{
      margin:0 0 8px;
      font-size:24px;
    }

    .sub{
      margin:0 0 18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    form{
      display:grid;
      gap:14px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:6px;
    }

    input, select{
      width:100%;
      padding:12px 13px;
      border:1px solid var(--border);
      border-radius:12px;
      font-size:14px;
      outline:none;
      background:#fff;
    }

    input:focus, select:focus{
      border-color:var(--nav);
    }

    .hint{
      color:var(--muted);
      font-size:12px;
      margin-top:5px;
      line-height:1.4;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:4px;
    }

    button{
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{
      background:var(--nav);
      color:#fff;
    }

    .btn-primary:disabled{
      opacity:.7;
      cursor:not-allowed;
    }

    .btn-link{
      background:#eef2ff;
      color:var(--nav);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:12px 16px;
      border-radius:12px;
      font-weight:700;
      font-size:14px;
    }

    .message{
      display:none;
      padding:12px 14px;
      border-radius:12px;
      font-size:14px;
      line-height:1.5;
    }

    .message.show{display:block}
    .message.ok{
      background:#ecfdf5;
      color:var(--ok);
      border:1px solid #bbf7d0;
    }
    .message.error{
      background:#fef2f2;
      color:var(--error);
      border:1px solid #fecaca;
    }

    .hidden{display:none !important}

    @media (max-width:700px){
      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">Practice Online</div>

  <div class="wrap">
    <div class="card">
      <h1>Create account</h1>
      <p class="sub">
        Register your account below. Student accounts require a grade. Materials accounts do not require a grade.
      </p>

      <div id="msg" class="message"></div>

      <form id="registerForm">
        <div class="grid">
          <div>
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" required />
          </div>

          <div>
            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname" required />
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>

          <div>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required />
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="accountType">Account type</label>
            <select id="accountType" name="accountType" required>
              <option value="">Select account type</option>
              <option value="student">Student</option>
              <option value="materials">Materials</option>
            </select>
          </div>

          <div id="gradeWrap">
            <label for="grade">Grade</label>
            <select id="grade" name="grade">
              <option value="">Select grade</option>
              <option value="8">Grade 8</option>
              <option value="9">Grade 9</option>
              <option value="10">Grade 10</option>
              <option value="11">Grade 11</option>
              <option value="12">Grade 12</option>
            </select>
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="schoolName">School name</label>
            <input type="text" id="schoolName" name="schoolName" />
          </div>

          <div>
            <label for="currentMarkRange">Current mark range</label>
            <select id="currentMarkRange" name="currentMarkRange">
              <option value="">Select mark range</option>
              <option value="0-29">0-29</option>
              <option value="30-39">30-39</option>
              <option value="40-49">40-49</option>
              <option value="50-59">50-59</option>
              <option value="60-69">60-69</option>
              <option value="70-79">70-79</option>
              <option value="80-100">80-100</option>
            </select>
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="cellphone">Cellphone</label>
            <input type="text" id="cellphone" name="cellphone" />
          </div>

          <div>
            <label for="guardianCellphone">Guardian cellphone</label>
            <input type="text" id="guardianCellphone" name="guardianCellphone" />
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="province">Province</label>
            <input type="text" id="province" name="province" />
          </div>

          <div>
            <label for="district">District</label>
            <input type="text" id="district" name="district" />
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">Select gender</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="nonbinary">Nonbinary</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div>
            <label for="profileHeadline">Profile headline</label>
            <input type="text" id="profileHeadline" name="profileHeadline" placeholder="Optional" />
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="passwordHash">Password</label>
            <input type="password" id="passwordHash" name="passwordHash" required minlength="6" />
            <div class="hint">This field is sent as <strong>passwordHash</strong>.</div>
          </div>

          <div>
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" />
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn" class="btn-primary">Create account</button>
          <a class="btn-link" href="login.html">Go to login</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";

    const form = document.getElementById("registerForm");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submitBtn");
    const accountType = document.getElementById("accountType");
    const gradeWrap = document.getElementById("gradeWrap");
    const gradeInput = document.getElementById("grade");

    function showMessage(text, type) {
      msg.className = "message show " + type;
      msg.textContent = text;
    }

    function clearMessage() {
      msg.className = "message";
      msg.textContent = "";
    }

    function toggleGrade() {
      const val = accountType.value;
      if (val === "student") {
        gradeWrap.classList.remove("hidden");
        gradeInput.required = true;
      } else {
        gradeWrap.classList.add("hidden");
        gradeInput.required = false;
        gradeInput.value = "";
      }
    }

    accountType.addEventListener("change", toggleGrade);
    toggleGrade();

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      clearMessage();

      const firstName = document.getElementById("firstName").value.trim();
      const surname = document.getElementById("surname").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const accountTypeValue = document.getElementById("accountType").value;
      const gradeValue = document.getElementById("grade").value;
      const schoolName = document.getElementById("schoolName").value.trim();
      const currentMarkRange = document.getElementById("currentMarkRange").value;
      const cellphone = document.getElementById("cellphone").value.trim();
      const guardianCellphone = document.getElementById("guardianCellphone").value.trim();
      const province = document.getElementById("province").value.trim();
      const district = document.getElementById("district").value.trim();
      const gender = document.getElementById("gender").value;
      const profileHeadline = document.getElementById("profileHeadline").value.trim();
      const passwordHash = document.getElementById("passwordHash").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!firstName || !surname || !username || !email || !accountTypeValue || !passwordHash || !confirmPassword) {
        showMessage("Please fill in all required fields.", "error");
        return;
      }

      if (accountTypeValue === "student" && !gradeValue) {
        showMessage("Please select a grade for a student account.", "error");
        return;
      }

      if (passwordHash !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      try {
        const payload = {
          firstName,
          surname,
          fullName: (firstName + " " + surname).trim(),
          username,
          email,
          accountType: accountTypeValue,
          schoolName,
          currentMarkRange,
          cellphone,
          guardianCellphone,
          province,
          district,
          gender,
          profileHeadline,
          passwordHash
        };

        if (accountTypeValue === "student") {
          payload.grade = Number(gradeValue);
        }

        const res = await fetch(`${API}/api/auth/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showMessage(data.message || "Registration failed.", "error");
          return;
        }

        showMessage(
          data.message || "Registration successful. Please check your email if verification is required.",
          "ok"
        );

        form.reset();
        toggleGrade();
      } catch (err) {
        showMessage("Unable to register right now. Please try again.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
