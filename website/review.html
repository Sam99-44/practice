<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Review Attempt | Practice Online</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    :root{
      --nav:#1b1648;
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;

      --greenBg:#ecfdf5;
      --greenBd:#bbf7d0;

      --redBg:#fff1f2;
      --redBd:#fecaca;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      background:var(--nav);
      color:#fff;
      padding:14px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    header a{
      color:#fff;
      text-decoration:none;
      font-weight:800;
    }

    .wrap{
      max-width:1000px;
      margin:20px auto;
      padding:0 16px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      padding:18px;
    }

    .metaRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      background:#eef7ff;
      border:1px solid #cfe9ff;
      color:var(--accent);
      white-space:nowrap;
    }

    .pill.marks{
      background:#f8fafc;
      border-color:#e5e7eb;
      color:#334155;
    }

    .topLine{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin:14px 0 8px;
    }

    .counter{
      font-weight:900;
      color:#334155;
    }

    .jump{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .jump label{
      font-size:12px;
      font-weight:900;
      color:var(--muted);
    }
    select{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      background:#fff;
      min-width:240px;
      font-size:14px;
      outline:none;
      font-weight:800;
    }

    .qBox{
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px;
      background:#fff;
    }

    .qTitle{
      font-weight:900;
      margin:0 0 10px 0;
      font-size:16px;
      line-height:1.35;
      word-break:break-word;
    }

    .hint{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background:#e7eef5;
      border:1px solid #cfe9ff;
      color:#0b3c5d;
      font-size:13px;
      font-weight:700;
    }

    .noteBlock{
      padding:14px;
      border:1px solid #e6e6e6;
      border-radius:12px;
      background:#f8fafc;
      font-weight:800;
      line-height:1.4;
      word-break:break-word;
    }

    .opt{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      margin-bottom:8px;
      background:#fff;
      font-weight:700;
      line-height:1.35;
      word-break:break-word;
    }
    .opt.correct{ background:var(--greenBg); border-color:var(--greenBd); }
    .opt.wrong{ background:var(--redBg); border-color:var(--redBd); }

    .answerGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }

    .answerCard{
      padding:12px;
      border-radius:12px;
      border:1px solid #e6e6e6;
      font-weight:800;
      word-break:break-word;
      background:#fff;
    }

    .answerCard.good{ background:var(--greenBg); border-color:var(--greenBd); }
    .answerCard.bad{ background:var(--redBg); border-color:var(--redBd); }

    .resultInfo{
      margin-top:12px;
      font-weight:900;
    }

    .navBtns{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid #ddd;
      background:#fff;
      cursor:pointer;
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
    }
    button:hover{background:#f8fafc}
    button:disabled{opacity:.6; cursor:not-allowed;}

    .errorBox{
      margin-top:12px;
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
      color:#334155;
      font-weight:800;
      display:none;
    }

    @media (max-width:700px){
      .answerGrid{grid-template-columns:1fr;}
      select{min-width:100%;}
    }
  </style>

  <script>
    const t = localStorage.getItem("token");
    if (!t) window.location.href = "login.html";
  </script>
</head>

<body>

<header>
  <a href="results.html">Back to Results</a>
  <button id="logoutBtn" type="button">Logout</button>
</header>

<div class="wrap">
  <div class="card">

    <h2 id="title" style="margin:0;">Loading…</h2>
    <div class="metaRow" id="meta"></div>

    <div class="topLine">
      <div class="counter" id="counter"></div>

      <div class="jump">
        <label for="jumpSelect">Jump</label>
        <select id="jumpSelect"></select>
      </div>
    </div>

    <div class="qBox">
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
        <span class="pill marks" id="qMarksPill" style="display:none;">Marks: -</span>
      </div>

      <h3 class="qTitle" id="qText"></h3>

      <div id="hint" class="hint" style="display:none;"></div>
      <div id="body"></div>
      <div class="resultInfo" id="resultInfo"></div>

      <div class="navBtns">
        <button id="prevBtn" type="button">Previous</button>
        <button id="nextBtn" type="button">Next</button>
      </div>

      <div id="err" class="errorBox"></div>
    </div>

  </div>
</div>

<script>
  const API = window.API || "https://api.practiceonline.co.za";
  const token = localStorage.getItem("token");
  const resultId = new URLSearchParams(window.location.search).get("resultId");

  const titleEl = document.getElementById("title");
  const metaEl = document.getElementById("meta");
  const counterEl = document.getElementById("counter");
  const qTextEl = document.getElementById("qText");
  const hintEl = document.getElementById("hint");
  const bodyEl = document.getElementById("body");
  const resultInfoEl = document.getElementById("resultInfo");
  const errEl = document.getElementById("err");
  const jumpSelect = document.getElementById("jumpSelect");
  const qMarksPill = document.getElementById("qMarksPill");

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  let answers = [];
  let idx = 0;

  // ✅ Map: answer index -> question number (notes excluded)
  let qNumberByIndex = new Map();
  let totalQuestionsOnly = 0;

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    window.location.href = "login.html";
  };

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  function showErr(message){
    errEl.style.display = "block";
    errEl.textContent = message;
  }

  function clearErr(){
    errEl.style.display = "none";
    errEl.textContent = "";
  }

  function typesetMath(root=document){
    if (window.MathJax?.typesetPromise) {
      window.MathJax.typesetPromise([root]).catch(()=>{});
    }
  }

  // ✅ marks helper (fallback to 1 if points not saved)
  function getPoints(a){
    const v = Number(a?.points ?? a?.mark ?? a?.marks ?? 1);
    return Number.isFinite(v) && v > 0 ? Math.round(v) : 1;
  }
  function earnedPoints(a){
    const pts = getPoints(a);
    return a?.isCorrect ? pts : 0;
  }

  function buildNumbering(){
    qNumberByIndex = new Map();
    let qNum = 0;

    for (let i = 0; i < answers.length; i++){
      const type = String(answers[i]?.type || "mcq").toLowerCase();
      if (type !== "note") {
        qNum += 1;
        qNumberByIndex.set(i, qNum);
      }
    }
    totalQuestionsOnly = qNum;
  }

  function buildJump(){
    jumpSelect.innerHTML = answers.map((a, i) => {
      const type = String(a?.type || "mcq").toLowerCase();
      if (type === "note") return `<option value="${i}">Note / Heading</option>`;
      const n = qNumberByIndex.get(i) || (i + 1);
      return `<option value="${i}">Question ${n}</option>`;
    }).join("");

    jumpSelect.onchange = () => {
      const v = Number(jumpSelect.value);
      if (Number.isFinite(v) && v >= 0 && v < answers.length) {
        idx = v;
        render();
      }
    };
  }

  async function load(){
    if (!resultId) {
      showErr("Missing resultId in the URL.");
      return;
    }

    try{
      const res = await fetch(`${API}/api/results/${encodeURIComponent(resultId)}`, {
        headers: { Authorization: "Bearer " + token }
      });

      if (res.status === 401) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
        return;
      }

      if (!res.ok) {
        const txt = await res.text().catch(()=> "");
        throw new Error(txt || `Request failed (HTTP ${res.status})`);
      }

      const r = await res.json();

      titleEl.textContent = cleanSpaces(r.title || "Assessment Review");

      const pct = Number(r.percent);
      const safePct = Number.isFinite(pct) ? pct : 0;

      metaEl.innerHTML = `
        <span class="pill">Grade ${r.grade ?? "-"}</span>
        <span class="pill">Topic: ${escapeHtml(cleanSpaces(r.topic || "General"))}</span>
        <span class="pill">Mark: ${safePct}%</span>
      `;

      answers = Array.isArray(r.answers) ? r.answers : [];
      if (!answers.length) {
        showErr("No saved answers found for this attempt.");
        return;
      }

      buildNumbering();
      buildJump();

      idx = 0;
      render();

      typesetMath(document.querySelector(".card"));
    } catch(e){
      showErr("Could not load review: " + (e.message || ""));
    }
  }

  function render(){
    clearErr();

    const a = answers[idx] || {};
    const type = String(a.type || "mcq").toLowerCase();
    jumpSelect.value = String(idx);

    // Reset
    hintEl.style.display = "none";
    hintEl.textContent = "";
    bodyEl.innerHTML = "";
    resultInfoEl.textContent = "";
    qTextEl.textContent = "";
    qMarksPill.style.display = "none";
    qMarksPill.textContent = "Marks: -";

    // ✅ NOTE (not numbered)
    if (type === "note") {
      counterEl.textContent = `Note / Heading`;
      bodyEl.innerHTML = `<div class="noteBlock">${escapeHtml(cleanSpaces(a.questionText || ""))}</div>`;
      typesetMath(bodyEl);
      updateNavButtons();
      return;
    }

    // ✅ QUESTION (notes excluded from numbering)
    const qNum = qNumberByIndex.get(idx) || 1;
    counterEl.textContent = `Question ${qNum} of ${totalQuestionsOnly}`;

    // ✅ Marks per question
    const pts = getPoints(a);
    const earned = earnedPoints(a);
    qMarksPill.style.display = "inline-flex";
    qMarksPill.textContent = `Marks: ${earned} / ${pts}`;

    // Question text
    qTextEl.textContent = cleanSpaces(a.questionText || "");

    // Hint
    const hint = cleanSpaces(a.hint || "");
    if (hint){
      hintEl.style.display = "block";
      hintEl.textContent = "Hint: " + hint;
    }

    // Render answer
    if (type === "text") {
      const userAns = cleanSpaces(a.textAnswer || "");
      const correctAns = cleanSpaces(a.correctText || "");
      const isCorrect = !!a.isCorrect;

      bodyEl.innerHTML = `
        <div class="answerGrid">
          <div class="answerCard ${isCorrect ? "good" : "bad"}">
            Your Answer: ${escapeHtml(userAns || "No answer")}
          </div>
          <div class="answerCard good">
            Correct Answer: ${escapeHtml(correctAns || "Not saved")}
          </div>
        </div>
      `;

      resultInfoEl.textContent = isCorrect ? "Correct" : "Incorrect";
    } else {
      const options = Array.isArray(a.options) ? a.options : [];
      const chosen = Number(a.chosenIndex);
      const correct = Number(a.correctIndex);

      bodyEl.innerHTML = options.map((opt, i) => {
        const isCorrect = i === correct;
        const isChosen = i === chosen;

        let cls = "";
        if (isCorrect) cls = "correct";
        if (isChosen && !isCorrect) cls = "wrong";

        return `<div class="opt ${cls}">
          ${String.fromCharCode(65 + i)}. ${escapeHtml(cleanSpaces(opt))}
        </div>`;
      }).join("");

      resultInfoEl.textContent = `Correct Answer: ${String.fromCharCode(65 + correct)}`;
    }

    typesetMath(qTextEl);
    typesetMath(hintEl);
    typesetMath(bodyEl);
    typesetMath(resultInfoEl);

    updateNavButtons();
  }

  function updateNavButtons(){
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === answers.length - 1;
  }

  prevBtn.onclick = () => {
    if (idx > 0){ idx--; render(); }
  };

  nextBtn.onclick = () => {
    if (idx < answers.length - 1){ idx++; render(); }
  };

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") prevBtn.click();
    if (e.key === "ArrowRight") nextBtn.click();
  });

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  load();
</script>

</body>
</html>
