<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Dashboard | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .topbar{
      background:#fff;
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      z-index:50;
    }

    .topbar-inner{
      max-width:1200px;
      margin:0 auto;
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .brand{
      font-weight:800;
      color:var(--accent);
      font-size:18px;
      white-space:nowrap;
    }

    .menu-btn{
      display:none;
      border:1px solid var(--border);
      background:#fff;
      border-radius:10px;
      padding:8px 10px;
      cursor:pointer;
      font-size:18px;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .nav-links a,
    .mobile-menu a{
      text-decoration:none;
      color:var(--text);
      padding:10px 12px;
      border-radius:10px;
      font-size:14px;
      font-weight:700;
      border:1px solid transparent;
    }

    .nav-links a:hover,
    .mobile-menu a:hover{
      background:#f8fafc;
      border-color:#e2e8f0;
    }

    .nav-links a.active,
    .mobile-menu a.active{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }

    .nav-links button,
    .mobile-menu button{
      background:var(--accent);
      color:#fff;
      padding:10px 12px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }

    .mobile-menu{
      display:none;
      max-width:1200px;
      margin:0 auto;
      padding:0 20px 14px 20px;
      flex-direction:column;
      gap:8px;
    }

    .mobile-menu.open{
      display:flex;
    }

    .mobile-menu a,
    .mobile-menu button{
      width:100%;
      text-align:left;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .title h1{
      margin:0;
      font-size:22px;
    }

    .title p{
      margin:6px 0 0 0;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }

    .btn{
      background:var(--accent);
      color:#fff;
      padding:10px 12px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      text-decoration:none;
      font-weight:700;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .btn2{
      background:#fff;
      color:var(--text);
      border:1px solid #ddd;
    }

    .btn:disabled{
      opacity:0.65;
      cursor:not-allowed;
    }

    .btn:active{
      transform:translateY(1px);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:14px;
      margin-top:14px;
    }

    @media (max-width: 900px){
      .grid{grid-template-columns:1fr;}
    }

    @media (max-width: 860px){
      .menu-btn{display:inline-flex;}
      #desktopNav{display:none;}
    }

    @media (min-width: 861px){
      #mobileMenu{display:none !important;}
    }

    @media (max-width: 560px){
      .actions{justify-content:flex-start;}
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:var(--shadow);
      min-width:0;
    }

    .muted{color:var(--muted);}
    .error{color:var(--error);}
    .ok{color:var(--ok);}

    .big{
      font-size:30px;
      font-weight:800;
      margin-top:6px;
      letter-spacing:-0.02em;
    }

    .list{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .rowItem{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border:1px solid #eee;
      border-radius:12px;
      background:#fafafa;
      font-size:14px;
      flex-wrap:wrap;
    }

    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #cfe9ff;
      background:#eef7ff;
      color:var(--accent);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .miniStats{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .miniPill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      border:1px solid #e2e8f0;
      background:#fff;
      color:#334155;
    }

    #msg{
      margin-top:14px;
    }
  
/* =====================================================================
   FINAL PRACTICE ONLINE DASHBOARD THEME
   Matches the Admin Quiz and Edit Assessment pages.
   ===================================================================== */
:root{
  --dash-gold:#c9a227;
  --dash-gold-dark:#a98518;
  --dash-navy:#1b1648;
  --dash-green:#159447;
  --dash-bg:#f5f7fa;
  --dash-card:#ffffff;
  --dash-border:#dfe5ec;
  --dash-text:#111827;
  --dash-muted:#64748b;
}

html,
body{
  width:100% !important;
  max-width:none !important;
  margin:0 !important;
  padding:0 !important;
  background:var(--dash-bg) !important;
  color:var(--dash-text) !important;
  font-family:Arial, Helvetica, sans-serif !important;
}

body{
  overflow-x:hidden !important;
}

/* Full-width solid gold header */
.topbar{
  position:sticky !important;
  top:0 !important;
  z-index:50 !important;
  width:100% !important;
  border:none !important;
  background:var(--dash-gold) !important;
  box-shadow:none !important;
}

.topbar-inner{
  width:100% !important;
  max-width:1500px !important;
  min-height:68px !important;
  margin:0 auto !important;
  padding:0 20px !important;
}

.brand{
  display:flex !important;
  align-items:center !important;
  gap:12px !important;
  color:#ffffff !important;
  font-size:14px !important;
  white-space:normal !important;
}

.brandAccountIcon{
  width:38px !important;
  height:38px !important;
  display:block !important;
  flex:0 0 38px !important;
  object-fit:contain !important;
}

.brandText{
  display:flex !important;
  flex-direction:column !important;
  justify-content:center !important;
  line-height:1.2 !important;
}

.brandText strong{
  color:#ffffff !important;
  font-size:14px !important;
  font-weight:700 !important;
}

.brandText span{
  margin-top:2px !important;
  color:#ffffff !important;
  font-size:12px !important;
  font-weight:400 !important;
}

.nav-links button,
.mobile-menu button{
  min-height:auto !important;
  padding:0 !important;
  border:none !important;
  border-radius:0 !important;
  background:transparent !important;
  color:#ffffff !important;
  font-size:12px !important;
  font-weight:700 !important;
}

.menu-btn{
  min-height:36px !important;
  padding:8px 12px !important;
  border:1px solid rgba(255,255,255,.65) !important;
  border-radius:4px !important;
  background:transparent !important;
  color:#ffffff !important;
  font-size:12px !important;
  font-weight:700 !important;
}

.mobile-menu{
  width:100% !important;
  max-width:1500px !important;
  background:var(--dash-gold) !important;
}

.mobile-menu button{
  padding:10px 0 !important;
}

/* Full-width page container with clean spacing */
.wrap{
  width:calc(100% - 40px) !important;
  max-width:1500px !important;
  margin:0 auto !important;
  padding:20px 0 28px !important;
}

.top{
  margin-bottom:18px !important;
}

.title h1{
  color:var(--dash-navy) !important;
  font-size:24px !important;
  font-weight:800 !important;
}

.title p,
.muted{
  color:var(--dash-muted) !important;
}

/* Dashboard action buttons */
.actions{
  gap:10px !important;
}

.btn{
  min-height:40px !important;
  padding:9px 14px !important;
  border:1px solid var(--dash-navy) !important;
  border-radius:4px !important;
  background:var(--dash-navy) !important;
  color:#ffffff !important;
  font-family:Arial, Helvetica, sans-serif !important;
  font-size:12px !important;
  font-weight:700 !important;
  box-shadow:none !important;
}

.btn2{
  border:1px solid var(--dash-border) !important;
  background:#ffffff !important;
  color:var(--dash-navy) !important;
}

.btn:hover:not(:disabled){
  transform:none !important;
  opacity:.94 !important;
}

/* Clean stat cards */
.grid{
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  gap:16px !important;
  margin-top:16px !important;
}

.card{
  min-width:0 !important;
  padding:18px !important;
  border:1px solid var(--dash-border) !important;
  border-radius:8px !important;
  background:var(--dash-card) !important;
  box-shadow:none !important;
}

.card > .muted:first-child{
  color:var(--dash-navy) !important;
  font-size:13px !important;
  font-weight:800 !important;
}

.big{
  margin-top:8px !important;
  color:var(--dash-navy) !important;
  font-size:30px !important;
  font-weight:800 !important;
}

.portalIconWrap{
  width:46px !important;
  height:46px !important;
  margin:12px 0 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  border:1px solid var(--dash-border) !important;
  border-radius:50% !important;
  background:#ffffff !important;
}

.portalIconWrap img{
  width:30px !important;
  height:30px !important;
  display:block !important;
  object-fit:contain !important;
}

.rowItem{
  padding:10px 12px !important;
  border:1px solid var(--dash-border) !important;
  border-radius:6px !important;
  background:#ffffff !important;
}

.pill{
  border:1px solid rgba(27,22,72,.15) !important;
  background:#f5f4fb !important;
  color:var(--dash-navy) !important;
}

.miniPill{
  border:1px solid var(--dash-border) !important;
  background:#f8fafc !important;
  color:#334155 !important;
}

#msg{
  margin-top:16px !important;
}

@media(max-width:1100px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  }
}

@media(max-width:760px){
  .wrap{
    width:calc(100% - 24px) !important;
  }

  .grid{
    grid-template-columns:1fr !important;
  }

  .topbar-inner{
    padding:0 14px !important;
  }

  .actions{
    width:100% !important;
    justify-content:flex-start !important;
  }
}

@media(max-width:560px){
  .wrap{
    width:calc(100% - 20px) !important;
  }

  .actions .btn{
    width:100% !important;
  }

  .title h1{
    font-size:21px !important;
  }
}

</style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brandAccountIcon" src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg" alt="Account" />
        <div class="brandText">
          <strong>Practice Online</strong>
          <span id="headerRoleText">Dashboard</span>
        </div>
      </div>

      <button id="menuBtn" class="menu-btn" type="button">Menu</button>

      <nav id="desktopNav" class="nav-links">
        <button id="logoutBtn" type="button">Logout</button>
      </nav>
    </div>

    <div id="mobileMenu" class="mobile-menu">
      <button id="logoutBtnMobile" type="button">Logout</button>
    </div>
  </header>

  <div class="wrap">
    <div class="top">
      <div class="title">
        <h1 id="pageTitle">Admin Dashboard</h1>
        <p class="muted" id="who">Checking login...</p>
      </div>

<div class="actions">
  <a class="btn btn2" href="admin-quiz.html">Add Assessment</a>

  <a class="btn btn2" href="internal-review.html">
    Review
  </a>

  <a class="btn btn2" href="edit-assessment.html">
    Edit / Freeze / Delete
  </a>

  <a class="btn btn2" href="learner-quizzes.html">
    Learner View
  </a>

  <button class="btn btn2" id="refreshBtn" type="button">
    Refresh
  </button>
</div>
    </div>

    <div class="grid" id="statsGrid">
      <div class="card">
  <div class="muted">Employee Portal</div>

  <div class="portalIconWrap">
    <img src="https://res.cloudinary.com/dopoxadlr/image/upload/v1773933113/account_m5xpia.svg" alt="" aria-hidden="true" />
  </div>

  <br>

  <a class="btn" href="employees/employee-login.html">
    Open Employee Portal
  </a>
</div>
      <div class="card" id="cardTotalUsers">
        <div class="muted">Total Users</div>
        <div class="big" id="totalUsers">-</div>
      </div>

      <div class="card" id="cardTotalAssessments">
        <div class="muted">Total Assessments</div>
        <div class="big" id="totalAssessments">-</div>
      </div>

      <div class="card" id="cardTotalLearners">
        <div class="muted">Total Learners (Grades 8–12)</div>
        <div class="big" id="totalLearners">-</div>
      </div>

      <div class="card" id="cardByGradeAssessments">
        <div class="muted">Assessments by Grade</div>
        <div id="byGradeAssessments" class="list muted" style="margin-top:10px;">-</div>
      </div>

      <div class="card" id="cardByGradeLearners">
        <div class="muted">Learners by Grade</div>
        <div id="byGradeLearners" class="list muted" style="margin-top:10px;">-</div>
      </div>

      <div class="card" id="cardByGradeAccountType">
        <div class="muted">Account Type by Grade</div>
        <div id="byGradeAccountType" class="list muted" style="margin-top:10px;">-</div>
      </div>
    </div>

    <p id="msg" class="muted"></p>
  </div>

  <script src="nav.js"></script>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";
    const token = localStorage.getItem("token");
    const refreshBtn = document.getElementById("refreshBtn");
    let currentRole = "";

    function logout(){
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      localStorage.removeItem("me_cache");
      localStorage.removeItem("user");
      localStorage.removeItem("role");
      window.location.href = "login.html";
    }

    document.getElementById("refreshBtn").addEventListener("click", () => loadStats(true));

    function setMsg(text, cls="muted"){
      const el = document.getElementById("msg");
      el.className = cls;
      el.textContent = text;
    }

    function safeNum(x){
      const n = Number(x);
      return Number.isFinite(n) ? n : 0;
    }

    function buildGradeMap(list){
      const map = new Map();
      (Array.isArray(list) ? list : []).forEach(item => {
        map.set(String(item.grade), safeNum(item.count));
      });
      return map;
    }

    function renderAssessmentsByGrade(list){
      const el = document.getElementById("byGradeAssessments");
      const grades = [8, 9, 10, 11, 12];
      const map = buildGradeMap(list);

      el.innerHTML = grades.map(g => `
        <div class="rowItem">
          <span class="pill">Grade ${g}</span>
          <b>${map.get(String(g)) || 0}</b>
        </div>
      `).join("");
    }

    function renderLearnersByGrade(list){
      const el = document.getElementById("byGradeLearners");
      const grades = [8, 9, 10, 11, 12];
      const map = buildGradeMap(list);

      el.innerHTML = grades.map(g => `
        <div class="rowItem">
          <span class="pill">Grade ${g}</span>
          <b>${map.get(String(g)) || 0}</b>
        </div>
      `).join("");
    }

    function renderAccountTypeByGrade(list){
      const el = document.getElementById("byGradeAccountType");
      const rows = Array.isArray(list) ? list : [];
      const grades = [8, 9, 10, 11, 12];

      el.innerHTML = grades.map(g => {
        const row = rows.find(x => Number(x.grade) === g) || {
          grade: g,
          student: 0,
          materials: 0,
          total: 0
        };

        return `
          <div class="rowItem">
            <span class="pill">Grade ${g}</span>
            <div class="miniStats">
              <span class="miniPill">Student: <b>${safeNum(row.student)}</b></span>
              <span class="miniPill">Materials: <b>${safeNum(row.materials)}</b></span>
              <span class="miniPill">Total: <b>${safeNum(row.total)}</b></span>
            </div>
          </div>
        `;
      }).join("");
    }

    function hideStatsForEditor(){
      document.getElementById("pageTitle").textContent = "Editor Dashboard";
      document.getElementById("cardTotalUsers").style.display = "none";
      document.getElementById("cardTotalAssessments").style.display = "none";
      document.getElementById("cardTotalLearners").style.display = "none";
      document.getElementById("cardByGradeAssessments").style.display = "none";
      document.getElementById("cardByGradeLearners").style.display = "none";
      document.getElementById("cardByGradeAccountType").style.display = "none";
      refreshBtn.style.display = "none";
      setMsg("Editor access: you can add, edit and freeze assessments.", "ok");
    }

    async function requireAdmin(){
      let meRes;
      try{
        meRes = await fetch(`${API}/api/auth/me`, {
          headers: { Authorization: `Bearer ${token}` }
        });
      } catch {
        setMsg("Network error. Please refresh.", "error");
        return false;
      }

      const me = await meRes.json().catch(()=>null);
      if (!meRes.ok || !me) {
        logout();
        return false;
      }

      if (!["admin", "editor"].includes(String(me.role || "").toLowerCase())) {
        setMsg("Access denied. Redirecting...", "error");
        setTimeout(() => {
          window.location.href = "learner-quizzes.html";
        }, 700);
        return false;
      }

      currentRole = String(me.role || "").toLowerCase();
      document.getElementById("who").textContent = `Logged in as: ${me.username} (${me.role})`;
      const headerRoleText = document.getElementById("headerRoleText");
      if (headerRoleText) {
        headerRoleText.textContent = currentRole === "editor"
          ? "Editor Dashboard"
          : "Admin Dashboard";
      }

      if (currentRole === "editor") {
        hideStatsForEditor();
      }

      return true;
    }

    async function loadStats(showToast){
      if (currentRole === "editor") return;

      refreshBtn.disabled = true;
      setMsg("Loading stats...", "muted");

      let res;
      try{
        res = await fetch(`${API}/api/admin/stats`, {
          headers: { Authorization: `Bearer ${token}` }
        });
      } catch {
        setMsg("Network error loading stats.", "error");
        refreshBtn.disabled = false;
        return;
      }

      const data = await res.json().catch(()=>null);
      if (!res.ok || !data){
        setMsg("Could not load stats.", "error");
        refreshBtn.disabled = false;
        return;
      }

      document.getElementById("totalUsers").textContent = safeNum(data.totalUsers);

      const totalAssessments = (data.totalAssessments != null)
        ? data.totalAssessments
        : data.totalQuizzes;

      document.getElementById("totalAssessments").textContent = safeNum(totalAssessments);

      const totalLearners = (data.totalLearners != null)
        ? safeNum(data.totalLearners)
        : (Array.isArray(data.learnersByGrade) ? data.learnersByGrade : [])
            .reduce((sum, x) => sum + safeNum(x.count), 0);

      document.getElementById("totalLearners").textContent = totalLearners;

      renderAssessmentsByGrade(data.quizzesByGrade);
      renderLearnersByGrade(data.learnersByGrade);
      renderAccountTypeByGrade(data.accountTypeByGrade);

      setMsg(showToast ? "Stats refreshed." : "Stats loaded.", "ok");
      refreshBtn.disabled = false;
    }

    (async () => {
      if (!token) return logout();
      const ok = await requireAdmin();
      if (!ok) return;
      if (currentRole === "admin") {
        await loadStats(false);
      }
    })();
  </script>
</body>
</html>
