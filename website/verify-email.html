<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Verification | Practice Online</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:#f6f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:28px;
  width:100%;
  max-width:420px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  text-align:center;
}

h2{
  margin-top:0;
}

.msg{
  margin-top:14px;
  font-size:15px;
}

.ok{color:#065f46;}
.error{color:#b91c1c;}

.btn{
  margin-top:18px;
  background:#0b3c5d;
  color:#fff;
  border:none;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

</style>
</head>

<body>

<div class="card">

<h2>Verifying Email</h2>

<p id="status">Please wait while we verify your email...</p>

<div id="result" class="msg"></div>

<button id="loginBtn" class="btn" style="display:none">
Go to Login
</button>

</div>

<script>

const API = "https://api.practiceonline.co.za";

const result = document.getElementById("result");
const loginBtn = document.getElementById("loginBtn");

function getParam(name){
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

async function verifyEmail(){

  const token = getParam("token");
  const email = getParam("email");

  if(!token || !email){
    result.textContent = "Invalid verification link.";
    result.className = "msg error";
    return;
  }

  try{

    const res = await fetch(API + "/api/verify-email",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({email,token})
    });

    const data = await res.json().catch(()=>({}));

    if(!res.ok){
      result.textContent = data.message || "Verification failed.";
      result.className = "msg error";
      return;
    }

    result.textContent = "Email verified successfully. You can login now.";
    result.className = "msg ok";

    loginBtn.style.display = "inline-block";

  }catch{
    result.textContent = "Network error. Please try again.";
    result.className = "msg error";
  }

}

loginBtn.onclick = () => {
  window.location.href = "login.html";
};

verifyEmail();

</script>

</body>
</html>
