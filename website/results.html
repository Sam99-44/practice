<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Results | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;
      --accent:#0b3c5d;
      --accent-soft:#e7eef5;
      --radius:14px;
      --shadow:0 6px 18px rgba(0,0,0,0.06);
      --error:#b91c1c;
      --ok:#065f46;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,Arial,sans-serif; background:var(--bg); color:var(--text);}
    .wrap{max-width:1100px; margin:0 auto; padding:24px;}

    .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:12px;}
    .brand{display:flex; align-items:center; gap:10px;}
    .logo{width:38px; height:38px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800;}
    .brand span{display:block; font-size:13px; color:var(--muted);}

    .nav{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
    .nav a{text-decoration:none; font-size:14px; color:var(--text); padding:6px 8px; border-radius:8px;}
    .nav a:hover{ background:var(--accent-soft); }
    .nav a.active{ font-weight:700; color:var(--accent); }
    .nav .btn{background:var(--accent); color:#fff; padding:8px 12px; border-radius:10px; border:none; cursor:pointer; font-size:14px; font-weight:700;}

    .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
    h1{margin:0; font-size:22px;}
    .muted{color:var(--muted);}
    .error{color:var(--error);}
    .ok{color:var(--ok);}

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-end;
      margin-top:14px;
      margin-bottom:10px;
    }
    .controls .group{display:flex; flex-direction:column; gap:6px;}
    select,input{
      padding:10px;
      border-radius:10px;
      border:1px solid #ddd;
      background:#fff;
      min-width:220px;
      font-size:14px;
      outline:none;
    }
    .btn2{
      background:#fff;
      border:1px solid #ddd;
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }
    .smallBtn{
      background:#fff;
      border:1px solid #ddd;
      padding:6px 10px;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
      font-size:12px;
      white-space:nowrap;
    }

    table{width:100%; border-collapse:collapse; margin-top:10px;}
    th, td{padding:10px; border-bottom:1px solid #eee; text-align:left; font-size:14px; vertical-align:middle;}
    th{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #cfe9ff;
      background:#eef7ff;
      color:#0b3c5d;
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }
    .scorepill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #e6e6e6;
      background:#f8fafc;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .empty{
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
      margin-top:12px;
    }
  </style>

  <script>
    const authToken = localStorage.getItem("token");
    if (!authToken) window.location.href = "login.html";
  </script>
</head>

<body>
  <div class="wrap">

    <div class="topbar">
      <div class="brand">
        <div class="logo">PO</div>
        <div>
          <strong>Practice Online</strong>
          <span id="welcomeSub">Results</span>
        </div>
      </div>

      <nav class="nav">
        <a href="learner-quizzes.html">Back to Practice</a>
        <a href="results.html" class="active">Results</a>
        <a href="about.html">About</a>
        <a href="admin-quiz.html" data-admin>Admin</a>
        <button class="btn" id="logoutBtn" type="button">Logout</button>
      </nav>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div>
          <h1>Your Results</h1>
          <p class="muted" style="margin:6px 0 0 0;">Your quiz history will show here.</p>
        </div>
        <div>
          <span class="pill" id="countPill">Loading…</span>
        </div>
      </div>

      <div class="controls">
        <div class="group">
          <label class="muted" style="font-size:12px;">Grade</label>
          <select id="gradeFilter">
            <option value="">All grades</option>
            <option value="8">Grade 8</option>
            <option value="9">Grade 9</option>
            <option value="10">Grade 10</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>

        <div class="group" style="flex:1; min-width:240px;">
          <label class="muted" style="font-size:12px;">Search topic/title</label>
          <input id="searchBox" placeholder="Type e.g. Algebra..." />
        </div>

        <div class="group">
          <label class="muted" style="font-size:12px;">Actions</label>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn2" id="refreshBtn" type="button">Refresh</button>
            <button class="btn2" id="clearBtn" type="button">Clear filters</button>
          </div>
        </div>
      </div>

      <p id="status" class="muted" style="margin:6px 0 0 0;"></p>

      <div id="tableWrap"></div>
    </div>

  </div>

  <script src="nav.js"></script>

  <script>
    const API = window.API || "https://practice-backend-msgn.onrender.com";
    const token = localStorage.getItem("token");

    const username = localStorage.getItem("username") || "Learner";
    document.getElementById("welcomeSub").textContent = `Welcome, ${username}`;

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      window.location.href = "login.html";
    });

    const gradeFilter = document.getElementById("gradeFilter");
    const searchBox = document.getElementById("searchBox");
    const refreshBtn = document.getElementById("refreshBtn");
    const clearBtn = document.getElementById("clearBtn");

    const statusEl = document.getElementById("status");
    const tableWrap = document.getElementById("tableWrap");
    const countPill = document.getElementById("countPill");

    let allResults = [];

    gradeFilter.addEventListener("change", render);
    searchBox.addEventListener("input", render);

    refreshBtn.addEventListener("click", loadResults);
    clearBtn.addEventListener("click", () => {
      gradeFilter.value = "";
      searchBox.value = "";
      render();
    });

    loadResults();

    async function loadResults(){
      statusEl.className = "muted";
      statusEl.textContent = "Loading results…";
      tableWrap.innerHTML = "";
      countPill.textContent = "Loading…";

      try{
        const res = await fetch(`${API}/api/results/my`, {
          headers: { Authorization: "Bearer " + token }
        });

        if (res.status === 401) {
          localStorage.removeItem("token");
          window.location.href = "login.html";
          return;
        }

        if (!res.ok) {
          const txt = await res.text().catch(()=> "");
          throw new Error(txt || `Request failed (HTTP ${res.status})`);
        }

        const data = await res.json();
        allResults = Array.isArray(data) ? data : [];

        statusEl.textContent = "";
        render();
      } catch (err){
        statusEl.className = "error";
        statusEl.textContent = "Could not load results: " + (err.message || "");
        countPill.textContent = "0 results";

        tableWrap.innerHTML = `
          <div class="empty">
            <div class="error"><b>Results not showing.</b></div>
            <div class="muted" style="margin-top:6px;">
              Open DevTools → Network → refresh this page → check:
              <br><b>GET /api/results/my</b>
            </div>
          </div>
        `;
      }
    }

    function render(){
      const grade = gradeFilter.value;
      const q = (searchBox.value || "").trim().toLowerCase();

      let list = [...allResults];

      if (grade) list = list.filter(r => String(r.grade ?? "") === String(grade));

      if (q) {
        list = list.filter(r => {
          const t = String(r.topic || "").toLowerCase();
          const title = String(r.title || "").toLowerCase();
          return t.includes(q) || title.includes(q);
        });
      }

      countPill.textContent = `${list.length} result${list.length === 1 ? "" : "s"}`;

      if (list.length === 0) {
        tableWrap.innerHTML = `
          <div class="empty">
            <b>No results found.</b>
            <div class="muted" style="margin-top:6px;">
              If you just submitted a quiz, click <b>Refresh</b>.
            </div>
          </div>
        `;
        return;
      }

      tableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Grade</th>
              <th>Topic</th>
              <th>Quiz</th>
              <th>Score</th>
              <th>Review</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(r => {
              const d = r.createdAt ? new Date(r.createdAt) : null;
              const dateStr = d ? d.toLocaleString() : "-";
              const gradeStr = r.grade ?? "-";
              const topicStr = escapeHtml(r.topic || "General");
              const titleStr = escapeHtml(r.title || "Quiz");
              const scoreStr = `${r.score}/${r.total} (${r.percent}%)`;
              const id = r._id ? String(r._id) : "";

              return `
                <tr>
                  <td>${escapeHtml(dateStr)}</td>
                  <td><span class="pill">Grade ${escapeHtml(String(gradeStr))}</span></td>
                  <td>${topicStr}</td>
                  <td>${titleStr}</td>
                  <td><span class="scorepill">${escapeHtml(scoreStr)}</span></td>
                  <td>
                    ${id ? `<button class="smallBtn" data-review="${escapeHtml(id)}">Review</button>` : `<span class="muted">—</span>`}
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      `;

      // ✅ attach events
      tableWrap.querySelectorAll("[data-review]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-review");
          window.location.href = `review.html?resultId=${encodeURIComponent(id)}`;
        });
      });
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
  </script>
</body>
</html>
