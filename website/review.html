<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Review Attempt | Practice Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    :root{
      --nav:#1b1648;
      --red:#e11d2e;

      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#0f172a;
      --muted:#475569;

      --radius:14px;
      --shadow:0 10px 28px rgba(2,6,23,.08);

      --ok:#065f46;
      --error:#b91c1c;

      --soft:#eef2ff;
      --focus:0 0 0 4px rgba(207,233,255,.65);

      --noteBg:#f8fafc;
      --noteBd:#e5e7eb;
      --noteText:#0b3c5d;

      --greenBg:#ecfdf5;
      --greenBd:#bbf7d0;

      --redBg:#fff1f2;
      --redBd:#fecaca;

      /* ✅ Solution box */
      --solBg:#fff7ed;
      --solBd:#fed7aa;
      --solText:#7c2d12;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Inter, Arial, sans-serif;
      font-weight:500;
      background:var(--bg);
      color:var(--text);
    }

    a{color:inherit;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:18px}
    .muted{color:var(--muted); font-weight:500;}
    .error{color:var(--error)}
    .hidden{display:none!important}

    header.topbar{
      background:var(--nav);
      color:#fff;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .topbar-inner{
      max-width:1100px;
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .brand{display:flex;flex-direction:column;line-height:1.15}
    .brand .name{font-weight:600; letter-spacing:.15px;}
    .brand .sub{font-weight:500; opacity:.85; font-size:12px; margin-top:2px;}

    nav.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    nav.nav a{
      padding:8px 10px;
      border-radius:10px;
      color:#e7e9ff;
      font-weight:600;
      font-size:13px;
    }
    nav.nav a:hover{background:rgba(255,255,255,.10)}
    nav.nav a.active{
      color:#fff;
      border-bottom:3px solid var(--red);
      border-radius:10px 10px 8px 8px;
      padding-bottom:5px;
      font-weight:600;
    }

    .btnTop{
      background:transparent;
      color:#fff;
      border:1px solid rgba(255,255,255,.22);
      padding:8px 12px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
    }
    .btnTop:hover{background:rgba(255,255,255,.08)}

    .section{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-top:14px;
    }
    .sectionHead{
      background:linear-gradient(180deg,#f4f7ff,#eef4ff);
      border-bottom:1px solid var(--border);
      padding:12px 14px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .sectionHead h1{
      margin:0;
      font-size:18px;
      letter-spacing:-0.01em;
      font-weight:600;
    }
    .sectionBody{padding:14px}

    .controls{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .counter{
      font-weight:600;
      color:#111827;
      font-size:13px;
    }
    .jump{
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:flex-end;
    }
    .jump label{
      font-size:12px;
      font-weight:600;
      color:var(--muted);
    }
    select{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      background:#fff;
      min-width:240px;
      font-size:14px;
      outline:none;
      font-weight:600;
    }
    select:focus{box-shadow:var(--focus);border-color:#cfe9ff;}

    .qBox{
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px;
      background:#fff;
    }

    .qHead{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:10px;
    }
    .qTitle{
      font-weight:600;
      line-height:1.35;
      margin:0;
      min-width:0;
      flex:1 1 auto;
      word-break:break-word;
      font-size:15px;
    }
    .qRight{
      flex:0 0 auto;
      white-space:nowrap;
      font-weight:500;
      font-size:12px;
      color:var(--muted);
      padding-top:2px;
    }

    .hint{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background:var(--soft);
      border:1px solid #cfe9ff;
      color:#0b3c5d;
      font-size:13px;
      font-weight:500;
    }

    .noteBox{
      border:1px solid var(--noteBd);
      background:var(--noteBg);
      border-radius:14px;
      padding:12px 12px;
      color:var(--noteText);
      font-weight:600;
      line-height:1.45;
      word-break:break-word;
    }

    .opt{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #ddd;
      margin-bottom:8px;
      background:#fff;
      font-weight:500;
      line-height:1.35;
      word-break:break-word;
    }
    .opt.correct{ background:var(--greenBg); border-color:var(--greenBd); }
    .opt.wrong{ background:var(--redBg); border-color:var(--redBd); }

    .answerGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    .answerCard{
      padding:12px;
      border-radius:12px;
      border:1px solid #e6e6e6;
      font-weight:600;
      word-break:break-word;
      background:#fff;
    }
    .answerCard.good{ background:var(--greenBg); border-color:var(--greenBd); }
    .answerCard.bad{ background:var(--redBg); border-color:var(--redBd); }

    /* ✅ NEW solution box */
    .solutionBox{
      margin-top:12px;
      border-radius:12px;
      border:1px solid var(--solBd);
      background:var(--solBg);
      color:var(--solText);
      padding:12px;
      font-weight:600;
      line-height:1.45;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .solutionTitle{
      font-weight:700;
      margin:0 0 6px 0;
      font-size:13px;
    }

    .resultInfo{
      margin-top:12px;
      font-weight:600;
      color:#111827;
    }

    .navBtns{
      margin-top:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid #ddd;
      background:#fff;
      cursor:pointer;
      font-weight:600;
      font-size:13px;
      white-space:nowrap;
    }
    button:hover{background:#f8fafc}
    button:disabled{opacity:.6; cursor:not-allowed;}

    .errorBox{
      margin-top:12px;
      padding:14px;
      border:1px dashed #ddd;
      border-radius:12px;
      background:#fafafa;
      color:#334155;
      font-weight:600;
      display:none;
    }

    @media (max-width:700px){
      .answerGrid{grid-template-columns:1fr;}
      select{min-width:100%;}
      .jump{align-items:flex-start;}
      .qHead{flex-wrap:wrap;}
      .qRight{padding-top:0}
    }
  </style>

  <script>
    const t = localStorage.getItem("token");
    if (!t) window.location.href = "login.html";
  </script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="name">Practice Online</div>
      <div class="sub">Review Attempt</div>
    </div>

    <nav class="nav">
      <a href="results.html" class="active">Back to Results</a>
      <button class="btnTop" id="logoutBtn" type="button">Logout</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="section">
    <div class="sectionHead">
      <div>
        <h1 id="title">Loading…</h1>
        <div class="muted" style="margin-top:6px;">Review your attempt question by question.</div>
      </div>
    </div>

    <div class="sectionBody">
      <div class="controls">
        <div class="counter" id="counter"></div>
        <div class="jump">
          <label for="jumpSelect"></label>
          <select id="jumpSelect"></select>
        </div>
      </div>

      <div class="qBox">
        <div class="qHead">
          <div class="qTitle" id="qText"></div>
          <div class="qRight" id="qRight"></div>
        </div>

        <div id="hint" class="hint" style="display:none;"></div>
        <div id="body"></div>

        <!-- ✅ NEW solution container -->
        <div id="solutionWrap" style="display:none;"></div>

        <div class="resultInfo" id="resultInfo"></div>

        <div class="navBtns">
          <button id="prevBtn" type="button">Previous</button>
          <button id="nextBtn" type="button">Next</button>
        </div>

        <div id="err" class="errorBox"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = window.API || "https://api.practiceonline.co.za";
  const token = localStorage.getItem("token");
  const resultId = new URLSearchParams(window.location.search).get("resultId");

  const titleEl = document.getElementById("title");
  const counterEl = document.getElementById("counter");
  const qTextEl = document.getElementById("qText");
  const qRightEl = document.getElementById("qRight");
  const hintEl = document.getElementById("hint");
  const bodyEl = document.getElementById("body");
  const solutionWrap = document.getElementById("solutionWrap");
  const resultInfoEl = document.getElementById("resultInfo");
  const errEl = document.getElementById("err");
  const jumpSelect = document.getElementById("jumpSelect");

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  let answers = [];
  let idx = 0;

  let qNumberByIndex = new Map();
  let totalQuestionsOnly = 0;

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    window.location.href = "login.html";
  };

  function cleanSpaces(s){
    return String(s || "").trim().replace(/\s+/g, " ");
  }

  function showErr(message){
    errEl.style.display = "block";
    errEl.textContent = message;
  }

  function clearErr(){
    errEl.style.display = "none";
    errEl.textContent = "";
  }

  function typesetMath(root=document){
    if (window.MathJax?.typesetPromise) {
      window.MathJax.typesetPromise([root]).catch(()=>{});
    }
  }

  function buildNumbering(){
    qNumberByIndex = new Map();
    let qNum = 0;

    for (let i = 0; i < answers.length; i++){
      const type = String(answers[i]?.type || "mcq").toLowerCase();
      if (type !== "note") {
        qNum += 1;
        qNumberByIndex.set(i, qNum);
      }
    }
    totalQuestionsOnly = qNum;
  }

  function buildJump(){
    jumpSelect.innerHTML = answers.map((a, i) => {
      const type = String(a?.type || "mcq").toLowerCase();
      if (type === "note") return `<option value="${i}">Note / Heading</option>`;
      const n = qNumberByIndex.get(i) || (i + 1);
      return `<option value="${i}">Question ${n}</option>`;
    }).join("");

    jumpSelect.onchange = () => {
      const v = Number(jumpSelect.value);
      if (Number.isFinite(v) && v >= 0 && v < answers.length) {
        idx = v;
        render();
      }
    };
  }

  async function load(){
    if (!resultId) {
      showErr("Missing resultId in the URL.");
      return;
    }

    try{
      const res = await fetch(`${API}/api/results/${encodeURIComponent(resultId)}`, {
        headers: { Authorization: "Bearer " + token }
      });

      if (res.status === 401) {
        localStorage.removeItem("token");
        window.location.href = "login.html";
        return;
      }

      if (!res.ok) {
        const txt = await res.text().catch(()=> "");
        throw new Error(txt || `Request failed (HTTP ${res.status})`);
      }

      const r = await res.json();
      titleEl.textContent = cleanSpaces(r.title || "Assessment Review");

      answers = Array.isArray(r.answers) ? r.answers : [];
      if (!answers.length) {
        showErr("No saved answers found for this attempt.");
        return;
      }

      buildNumbering();
      buildJump();

      idx = 0;
      render();

      typesetMath(document.querySelector(".section"));
    } catch(e){
      showErr("Could not load review: " + (e.message || ""));
    }
  }

  function renderSolutionBox(a){
    const sol = cleanSpaces(a?.solution || "");
    if (!sol){
      solutionWrap.style.display = "none";
      solutionWrap.innerHTML = "";
      return;
    }
    solutionWrap.style.display = "block";
    solutionWrap.innerHTML = `
      <div class="solutionBox">
        <div class="solutionTitle">Solution / Working</div>
        <div>${escapeHtml(sol)}</div>
      </div>
    `;
    typesetMath(solutionWrap);
  }

  function render(){
    clearErr();

    const a = answers[idx] || {};
    const type = String(a.type || "mcq").toLowerCase();
    jumpSelect.value = String(idx);

    hintEl.style.display = "none";
    hintEl.textContent = "";
    bodyEl.innerHTML = "";
    resultInfoEl.textContent = "";
    qTextEl.textContent = "";
    qRightEl.textContent = "";
    solutionWrap.style.display = "none";
    solutionWrap.innerHTML = "";

    if (type === "note") {
      counterEl.textContent = `Note / Heading`;
      bodyEl.innerHTML = `<div class="noteBox">${escapeHtml(cleanSpaces(a.questionText || ""))}</div>`;
      typesetMath(bodyEl);
      updateNavButtons();
      return;
    }

    const qNum = qNumberByIndex.get(idx) || 1;
    counterEl.textContent = `Question ${qNum} of ${totalQuestionsOnly}`;

    qTextEl.textContent = cleanSpaces(a.questionText || "");

    // show marks per question (points snapshot)
    const pts = Number(a.points || 0);
    const earned = Number(a.earnedPoints || 0);
    qRightEl.textContent = pts ? `${earned}/${pts} marks` : "";

    const hint = cleanSpaces(a.hint || "");
    if (hint){
      hintEl.style.display = "block";
      hintEl.textContent = "Hint: " + hint;
    }

    if (type === "text") {
      const userAns = cleanSpaces(a.textAnswer || "");
      const correctAns = cleanSpaces(a.correctText || "");
      const isCorrect = !!a.isCorrect;

      bodyEl.innerHTML = `
        <div class="answerGrid">
          <div class="answerCard ${isCorrect ? "good" : "bad"}">
            Your Answer: ${escapeHtml(userAns || "No answer")}
          </div>
          <div class="answerCard good">
            Correct Answer: ${escapeHtml(correctAns || "Not saved")}
          </div>
        </div>
      `;

      resultInfoEl.textContent = isCorrect ? "Correct" : "Incorrect";
    } else {
      const options = Array.isArray(a.options) ? a.options : [];
      const chosen = Number(a.chosenIndex);
      const correct = Number(a.correctIndex);

      bodyEl.innerHTML = options.map((opt, i) => {
        const isCorrect = i === correct;
        const isChosen = i === chosen;

        let cls = "";
        if (isCorrect) cls = "correct";
        if (isChosen && !isCorrect) cls = "wrong";

        return `<div class="opt ${cls}">
          ${String.fromCharCode(65 + i)}. ${escapeHtml(cleanSpaces(opt))}
        </div>`;
      }).join("");

      resultInfoEl.textContent = `Correct Answer: ${String.fromCharCode(65 + correct)}`;
    }

    // ✅ show solution/workings if saved
    renderSolutionBox(a);

    typesetMath(qTextEl);
    typesetMath(hintEl);
    typesetMath(bodyEl);
    typesetMath(resultInfoEl);

    updateNavButtons();
  }

  function updateNavButtons(){
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === answers.length - 1;
  }

  prevBtn.onclick = () => {
    if (idx > 0){ idx--; render(); }
  };

  nextBtn.onclick = () => {
    if (idx < answers.length - 1){ idx++; render(); }
  };

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") prevBtn.click();
    if (e.key === "ArrowRight") nextBtn.click();
  });

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  load();
</script>

</body>
</html>
